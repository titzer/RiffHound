<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Scroller Modes</title>
<style>
  * { box-sizing: border-box; }

  /* The theme hue lives on :root so every derived colour below is resolved
     against the *current* --fg; deriving them anywhere else would freeze
     them at the value --fg had on that element. */
  :root[data-theme="green"] { --fg: #46ff7a; }
  :root[data-theme="amber"] { --fg: #ffb43c; }
  :root[data-theme="red"]   { --fg: #ff4436; }

  :root {
    --fg: #46ff7a;  /* fallback; the [data-theme] rules above win */
    --pad: 16px;
    --gap: 12px;
    --next-w: clamp(110px, 15vw, 240px);
    --disp-w: calc(100% - var(--pad) * 2 - var(--next-w));
    --dim: color-mix(in srgb, var(--fg) 52%, #000);
    --panel: color-mix(in srgb, var(--fg) 11%, #000);
    --hot: color-mix(in srgb, var(--fg) 34%, #000);
    --glow: color-mix(in srgb, var(--fg) 55%, transparent);
    --scan-pitch: 2px;   /* both overwritten by the settings sliders */
    --brightness: 100%;
    --lyric-zoom: 100;                       /* per cent, from the settings */
    --cur-size: calc(clamp(18px, 2.9vw, 38px) * var(--lyric-zoom) / 100);
    --side-size: calc(clamp(15px, 1.9vw, 25px) * var(--lyric-zoom) / 100);
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--fg);
    background: #040604;
    font: 700 14px/1.4 ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    letter-spacing: .1em;
    text-shadow: 0 0 7px var(--glow);
    filter: brightness(var(--brightness));
  }

  /* Chrome is upper-case CRT lettering; chord names keep their own case,
     since "Am" and "AM" are not the same chord. */
  header, .next small { text-transform: uppercase; }

  /* A subtree with its own phosphor colour. JS sets --fg here; the shades
     have to be mixed again at the same place, since the :root versions were
     already resolved against the :root hue and only inherit their result. */
  .tinted {
    --dim: color-mix(in srgb, var(--fg) 52%, #000);
    --panel: color-mix(in srgb, var(--fg) 11%, #000);
    --hot: color-mix(in srgb, var(--fg) 34%, #000);
    --glow: color-mix(in srgb, var(--fg) 55%, transparent);
    color: var(--fg);
    text-shadow: 0 0 7px var(--glow);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    padding: 5px var(--pad);
  }

  h1 { margin: 0; font-size: 21px; }

  /* The title is a control, not just a heading: it opens the track menu. */
  .track { position: relative; }

  .title-btn,
  .title-btn:hover:not(:disabled) {
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg);
  }

  .title-btn { cursor: pointer; text-shadow: inherit; }
  .title-btn:hover:not(:disabled) { text-shadow: 0 0 12px var(--fg); }
  #titleTags { color: var(--dim); }

  button, input { font: inherit; letter-spacing: inherit; color: inherit; }

  .switch { display: inline-flex; }

  button {
    padding: 6px 10px;
    border: 1px solid var(--dim);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    text-shadow: inherit;
  }

  /* Overlap the borders instead of dropping one: a button whose neighbour is
     disabled (35% opacity) was left with no visible edge of its own. */
  .switch button + button { margin-left: -1px; }
  .switch button.active, .switch button:hover:not(:disabled) { position: relative; z-index: 1; }

  button.active, button:hover:not(:disabled) {
    color: var(--fg);
    background: var(--hot);
    border-color: var(--fg);
    text-shadow: 0 0 10px var(--fg);
  }

  /* The inactive half of play/stop reads as an unlit key on the panel. */
  button:disabled {
    opacity: .35;
    cursor: default;
  }

  /* Big three-digit tempo readout, top right; type over it to set the tempo. */
  .bpm {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 0 4px;
  }

  .bpm input {
    width: 3ch;
    padding: 0;
    border: 0;
    background: none;
    outline: none;
    text-align: center;
    font-size: clamp(26px, 3.6vw, 40px);
    line-height: 1.1;
    text-shadow: 0 0 14px var(--fg);
  }

  .bpm input:focus { background: var(--hot); }
  .bpm span { font-size: 12px; color: var(--dim); }

  /* ---- settings menu --------------------------------------------------- */

  .menu { position: relative; }

  /* The two icon buttons belong together, so they sit closer than the
     header's own gap would put them. */
  .tools { display: flex; align-items: center; gap: 5px; }

  .menu-btn {
    display: grid;
    gap: 4px;
    place-content: center;
    width: 40px;
    height: 34px;
    padding: 0;
  }

  .menu-btn i { width: 20px; height: 3px; background: currentColor; }

  .fs-ico {
    width: 18px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    width: 420px;
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 2px solid var(--fg);
    box-shadow: 0 0 24px -4px var(--fg);

    /* Semi-transparent, with the backdrop blurred so the display still reads
     through it without the labels having to fight the scanlines. */
    background: #050705b3;   /* 70% */
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }

  .panel[hidden] { display: none; }

  /* One row per setting: name on the left, control on the right, readout after
     it. Wider dialog, but each setting costs one line instead of two. */
  .setting {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    font-size: 12px;
  }

  .setting > label { flex: 1; min-width: 0; }
  .setting output { order: 3; min-width: 3.2em; text-align: right; color: var(--fg); }
  .setting .val { order: 3; }
  .setting .switch { flex: none; max-width: 262px; }

  /* Second level: common settings first, then one collapsible group per
     display. The group body is its own element so `details` keeps its
     disclosure behaviour whatever display the panel grid gives it. */
  .panel details { border-top: 1px solid var(--dim); padding-top: 8px; }

  .panel summary {
    cursor: pointer;
    font-size: 12px;
    letter-spacing: .14em;
    color: var(--dim);
  }

  .panel details[open] summary { color: var(--fg); }
  .group { display: grid; gap: 9px; padding-top: 9px; }

  /* A readout paired with its reset button, in the row's right-hand cell. */
  .val { display: flex; align-items: center; gap: 8px; }

  .reset {
    padding: 1px 6px;
    font-size: 10px;
    letter-spacing: .08em;
  }

  .search {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--dim);
    background: var(--panel);
    outline: none;
  }

  .search:focus { border-color: var(--fg); }
  .search::placeholder { color: var(--dim); opacity: .7; }
  .note { width: 100%; text-align: right; font-size: 11px; color: var(--dim); opacity: .75; }
  .setting .switch button { flex: 1; padding: 5px 2px; font-size: 11px; }

  /* Mode icons. The circle is the moving marker, drawn where it meets the
     music; the lines are the rows the stroke glyphs sit on. So the icon says
     both what moves and what it lands on. */
  .ico {
    display: block;
    width: 100%;
    max-width: 40px;
    height: auto;
    margin: 0 auto 3px;
    overflow: visible;
  }

  .ico .wv { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .55; }
  .ico .row { stroke: currentColor; stroke-width: 1.6; }
  .ico .mk { fill: currentColor; }
  .ico .fr { fill: none; stroke: currentColor; stroke-width: 1.4; }

  /* Framing for the strum pane: one frame round the whole pane, or a box
     round each stroke. Transparent rather than none, so nothing resizes. */
  /* With each stroke in its own box the pane needs no surface of its own. */
  :root[data-strumframe="boxes"] .spane {
    border-color: transparent;
    background: none;
  }

  :root[data-strumframe="boxes"] .sslot {
    display: grid;
    place-items: center;
    min-width: 1.5em;
    min-height: 1.25em;
    border: 2px solid var(--dim);
    background: #050705;
  }

  :root[data-strumframe="boxes"] .sslot.hit { border-color: var(--fg); }

  input[type=checkbox] {
    appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 2px solid var(--dim);
    background: var(--panel);
    cursor: pointer;
  }

  input[type=checkbox]:checked {
    border-color: var(--fg);
    background: var(--fg);
    box-shadow: 0 0 10px var(--fg);
  }

  input[type=range] {
    appearance: none;
    flex: none;
    width: 168px;
    height: 20px;
    background: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-runnable-track {
    height: 8px;
    border: 1px solid var(--dim);
    background: repeating-linear-gradient(90deg, var(--dim) 0 3px, #0000 3px 8px);
  }

  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 20px;
    margin-top: -6px;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }

  input[type=range]::-moz-range-track {
    height: 8px;
    border: 1px solid var(--dim);
    background: repeating-linear-gradient(90deg, var(--dim) 0 3px, #0000 3px 8px);
  }

  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 20px;
    border: 0;
    border-radius: 0;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }

  /* ---- stage ---------------------------------------------------------- */

  .stage { position: relative; flex: 1; overflow: hidden; }

  /* The CRT look is three independent pieces: the monochrome palette and the
     text-shadow bloom above, a vignette (::before), and the scanline raster
     (::after) — a repeating gradient of one transparent line and one dark
     line, so --scan-pitch is the distance from one dark line to the next. */
  .stage::before,
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .stage::before {
    z-index: 19;
    background: radial-gradient(120% 90% at 50% 45%, #0000 55%, #000c);
  }

  .stage::after {
    z-index: 20;
    background: repeating-linear-gradient(
      #0000 0 calc(var(--scan-pitch) / 2),
      #000000a0 calc(var(--scan-pitch) / 2) var(--scan-pitch));
  }

  :root[data-scan="off"] .stage::after { display: none; }

  /* The chord surfaces switch off together; the strum pane is independent. */
  :root[data-chords="off"] .main-row,
  :root[data-chords="off"] .preview,
  :root[data-chords="off"] .beats,
  :root[data-chords="off"] .next,
  :root[data-chords="off"] .playhead { display: none; }

  /* Holds however many lines-ahead are asked for, without becoming a row of
     its own: its children are the flex items. */
  #lyricAhead { display: contents; }

  /* ---- lyrics --------------------------------------------------------- */

  /* Three lines stacked at the top of the stage; the current one carries a
     landing pad above every syllable, and the ball flies in the gap left
     above it. JS sets the block's height. */
  /* Left-justified, with a gutter wide enough for a full eight-dot cue: 8
     dots + 7 gaps + the offset, in units of the side lines' font size. */
  .lyrics {
    position: absolute;
    top: 0;
    left: var(--pad);
    width: var(--disp-w);
    padding-left: calc(var(--side-size) * 4.8);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 4px;
    z-index: 5;
  }

  .lyric { position: relative; white-space: nowrap; }

  .lyric.side {
    color: var(--dim);
    font-size: var(--side-size);
    opacity: .7;
  }

  .lyric.cur {
    margin-top: var(--hop-room);
    display: flex;
    align-items: flex-start;
    font-size: var(--cur-size);
  }

  /* A syllable is a column: landing pad on top, text below. */
  .syl {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    color: var(--dim);
    transition: color 90ms;
  }

  /* ♯ and ♭ sit too far from the letter, and the global letter-spacing pushes
     them further; pull them back and drop the tracking on the glyph itself. */
  .acc {
    margin-left: -.16em;
    margin-right: -.04em;
    letter-spacing: 0;
  }

  .syl.word { margin-left: .42em; }
  .syl:first-child { margin-left: 0; }  /* keep the line flush with the others */
  .syl.sung { color: var(--fg); }
  .syl.hit { text-shadow: 0 0 18px var(--fg); }

  .pad {
    width: 100%;
    height: 4px;
    margin-bottom: .18em;
    background: var(--dim);
  }

  /* A held syllable gets a narrower, broken pad — the ball bounces in place
     on it instead of arcing away. */
  .pad.sustain {
    width: 48%;
    background: repeating-linear-gradient(90deg, var(--dim) 0 4px, #0000 4px 8px);
  }

  .syl.sung .pad { background: var(--fg); }
  .syl.sung .pad.sustain { background: repeating-linear-gradient(90deg, var(--fg) 0 4px, #0000 4px 8px); }
  .syl.hit .pad { box-shadow: 0 0 12px var(--fg); }

  /* Countdown until the line starts: one dot per half beat, anchored by its
     right edge to the left of the text, so dots vanish from the left and the
     lyric itself never shifts. Sized against --side-size rather than the host
     line's own em, so the gutter fits it exactly whichever line carries it. */
  .cue {
    position: absolute;
    right: calc(100% + var(--side-size) * .6);
    top: 50%;
    display: flex;
    gap: calc(var(--side-size) * .22);
    transform: translateY(-50%);
  }

  .dot {
    width: calc(var(--side-size) * .33);
    height: calc(var(--side-size) * .33);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 6px var(--fg);
  }

  /* Guides off: plain karaoke, syllables still light up as they're sung. */
  :root[data-guide="off"] .pad,
  :root[data-guide="off"] .lyric-ball { display: none; }

  /* The block is bottom-anchored, so dropping the past line hands its space
     back to the lyrics rather than leaving a hole. */
  :root[data-past="off"] #lyricPrev { display: none; }

  .lyric-ball {
    position: absolute;
    width: calc(22px * var(--lyric-zoom) / 100);
    height: calc(22px * var(--lyric-zoom) / 100);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 20px var(--fg);
    transform: translateX(-50%);
  }

  /* One chord row moves or lights up — the one being played. Everything else
     about the chords is fixed, so no motion competes with now. */
  .main-row {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    display: grid;
    grid-template-columns: repeat(var(--bars, 4), 1fr);
    gap: var(--gap);
    z-index: 4;
  }

  /* The group queued up next: parked below the main row, left-justified,
     small and quiet. Static — it only changes at a group boundary. */
  .preview {
    position: absolute;
    left: var(--pad);
    width: calc(var(--disp-w) * .38);
    display: grid;
    grid-template-columns: repeat(var(--bars, 4), 1fr);
    gap: 6px;
    opacity: .5;
  }

  .preview .measure { border-width: 1px; }
  .preview small { display: none; }

  .measure {
    position: relative;
    height: var(--h);
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 2px solid var(--dim);
    background: var(--panel);
    font-size: calc(var(--h) * .42);
  }

  .name { white-space: nowrap; }

  .measure small {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 11px;
    opacity: .55;
  }

  .main-row .measure {
    color: var(--dim);
    font-size: calc(var(--h) * .58);
    transition: background 120ms, border-color 120ms, color 120ms;
  }

  .main-row .measure.current {
    color: var(--fg);
    border-color: var(--fg);
    background: var(--hot);
    text-shadow: 0 0 16px var(--fg);
  }

  /* Repeat counter in the last bar: one rectangle per pass, emptying from the
     left as passes are spent. It follows the bar's own colour so it stays
     part of the bar rather than a second thing to watch. */
  .repeats {
    position: absolute;
    right: 10px;
    bottom: 9px;
    display: flex;
    gap: 6px;
  }

  .repeats i {
    width: 15px;
    height: 22px;
    border: 3px solid currentColor;
    background: currentColor;
  }

  .repeats i.spent { background: none; }

  /* Same counter in the pane, but counting loops of the pattern inside one
     chord group rather than passes over the group. */
  .spane .repeats { top: 6px; bottom: auto; right: 8px; }
  .spane .repeats i { width: 9px; height: 14px; border-width: 2px; }

  /* One box per eighth-note slot the player has to act on, straddling the top
     edge of the chord row. Positioned in *time* — slot s of 32 sits at s/32
     of the row — which is the same linear space the playhead sweeps, so the
     ball crosses a box's centre exactly on the beat it belongs to. */
  .beats {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    pointer-events: none;
    z-index: 6;
  }

  .beat {
    position: absolute;
    top: 0;
    height: 100%;
    width: var(--bw);
    display: grid;
    place-items: center;
    border: 2px solid var(--dim);
    background: #050705;   /* opaque: the chord row's edge runs behind it */
    color: var(--dim);
    font-size: calc(var(--bh) * .62);
    line-height: 1;
    transform: translateX(-50%);
  }

  .beat.hit {
    color: var(--fg);
    border-color: var(--fg);
    background: var(--hot);
    text-shadow: 0 0 12px var(--fg);
  }

  /* Strum is a three-way: nothing, boxes on the chord row, or its own pane.
     With the pane up the chord row keeps its cursor and bar highlight but
     loses the ball — one bouncing thing on screen at a time. */
  .beats, .spane { display: none; }
  :root[data-chordcue="boxes"] .beats,
  :root[data-chordcue="hand"]  .beats { display: block; }
  :root[data-chordcue="off"]   .ball  { display: none; }
  :root:not([data-pane="off"]) .spane { display: block; }

  /* ---- strum pane ----------------------------------------------------- */

  .spane {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    border: 2px solid var(--dim);
    background: var(--panel);
    z-index: 5;
  }

  /* One loop of the pattern, however many bars that is. Slots are placed by
     time across the pane, so the marker crosses each at its own moment. */
  .sslot {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: var(--sglyph);
    line-height: 1;
    color: var(--dim);
    transition: color 90ms;
  }

  /* data-rows, not data-guide: :root already carries a data-guide for the
     sing guide, and two meanings for one name is asking for trouble. */
  .spane[data-rows="split"] .sslot.up   { top: var(--up-y); }
  .spane[data-rows="split"] .sslot.down { top: var(--down-y); }
  .spane[data-rows="hand"]  .sslot      { top: var(--mid-y); }

  .sslot.hit { color: var(--fg); text-shadow: 0 0 16px var(--fg); }

  .scount {
    position: absolute;
    top: var(--count-y);
    transform: translate(-50%, -50%);
    font-size: var(--scount);
    color: var(--dim);
    opacity: .6;
  }

  .sbar {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--dim);
    opacity: .5;
  }

  .smark {
    position: absolute;
    width: var(--smark);
    height: var(--smark);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 20px var(--fg);
    transform: translate(-50%, -50%);
  }

  /* Where the phrase hands off. Placed at the exact spot the ball lands on the
     return, so it reads as the destination of the last bounce rather than as
     decoration at the end of the row. */
  .catcher {
    position: absolute;
    display: grid;
    place-items: center;
    min-width: 1.2em;
    padding: 0 .1em;
    border: 2px dashed var(--dim);
    color: var(--dim);
    line-height: 1.1;
    font-size: var(--cur-size);
    transform: translate(-50%, -100%);   /* bottom edge on the landing line */
  }

  .scatch {
    font-size: var(--sglyph);
    transform: translate(-50%, -50%);
  }

  .spane .scount { color: var(--dim); }

  .spane[data-rows="split"] .scatch { top: var(--down-y); }
  .spane[data-rows="hand"]  .scatch { top: var(--mid-y); }

  .scursor {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 3px dashed var(--fg);
    opacity: .45;
    transform: translateX(-50%);
  }

  /* ---- playhead ------------------------------------------------------- */

  .playhead {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    pointer-events: none;
    z-index: 8;
  }

  .cursor {
    position: absolute;
    top: var(--ball-zone);
    bottom: 0;
    border-left: 4px dashed var(--fg);
    opacity: .6;
    transform: translateX(-50%);
  }

  .ball {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 26px var(--fg);
    transform: translateX(-50%);
  }

  /* Strum guide: the strumming hand keeps swinging whether or not it strikes,
     so only the glyph changes — the motion never stops. */
  .ball.strum {
    display: grid;
    place-items: center;
    border-radius: 0;
    background: none;
    box-shadow: none;
    font-size: 30px;
    line-height: 1;
    text-shadow: 0 0 14px var(--fg);
  }

  :root[data-playhead="off"] .playhead { display: none; }

  /* ---- next-chord margin ---------------------------------------------- */

  /* JS sizes this to 70% of a main bar, in both directions. */
  .next {
    position: absolute;
    right: var(--pad);
    display: grid;
    place-content: center;
    gap: 4px;
    text-align: center;
    border: 2px dashed var(--dim);
    color: var(--dim);
    z-index: 6;
    transition: color 150ms, border-color 150ms;
  }

  .next.lit {
    color: var(--fg);
    border-color: var(--fg);
    border-style: solid;
    background: var(--hot);
    text-shadow: 0 0 16px var(--fg);
  }

  .next b { font-size: calc(var(--h) * .46); font-weight: inherit; }

  /* ---- load dialog ----------------------------------------------------- */

  .results { display: grid; gap: 2px; width: 100%; max-height: 190px; overflow-y: auto; }

<body>
  <header class="tinted">

      <!-- The countdown belongs to whichever line is about to start, which is
           always the current one, so the cue lives here and is re-appended
           after each render. -->
      <div class="lyric cur" id="lyricCur"><span class="cue" id="cue"></span></div>
      <div id="lyricAhead"></div>
      <div class="lyric-ball" id="lyricBall"></div>

    <div id="preview" class="preview tinted"></div>

      <div id="cursor" class="cursor"></div>
      <div id="ball" class="ball"></div>
    </div>
  </div>
<script>
/* ===========================================================================
   A practice shell: notation on the left of the wire, panels on the right.

   State comes in three kinds, and they have three different lifetimes:

     display settings   per user, saved globally, survive a track change
     track settings     per track, saved against the track's id
     transport          position, playing, loop — never saved, and the part a
                        server drives

   Everything that changes any of them goes through command(). The UI, the URL,
   restored storage and (later) a socket are all just callers, so nothing in the
   drawing code has to know where a change came from.
   =========================================================================== */

const $ = id => document.getElementById(id);
const root = document.documentElement;
const mod = (n, m) => ((n % m) + m) % m;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, t) => a + (b - a) * t;
const arc = t => 4 * t * (1 - t);          /* 0 → 1 → 0, apex at t = .5 */
const TAU = Math.PI * 2;

/* ── the library ────────────────────────────────────────────────────────
   A sketch of what the server will serve. Every track carries the key and
   tempo it was recorded in; the player can move away from both. */
const TRACKS = [
  { id: "a-way-to-say",  title: "A Way To Say",  artist: "",          key: "C",  tempo: 95 },
  { id: "no-computer",   title: "No Computer",   artist: "",          key: "Am", tempo: 89 },
  { id: "half-past-3",   title: "Half Past Three", artist: "",        key: "G",  tempo: 112 },
  { id: "cleanest-thing", title: "The Cleanest Thing", artist: "",    key: "D",  tempo: 78 }
];

/* ── notation ───────────────────────────────────────────────────────────
   Four bars to a group, plus how many times the group is played before
   moving on. A repeat is one more pass over the same four bars. */
const progression = [
  { chords: ["C", "Am", "F", "G"], repeat: 2, strum: "doduoududoduouxu" },
  { chords: ["Em", "Am", "Dm", "G"], repeat: 1 },
  { chords: ["C", "G/B", "Am", "Em"], repeat: 1 },
  { chords: ["F", "C/E", "Dm", "G"], repeat: 3, strum: "doxudmxu" },
  { chords: ["C", "F", "C", "G"], repeat: 1, strum: "dodododo" },
  { chords: ["Dm", "G", "C"], repeat: 2, strum: "doduoudu" },
  { chords: ["Am", "F", "C", "G", "Em", "Dm"], repeat: 1, strum: "doxudmxu" },
  { chords: ["Am", "F", "C", "G"], repeat: 2 }
];

/* A strum pattern is eighth-note slots, any whole number of bars long:
     d down   u up   x percussive hit   m mute   o ring / no strike
   The hand swings down-up once per beat, so even slots always fall on the way
   down and odd slots on the way back up. */
const STRUM_DEFAULT = "doduoudu";
const STROKES = { d: "↓", u: "↑", x: "✕", m: "M", o: "○" };

const CUE_DOTS = 8;               /* longest countdown, one dot per half beat */
const CUE_BEATS = CUE_DOTS / 2;
const CUE_MIN = 2;                /* a shorter gap isn't worth counting down */
const SONG_BEATS = 104;

const song = [
  { at: 4,    syls: [["We",1],["write",1],["the",.5],["loops",1.5],["that",.5],["no",.5],["one",.5],["sees",1.5]] },
  { at: 12,   syls: [["in",.5],["rooms",1],["lit",.5],["blue",1],["at",.5],["half",.5],["past",.5],["three",2]] },
  { at: 24,   syls: [["A",.5],["thou",.5],["+sand",.5],["tests",1.5],["a",.5],["sin",.5],["+gle",.5],["green",2]] },
  { at: 32,   syls: [["the",.5],["clean",.5],["+est",.5],["thing",1],["we've",.5],["ev",.5],["+er",.5],["seen",2]] },
  { at: 44,   syls: [["But",.5],["un",.5],["+der",.5],["all",.5],["the",.5],["stacks",1],["and",.5],["strings",2]] },
  { at: 51.5, syls: [["there's",.5],["some",.5],["+one",.5],["wait",.5],["+ing",.5],["on",.5],["the",.5],["thing",2]] },
  { at: 64,   syls: [["So",.5],["name",1],["it",.5],["plain",1.5],["and",.5],["keep",.5],["it",.5],["kind",2]] },
  { at: 72,   syls: [["leave",1],["ev",.5],["+ery",.5],["com",.5],["+ment",.5],["you",.5],["would",.5],["find",2]] },
  { at: 84,   syls: [["'cause",.5],["code",1],["is",.5],["just",.5],["a",.5],["way",1],["to",.5],["say",2]] },
  { at: 92,   syls: [["I",.5],["thought",1],["of",.5],["you",.5],["a",.5],["+long",1],["the",.5],["way",2.5]] }
];

const lines = song.map(({ at, syls }) => {
  let cursor = 0;
  const parsed = syls.map(([text, dur]) => {
    const syl = { text: text.replace(/^\+/, ""), word: !text.startsWith("+"),
                  start: cursor, dur, sustain: dur >= 1.5 };
    cursor += dur;
    return syl;
  });
  return { start: at, end: at + cursor, span: cursor, syls: parsed };
});

/* A line appears as soon as the one before it stops singing, but never more
   than CUE_BEATS early — exactly as much lead-in as the dots can show. */
lines.forEach((line, i) => {
  const earliest = Math.max(i ? lines[i - 1].end : 0, line.start - CUE_BEATS);
  line.cued = line.start - earliest >= CUE_MIN;
  line.promote = line.cued ? earliest : line.start;
});
lines[0].promote = 0;

/* ── chord spelling ─────────────────────────────────────────────────────
   Names stay ASCII in the data; the glyphs are a rendering step. */
const SHARPS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLATS  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const PITCH_CLASS = { C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,
                      G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11 };

function transpose(name, semis) {
  if (!semis) return name;
  const scale = semis > 0 ? SHARPS : FLATS;
  return name.split("/").map(part => {
    const m = /^([A-G][#b]?)(.*)$/.exec(part);
    if (!m || !(m[1] in PITCH_CLASS)) return part;
    return scale[mod(PITCH_CLASS[m[1]] + semis, 12)] + m[2];
  }).join("/");
}

const accSpan = a => `<span class="acc">${a === "#" ? "♯" : "♭"}</span>`;
const chordHtml = name => name
  .replace(/([A-G])([#b])/g, (_, note, a) => note + accSpan(a))
  .replace(/([#b])(\d)/g, (_, a, digit) => accSpan(a) + digit);

/* ── icons ──────────────────────────────────────────────────────────────
   One grammar: the wave is the marker's path through a bar, the circle is the
   marker drawn where it meets the music, and the short lines are the rows the
   stroke glyphs sit on. So an icon says both what moves and what it lands on. */
const WAVE = "M0,8.00 L0.5,8.90 L1,9.76 L1.5,10.56 L2,11.25 L2.5,11.82 L3,12.25 L3.5,12.51 L4,12.60 L4.5,12.51 L5,12.25 L5.5,11.82 L6,11.25 L6.5,10.56 L7,9.76 L7.5,8.90 L8,8.00 L8.5,7.10 L9,6.24 L9.5,5.44 L10,4.75 L10.5,4.18 L11,3.75 L11.5,3.49 L12,3.40 L12.5,3.49 L13,3.75 L13.5,4.18 L14,4.75 L14.5,5.44 L15,6.24 L15.5,7.10 L16,8.00 L16.5,8.90 L17,9.76 L17.5,10.56 L18,11.25 L18.5,11.82 L19,12.25 L19.5,12.51 L20,12.60 L20.5,12.51 L21,12.25 L21.5,11.82 L22,11.25 L22.5,10.56 L23,9.76 L23.5,8.90 L24,8.00 L24.5,7.10 L25,6.24 L25.5,5.44 L26,4.75 L26.5,4.18 L27,3.75 L27.5,3.49 L28,3.40 L28.5,3.49 L29,3.75 L29.5,4.18 L30,4.75 L30.5,5.44 L31,6.24 L31.5,7.10 L32,8.00";
const ico = extra =>
  `<svg class="ico" viewBox="-1 0 34 16" aria-hidden="true"><path class="wv" d="${WAVE}"/>${extra}</svg>`;

const FLAT_ICO = '<svg class="ico" viewBox="-1 0 34 16" aria-hidden="true">' +
  '<path class="wv" d="M0,8 L32,8" stroke-dasharray="3 3" opacity=".5"/></svg>';
const TROUGHS = '<path class="row" d="M1,14.2 L7,14.2"/><path class="row" d="M17,14.2 L23,14.2"/>';
const PEAKS   = '<path class="row" d="M9,2.2 L15,2.2"/><path class="row" d="M25,2.2 L31,2.2"/>';
const MIDS    = '<path class="row" d="M5,8 L11,8"/><path class="row" d="M21,8 L27,8"/>';
const AT_BEAT = '<circle class="mk" cx="4" cy="12.6" r="2.4"/>';
const AT_CROSS = '<circle class="mk" cx="8" cy="8" r="2.4"/>';

const ICO = {
  off:   FLAT_ICO,
  ball:  ico(AT_BEAT),
  boxes: ico(TROUGHS + AT_BEAT),
  split: ico(TROUGHS + PEAKS + AT_BEAT),
  hand:  ico(MIDS + AT_CROSS),
  frameBoxes: '<svg class="ico" viewBox="0 0 32 16" aria-hidden="true">' +
    '<rect class="fr" x="1.5" y="3.5" width="6" height="9"/>' +
    '<rect class="fr" x="9.5" y="3.5" width="6" height="9"/>' +
    '<rect class="fr" x="17.5" y="3.5" width="6" height="9"/>' +
    '<rect class="fr" x="25.5" y="3.5" width="5" height="9"/></svg>',
  framePane: '<svg class="ico" viewBox="0 0 32 16" aria-hidden="true">' +
    '<rect class="fr" x="1.5" y="3.5" width="29" height="9"/></svg>'
};

const PHOSPHOR = { green: "#46ff7a", amber: "#ffb43c", red: "#ff4436" };
const COLOURS = [{ v: "green", label: "Green" },
                 { v: "amber", label: "Amber" },
                 { v: "red", label: "Red" }];

/* ── the settings registry ──────────────────────────────────────────────
   Every setting is a row of data: what it is called, where it belongs, how it
   is edited, and what it drives. The panel is built from this list, so adding
   a control — for a harmonica lane, a pitch trace, whatever — is one entry
   here and nothing else.

     scope   "display" (per user) or "track" (per track)
     css     writes the raw value + unit to a custom property
     flag    writes the value to a data- attribute on :root, for CSS to switch
     scale   divides for JS use, so 150 in the UI is 1.5 in the maths
     after   what to redo once it changes
     apply   anything that does not fit the above */
const SETTINGS = [
  { name: "controlColour", scope: "display", group: "common", label: "Control colour",
    type: "choice", def: "red", options: COLOURS, apply: v => tint("control", v) },
  { name: "brightness", scope: "display", group: "common", label: "Brightness",
    type: "range", def: 100, min: 40, max: 160, step: 5, unit: "%", css: "--brightness" },
  { name: "bounce", scope: "display", group: "common", label: "Ball bounce",
    type: "range", def: 150, min: 75, max: 250, step: 5, unit: "%", scale: 100 },
  { name: "scanlines", scope: "display", group: "common", label: "Scanlines",
    type: "toggle", def: true, flag: "scan" },
  { name: "scanPitch", scope: "display", group: "common", label: "Scanline pitch",
    type: "range", def: 2, min: 2, max: 16, step: 1, unit: "px", css: "--scan-pitch" },

  { name: "lyricColour", scope: "display", group: "lyrics", label: "Lyric colour",
    type: "choice", def: "amber", options: COLOURS, apply: v => tint("lyrics", v) },
  { name: "zoom", scope: "display", group: "lyrics", label: "Zoom",
    type: "range", def: 100, min: 60, max: 200, step: 5, scale: 100,
    /* suffix, not unit: the readout says "120%" but the variable must stay a
       bare number, because the stylesheet does the dividing by 100. */
    suffix: "%", css: "--lyric-zoom", after: "layout" },
  { name: "singGuide", scope: "display", group: "lyrics", label: "Sing guide",
    type: "toggle", def: true, flag: "guide", after: "layout" },
  { name: "pastLine", scope: "display", group: "lyrics", label: "Past line",
    type: "toggle", def: true, flag: "past", after: "layout" },
  { name: "nextLines", scope: "display", group: "lyrics", label: "Lines ahead",
    type: "range", def: 1, min: 1, max: 8, step: 1, after: "lyrics" },
  { name: "lineCue", scope: "display", group: "lyrics", label: "Line cue",
    type: "choice", def: "dots",
    options: [{ v: "off", label: "Off" }, { v: "dots", label: "Dots" }] },

  { name: "chordPanel", scope: "display", group: "chords", label: "Chord panel",
    type: "toggle", def: true, flag: "chords", after: "layout" },
  { name: "chordColour", scope: "display", group: "chords", label: "Chord colour",
    type: "choice", def: "green", options: COLOURS, apply: v => tint("chords", v) },
  { name: "chordCue", scope: "display", group: "chords", label: "Chord cue",
    type: "choice", def: "off", flag: "chordcue", after: "layout",
    options: [{ v: "off", label: "Off", icon: ICO.off },
              { v: "ball", label: "Ball", icon: ICO.ball },
              { v: "boxes", label: "Boxes", icon: ICO.boxes },
              { v: "hand", label: "Hand", icon: ICO.hand }] },
  { name: "strumPane", scope: "display", group: "chords", label: "Strum pane",
    type: "choice", def: "split", flag: "pane", after: "pane",
    options: [{ v: "off", label: "Off", icon: ICO.off },
              { v: "split", label: "Split", icon: ICO.split },
              { v: "hand", label: "Hand", icon: ICO.hand }] },
  { name: "strumFrame", scope: "display", group: "chords", label: "Frame",
    type: "choice", def: "pane", flag: "strumframe",
    options: [{ v: "boxes", label: "Boxes", icon: ICO.frameBoxes },
              { v: "pane", label: "Pane", icon: ICO.framePane }] },
  { name: "playhead", scope: "display", group: "chords", label: "Playhead",
    type: "toggle", def: true, flag: "playhead" },

  /* Per track, so a song remembers that you play it a step down. */
  { name: "shift", scope: "track", group: "track", label: "Pitch",
    type: "range", def: 0, min: -7, max: 7, step: 1, reset: 0,
    format: v => (v > 0 ? "+" : "") + v, after: "chords,title" },
  { name: "transposeChords", scope: "track", group: "track", label: "Transpose chords",
    type: "toggle", def: true, after: "chords" },
  { name: "speed", scope: "track", group: "track", label: "Speed",
    type: "range", def: 100, min: 50, max: 150, step: 1, scale: 100, reset: 100,
    format: v => (v / 100).toFixed(2) + "x", after: "title" }

  /* Coming: a lane per instrument — harmonica holes, clarinet fingering, a
     piano roll or engraved staff for the vocal — plus a live pitch trace over
     whichever of those is showing. Each is one PANELS entry and one or two
     rows here; none of them needs anything else to change. */
];

const DEF = Object.fromEntries(SETTINGS.map(d => [d.name, d]));
const state = {};                       /* name -> raw value, as the UI holds it */
const num = name => state[name] / (DEF[name].scale || 1);

/* ── stores ─────────────────────────────────────────────────────────────
   Versioned, and unknown keys are ignored rather than thrown at: a newer build
   must be able to read an older browser's saved settings and the reverse. */
const STORE = "riffhound.v1";
const store = { display: {}, tracks: {}, stats: {} };

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    if (saved.display) Object.assign(store.display, saved.display);
    if (saved.tracks) Object.assign(store.tracks, saved.tracks);
    if (saved.stats) Object.assign(store.stats, saved.stats);
  } catch (e) { /* corrupt or unavailable: fall back to defaults */ }
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {}
  }, 250);
}

/* ── elements ───────────────────────────────────────────────────────────── */
const main = $("main"), preview = $("preview"), beats = $("beats"), spane = $("spane");
const lyrics = $("lyrics"), lyricCur = $("lyricCur"), lyricPrev = $("lyricPrev");
const lyricAhead = $("lyricAhead"), lyricBall = $("lyricBall");
const cue = $("cue"), lyricCatch = $("lyricCatch");
const ball = $("ball"), cursor = $("cursor"), playhead = $("playhead");
const stage = $("stage"), next = $("next"), nextChord = $("nextChord");
const play = $("play"), stop = $("stop"), bpm = $("bpm");
const menuBtn = $("menuBtn"), panel = $("panel");
const titleBtn = $("titleBtn"), trackPanel = $("trackPanel");
const titleText = $("titleText"), titleTags = $("titleTags");
const header = document.querySelector("header");

/* Which elements wear each part's phosphor. Each is .tinted, so setting --fg
   on it re-mixes that subtree's shades. Group elements are added once the
   panel has been built. */
const parts = {
  control: [header],
  lyrics: [lyrics],
  chords: [main, preview, next, beats, spane, playhead]
};

function tint(part, colour) {
  parts[part].forEach(el => el && el.style.setProperty("--fg", PHOSPHOR[colour]));
}

/* ── transport ──────────────────────────────────────────────────────────
   Position is one number. Everything else about where we are is derived from
   it, which is what makes seeking, looping and a server telling us where to be
   all the same operation. */
const player = { beat: 0, playing: true, loop: null };
let track = TRACKS[0];

const BALL = 34, BALL_ZONE = 76, LYRIC_BALL = 22, HOP_ROOM = 46, LEAD_STEP = 52;
const BPM_MIN = 40, BPM_MAX = 240;

const tempo = () => clamp(Math.round(track.tempo * num("speed")), BPM_MIN, BPM_MAX);
const beatMs = () => 60000 / tempo();

const zoom = () => num("zoom");
const hopRoom = () => HOP_ROOM * zoom();
const ballSize = () => LYRIC_BALL * zoom();
const paneOn = () => state.strumPane !== "off";
const boxesOn = () => state.chordCue === "boxes" || state.chordCue === "hand";
const zone = () => (state.chordCue === "off" ? 14 : BALL_ZONE);

/* One pass through the whole progression, repeats expanded. */
const CYCLE = progression.reduce((n, g) => n + g.chords.length * 4 * g.repeat, 0);

/* Absolute beat -> which group, which pass, and how far into it. Pure, so it
   can answer for any beat, not just the next one. */
function locate(beat) {
  let b = mod(beat, CYCLE);
  for (let i = 0; i < progression.length; i++) {
    const g = progression[i], len = g.chords.length * 4;
    for (let p = 0; p < g.repeat; p++) {
      if (b < len) return { index: i, pass: p, t: b, group: g, len };
      b -= len;
    }
  }
  return { index: 0, pass: 0, t: 0, group: progression[0], len: 16 };
}

let here = locate(0);                    /* refreshed once per frame */
const bars = () => here.group.chords.length;
const groupBeats = () => bars() * 4;
const slots = () => bars() * 8;
const pattern = () => here.group.strum || STRUM_DEFAULT;
const patternBeats = () => pattern().length / 2;

/* What plays after this pass: the same group again if repeats are left. */
function nextGroup() {
  const g = here.group;
  return here.pass + 1 < g.repeat ? g : progression[(here.index + 1) % progression.length];
}

const chordName = raw => transpose(raw, state.transposeChords ? state.shift : 0);

/* ── panels ─────────────────────────────────────────────────────────────
   The stage is a stack of bands. Each panel says how tall it wants to be and
   where to put itself; layout walks them in order. A new lane — harmonica,
   fingering, a staff, a pitch trace — is one more entry, and nothing else in
   here has to know about it. */
const chordsOn = () => state.chordPanel;

const PANELS = [
  /* Lyrics ask for as much as their lines actually need — the sizes are the
     same clamps the stylesheet uses — and get capped at what is left. Asking
     rather than taking is what keeps the stack at the top of the stage, with
     any slack below it instead of pushed between the panels. */
  { id: "lyrics", flex: true, place: placeLyrics, want: () => {
      const vw = root.clientWidth;      /* what the stylesheet's vw resolves to */
      const side = clamp(vw * .019, 15, 25) * zoom();
      const cur = clamp(vw * .029, 18, 38) * zoom();
      const rows = (state.pastLine ? 1 : 0) + state.nextLines;
      return Math.round(hopRoom() + cur * 1.3 + rows * side * 1.45 + 22);
    } },
  { id: "strum",  gap: () => 16, place: placePane,
    height: h => (paneOn() ? Math.round(h * .17) : 0) },
  { id: "chords", gap: () => zone() + 8, place: placeChords,
    height: h => (chordsOn() ? Math.max(90, Math.round(h * (paneOn() ? .27 : .3))) : 0) },
  { id: "preview", gap: () => 14, place: placePreview,
    height: h => (chordsOn() ? Math.round(h * (paneOn() ? .081 : .09)) : 0) }
];

let geo = {};

function layout() {
  const h = stage.clientHeight;
  geo = { zone: zone() };

  const bands = PANELS.map(p => (p.flex ? 0 : p.height(h)));
  const used = bands.reduce((a, b, i) =>
    a + b + (b > 0 && PANELS[i].gap ? PANELS[i].gap() : 0), 0);

  const flex = PANELS.findIndex(p => p.flex);
  if (flex >= 0) bands[flex] = clamp(PANELS[flex].want(), 90, Math.max(90, h - used));

  let y = 0;
  PANELS.forEach((p, i) => {
    if (bands[i] > 0 && p.gap) y += p.gap();
    p.place(y, bands[i], h);
    if (bands[i] > 0) y += bands[i];
  });

  measurePads();
  if (lastLine >= 0) placeCatcher(lastLine);
}

function placeLyrics(y, band) {
  lyrics.style.top = y + "px";
  lyrics.style.height = band + "px";
  lyrics.style.setProperty("--hop-room", hopRoom() + "px");
}

function placeChords(y, band) {
  geo.top = y;
  geo.mainH = band;
  geo.bottom = y + band;

  /* Beat boxes have to fit between adjacent eighth-note slots. */
  const boxW = Math.min(34, Math.round(main.clientWidth / slots() * .82));
  geo.boxH = Math.round(boxW * .78);

  main.style.top = y + "px";
  main.style.setProperty("--h", band + "px");

  beats.style.top = Math.round(y - geo.boxH / 2) + "px";
  beats.style.height = geo.boxH + "px";
  beats.style.setProperty("--bw", boxW + "px");
  beats.style.setProperty("--bh", geo.boxH + "px");

  playhead.style.top = (y - geo.zone) + "px";
  playhead.style.height = (geo.zone + band) + "px";
  playhead.style.setProperty("--ball-zone", geo.zone + "px");

  /* 70% of a bar, but never wider than the margin actually reserved for it —
     on a wide window a bar gets big enough that 70% of one would reach back
     over the chord row. main.offsetLeft is the page padding. */
  const bar = main.children[0]?.getBoundingClientRect().width || band;
  const nextH = Math.round(band * .7);
  const room = stage.clientWidth - main.offsetLeft * 2 - main.clientWidth - 12;

  next.style.top = Math.round(y + (band - nextH) / 2) + "px";
  next.style.height = nextH + "px";
  next.style.width = Math.max(60, Math.min(Math.round(bar * .7), room)) + "px";
  next.style.setProperty("--h", nextH + "px");
}

/* The pane splits into a stroke band and a count band beneath it. Rows sit
   symmetrically inside the stroke band, and the hand's travel plus its own
   width covers 95% of that band. Ball mode puts upstrokes on the top row and
   downstrokes on the bottom, so a ball bouncing once a beat is lowest on the
   beat and highest on the "and" — exactly where the two kinds of stroke are.
   paneRise is the gap it must cover, fixed by the rows rather than by the
   bounce setting: the ball has to actually land on the glyphs. */
function placePane(y, band) {
  const countH = Math.round(band * .2);
  const bandH = band - countH;
  const upY = Math.round(bandH * .24), downY = Math.round(bandH * .76);
  const markSize = Math.round(band * .16);
  const countSize = Math.round(band * .13);

  geo.paneRise = downY - upY;
  geo.paneSwing = Math.round((bandH * .95 - markSize) / 2);

  spane.style.top = y + "px";
  spane.style.height = band + "px";
  spane.style.setProperty("--up-y", upY + "px");
  spane.style.setProperty("--mid-y", Math.round(bandH * .5) + "px");
  spane.style.setProperty("--down-y", downY + "px");
  spane.style.setProperty("--count-y", Math.round(bandH + countH * .5) + "px");
  spane.style.setProperty("--sglyph", Math.round(band * .3) + "px");
  spane.style.setProperty("--scount", countSize + "px");
  spane.style.setProperty("--smark", markSize + "px");

  /* Side margins wide enough that a stroke box at either end sits inside the
     frame rather than straddling it. Everything in the pane is placed through
     paneX(), so the strokes and the marker share one mapping. */
  spane.style.setProperty("--sm", Math.round(band * .225 + 6) + "px");
}

function placePreview(y, band) {
  preview.style.top = y + "px";
  preview.style.setProperty("--h", band + "px");
}

/* ── chord row, preview, beat boxes ─────────────────────────────────────── */
let lastMeasure = -1, lastSlot = -1, lastCell = null, beatCells = [];

function repeatMarks(repeat) {
  const box = document.createElement("div");
  box.className = "repeats";
  box.append(...Array.from({ length: repeat }, (_, k) => {
    const mark = document.createElement("i");
    if (k < here.pass) mark.className = "spent";
    return mark;
  }));
  return box;
}

function makeMeasure(chord, i, repeat = 0, last = false) {
  const el = document.createElement("div");
  el.className = "measure";
  /* One wrapper, because .measure is a grid: bare text plus an accidental
     span would be two grid items and stack vertically. */
  el.innerHTML = `<small>${i + 1}</small>` +
    `<span class="name">${chordHtml(chordName(chord))}</span>`;
  if (last && repeat > 1) el.append(repeatMarks(repeat));
  return el;
}

function renderChords() {
  const { chords, repeat } = here.group;
  main.style.setProperty("--bars", chords.length);
  main.replaceChildren(...chords.map((c, i) =>
    makeMeasure(c, i, repeat, i === chords.length - 1)));

  const upcoming = nextGroup();
  preview.style.setProperty("--bars", upcoming.chords.length);
  preview.replaceChildren(...upcoming.chords.map((c, i) => makeMeasure(c, i)));
  nextChord.innerHTML = chordHtml(chordName(upcoming.chords[0]));

  renderBeats();
  renderPane();
  lastMeasure = -1;
}

/* A box for every slot that asks for something; nothing where the chord just
   rings on. Placed by time, so slot s of n sits at s/n across the group. */
function renderBeats() {
  const pat = pattern(), n = slots(), cells = [];
  beatCells = [];
  lastCell = null;
  lastSlot = -1;

  for (let s = 0; s < n; s++) {
    const stroke = pat[s % pat.length];
    if (!stroke || stroke === "o") continue;
    const cell = document.createElement("div");
    cell.className = "beat";
    cell.style.left = (s / n * 100) + "%";
    cell.textContent = STROKES[stroke];
    beatCells[s] = cell;
    cells.push(cell);
  }
  beats.replaceChildren(...cells);
}

function updateMeasure(measure) {
  [...main.children].forEach((cell, i) =>
    cell.classList.toggle("current", i === measure));
  next.classList.toggle("lit", measure === bars() - 1);
}

/* A bouncing ball always bounces on the beat, never on the eighths, even where
   the strum guide is finer — so it lands on every fourth box, not every box.
   Hand is not a bounce but a swing: a full down-up per beat, crossing the box
   centre line at the instant a stroke is played. */
const boxTop = () => geo.zone - (boxesOn() ? geo.boxH / 2 : 0);

function bounceY(t) {
  const room = Math.max(0, boxTop() - BALL - 4);
  return boxTop() - BALL -
    Math.abs(Math.sin(t * Math.PI)) * clamp(room * .62 * num("bounce"), 0, room);
}

function strumY(t) {
  const room = Math.min(geo.zone - BALL / 2 - 4, geo.mainH * .35);
  return geo.zone - BALL / 2 +
    Math.sin(mod(t, 1) * TAU) * clamp(geo.boxH * 1.5 * num("bounce"), 0, room);
}

function updateBeat(t) {
  const slot = Math.floor(mod(t, groupBeats()) * 2);
  if (slot === lastSlot) return;

  lastCell?.classList.remove("hit");
  lastCell = beatCells[slot] || null;
  lastCell?.classList.add("hit");

  const pat = pattern();
  ball.textContent = state.chordCue === "hand"
    ? STROKES[pat[slot % pat.length]] || STROKES.o : "";
  lastSlot = slot;
}

/* ── strum pane ─────────────────────────────────────────────────────────── */
let paneSlots = [], paneMark = null, paneCursor = null, paneCatch = null;
let lastPaneSlot = -1, lastPaneCell = null, paneMarks = [], lastPaneLoop = -1;

/* Fraction f of the pattern, as a position inside the pane's margins. Slots,
   dividers, the catcher and the marker all go through here, so nothing can
   land off the grid the others are on. */
const paneX = f => `calc(var(--sm) + (100% - 2 * var(--sm)) * ${f})`;

function renderPane() {
  const pat = pattern(), n = pat.length, kids = [];
  paneSlots = [];
  lastPaneSlot = -1;
  lastPaneCell = null;

  for (let s = 0; s < n; s++) {
    const x = paneX(s / n), stroke = pat[s];

    if (stroke && stroke !== "o") {
      const el = document.createElement("div");
      /* Placement follows the hand, not the glyph: an up-muted chunk still
         happens on the way up. */
      el.className = "sslot " + (s % 2 ? "up" : "down");
      el.style.left = x;
      el.textContent = STROKES[stroke];
      paneSlots[s] = el;
      kids.push(el);
    }

    const count = document.createElement("div");
    count.className = "scount";
    count.style.left = x;
    count.textContent = s % 2 ? "&" : String(s / 2 % 4 + 1);
    kids.push(count);
  }

  for (let b = 1; b < n / 8; b++) {
    const rule = document.createElement("div");
    rule.className = "sbar";
    rule.style.left = paneX(b * 8 / n);
    kids.push(rule);
  }

  /* How many times this pattern comes round before the chords move on. */
  const loops = Math.round(groupBeats() / patternBeats());
  paneMarks = [];
  lastPaneLoop = -1;
  if (loops > 1) {
    const box = document.createElement("div");
    box.className = "repeats";
    for (let k = 0; k < loops; k++)
      paneMarks.push(box.appendChild(document.createElement("i")));
    kids.push(box);
  }

  paneCatch = document.createElement("div");
  paneCatch.className = "catcher scatch";
  paneCatch.style.left = paneX(1);        /* the wrap point, where the marker ends */
  paneCatch.textContent = "↵";
  paneCursor = document.createElement("div");
  paneCursor.className = "scursor";
  paneMark = document.createElement("div");
  paneMark.className = "smark";

  spane.dataset.rows = state.strumPane;
  spane.replaceChildren(...kids, paneCatch, paneCursor, paneMark);
}

function updatePane(t) {
  if (!paneMark) return;

  const period = patternBeats();
  const local = mod(t, period);
  const x = paneX(local / period);
  const phase = mod(t, 1);

  paneCursor.style.left = x;
  paneMark.style.left = x;
  paneMark.style.top = state.strumPane === "hand"
    ? `calc(var(--mid-y) + ${(Math.sin(phase * TAU) * geo.paneSwing).toFixed(1)}px)`
    : `calc(var(--down-y) - ${(arc(phase) * geo.paneRise).toFixed(1)}px)`;

  const loop = Math.floor(t / period);
  if (loop !== lastPaneLoop) {
    paneMarks.forEach((m, k) => m.classList.toggle("spent", k < loop));
    lastPaneLoop = loop;
  }

  const slot = Math.floor(local * 2);
  if (slot === lastPaneSlot) return;
  lastPaneCell?.classList.remove("hit");
  lastPaneCell = paneSlots[slot] || null;
  lastPaneCell?.classList.add("hit");
  lastPaneSlot = slot;
}

/* ── lyrics ─────────────────────────────────────────────────────────────── */
let pads = [], lastLine = -1, lastSyllable = -1, lastCue = -1;
let cueRight = null, cuePitch = 0;

const lineAt = i => lines[mod(i, lines.length)];
const lineText = syls => syls.map(s => (s.word ? " " : "") + s.text).join("").trim();

/* Beats from a line appearing until it is replaced. The ball keeps sweeping
   for all of it, so this is what says where its last bounce lands. */
function lineHold(index) {
  const i = mod(index, lines.length);
  const nxt = lines[mod(index + 1, lines.length)];
  const promote = i === lines.length - 1 ? nxt.promote + SONG_BEATS : nxt.promote;
  return promote - lines[i].start;
}

function placeCatcher(index) {
  if (!pads.length) return;
  const span = lineAt(index).span;
  const f = span > 0 ? Math.floor(lineHold(index)) / span : 1;
  lyricCatch.style.left = lerp(pads[0].x, pads[pads.length - 1].x, f) + "px";
  lyricCatch.style.top = pads[0].y + "px";
}

function lineNow(beat) {
  const cycle = Math.floor(beat / SONG_BEATS);
  const local = beat - cycle * SONG_BEATS;
  let i = lines.length - 1;
  while (i > 0 && local < lines[i].promote) i--;
  return { index: cycle * lines.length + i, base: cycle * SONG_BEATS };
}

function renderLine(index) {
  const syls = lineAt(index).syls.map(syl => {
    const el = document.createElement("span");
    el.className = `syl${syl.word ? " word" : ""}`;
    el.innerHTML = `<b class="pad${syl.sustain ? " sustain" : ""}"></b>${syl.text}`;
    return el;
  });

  lyricCur.replaceChildren(...syls, cue);   /* cue is absolute; takes no column */
  lyricPrev.textContent = lineText(lineAt(index - 1).syls);
  /* However many lines ahead the player asked for. */
  lyricAhead.replaceChildren(...Array.from({ length: state.nextLines }, (_, k) => {
    const el = document.createElement("div");
    el.className = "lyric side";
    el.textContent = lineText(lineAt(index + k + 1).syls);
    return el;
  }));
  lastSyllable = -1;
  lastCue = -1;
  measurePads();
  placeCatcher(index);
}

/* One dot per half beat until this line starts singing, so the last dot goes
   out on its first syllable. Only lines that arrived early are counted down. */
function updateCue(line, local) {
  const waiting = line.start - local;
  const dots = state.lineCue === "dots" && line.cued && waiting > 0
    ? clamp(Math.ceil(waiting * 2), 0, CUE_DOTS) : 0;

  if (dots === lastCue) return;

  cue.replaceChildren(...Array.from({ length: dots }, () => {
    const dot = document.createElement("i");
    dot.className = "dot";
    return dot;
  }));

  /* Measured once, when the countdown first appears at its widest. The group
     is anchored on its right, so that edge and one dot's width are enough to
     say where the head of the remaining dots is at any moment. */
  if (dots > 0) {
    if (lastCue <= 0) {
      const r = cue.getBoundingClientRect(), base = lyrics.getBoundingClientRect();
      cueRight = r.right - base.left;
      cuePitch = r.width / dots;
    }
  } else {
    cueRight = null;
  }
  lastCue = dots;
}

/* Pad centres in .lyrics coordinates; the ball rides on top of them. */
function measurePads() {
  const base = lyrics.getBoundingClientRect();
  pads = [...lyricCur.querySelectorAll(".pad")].map(pad => {
    const r = pad.getBoundingClientRect();
    return { x: r.left - base.left + r.width / 2, y: r.top - base.top };
  });
}

/* Waiting out a countdown: the ball rides the dots out, then takes one hop
   across on the final beat. Anything smoother has it inside the words before
   they start; anything more stepped jumps sideways at each touchdown. */
function leadInAt(t, lead) {
  const head = w => cueRight - (w * 2 - .5) * cuePitch;
  const x = cueRight == null
    ? lerp(pads[0].x - LEAD_STEP * zoom(), pads[0].x, clamp(1 + t / (lead || 1), 0, 1))
    : t < -1 ? head(-t)
    : lerp(head(1), pads[0].x, clamp(t + 1, 0, 1));

  return { i: 0, landed: false, x,
           y: pads[0].y - arc(mod(t, 1)) * hopRoom() * num("bounce") * .6 };
}

/* Steady sweep across the line. Travel is not clamped at the last syllable —
   once the words run out the ball keeps its rate and bounces away to the
   right, into the return box, rather than hovering over the final word. */
function sweepAt(t, span) {
  const from = pads[0], to = pads[pads.length - 1];
  const x = lerp(from.x, to.x, span > 0 ? t / span : 1);
  let i = 0;
  while (i < pads.length - 1 && pads[i + 1].x <= x) i++;
  return { x, y: from.y - arc(mod(t, 1)) * hopRoom() * num("bounce") * .6,
           i, landed: t >= 0 };
}

function updateLyrics(beat) {
  const { index, base } = lineNow(beat);
  if (index !== lastLine) {
    renderLine(index);
    lastLine = index;
  }

  const line = lineAt(index);
  const local = beat - base;
  const t = local - line.start;         /* negative while the line waits */

  updateCue(line, local);
  if (!pads.length) return;

  const pos = t < 0 ? leadInAt(t, line.start - line.promote) : sweepAt(t, line.span);
  lyricBall.style.left = pos.x + "px";
  lyricBall.style.top = (pos.y - ballSize()) + "px";

  const reached = pos.landed ? pos.i : -1;
  if (reached !== lastSyllable) {
    [...lyricCur.children].forEach((el, k) => {
      el.classList.toggle("sung", k <= reached);
      el.classList.toggle("hit", k === reached);
    });
    lastSyllable = reached;
  }
}

/* ── the frame ──────────────────────────────────────────────────────────── */
let lastKey = "";

function frame(now) {
  const dt = now - (frame.last || now);
  frame.last = now;

  if (player.playing) {
    player.beat += dt / beatMs();

    /* A training loop is just a bound on the one number. */
    if (player.loop && player.beat >= player.loop.to)
      player.beat = player.loop.from + (player.beat - player.loop.to);

    practiced(dt);
  }

  here = locate(player.beat);
  const key = here.index + ":" + here.pass;
  if (key !== lastKey) {
    renderChords();
    lastKey = key;
  }

  const t = here.t;
  const measure = Math.min(bars() - 1, Math.floor(t / 4));
  if (measure !== lastMeasure) {
    updateMeasure(measure);
    lastMeasure = measure;
  }

  ball.style.left = cursor.style.left = `${t / here.len * 100}%`;
  ball.style.top = (state.chordCue === "hand" ? strumY : bounceY)(t) + "px";
  updateBeat(t);
  updatePane(t);

  /* The lyric clock is the same number, on its own phrase length, so words and
     chords drift against each other exactly as they do on a lead sheet. */
  updateLyrics(player.beat);

  requestAnimationFrame(frame);
}

/* ── practice log ───────────────────────────────────────────────────────
   How long, and how recently. Kept per track id so the library can put what
   you have been working on at the top. */
function practiced(ms) {
  const s = store.stats[track.id] || (store.stats[track.id] = { secs: 0, last: 0 });
  s.secs += ms / 1000;
  s.last = Date.now();
  if (Math.floor(s.secs) % 10 === 0) save();
}

const ago = t => {
  if (!t) return "";
  const d = (Date.now() - t) / 86400000;
  return d < 1 ? "today" : d < 2 ? "yesterday" : Math.floor(d) + "d ago";
};

const spent = s => !s || s < 60 ? "" : Math.round(s / 60) + "m";

/* ── commands ───────────────────────────────────────────────────────────
   The single door in. A click, a URL parameter, a restored setting and a
   server push all arrive here, which is why none of the drawing code needs to
   know which of those happened. */
function command(msg) {
  const { cmd } = msg;

  if (cmd === "set") return set(msg.name, msg.value);
  if (cmd === "play") return transport(true);
  if (cmd === "stop") return transport(false);
  if (cmd === "seek") { player.beat = Number(msg.beat) || 0; return; }
  if (cmd === "tempo")
    return set("speed", Math.round(Number(msg.bpm) / track.tempo * 100));
  if (cmd === "loop") {
    player.loop = msg.from == null ? null : { from: Number(msg.from), to: Number(msg.to) };
    if (player.loop) player.beat = player.loop.from;
    return;
  }
  if (cmd === "track") return loadTrack(msg.id);
}

function transport(on) {
  /* The guard protects the state change, not the reflection: calling this with
     the value it already has is how the buttons get their initial state. */
  if (on !== player.playing) {
    player.playing = on;
    if (!on) save();
  }
  play.disabled = player.playing;
  stop.disabled = !player.playing;
}

/* ── a server, when there is one ────────────────────────────────────────
   Nothing here yet but the seam: messages are commands, so a session that
   tells four screens what to play and where to be needs no other hooks. */
const net = {
  socket: null,
  connect(url) {
    this.socket = new WebSocket(url);
    this.socket.onmessage = e => {
      try { command(JSON.parse(e.data)); } catch (err) {}
    };
  },
  send(msg) {
    if (this.socket && this.socket.readyState === 1)
      this.socket.send(JSON.stringify(msg));
  }
};

/* ── set / sync ─────────────────────────────────────────────────────────
   set() is the only thing that writes state. sync() is the only thing that
   writes controls, and never fires events, so a change can safely come from
   anywhere without the UI arguing with itself. */
const controls = {};                       /* name -> the element to reflect into */
const AFTER = {
  layout: () => layout(),
  pane:   () => { renderPane(); layout(); },
  chords: () => renderChords(),
  lyrics: () => { if (lastLine >= 0) renderLine(lastLine); layout(); },
  title:  () => updateTitle()
};

function coerce(def, v) {
  if (def.type === "toggle") return !!v;
  if (def.type === "range") return clamp(Number(v), def.min, def.max);
  return def.options.some(o => o.v === v) ? v : def.def;
}

function set(name, value, opts = {}) {
  const def = DEF[name];
  if (!def) return;                        /* unknown setting: ignore, never throw */

  state[name] = coerce(def, value);
  const v = state[name];

  if (def.css) root.style.setProperty(def.css, v + (def.unit || ""));
  if (def.flag) root.dataset[def.flag] = v === true ? "on" : v === false ? "off" : v;
  if (def.apply) def.apply(v);

  sync(name);
  if (!opts.quiet) {
    (def.after || "").split(",").filter(Boolean).forEach(a => AFTER[a]?.());
    (def.scope === "track" ? trackStore() : store.display)[name] = v;
    save();
  }
}

function sync(name) {
  const def = DEF[name], el = controls[name], v = state[name];
  if (!el) return;

  if (def.type === "choice") {
    [...el.children].forEach(b => b.classList.toggle("active", b.dataset.v === v));
  } else if (def.type === "toggle") {
    el.checked = v;
  } else if (document.activeElement !== el) {
    el.value = v;
  }

  const out = el.closest(".setting")?.querySelector("output");
  if (out) out.value = def.format ? def.format(v) : v + (def.suffix || def.unit || "");
}

const trackStore = () => store.tracks[track.id] || (store.tracks[track.id] = {});

/* ── the panel, built from the registry ─────────────────────────────────── */
function rowFor(def) {
  const row = document.createElement("div");
  row.className = "setting";
  row.innerHTML = `<label>${def.label}</label>`;

  if (def.type === "choice") {
    const sw = document.createElement("div");
    sw.className = "switch";
    def.options.forEach(o => {
      const b = document.createElement("button");
      b.dataset.v = o.v;
      b.innerHTML = (o.icon || "") + `<span>${o.label}</span>`;
      b.onclick = () => command({ cmd: "set", name: def.name, value: o.v });
      sw.append(b);
    });
    row.append(sw);
    controls[def.name] = sw;
  } else if (def.type === "toggle") {
    const box = document.createElement("input");
    box.type = "checkbox";
    box.onchange = () => command({ cmd: "set", name: def.name, value: box.checked });
    row.append(box);
    controls[def.name] = box;
  } else {
    const slider = document.createElement("input");
    Object.assign(slider, { type: "range", min: def.min, max: def.max, step: def.step });
    slider.oninput = () => command({ cmd: "set", name: def.name, value: slider.value });

    const val = document.createElement("span");
    val.className = "val";
    val.append(document.createElement("output"));
    if (def.reset !== undefined) {
      const r = document.createElement("button");
      r.className = "reset";
      r.textContent = "reset";
      r.onclick = () => command({ cmd: "set", name: def.name, value: def.reset });
      val.append(r);
    }
    row.append(slider, val);
    controls[def.name] = slider;
  }
  return row;
}

function group(title, id, defs) {
  const box = document.createElement("details");
  box.open = true;
  box.className = "tinted";
  if (id) box.id = id;
  const sum = document.createElement("summary");
  sum.textContent = title;
  const body = document.createElement("div");
  body.className = "group";
  body.append(...defs.map(rowFor));
  box.append(sum, body);
  return box;
}

function buildPanel() {
  const of = g => SETTINGS.filter(d => d.group === g);
  panel.replaceChildren(
    group("Display", null, of("common")),
    group("Lyrics", "lyricsGroup", of("lyrics")),
    group("Chords", "chordsGroup", of("chords")));

  /* Each part's settings wear that part's colour, so the panel says which
     display a control belongs to before you read the label. */
  parts.lyrics.push($("lyricsGroup"));
  parts.chords.push($("chordsGroup"));
}

/* ── the track panel, and loading ───────────────────────────────────────── */
let results = null, searchBox = null;

function buildTrackPanel() {
  const row = document.createElement("div");
  row.className = "setting";
  row.innerHTML = `<label for="search">Load track</label>`;

  searchBox = document.createElement("input");
  Object.assign(searchBox, { id: "search", className: "search", type: "search",
                             placeholder: "search tracks…", autocomplete: "off" });
  searchBox.oninput = () => renderResults(searchBox.value);

  results = document.createElement("div");
  results.className = "results";

  const orig = document.createElement("div");
  orig.className = "setting";
  orig.innerHTML = `<label>Recorded in</label><output id="origInfo"></output>`;

  row.append(searchBox, results);
  trackPanel.replaceChildren(row,
    group("Track", null, SETTINGS.filter(d => d.group === "track")));
  trackPanel.querySelector(".group").prepend(orig);
  renderResults("");
}

/* What the library endpoint will fill in. Sorted by what you touched last, and
   showing how long you have spent on it, since that is the thing you want when
   you sit down to practise. */
function renderResults(query = "") {
  const q = String(query).trim().toLowerCase();
  const rows = TRACKS
    .filter(t => !q || (t.title + " " + t.artist).toLowerCase().includes(q))
    .sort((a, b) => (store.stats[b.id]?.last || 0) - (store.stats[a.id]?.last || 0))
    .map(t => {
      const s = store.stats[t.id] || {};
      const b = document.createElement("button");
      b.className = "result" + (t.id === track.id ? " on" : "");
      b.innerHTML = `<b>${t.title}</b><i>${spent(s.secs)}</i><i>${ago(s.last)}</i>`;
      b.onclick = () => command({ cmd: "track", id: t.id });
      return b;
    });

  results.replaceChildren(...(rows.length ? rows :
    [Object.assign(document.createElement("div"), { className: "note", textContent: "nothing found" })]));
}

function loadTrack(id) {
  const found = TRACKS.find(t => t.id === id);
  if (!found) return;

  track = found;
  /* Track settings are per track: restore this one's, defaulting where it has
     none. Only the notation is still shared — the demo has one song's worth. */
  const saved = trackStore();
  SETTINGS.filter(d => d.scope === "track")
          .forEach(d => set(d.name, saved[d.name] ?? d.def, { quiet: true }));

  player.beat = 0;
  lastKey = "";
  $("origInfo").value = `${track.key} · ${track.tempo} bpm`;
  renderResults(searchBox.value);
  updateTitle();
  renderChords();
}

/* The title names the track, and then only what has been moved away from its
   original: the key it now sounds in, and the speed relative to the record. */
function updateTitle() {
  const ratio = num("speed");
  const tags = [];
  if (state.shift) tags.push(chordHtml(transpose(track.key, state.shift)));
  if (Math.abs(ratio - 1) > .005) tags.push(ratio.toFixed(2) + "x");

  titleText.textContent = track.title;
  titleTags.innerHTML = tags.length ? " - " + tags.join(" - ") : "";
  if (document.activeElement !== bpm) bpm.value = tempo();
}

/* ── menus ──────────────────────────────────────────────────────────────── */
function openMenu(open) {
  panel.hidden = !open;
  menuBtn.setAttribute("aria-expanded", open);
  menuBtn.classList.toggle("active", open);
  if (open) openTrack(false);
}

function openTrack(open) {
  trackPanel.hidden = !open;
  titleBtn.setAttribute("aria-expanded", open);
  if (open) { renderResults(searchBox.value); openMenu(false); }
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

play.onclick = () => command({ cmd: "play" });
stop.onclick = () => command({ cmd: "stop" });
menuBtn.onclick = () => openMenu(panel.hidden);
$("fsBtn").onclick = toggleFullscreen;
titleBtn.onclick = () => openTrack(trackPanel.hidden);

addEventListener("pointerdown", e => {
  if (!panel.hidden && !e.target.closest(".menu")) openMenu(false);
  if (!trackPanel.hidden && !e.target.closest(".track")) openTrack(false);
});
addEventListener("resize", layout);
addEventListener("fullscreenchange", () => {
  $("fsBtn").classList.toggle("active", !!document.fullscreenElement);
  layout();
});

/* Digits only, and don't fight the caret while the field has focus. */
bpm.addEventListener("input", () => {
  bpm.value = bpm.value.replace(/\D/g, "").slice(0, 3);
  if (bpm.value) command({ cmd: "tempo", bpm: bpm.value });
});
bpm.addEventListener("blur", () => { bpm.value = tempo(); });
bpm.addEventListener("keydown", e => { if (e.key === "Enter") bpm.blur(); });
bpm.addEventListener("focus", () => bpm.select());

addEventListener("keydown", e => {
  /* Don't steal keys from the tempo field or the track search box. */
  if (e.target.tagName === "INPUT" && /^(text|search)$/.test(e.target.type)) return;

  const colour = { g: "green", a: "amber", r: "red" }[e.key.toLowerCase()];
  if (colour) ["controlColour", "lyricColour", "chordColour"]
    .forEach(n => command({ cmd: "set", name: n, value: colour }));
  else if (e.key === "=" || e.key === "+") nudge(1);
  else if (e.key === "-" || e.key === "_") nudge(-1);
  else if (e.key === " ") command({ cmd: player.playing ? "stop" : "play" });
  else if (e.key.toLowerCase() === "f") toggleFullscreen();
  else if (e.key === "Escape") { openMenu(false); openTrack(false); }
  else return;
  e.preventDefault();
});

/* Step to the next/previous multiple of five bpm. */
function nudge(dir) {
  const t = tempo(), r = t % 5;
  command({ cmd: "tempo", bpm: dir > 0 ? t + 5 - r : (r === 0 ? t - 5 : t - r) });
}

/* ── boot ───────────────────────────────────────────────────────────────
   Defaults, then saved settings, then the URL — each layer allowed to override
   the one before, all of them going through the same door. */
load();
buildPanel();
buildTrackPanel();

SETTINGS.forEach(d => set(d.name, d.def, { quiet: true }));
SETTINGS.filter(d => d.scope === "display")
        .forEach(d => d.name in store.display && set(d.name, store.display[d.name], { quiet: true }));
loadTrack(TRACKS[0].id);

/* ?beat=32&tempo=104&play=0&set.zoom=140 — the same commands a socket sends. */
new URLSearchParams(location.search).forEach((v, k) => {
  if (k.startsWith("set.")) command({ cmd: "set", name: k.slice(4), value: v });
  else if (k === "track") command({ cmd: "track", id: v });
  else if (k === "beat") command({ cmd: "seek", beat: v });
  else if (k === "tempo") command({ cmd: "tempo", bpm: v });
  else if (k === "loop") { const [f, t] = v.split(",");
                           command({ cmd: "loop", from: f, to: t }); }
  else if (k === "play") command({ cmd: v === "0" ? "stop" : "play" });
});

renderLine(0);
layout();
transport(player.playing);
requestAnimationFrame(frame);
</script>
</body>
</html>
