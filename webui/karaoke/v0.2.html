const tint = (part, colour) =>
  parts[part].forEach(el => el && el.style.setProperty("--fg", PHOSPHOR[colour]));

/* ── transport ──────────────────────────────────────────────────────────
   Position is one number again, but now the audio owns it: when a track is
   loaded the element is the clock and we only read it. That is the honest
   arrangement — the sound cannot be made to follow us. */
const player = { time: 0, duration: 0, playing: false, loop: null };
let track = { id: null, title: "No track loaded" };
let audio = null, audioUrl = null;

const LYRIC_BALL = 22, HOP_ROOM = 46, LEAD_STEP = 52, BALL = 34, BALL_ZONE = 76;

const zoom = () => num("zoom");
const hopRoom = () => HOP_ROOM * zoom();
const ballSize = () => LYRIC_BALL * zoom();
const paneOn = () => state.strumPane !== "off";
const chordsOn = () => state.chordPanel;
const zone = () => (state.chordCue === "off" ? 14 : BALL_ZONE);

let lyricLines = [], sections = [], beatGrid = [], chordLine = [];

/* The beatmap's own grid, when it has one. Bouncing on recorded beats rather
   than a fixed rate is the difference between following the record and
   following a metronome that happens to start in the right place. */
function beatIndex(t) {
  let lo = 0, hi = beatGrid.length - 1;
  if (hi < 0 || t < beatGrid[0]) return -1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (beatGrid[mid] <= t) lo = mid; else hi = mid - 1;
  }
  return lo;
}

/* The typical gap, taken as the median so a couple of wild intervals — or a
   long unmarked stretch — cannot drag it. */
let beatPeriod = 0;
function analyseBeats() {
  const gaps = [];
  for (let i = 1; i < beatGrid.length; i++) gaps.push(beatGrid[i] - beatGrid[i - 1]);
  gaps.sort((a, b) => a - b);
  beatPeriod = gaps.length ? gaps[gaps.length >> 1] : 0;
}

/* Most maps mark only the opening: Margaritaville has 150 beats over three
   and a half minutes. So: bounce on real beats where they are written, and
   where they run out — or a gap is too long to be one beat — carry on at the
   established period, in phase from the last beat actually marked. That keeps
   the bounce honest for as long as the map is, then plausible after. */
const GAP_FACTOR = 1.6;

function beatPhase(t) {
  const p = beatPeriod || BOUNCE;
  if (!beatGrid.length) return mod(t, p) / p;

  const i = beatIndex(t);
  if (i < 0) return mod(t - beatGrid[0], p) / p;
  if (i >= beatGrid.length - 1) return mod(t - beatGrid[i], p) / p;

  const d = beatGrid[i + 1] - beatGrid[i];
  return d > p * GAP_FACTOR ? mod(t - beatGrid[i], p) / p : (t - beatGrid[i]) / d;
}

function bpmAt(t) {
  if (!beatPeriod) return 0;
  const i = beatIndex(t);
  if (i < 0 || i >= beatGrid.length - 1) return Math.round(60 / beatPeriod);

  /* Averaged over four beats so the readout doesn't jitter on human timing. */
  const j = Math.min(beatGrid.length - 1, i + 4);
  const local = (beatGrid[j] - beatGrid[i]) / (j - i);
  return Math.round(60 / (local > beatPeriod * GAP_FACTOR ? beatPeriod : local));
}

/* A fractional beat number for a time and its inverse, by interpolating
   between the beats either side and extrapolating past both ends with the
   nearest interval. A strum loop is a number of beats long, not a number of
   seconds, so laying its repeats out in this coordinate is what makes them
   drift with the take instead of walking off it. The two are exact inverses,
   which matters: a slot's time is round-tripped through both. */
function beatPos(t) {
  const p = beatPeriod || BOUNCE;
  if (beatGrid.length < 2) return t / p;

  const i = beatIndex(t);
  if (i < 0) return (t - beatGrid[0]) / (beatGrid[1] - beatGrid[0]);
  if (i >= beatGrid.length - 1) {
    const n = beatGrid.length;
    return n - 1 + (t - beatGrid[n - 1]) / (beatGrid[n - 1] - beatGrid[n - 2]);
  }
  return i + (t - beatGrid[i]) / (beatGrid[i + 1] - beatGrid[i]);
}

function beatTime(b) {
  const p = beatPeriod || BOUNCE;
  if (beatGrid.length < 2) return b * p;

  const n = beatGrid.length;
  if (b <= 0)     return beatGrid[0] + b * (beatGrid[1] - beatGrid[0]);
  if (b >= n - 1) return beatGrid[n - 1] + (b - n + 1) * (beatGrid[n - 1] - beatGrid[n - 2]);
  const i = Math.floor(b);
  return lerp(beatGrid[i], beatGrid[i + 1], b - i);
}

/* ── strum ──────────────────────────────────────────────────────────────
   A strum line is one loop: its span says where the loop starts and how many
   beats it takes to come round, and it keeps repeating until the next strum
   line. So a song played one way needs one line, and a bridge that changes the
   right hand needs one more. */
let strumLines = [];

function analyseStrums(list, until) {
  strumLines = list.map((s, i) => {
    const pat = compileStrum(s.pattern);
    const b0 = beatPos(s.t_start);
    const span = beatPos(s.t_end) - b0;
    /* The span is the authority on how long the loop is, because the beats are
       what the audio actually did; the pattern's own length is the fallback for
       a line written without one. They disagreeing is worth saying out loud —
       it means the eighths in the pattern are not the eighths on the record. */
    const loop = span > .05 ? span : pat.beats;
    return { pat, b0, loop, mismatch: span > .05 && Math.abs(span - pat.beats) > .05,
             from: s.t_start, to: i + 1 < list.length ? list[i + 1].t_start : until };
  });
}

/* Which loop of which pattern is running at t, and how far through it. */
function strumAt(t) {
  if (!strumLines.length) return null;
  let i = 0;
  while (i < strumLines.length - 1 && t >= strumLines[i + 1].from) i++;
  const s = strumLines[i];
  if (t < s.from || t >= s.to) return null;

  const k = (beatPos(t) - s.b0) / s.loop;
  return { line: s, pat: s.pat, loop: Math.floor(k), f: mod(k, 1) };
}

/* When slot `s` of loop `k` is played. Slots are evenly spaced across the
   loop — eighth notes when the line is written as one — and the time comes
   back through the beat grid, so a slot lands where the beat under it landed. */
const slotTime = (line, k, s) =>
  beatTime(line.b0 + (k + s / line.pat.n) * line.loop);

/* ── panels ─────────────────────────────────────────────────────────────
   A stack of bands: each says how tall it wants to be and where to put
   itself. The chord surfaces are still here, and still sized, so that when
   the maps grow chords there is nowhere new to put them. */
const PANELS = [
  { id: "lyrics", flex: true, place: placeLyrics, want: () => {
      const vw = root.clientWidth;
      const side = clamp(vw * .019, 15, 25) * zoom();
      const cur = clamp(vw * .029, 18, 38) * zoom();
      const rows = (state.pastLine ? 1 : 0) + state.nextLines;
      return Math.round(hopRoom() + cur * 1.3 + rows * side * 1.45 + 22);
    } },
  { id: "strum", gap: () => 16, place: placePane,
    height: h => (paneOn() ? Math.round(h * .17) : 0) },
  { id: "chords", gap: () => zone() + 8, place: placeChords,
    height: h => (chordsOn() ? Math.max(90, Math.round(h * (paneOn() ? .27 : .3))) : 0) },
  { id: "preview", gap: () => 14, place: placePreview,
    height: h => (chordsOn() ? Math.round(h * (paneOn() ? .081 : .09)) : 0) }
];

let geo = {};

function layout() {
  const h = stage.clientHeight;
  geo = { zone: zone() };

  const bands = PANELS.map(p => (p.flex ? 0 : p.height(h)));
  const used = bands.reduce((a, b, i) =>
    a + b + (b > 0 && PANELS[i].gap ? PANELS[i].gap() : 0), 0);

  const flex = PANELS.findIndex(p => p.flex);
  if (flex >= 0) bands[flex] = clamp(PANELS[flex].want(), 90, Math.max(90, h - used));

  let y = 0;
  PANELS.forEach((p, i) => {
    if (bands[i] > 0 && p.gap) y += p.gap();
    p.place(y, bands[i], h);
    if (bands[i] > 0) y += bands[i];
  });

  fitLines();
  measurePads();
  if (lastLine >= 0) placeCatcher(lastLine, lastRest);
}

function placeLyrics(y, band) {
  lyrics.style.top = y + "px";
  lyrics.style.height = band + "px";
  lyrics.style.setProperty("--hop-room", hopRoom() + "px");
}

function placeChords(y, band) {
  geo.top = y; geo.mainH = band; geo.bottom = y + band; geo.boxH = 20;
  main.style.top = y + "px";
  main.style.setProperty("--h", band + "px");
  beats.style.top = Math.round(y - geo.boxH / 2) + "px";
  beats.style.height = geo.boxH + "px";
  beats.style.setProperty("--bh", geo.boxH + "px");
  beats.style.setProperty("--bw", Math.round(geo.boxH * 1.05) + "px");
  playhead.style.top = (y - geo.zone) + "px";
  playhead.style.height = (geo.zone + band) + "px";
  playhead.style.setProperty("--ball-zone", geo.zone + "px");

  const nextH = Math.round(band * .7);
  const bar = main.clientWidth / 4;
  const room = stage.clientWidth - main.offsetLeft * 2 - main.clientWidth - 12;
  next.style.top = Math.round(y + (band - nextH) / 2) + "px";
  next.style.height = nextH + "px";
  next.style.width = Math.max(60, Math.min(Math.round(bar * .7), room)) + "px";
  next.style.setProperty("--h", nextH + "px");
}

function placePane(y, band) {
  const countH = Math.round(band * .2), bandH = band - countH;
  const upY = Math.round(bandH * .24), midY = Math.round(bandH * .5);
  const downY = Math.round(bandH * .76);
  /* What the marker's ±1 is worth in pixels, in each of the pane's two
     readings: the rows it lands on, and the swing it makes through them. */
  geo.paneRow = downY - midY;
  geo.paneSwing = Math.round(bandH * .3);
  geo.paneRoom = Math.round(bandH * .46);
  /* The sizes the band alone would like. A loop that only occupies part of the
     pane packs its slots tighter than that, so renderPane may come back and
     take them down; these are the ceiling. */
  geo.paneGlyph = Math.round(band * .3);
  geo.paneCount = Math.round(band * .13);
  geo.paneMargin = Math.round(band * .225 + 6);

  spane.style.top = y + "px";
  spane.style.height = band + "px";
  spane.style.setProperty("--up-y", upY + "px");
  spane.style.setProperty("--mid-y", midY + "px");
  spane.style.setProperty("--down-y", downY + "px");
  spane.style.setProperty("--count-y", Math.round(bandH + countH * .5) + "px");
  spane.style.setProperty("--sglyph", geo.paneGlyph + "px");
  spane.style.setProperty("--scount", geo.paneCount + "px");
  spane.style.setProperty("--smark", Math.round(band * .16) + "px");
  spane.style.setProperty("--sm", geo.paneMargin + "px");
  /* The pane is drawn against its own width, so a resize has to redraw it. */
  paneAt = "";
}

function placePreview(y, band) {
  preview.style.top = y + "px";
  preview.style.setProperty("--h", band + "px");
}

/* ── lyrics ─────────────────────────────────────────────────────────────
   No syllable map yet, so a line is one span: it lights while its own range
   is running, and the ball sweeps across it in that time. When the maps carry
   syllables this becomes the same landing-pad code the demo has. */
let pads = [], lastLine = -1, lastRest = false, lastLit = null, lastCue = -1;
let cueRight = null, cuePitch = 0;

const lineAt = i => lyricLines[clamp(i, 0, lyricLines.length - 1)];
const lineText = i =>
  (i >= 0 && i < lyricLines.length ? lyricLines[i].text : "");

/* Which line is on screen: the last one to have been promoted. */
function lineNow(t) {
  if (!lyricLines.length) return -1;
  let i = lyricLines.length - 1;
  while (i > 0 && t < lyricLines[i].promote) i--;
  return t < lyricLines[0].promote ? -1 : i;
}

/* When a line stops being on screen: the next line's promotion, or two seconds
   past the end for the last one. */
const handoff = i => (i + 1 < lyricLines.length ? lyricLines[i + 1].promote
                                                : lyricLines[i].t_end + 2);

/* Seconds from a line appearing until it is replaced. */
const lineHold = i => handoff(i) - lyricLines[i].t_start;

/* Is line i over, with the wait after it long enough to clear the row? */
const resting = (i, t) =>
  i >= 0 && lyricLines[i].rest != null && t >= lyricLines[i].rest;

/* The far end of the row; nothing may land past it. */
const rowEnd = () => Math.max(pads[0].x + 24, lyrics.clientWidth - 24);

/* Where the ball lands. Singing a line, that is where its sweep has got to by
   the time the next line takes over -- past the last word, because the ball
   keeps moving through the gap. Resting, the row is blank and the ball has the
   whole of it to cross, so it is the end of the row.

   Either way it is clamped to the row: extrapolating a two-second line across
   an eight-second wait used to put the catcher, and the ball chasing it, off
   the right of the screen. */
function catchX(i, rest) {
  if (rest) return rowEnd();
  const l = lyricLines[i];
  const span = Math.max(.2, l.t_end - l.t_start);
  return Math.min(rowEnd(), lerp(pads[0].x, pads[1].x, lineHold(i) / span));
}

function placeCatcher(i, rest) {
  if (!pads.length || i < 0) return;
  lyricCatch.style.left = catchX(i, rest) + "px";
  lyricCatch.style.top = pads[0].y + "px";
}

/* Resting, the current row is blank and the line that has just finished moves
   up to the past row -- which is what it now is. The lines ahead are the same
   either way: the next line to sing is still the next line to sing. */
function renderLine(i, rest) {
  const span = document.createElement("span");
  span.className = "line";
  span.textContent = (rest ? "" : lineText(i)) || "\u00a0";
  lyricCur.replaceChildren(span, cue);
  lyricPrev.textContent = lineText(rest ? i : i - 1);

  lyricAhead.replaceChildren(...Array.from({ length: state.nextLines }, (_, k) => {
    const el = document.createElement("div");
    el.className = "lyric side";
    el.textContent = lineText(i + k + 1);
    return el;
  }));

  lastLit = null;
  lastCue = -1;
  fitLines();
  measurePads();
  placeCatcher(i, rest);
}

/* Lines that no longer fit in the band are not drawn at all.

   The band is what is left once the surfaces below it have taken their space,
   so switching on the strum pane, or asking for more lines than the window is
   tall enough for, leaves room for fewer than were asked for. Letting the
   surplus spill was the wrong answer twice over: it ran over the chord row,
   and it showed a line in a place that means something else.

   The current line is never one of them: it is the line the display is for. So
   the past line goes first when the current line is the one being pushed out,
   since it is above and dropping it is what pulls the current line back in;
   otherwise the lines ahead go from the far end. The ball's headroom is the
   current line's own top margin, so what the past line hands back goes to the
   lines rather than to the hop. */
function fitLines() {
  const room = lyrics.clientHeight;
  if (!room) return;

  const ahead = [...lyricAhead.children];
  const show = (el, on) => { if (el) el.style.display = on ? "" : "none"; };
  ahead.forEach(el => show(el, true));
  show(lyricPrev, true);

  const top = () => lyrics.getBoundingClientRect().top;
  const over = el => el && el.getBoundingClientRect().bottom - top() > room + .5;

  /* The past line goes first when even the current line is being pushed out:
     it is above, so dropping it is what pulls the current line back in. */
  if (over(lyricCur)) show(lyricPrev, false);
  for (let k = ahead.length - 1; k >= 0 && over(ahead[k]); k--) show(ahead[k], false);
}

/* Two points rather than a pad per syllable: where the line starts and where
   it ends. The ball rides between them. */
function measurePads() {
  const base = lyrics.getBoundingClientRect();
  const line = lyricCur.querySelector(".line");
  if (!line) { pads = []; return; }
  const r = line.getBoundingClientRect();
  const y = r.top - base.top;
  pads = [{ x: r.left - base.left, y }, { x: r.right - base.left, y }];
}

function updateCue(line, t) {
  const waiting = line ? line.t_start - t : 0;
  const dots = state.lineCue === "dots" && line && line.cued && waiting > 0
    ? clamp(Math.ceil(waiting / CUE_STEP), 0, CUE_DOTS) : 0;

  if (dots === lastCue) return;

  cue.replaceChildren(...Array.from({ length: dots }, () => {
    const dot = document.createElement("i");
    dot.className = "dot";
    return dot;
  }));

  if (dots > 0) {
    if (lastCue <= 0) {
      const r = cue.getBoundingClientRect(), base = lyrics.getBoundingClientRect();
      cueRight = r.right - base.left;
      cuePitch = r.width / dots;
    }
  } else {
    cueRight = null;
  }
  lastCue = dots;
}

/* Riding the countdown out, then one hop onto the first word so the ball
   arrives exactly as the line starts. */
function leadIn(dt, lead) {
  const head = w => cueRight - (w / CUE_STEP - .5) * cuePitch;
  return cueRight == null
    ? lerp(pads[0].x - LEAD_STEP * zoom(), pads[0].x, clamp(1 + dt / (lead || 1), 0, 1))
    : dt < -BOUNCE ? head(-dt)
    : lerp(head(BOUNCE), pads[0].x, clamp(dt / BOUNCE + 1, 0, 1));
}

/* Across the line while it is being sung, then on to the catcher. The run-out
   used to be the sweep extrapolated, which is right only while the ball has
   somewhere to go: a short line followed by a long wait sent it off the side of
   the screen. It now aims at the catcher, so the two agree by construction
   wherever that lands. */
function sweepAt(dt, span) {
  return lerp(pads[0].x, pads[1].x, span > 0 ? clamp(dt / span, 0, 1) : 1);
}

/* Both balls bounce on the same grid, so they agree about where the beat is.
   The hop is the one thing every stage has in common — the ball keeps time
   whether it is counting in, singing, running out, or crossing a blank row. */
const bob = () => arc(beatPhase(player.time)) * hopRoom() * num("bounce") * .6;

function updateLyrics(t) {
  const i = lineNow(t);
  const rest = resting(i, t);
  if (i !== lastLine || rest !== lastRest) {
    renderLine(i, rest);
    lastLine = i;
    lastRest = rest;
  }
  if (i < 0 || !pads.length) return;

  const line = lyricLines[i];
  const dt = t - line.t_start;
  const span = Math.max(.2, line.t_end - line.t_start);
  const to = handoff(i);
  const at = catchX(i, rest);

  updateCue(line, t);

  /* Four stages, and the ball is doing something different in each: riding the
     countdown in, sweeping the line, running out past its last word, or -- when
     the row has been cleared for a rest -- crossing the blank row from the
     margin to the return box, which is where the next line's countdown starts. */
  const ease = (from, t0, t1) =>
    lerp(from, at, clamp(t1 > t0 ? (t - t0) / (t1 - t0) : 1, 0, 1));

  const x = dt < 0        ? leadIn(dt, line.t_start - line.promote)
          : rest          ? ease(pads[0].x, line.rest, to)
          : t <= line.t_end ? sweepAt(dt, span)
          :                 ease(pads[1].x, line.t_end, to);

  lyricBall.style.left = x + "px";
  lyricBall.style.top = (pads[0].y - bob() - ballSize()) + "px";

  const lit = dt >= 0 && t <= line.t_end;
  if (lit !== lastLit) {
    lyricCur.classList.toggle("on", lit);
    lastLit = lit;
  }
}

/* ── chords ─────────────────────────────────────────────────────────────
   A window of four chords, each box as wide as the chord is long, so the
   cursor can sweep the row linearly in time and still line up with the boxes.
   That is the proportional sizing an off-beat change needs; it comes free once
   the boxes stop being equal quarters of a bar. */
const BARS_PER_ROW = 4;
let chordGroups = [], groupAt = -1, barLen = 2;

/* Chords are grouped once, on load, and the row then holds a whole group at a
   time instead of shuffling along at every change. Groups never straddle a
   section, so what you memorise is "the four that open the chorus" rather than
   an arbitrary window that happened to line up that way. */
function groupChords() {
  /* One row is BARS_PER_ROW bars of time — always, for every group. That is
     what makes the cursor cross at one rate and a short group simply stop
     early instead of being stretched. Runs are broken to fit rather than
     counted, because four chords can be four bars or eight. */
  const beats = sections[0]?.beatsPerBar || 4;
  barLen = (beatPeriod || BOUNCE) * beats;

  chordGroups = [];
  let run = [];
  const flush = () => { if (run.length) chordGroups.push(run); run = []; };
  const bars = r => (r[r.length - 1].t_end - r[0].t_start) / barLen;

  const sectionOf = t => sections.findIndex(s => t >= s.t_start && t < s.t_end);
  let inSection = -1, inGroup = -1;

  for (const c of chordLine) {
    const grp = c.group >= 0 ? c.group : -1;
    /* Chords written on one line are a row the author already decided on, so
       the whole run takes the section of its first chord. Sections are marked
       by ear and land a fraction of a bar off the changes they introduce —
       reading each chord's own section would let that fraction shear "Em C G D"
       into "Em" and "C G D" at every boundary. Loose chords still break on a
       section, which is what keeps "the four that open the chorus" a row. */
    const sec = grp >= 0 && grp === inGroup ? inSection : sectionOf(c.t_start);

    if (grp !== inGroup || sec !== inSection) { flush(); inGroup = grp; inSection = sec; }

    /* Adding this one would overrun the row, so start a new one first. */
    if (run.length && bars([...run, c]) > BARS_PER_ROW + .05) flush();
    run.push(c);
    if (bars(run) >= BARS_PER_ROW - .05) flush();
  }
  flush();

  chordGroups.forEach((g, i) => { g.at = g[0].t_start; g.to = g[g.length - 1].t_end; g.i = i; });

  /* The widest row, not a fixed four bars. Still one ruler for the whole
     track — every row is the same seconds per pixel, so a two-second chord is
     the same width wherever it appears — but a song whose rows are all two
     bars gets a ruler two bars long instead of spending half the screen on a
     tail that is empty for the entire song. The packing above bounds this to
     about BARS_PER_ROW, so one long line cannot squash the rest. */
  spanMax = chordGroups.reduce((w, g) => Math.max(w, g.to - g.at), 0)
            || BARS_PER_ROW * barLen;
}

function chordBox(c, i) {
  const el = document.createElement("div");
  el.className = "measure";
  el.innerHTML = `<small>${fmtTime(c.t_start)}</small>` +
    `<span class="name">${chordHtml(c.name)}</span>`;
  return el;
}

/* One seconds-per-pixel for the whole track, set by the longest group. A
   shorter group simply stops early and leaves the rest of the row empty,
   rather than being stretched to fill it — so the cursor crosses the screen at
   the same rate all the way through, and a two-second chord looks like a
   two-second chord wherever it appears. */
let spanMax = 1;

function sizeRow(el, group) {
  const cols = group.map(c => Math.max(.15, c.t_end - c.t_start));
  const rest = spanMax - cols.reduce((a, b) => a + b, 0);
  if (rest > .05) cols.push(rest);          /* the empty tail */
  el.style.gridTemplateColumns = cols.map(d => d.toFixed(3) + "fr").join(" ");
}

function renderGroup(i) {
  const g = chordGroups[i], ahead = chordGroups[i + 1];
  main.replaceChildren(...(g || []).map(chordBox));
  sizeRow(main, g || []);
  preview.replaceChildren(...(ahead || []).map(chordBox));
  sizeRow(preview, ahead || []);
  $("nextChord").innerHTML = ahead ? chordHtml(ahead[0].name) : "";
  renderBeats(g);
}

function updateChords(t) {
  if (!chordGroups.length) return;

  let i = 0;
  while (i < chordGroups.length - 1 && t >= chordGroups[i].to) i++;
  if (i !== groupAt) { groupAt = i; renderGroup(i); }

  const g = chordGroups[i];
  /* Against the fixed scale, not the group's own length. */
  const f = clamp((t - g.at) / spanMax, 0, 1);
  ball.style.left = cursor.style.left = (f * 100) + "%";

  /* Bounce or strum: the ball is on the beat, or it is the right hand. In hand
     mode it carries the stroke it is about to play, and the motion never stops
     even where the pattern has nothing to strike. With no pattern to follow
     there is no hand to draw, so it goes back to keeping the beat rather than
     standing still with nothing in it. */
  const here = state.chordCue === "hand" ? strumAt(t) : null;
  ball.classList.toggle("strum", !!here);
  ball.style.top = (here ? strumY(t, here) : bounceY(t)) + "px";
  const sl = here && here.pat.slots[Math.min(here.pat.n - 1,
                                             Math.floor(here.f * here.pat.n))];
  const glyph = sl ? sl.glyph || "·" : "";
  if (ball.textContent !== glyph) ball.textContent = glyph;
  updateBeats(t);

  /* Which chord of the group is sounding. */
  let k = 0;
  while (k < g.length - 1 && t >= g[k].t_end) k++;
  [...main.children].forEach((el, j) =>
    el.classList.toggle("current", j === k && t >= g[0].t_start));
}

/* The chord ball bounces on the map's beats, so it drifts with the record. */
function bounceY(t) {
  const room = Math.max(0, geo.zone - BALL - 4);
  return geo.zone - BALL -
    arc(beatPhase(t)) * clamp(room * .62 * num("bounce"), 0, room);
}

/* In hand mode the ball is not bouncing, it is strumming: it rides the same
   swing the pane's marker does, so the two agree about where the hand is. */
function strumY(t, here) {
  const room = Math.max(0, geo.zone - BALL / 2 - 4);
  return geo.zone - BALL / 2 +
    swingThrough(here.pat, here.f) * clamp(geo.zone * .5 * num("bounce"), 0, room);
}

/* ── strum pane ─────────────────────────────────────────────────────────
   One loop of the current pattern, drawn once and then only lit.

   The pane is a fixed ruler — PANE_BARS bars of it, always — and a loop takes
   as much of that as it is long: a one-bar pattern is a quarter of the pane and
   the marker crosses that quarter in a bar, at exactly the rate a four-bar
   pattern crosses the whole thing. Letting every loop fill the pane instead
   made the marker's speed mean nothing, and sent a one-bar loop tearing across
   the screen four times as fast as a four-bar one for no musical reason.

   Same argument as spanMax on the chord row, and the same consequence: a short
   loop stops early and leaves the tail of the pane empty rather than being
   stretched across it. */
const PANE_BARS = 4;
const barBeats = () => sections[0]?.beatsPerBar || 4;
const paneSpan = line => clamp(line.loop / (PANE_BARS * barBeats()), .05, 1);

let paneSlots = [], paneMark = null, paneCursor = null;
let paneMarks = [], paneAt = "", paneW1 = 1;
let lastPaneSlot = -1, lastPaneCell = null, lastPaneLoop = -1;

/* Every x in the pane goes through here, so slots, ties, bar lines, the
   cursor and the marker cannot land on different grids. Fractions are of the
   loop, not of the pane, so the ruler above is applied in exactly one place. */
const paneX = f => `calc(var(--sm) + (100% - 2 * var(--sm)) * ${f * paneW1})`;
const paneW = df => `calc((100% - 2 * var(--sm)) * ${df * paneW1})`;

const ROW = { down: "down", up: "up" };

function renderPane(pat, loops, w) {
  paneSlots = [];
  lastPaneSlot = -1;
  lastPaneCell = null;
  lastPaneLoop = -1;
  paneMarks = [];
  paneW1 = w || 1;

  if (!pat) {
    spane.replaceChildren();
    paneMark = paneCursor = null;
    return;
  }

  const n = pat.n, kids = [];

  /* Slots as large as the band allows, or as large as they fit, whichever is
     smaller: a one-bar loop in a quarter of the pane has four times the slots
     per inch that a four-bar one does, and the glyphs would run together. */
  const room = Math.max(0, spane.clientWidth - geo.paneMargin * 2);
  if (room > 0) {
    const pitch = room * paneW1 / n;
    spane.style.setProperty("--sglyph",
      Math.round(Math.min(geo.paneGlyph, pitch * .95)) + "px");
    spane.style.setProperty("--scount",
      Math.round(Math.min(geo.paneCount, pitch * .5)) + "px");
  }

  for (const sl of pat.slots) {
    const x = paneX(sl.s / n);

    /* A tie is the stroke before it, held: drawn as a line out of that stroke
       along its own row rather than as a mark of its own, because what the
       hand does here is nothing. */
    if (sl.tie && sl.from >= 0) {
      const tie = document.createElement("div");
      tie.className = "stie " + ROW[pat.slots[sl.from].dir];
      tie.style.left = paneX(pat.slots[sl.from].s / n);
      tie.style.width = paneW((sl.s - pat.slots[sl.from].s + .5) / n);
      kids.push(tie);
    } else if (sl.hit) {
      const el = document.createElement("div");
      /* The row follows the hand, not the glyph: an up-muted chunk still
         happens on the way up, and the four downs of "DdDd" are four downs. */
      el.className = "sslot " + ROW[sl.dir] + (sl.weight < 1 ? " light" : "");
      el.style.left = x;
      el.textContent = sl.glyph;
      paneSlots[sl.s] = el;
      kids.push(el);
    }

    const count = document.createElement("div");
    count.className = "scount";
    count.style.left = x;
    count.textContent = sl.s % 2 ? "&" : String(sl.s / 2 % 4 + 1);
    kids.push(count);
  }

  for (let b = 1; b < n / 8; b++) {
    const rule = document.createElement("div");
    rule.className = "sbar";
    rule.style.left = paneX(b * 8 / n);
    kids.push(rule);
  }

  /* How many times the loop comes round before the chords move on. */
  if (loops > 1) {
    const box = document.createElement("div");
    box.className = "repeats";
    for (let k = 0; k < loops; k++)
      paneMarks.push(box.appendChild(document.createElement("i")));
    kids.push(box);
  }

  /* The wrap point, which is the end of the loop rather than the end of the
     pane -- with a fixed ruler those are only the same thing at four bars. */
  const catcher = document.createElement("div");
  catcher.className = "catcher scatch";
  catcher.style.left = paneX(1);
  catcher.textContent = "↵";
  paneCursor = document.createElement("div");
  paneCursor.className = "scursor";
  paneMark = document.createElement("div");
  paneMark.className = "smark";

  spane.dataset.rows = state.strumPane;
  spane.replaceChildren(...kids, catcher, paneCursor, paneMark);
}

function updatePane(t) {
  const here = strumAt(t);

  /* The pane is rebuilt only when the pattern itself changes, so a loop that
     repeats for a whole verse is drawn once. */
  /* Keyed on the group too, because the repeat dots count loops inside it. */
  const key = here ? `${here.line.pat.src}@${here.line.from}#${groupAt}` : "";
  if (key !== paneAt || spane.dataset.rows !== state.strumPane) {
    paneAt = key;
    renderPane(here && here.pat, here ? loopsPerGroup(here.line) : 0,
               here ? paneSpan(here.line) : 1);
  }
  if (!here || !paneMark) return;

  const x = paneX(here.f);
  paneCursor.style.left = x;
  paneMark.style.left = x;
  /* Split mode reads the swing as the row it is heading for, hand mode as the
     hand's own path through the strings. One motion, two projections. */
  const swing = clamp(geo.paneSwing * num("bounce"), 0, geo.paneRoom);
  paneMark.style.top = state.strumPane === "hand"
    ? `calc(var(--mid-y) + ${(swingThrough(here.pat, here.f) * swing).toFixed(1)}px)`
    : `calc(var(--mid-y) + ${(swingToward(here.pat, here.f) * geo.paneRow).toFixed(1)}px)`;

  if (here.loop !== lastPaneLoop) {
    paneMarks.forEach((m, k) => m.classList.toggle("spent", k < here.loop));
    lastPaneLoop = here.loop;
  }

  const slot = Math.min(here.pat.n - 1, Math.floor(here.f * here.pat.n));
  if (slot === lastPaneSlot) return;
  lastPaneCell?.classList.remove("hit");
  lastPaneCell = paneSlots[slot] || null;
  lastPaneCell?.classList.add("hit");
  lastPaneSlot = slot;
}

/* How many times the loop comes round inside one chord row. Both are lengths
   in beats, so this is the honest count even where the row is not four bars. */
function loopsPerGroup(line) {
  const g = chordGroups[groupAt];
  if (!g || !(line.loop > 0)) return 0;
  return Math.round((beatPos(g.to) - beatPos(g.at)) / line.loop);
}

/* ── stroke boxes on the chord row ──────────────────────────────────────
   The same strokes again, but laid out in the chord row's space rather than
   the pattern's: one box per stroke the row contains, at the spot the cursor
   will be when it is played. Rebuilt with the row, since that is the window
   they are drawn against. */
let beatCells = [], lastCell = null, lastSlot = -1;

function renderBeats(g) {
  beatCells = [];
  lastCell = null;
  lastSlot = -1;
  if (!g || !strumLines.length) { beats.replaceChildren(); return; }

  /* The row's window, not the group's own extent: a short group leaves the
     tail of the row empty, and the strokes stop where the group does. */
  const t0 = g.at, t1 = g.at + spanMax;
  const cells = [];

  for (const line of strumLines) {
    const to = Math.min(t1, line.to);
    if (to <= Math.max(t0, line.from)) continue;
    let k = Math.max(0, Math.floor((beatPos(Math.max(t0, line.from)) - line.b0) / line.loop));
    for (; ; k++) {
      const at = slotTime(line, k, 0);
      if (at >= to) break;
      for (const sl of line.pat.slots) {
        if (!sl.hit) continue;
        const t = slotTime(line, k, sl.s);
        if (t < t0 || t < line.from || t >= to) continue;
        const cell = document.createElement("div");
        cell.className = "beat" + (sl.weight < 1 ? " light" : "");
        cell.style.left = ((t - t0) / spanMax * 100) + "%";
        cell.textContent = sl.glyph;
        beatCells.push({ t, cell });
        cells.push(cell);
      }
    }
  }

  beatCells.sort((a, b) => a.t - b.t);
  /* Boxes are as wide as the gap between them allows, so an eighth-note
     pattern stays a row of boxes rather than one smear. */
  const gap = beatCells.length > 1
    ? beatCells.slice(1).reduce((m, c, i) => Math.min(m, c.t - beatCells[i].t), 1e9)
    : spanMax;
  const px = main.clientWidth * gap / spanMax;   /* .beats may be display:none */
  beats.style.setProperty("--bw", Math.round(clamp(px - 3, 10, geo.boxH * 1.6)) + "px");
  beats.replaceChildren(...cells);
}

function updateBeats(t) {
  let i = -1;
  while (i + 1 < beatCells.length && t >= beatCells[i + 1].t) i++;
  if (i === lastSlot) return;
  lastCell?.classList.remove("hit");
  lastCell = i >= 0 ? beatCells[i].cell : null;
  lastCell?.classList.add("hit");
  lastSlot = i;
}

/* ── audio ──────────────────────────────────────────────────────────────
   The element is the clock. Everything else reads it. */
function attachAudio(url) {
  /* Tearing the old element down must not look like a failure. Assigning
     src = "" makes the browser resolve the empty string against the page and
     try to decode the HTML as media, which fires `error` a task later — by
     which time the handler below would blame the track just loaded, so every
     reload ended in "could not play" over a track that plays fine. Dropping
     the attribute and re-running load() abandons the resource silently. */
  if (audio) { audio.pause(); audio.removeAttribute("src"); audio.load(); }
  audio = null;
  player.time = 0;
  player.duration = 0;
  transport(false);

  if (!url) return;

  const el = audio = new Audio(url);
  el.preload = "auto";
  applyRate();                     /* a new element starts at 1× otherwise */
  /* A discarded element can still report pause or error after the swap, and
     what it has to say is about a track no longer on screen. */
  const live = fn => () => { if (el === audio) fn(); };
  el.addEventListener("loadedmetadata", live(() => {
    player.duration = el.duration || 0;
    drawTransport();
  }));
  el.addEventListener("play", live(() => transport(true)));
  el.addEventListener("pause", live(() => transport(false)));
  el.addEventListener("ended", live(() => transport(false)));
  el.addEventListener("error", live(() => {
    const why = MEDIA_ERR[el.error?.code] || "the browser gave no reason";
    const said = el.error?.message;
    noteProblem("Could not play " + track.title,
                { message: said ? `${why} — ${said}` : why });
  }));
}

/* Speed without pitch.
   Web Audio's playbackRate is a resampler: it plays the same samples on a
   different clock, so 0.75× also drops the track five semitones and you end up
   practising against an instrument that is out of tune with your own. The
   media element's own stretcher is the one that does what practising slowly
   means — preservesPitch keeps the key and stretches time — so the element
   stays the clock and this is a property on it rather than a graph.
   It is the default in every current browser; set it anyway, because a browser
   that has quietly turned it off would be silently transposing the track. */
const rate = () => num("speed");

function applyRate() {
  /* Before the early return: the readout answers for the speed whether or not
     there is a track loaded to apply it to. */
  drawTransport();
  if (!audio) return;
  audio.preservesPitch = true;
  if ("mozPreservesPitch" in audio) audio.mozPreservesPitch = true;
  if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = true;
  audio.playbackRate = rate();
}

function seek(to) {
  const t = clamp(to, 0, player.duration || 0);
  player.time = t;
  if (audio) audio.currentTime = t;
  /* Jumping backwards must not leave the old line on screen. */
  lastLine = -2;
  drawTransport();
}

function transport(on) {
  if (on !== player.playing) {
    player.playing = on;
    if (!on) save();
  }
  play.disabled = player.playing || !audio;
  stop.disabled = !player.playing;
}

function drawTransport() {
  const d = player.duration || 0;
  const f = d ? clamp(player.time / d, 0, 1) : 0;
  tlFill.style.width = (f * 100) + "%";
  tlHead.style.left = (f * 100) + "%";
  clockOut.textContent = `${fmtTime(player.time)} / ${fmtTime(d)}`;

  /* Tempo is read off the grid rather than declared, so it tracks the take —
     and then off the speed as well, because what the readout is for is the
     count you are playing to, not the one on the record. */
  const r = rate();
  const bpm = bpmAt(player.time);
  bpmOut.textContent = bpm ? Math.round(bpm * r) : "";
  rateOut.textContent = r === 1 ? "" : "×" + String(+r.toFixed(2));
}

/* ── the frame ──────────────────────────────────────────────────────────── */
function frame() {
  if (audio) player.time = audio.currentTime;
  if (player.loop && player.time >= player.loop.to) seek(player.loop.from);

  if (player.playing) practised();
  updateLyrics(player.time);
  updateChords(player.time);
  updatePane(player.time);
  drawTransport();
  requestAnimationFrame(frame);
}

/* How long, and how recently — per track, so the library can put what you have
   been working on at the top. */
let lastTick = 0;
function practised() {
  const now = Date.now();
  const dt = lastTick ? now - lastTick : 0;
  lastTick = now;
  if (!track.id || dt <= 0 || dt > 1000) return;

  const s = store.stats[track.id] || (store.stats[track.id] = { secs: 0, last: 0 });
  s.secs += dt / 1000;
  s.last = now;
  if (Math.floor(s.secs) % 10 === 0) save();
}

const ago = t => {
  if (!t) return "";
  const d = (Date.now() - t) / 86400000;
  return d < 1 ? "today" : d < 2 ? "yesterday" : Math.floor(d) + "d";
};
const spent = s => (!s || s < 60 ? "" : Math.round(s / 60) + "m");

/* ── commands ───────────────────────────────────────────────────────────
   The single door in: clicks, keys, the URL, and later a socket. */
function command(msg) {
  const { cmd } = msg;
  if (cmd === "set") return set(msg.name, msg.value);
  if (cmd === "play") return audio && audio.play().catch(() => {});
  if (cmd === "stop") return audio && audio.pause();
  if (cmd === "seek") return seek(Number(msg.time) || 0);
  if (cmd === "nudge") return seek(player.time + Number(msg.by));
  if (cmd === "loop") {
    player.loop = msg.from == null ? null
      : { from: Number(msg.from), to: Number(msg.to) };
    if (player.loop) seek(player.loop.from);
    return;
  }
  if (cmd === "track") return openTrackByKey(msg.key);
  if (cmd === "reload") return reloadTrack();
}

const net = {
  socket: null,
  connect(url) {
    this.socket = new WebSocket(url);
    this.socket.onmessage = e => { try { command(JSON.parse(e.data)); } catch (err) {} };
  },
  send(msg) {
    if (this.socket && this.socket.readyState === 1) this.socket.send(JSON.stringify(msg));
  }
};

/* ── the library ────────────────────────────────────────────────────────
   v0.1's loading, unchanged in behaviour: a directory handle kept in
   IndexedDB so the folder survives a reload, a file picker for one-offs, and
   pairing by filename stem — a track is a media file with a .txt beside it.
   This is the piece the server will eventually replace, endpoint for
   endpoint, without the rest of the app noticing. */
/* .mov is here for one reason: it is the only container that holds raw MP3
   frames in a way Apple's decoder accepts, which is what a VBR track remuxed
   for accurate seeking has to be if Safari is ever going to play it. */
const MEDIA_RE = /\.(mp3|ogg|wav|flac|m4a|mp4|m4v|mov|webm)$/i;
let _db = null, dirs = [], picked = [], remote = [];

function dbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("riffhound-karaoke", 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("dirs"))
        db.createObjectStore("dirs", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("charts"))
        db.createObjectStore("charts", { keyPath: "id" });
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e.target.error);
  });
}

function dbRun(store, mode, fn) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = e => reject(e.target.error);
  }));
}

const dbAdd = rec => dbRun("dirs", "readwrite", s => s.add(rec));
const dbAll = () => dbRun("dirs", "readonly", s => s.getAll());
const dbDel = id => dbRun("dirs", "readwrite", s => s.delete(id));

/* The last chart seen for a track. Not a cache in front of the server -- the
   server is always asked first, because the chart is the thing being edited in
   the next window and a stale one is worse than a slow one. This is what is
   left when the server does not answer at all: the difference between
   practising on last night's annotations and practising on none. */
const chartKept = id =>
  dbRun("charts", "readonly", s => s.get(id)).then(r => r?.text ?? null).catch(() => null);
const chartKeep = (id, text) =>
  dbRun("charts", "readwrite", s => s.put({ id, text, at: Date.now() })).catch(() => {});

const canDir = () => typeof showDirectoryPicker === "function";
const canFiles = () => typeof showOpenFilePicker === "function";

async function perm(handle) {
  try {
    if (await handle.queryPermission({ mode: "read" }) === "granted") return true;
    return await handle.requestPermission({ mode: "read" }) === "granted";
  } catch { return false; }
}

async function enumerate(handle) {
  const files = [];
  try {
    for await (const [name, h] of handle.entries())
      if (h.kind === "file") files.push({ name, handle: h });
  } catch {}
  return files.sort((a, b) => a.name.localeCompare(b.name));
}

/* Pair a media file with the .txt of the same stem. Only pairs are tracks. */
function pairUp(files, source) {
  const stems = {};
  for (const f of files) {
    const name = f.name || f.file?.name || "";
    const stem = name.replace(/\.[^/.]+$/, "");
    if (MEDIA_RE.test(name)) (stems[stem] ||= {}).media = f;
    else if (/\.txt$/i.test(name)) (stems[stem] ||= {}).txt = f;
  }
  return Object.entries(stems)
    .filter(([, p]) => p.media)
    .map(([stem, p]) => ({
      id: source + "/" + stem,
      title: (stem.includes("/") ? stem.split("/").pop() : stem).replace(/[_\-]+/g, " "),
      source, media: p.media, txt: p.txt || null
    }));
}

async function refreshDirs() {
  dirs = [];
  if (!canDir()) return;
  let rows = [];
  try { rows = await dbAll(); } catch { return; }
  for (const row of rows) {
    const ok = await perm(row.handle);
    dirs.push({ id: row.id, name: row.handle.name, handle: row.handle,
                files: ok ? await enumerate(row.handle) : [], ok });
  }
}

function library() {
  const out = [];
  for (const r of remote) if (r.ok) out.push(...serverTracks(r));
  for (const d of dirs) if (d.ok) out.push(...pairUp(d.files, d.name));
  out.push(...pairUp(picked, "picked"));
  return out;
}

/* ── servers ────────────────────────────────────────────────────────────
   A folder handle only exists on the machine that granted it, which is why a
   phone on a music stand cannot see the library the laptop can. A server can
   be reached from both, so the same folder becomes the same library from
   anywhere in the room -- and the same protocol serves the terminal client and
   the beatmapper later, without any of them owning a filesystem.

   Servers are remembered and re-checked at startup: a client should come up
   pointed at the library it was pointed at last, without being asked. The
   check is one small GET with a short deadline, so a server that has gone away
   costs a second at boot and says so in the panel rather than hanging the app.

   The server's own name, not its URL, keys what is remembered about a track:
   a laptop that comes back on a different port is the same library, and losing
   your practice history to a port number would be absurd. */
const HELLO_MS = 2500;

const cleanUrl = u => String(u || "").trim().replace(/\/+$/, "")
  .replace(/^(?!https?:\/\/)/, "http://");

async function ask(url, path, opts = {}) {
  const ctl = new AbortController();
  const bell = setTimeout(() => ctl.abort(), opts.ms || HELLO_MS);
  try {
    const r = await fetch(url + path, { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("server said " + r.status + " " + r.statusText);
    return opts.text ? await r.text() : await r.json();
  } finally {
    clearTimeout(bell);
  }
}

/* One handshake, then the listing. Kept together because a server that says
   hello but cannot list is not usable, and the panel should say so once. */
async function greet(url) {
  const hi = await ask(url, "/api/hello");
  if (!hi || hi.riffhound == null) throw new Error("not a RiffHound server");
  const got = await ask(url, "/api/tracks", { ms: 8000 });
  return { url, name: hi.name || url, roots: hi.roots || [],
           tracks: got.tracks || [], ok: true, why: "" };
}

/* Try every server we know, in parallel: they are independent and the slow one
   should not hold up the rest. A failure is remembered as a failure rather
   than dropped, so the panel can say which library is not answering. */
async function refreshServers() {
  const known = store.servers || (store.servers = []);
  remote = await Promise.all(known.map(async s => {
    try {
      return { ...await greet(s.url), at: s.at };
    } catch (e) {
      return { url: s.url, name: s.name || s.url, roots: [], tracks: [],
               ok: false, why: e.name === "AbortError" ? "no answer" : e.message };
    }
  }));
  /* Adopt whatever the servers now call themselves, so a rename follows. */
  remote.forEach(r => { const k = known.find(s => s.url === r.url); if (k) k.name = r.name; });
  save();
}

async function addServer(raw) {
  const url = cleanUrl(raw);
  if (!url) return "";
  const known = store.servers || (store.servers = []);
  let got;
  try {
    got = await greet(url);
  } catch (e) {
    noteProblem("Could not reach " + url, e);
    return e.name === "AbortError" ? "no answer" : "failed";
  }
  const row = known.find(s => s.url === url) || (known.push({ url }), known.at(-1));
  row.name = got.name;
  row.at = Date.now();
  save();
  remote = [...remote.filter(r => r.url !== url), got];
  return "ok";
}

function forgetServer(url) {
  store.servers = (store.servers || []).filter(s => s.url !== url);
  remote = remote.filter(r => r.url !== url);
  save();
}

/* An id is a path, so it arrives with slashes in it and may arrive with spaces,
   plus signs or hashes. Encoding it a segment at a time keeps the slashes as
   slashes -- they are the structure -- and everything else literal. */
const idPath = tid => String(tid).split("/").map(encodeURIComponent).join("/");

/* Server tracks alongside local ones, in the shape the rest of the app already
   understands: a title, a source, and somewhere to get the two files. */
const serverTracks = r => r.tracks.map(t => ({
  id: "@" + r.name + "/" + t.id,
  title: t.title,
  source: r.name,
  remote: { base: r.url, tid: t.id },
  media: { url: r.url + "/media/" + idPath(t.id), name: t.media },
  txt: t.chart ? { url: r.url + "/chart/" + idPath(t.id), name: t.title + ".txt" } : null
}));

/* Subsequence match, as v0.1 did: every letter of the query in order. */
function fuzzy(q, s) {
  if (!q) return true;
  q = q.toLowerCase(); s = s.toLowerCase();
  let qi = 0;
  for (let i = 0; i < s.length && qi < q.length; i++) if (s[i] === q[qi]) qi++;
  return qi === q.length;
}

/* ── what went wrong ────────────────────────────────────────────────────
   A track that will not load used to put "⚠ could not play <title>" in the
   header and stop there, which says nothing you could act on and costs you the
   title as well. The header now carries the warning sign alone, and the reason
   lives in the panel the title already opens — where there is room to name the
   file, quote the browser, and say what to do about it. */
let problems = [];

const fileName = f => f?.name || f?.file?.name || f?.handle?.name || "the file";

/* The four MediaError codes, in the terms of this app rather than the spec. */
const MEDIA_ERR = {
  1: "loading was aborted",
  2: "the file could not be read to the end",
  3: "the audio is damaged, or in a form this browser cannot decode",
  4: "this browser will not play this file's format"
};

/* Two failures are worth naming, because both mean "the library moved under
   you" and both are fixed the same way. */
const HINTS = {
  NotFoundError:    "The file is not there any more. Re-open the folder to pick up its current contents.",
  NotReadableError: "The file changed on disk after the folder was opened. Re-open the folder to re-read it.",
  SecurityError:    "The browser withdrew permission for this folder. Re-open it to grant access again."
};

function clearProblems() { problems = []; showProblems(); }

function noteProblem(what, err) {
  const name = err?.name || "";
  const said = err?.message || (err == null ? "" : String(err));
  problems.push({ what, said: name && said && !said.startsWith(name) ? `${name}: ${said}` : (said || name),
                  hint: HINTS[name] || "" });
  showProblems();
}

function renderTitle() {
  titleText.textContent = (problems.length ? "⚠ " : "") + (track.title || "");
}

function showProblems() {
  renderTitle();
  if (!problemBox) return;
  problemBox.replaceChildren(...problems.map(p => {
    const box = document.createElement("div");
    box.className = "problem";
    const what = document.createElement("b");
    what.textContent = p.what;
    box.append(what);
    for (const line of [p.said, p.hint]) {
      if (!line) continue;
      const el = document.createElement("span");
      el.textContent = line;
      box.append(el);
    }
    return box;
  }));
  problemBox.hidden = !problems.length;
}

/* Returns what could be read: a reload needs to tell "the file has no lyrics"
   apart from "the file could not be read", which look identical on screen.
   opts.reload marks the one caller that is re-reading the track already up,
   which keeps the few things that belong to the practice session rather than
   to the track — see the speed below. */
async function openTrack(entry, opts = {}) {
  const getFile = async h => (h && "getFile" in h ? await h.getFile() : h);
  const ok = { text: true, media: true };

  /* Name the track before clearing, because clearing repaints the title and
     the title it should paint is this one, not the one on its way out. */
  track = { id: entry.id, title: entry.title };
  clearProblems();

  /* The chart, from the server if there is one and from disk otherwise. A
     server chart is always fetched, never taken from the copy kept here: it is
     the file the beatmapper is writing to, and the whole point of edit-and-hear
     is that the next reload has the edit in it. The kept copy is the fallback
     for a server that has gone away, not a cache in front of one. */
  let text = "";
  if (entry.remote) {
    try {
      text = entry.txt ? await ask(entry.remote.base,
                                   "/chart/" + idPath(entry.remote.tid),
                                   { text: true, ms: 8000 }) : "";
      chartKeep(entry.id, text);
    } catch (e) {
      console.warn("chart:", e);
      const kept = await chartKept(entry.id);
      if (kept == null) {
        ok.text = false;
        noteProblem("Could not fetch the chart for " + entry.title, e);
      } else {
        text = kept;
        noteProblem("Showing the last chart kept for this track",
                    { message: "The server did not answer, so its annotations "
                             + "are as of the last time it did." });
      }
    }
  } else if (entry.txt) {
    try { text = await (await getFile(entry.txt.handle || entry.txt.file || entry.txt)).text(); }
    catch (e) {
      console.warn("lyrics:", e);
      ok.text = false;
      noteProblem("Could not read " + fileName(entry.txt), e);
    }
  }

  const parsed = parseTimeseries(text);
  lyricLines = parsed.lyrics;
  sections = parsed.sections;
  beatGrid = parsed.beats;
  analyseBeats();
  chordLine = parsed.chords;
  groupChords();
  /* A strum line runs until the next one, and the last one runs to the end of
     the track — which is not known yet, and does not need to be. */
  analyseStrums(parsed.strums, Infinity);
  for (const note of parsed.notes) noteProblem(note, null);
  if (parsed.strums.length && strumLines.some(s => s.mismatch))
    noteProblem("A strum line's span is not the length of its pattern",
                { message: "Its slots are being spread over the span it was "
                         + "given, so they are not eighth notes on this track." });

  groupAt = -1;
  paneAt = "";
  renderPane(null, 0);
  renderBeats(null);
  main.replaceChildren();
  preview.replaceChildren();

  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  let url = null;
  /* Server media goes to the element as a URL rather than through a Blob: the
     browser then streams it, seeks with Range instead of refetching, and keeps
     the bytes in its own cache -- which is the local media cache, already
     written, already correct about revalidating. */
  if (entry.remote) {
    url = entry.media.url;
  } else try {
    const file = await getFile(entry.media.handle || entry.media.file || entry.media);
    /* Read the bytes here rather than handing the File straight to
       createObjectURL. A File is a snapshot of a path: once the file behind it
       has been moved or rewritten — which is the normal state of affairs when
       something else on the machine is editing this library — the read fails.
       Deferring it means the failure arrives later, as a bare media error on
       the element with no name and no file attached to it. Reading now turns
       the same failure into an exception that can say which file and why, and
       the copy in memory cannot go stale underneath a track already playing. */
    const bytes = await file.arrayBuffer();
    url = audioUrl = URL.createObjectURL(new Blob([bytes], { type: file.type || "" }));
  } catch (e) {
    console.warn("media:", e);
    ok.media = false;
    noteProblem("Could not read " + fileName(entry.media), e);
  }

  titleTags.innerHTML = lyricLines.length ? "" : " - no lyrics";

  /* A new track starts at the record's own speed. Half time belongs to the
     passage you were working on, not to the library, and inheriting last
     night's 0.6× is the kind of thing you only notice a verse in. A reload is
     the same track mid-practice, so it keeps the speed you set. */
  if (!opts.reload) command({ cmd: "set", name: "speed", value: DEF.speed.def });

  lastLine = -2;
  attachAudio(url);
  renderResults(searchBox.value);
  layout();
  return ok;
}

/* Re-read the current track from disk. The beatmapper writes annotations while
   this page is open, so edit-and-hear is the loop that matters; the playhead
   and the playing state survive a reload, because being sent back to bar one
   every time would make it useless mid-practice. */
async function reloadTrack() {
  if (!track.id) return "no track";

  const at = player.time, was = player.playing;
  if (was) command({ cmd: "stop" });

  /* Re-enumerate first: a .txt written since the folder was opened is not in
     the cached listing, so a track can gain annotations between reloads, and a
     server can have gained the track itself. */
  await Promise.all([refreshDirs(), refreshServers()]);
  renderDirs();
  const entry = library().find(e => e.id === track.id);
  if (!entry) {
    /* The listing was just refreshed, so this is the folder's own answer: the
       track is not in it any more, under that name. */
    noteProblem(track.title + " is no longer in the folder",
                { message: "Nothing there pairs a media file with that name. "
                         + "It may have been renamed, moved, or given a different extension." });
    renderResults(searchBox ? searchBox.value : "");
    return "gone";
  }

  const ok = await openTrack(entry, { reload: true });

  /* seek() clamps against player.duration, and that stays 0 until the fresh
     audio reports its metadata — seeking any earlier lands at bar one. Wait
     for it, but never longer than a few seconds: a file that will not decode
     must not leave the button stuck. */
  if (audio && !player.duration) await new Promise(done => {
    audio.addEventListener("loadedmetadata", done, { once: true });
    audio.addEventListener("error", done, { once: true });
    setTimeout(done, 4000);
  });
  if (at > 0) seek(at);
  if (was) command({ cmd: "play" });

  return ok.text && ok.media ? "ok" : "unreadable";
}

/* A track can be named by its full id, by the id its server knows it as, or by
   title -- riffplay only has the server's id to hand, and a human typing a URL
   only has the title. */
const openTrackByKey = key => {
  const found = library().find(e =>
    e.id === key || e.remote?.tid === key || e.title === key);
  if (found) openTrack(found);
};

/* ── set / sync ─────────────────────────────────────────────────────────
   set() is the only thing that writes state. sync() is the only thing that
   writes controls, and never fires events, so a change can safely come from
   anywhere without the UI arguing with itself. */
const controls = {};                       /* name -> the element to reflect into */
const AFTER = {
  layout: () => layout(),
  lyrics: () => { renderLine(lastLine, lastRest); layout(); },
  /* The stroke surfaces are drawn once per chord row and once per pattern, so
     changing what they are supposed to show has to invalidate both. */
  strum: () => { groupAt = -1; paneAt = ""; layout(); }
};

function coerce(def, v) {
  if (def.type === "toggle") return !!v;
  if (def.type === "range") return clamp(Number(v), def.min, def.max);
  return def.options.some(o => o.v === v) ? v : def.def;
}

function set(name, value, opts = {}) {
  const def = DEF[name];
  if (!def) return;                        /* unknown setting: ignore, never throw */

  state[name] = coerce(def, value);
  const v = state[name];

  if (def.css) root.style.setProperty(def.css, v + (def.unit || ""));
  if (def.flag) root.dataset[def.flag] = v === true ? "on" : v === false ? "off" : v;
  if (def.apply) def.apply(v);

  sync(name);
  if (!opts.quiet) {
    (def.after || "").split(",").filter(Boolean).forEach(a => AFTER[a]?.());
    store.display[name] = v;
    save();
  }
}

function sync(name) {
  const def = DEF[name], el = controls[name], v = state[name];
  if (!el) return;

  if (def.type === "choice") {
    [...el.children].forEach(b => b.classList.toggle("active", b.dataset.v === v));
  } else if (def.type === "toggle") {
    el.checked = v;
  } else if (document.activeElement !== el) {
    el.value = v;
  }

  const out = el.closest(".setting")?.querySelector("output");
  if (out) out.value = def.format ? def.format(v) : v + (def.suffix || def.unit || "");
}

/* ── the panel, built from the registry ─────────────────────────────────── */
function rowFor(def) {
  const row = document.createElement("div");
  row.className = "setting";
  row.innerHTML = `<label>${def.label}</label>`;

  if (def.type === "choice") {
    const sw = document.createElement("div");
    sw.className = "switch";
    def.options.forEach(o => {
      const b = document.createElement("button");
      b.dataset.v = o.v;
      b.innerHTML = (o.icon || "") + `<span>${o.label}</span>`;
      b.onclick = () => command({ cmd: "set", name: def.name, value: o.v });
      sw.append(b);
    });
    row.append(sw);
    controls[def.name] = sw;
  } else if (def.type === "toggle") {
    const box = document.createElement("input");
    box.type = "checkbox";
    box.onchange = () => command({ cmd: "set", name: def.name, value: box.checked });
    row.append(box);
    controls[def.name] = box;
  } else {
    const slider = document.createElement("input");
    Object.assign(slider, { type: "range", min: def.min, max: def.max, step: def.step });
    slider.oninput = () => command({ cmd: "set", name: def.name, value: slider.value });

    const val = document.createElement("span");
    val.className = "val";
    val.append(document.createElement("output"));
    if (def.reset !== undefined) {
      const r = document.createElement("button");
      r.className = "reset";
      r.textContent = "reset";
      r.onclick = () => command({ cmd: "set", name: def.name, value: def.reset });
      val.append(r);
    }
    row.append(slider, val);
    controls[def.name] = slider;
  }
  return row;
}

function group(title, id, defs) {
  const box = document.createElement("details");
  box.open = true;
  box.className = "tinted";
  if (id) box.id = id;
  const sum = document.createElement("summary");
  sum.textContent = title;
  const body = document.createElement("div");
  body.className = "group";
  body.append(...defs.map(rowFor));
  box.append(sum, body);
  return box;
}

function buildPanel() {
  const of = g => SETTINGS.filter(d => d.group === g);
  panel.replaceChildren(
    group("Playback", null, of("playback")),
    group("Display", null, of("common")),
    group("Lyrics", "lyricsGroup", of("lyrics")),
    group("Chords", "chordsGroup", of("chords")));

  /* Each part's settings wear that part's colour, so the panel says which
     display a control belongs to before you read the label. */
  parts.lyrics.push($("lyricsGroup"));
  parts.chords.push($("chordsGroup"));
}


/* ── the load dialog ────────────────────────────────────────────────────── */
let searchBox = null, results = null, dirList = null, reloadBtn = null, problemBox = null;
let srvBox = null, srvList = null;

function buildTrackPanel() {
  const row = document.createElement("div");
  row.className = "setting";
  row.innerHTML = `<label for="search">Load track</label>`;

  /* First thing in the panel, because when it has anything to say it is the
     reason the panel was opened. */
  problemBox = document.createElement("div");
  problemBox.className = "problems";
  problemBox.hidden = true;

  searchBox = document.createElement("input");
  Object.assign(searchBox, { id: "search", className: "search", type: "search",
                             placeholder: "search tracks…", autocomplete: "off" });
  searchBox.oninput = () => renderResults(searchBox.value);

  results = document.createElement("div");
  results.className = "results";

  const sources = document.createElement("div");
  sources.className = "sources";
  const dirBtn = document.createElement("button");
  dirBtn.textContent = "Open folder…";
  dirBtn.onclick = addFolder;
  const fileBtn = document.createElement("button");
  fileBtn.textContent = "Open files…";
  fileBtn.onclick = addFiles;

  reloadBtn = document.createElement("button");
  reloadBtn.textContent = "Reload";
  reloadBtn.title = "Re-read this track's audio and annotations from disk";
  reloadBtn.onclick = async () => {
    const label = "Reload";
    reloadBtn.dataset.busy = "1";        /* openTrack re-renders and would re-enable it */
    reloadBtn.disabled = true;
    reloadBtn.textContent = "Reading…";
    /* "Could not read" is mostly the picked-files path: a file chosen through
       the plain input is a snapshot the browser refuses to re-read once it has
       changed on disk. Better to say so than to show minutes-old annotations
       as though they were fresh. */
    const r = await reloadTrack();
    reloadBtn.textContent = { ok: "Reloaded ✓", gone: "Not on disk",
                              unreadable: "Could not read" }[r] || label;
    setTimeout(() => {
      reloadBtn.textContent = label;
      delete reloadBtn.dataset.busy;
      reloadBtn.disabled = !track.id;
    }, 1400);
  };
  sources.append(dirBtn, fileBtn, reloadBtn);

  /* One field and one button: a server is a URL, and the point of remembering
     them is that this is the last time you type it. */
  const srvRow = document.createElement("div");
  srvRow.className = "sources";
  srvBox = document.createElement("input");
  Object.assign(srvBox, { className: "search", type: "text", spellcheck: false,
                          placeholder: "http://host:8177", autocomplete: "off" });
  const srvBtn = document.createElement("button");
  srvBtn.textContent = "Connect";
  const connect = async () => {
    if (!srvBox.value.trim()) return;
    srvBtn.disabled = true;
    srvBtn.textContent = "…";
    const r = await addServer(srvBox.value);
    srvBtn.textContent = { ok: "Connected", "no answer": "No answer" }[r] || "Failed";
    if (r === "ok") srvBox.value = "";
    renderServers();
    renderResults(searchBox.value);
    setTimeout(() => { srvBtn.textContent = "Connect"; srvBtn.disabled = false; }, 1400);
  };
  srvBtn.onclick = connect;
  srvBox.onkeydown = e => { if (e.key === "Enter") connect(); };
  srvRow.append(srvBox, srvBtn);

  srvList = document.createElement("div");
  srvList.className = "dirs";

  dirList = document.createElement("div");
  dirList.className = "dirs";

  row.append(searchBox, results, sources, srvRow, srvList, dirList);
  row.prepend(problemBox);        /* above the label, not below it */
  trackPanel.replaceChildren(row);
  renderResults("");
  renderServers();
  renderDirs();
  showProblems();          /* anything noted before the panel existed */
}

function renderResults(query) {
  const q = String(query || "").trim();
  if (reloadBtn) reloadBtn.disabled = !track.id || reloadBtn.dataset.busy === "1";
  const rows = library()
    .filter(e => fuzzy(q, e.title) || fuzzy(q, e.source))
    .sort((a, b) => (store.stats[b.id]?.last || 0) - (store.stats[a.id]?.last || 0))
    .slice(0, 60)
    .map(e => {
      const s = store.stats[e.id] || {};
      const b = document.createElement("button");
      b.className = "result" + (e.id === track.id ? " on" : "");
      b.innerHTML = `<b>${e.title}</b><i>${e.txt ? "" : "no lyrics"} ${spent(s.secs)}</i>` +
                    `<i>${ago(s.last)}</i>`;
      b.onclick = () => { openTrack(e); openTrackPanel(false); };
      return b;
    });

  results.replaceChildren(...(rows.length ? rows : [Object.assign(
    document.createElement("div"),
    { className: "note",
      textContent: remote.length || dirs.length || picked.length
        ? "nothing found"
        : "connect to a server, or open a folder of tracks, to begin" })]));
}

function renderServers() {
  if (!srvList) return;
  srvList.replaceChildren(...remote.map(r => {
    const el = document.createElement("div");
    el.className = "dir";
    const n = document.createElement("span");
    n.textContent = r.name + (r.ok ? "" : " (" + r.why + ")");
    n.title = r.url;
    const c = document.createElement("span");
    c.className = "badge";
    c.textContent = r.ok ? r.tracks.length + " tracks · " + (r.roots.join(", ") || "server")
                         : "offline";
    const x = document.createElement("button");
    x.textContent = "forget";
    x.onclick = () => {
      forgetServer(r.url);
      renderServers();
      renderResults(searchBox.value);
    };
    el.append(n, c, x);
    return el;
  }));
}

function renderDirs() {
  const rows = dirs.map(d => {
    const el = document.createElement("div");
    el.className = "dir";
    const n = document.createElement("span");
    n.textContent = d.name + (d.ok ? "" : " (no permission)");
    const c = document.createElement("span");
    c.className = "badge";
    c.textContent = d.ok ? pairUp(d.files, d.name).length + " tracks" : "";
    const x = document.createElement("button");
    x.textContent = "forget";
    x.onclick = async () => { await dbDel(d.id); await refreshDirs(); renderDirs(); renderResults(searchBox.value); };
    el.append(n, c, x);
    return el;
  });

  if (picked.length) {
    const el = document.createElement("div");
    el.className = "dir";
    el.innerHTML = `<span>picked files</span>` +
      `<span class="badge">${pairUp(picked, "picked").length} tracks · this session</span>`;
    rows.push(el);
  }
  dirList.replaceChildren(...rows);
}

/* Prefer the File System Access API, because a handle can be kept and the
   folder is still there after a reload. Where it is missing — Safari, Firefox,
   and Chrome from a file:// page — fall back to a plain file input, which
   works everywhere but only for the session. */
async function addFolder() {
  if (!canDir()) return $("pickDir").click();
  try {
    const handle = await showDirectoryPicker({ mode: "read" });
    if (!handle) return;
    await dbAdd({ handle });
    await refreshDirs();
    renderDirs();
    renderResults(searchBox.value);
  } catch (e) {
    if (e.name === "AbortError") return;
    console.warn(e);
    $("pickDir").click();          /* blocked rather than absent: try the input */
  }
}

async function addFiles() {
  if (!canFiles()) return $("pickFiles").click();
  try {
    const handles = await showOpenFilePicker({ multiple: true });
    for (const h of handles) picked.push({ name: h.name, handle: h });
    renderResults(searchBox.value);
  } catch (e) {
    if (e.name === "AbortError") return;
    console.warn(e);
    $("pickFiles").click();
  }
}

function takeFiles(list) {
  for (const f of list) picked.push({ name: f.webkitRelativePath || f.name, file: f });
  renderResults(searchBox ? searchBox.value : "");
  renderDirs();
}

$("pickDir").onchange = e => takeFiles(e.target.files);
$("pickFiles").onchange = e => takeFiles(e.target.files);

/* ── menus and transport bar ────────────────────────────────────────────── */
function openMenu(open) {
  panel.hidden = !open;
  menuBtn.setAttribute("aria-expanded", open);
  menuBtn.classList.toggle("active", open);
  if (open) openTrackPanel(false);
}

function openTrackPanel(open) {
  trackPanel.hidden = !open;
  titleBtn.setAttribute("aria-expanded", open);
  if (open) { renderResults(searchBox.value); openMenu(false); }
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

const seekFromPointer = e => {
  const r = timeline.getBoundingClientRect();
  command({ cmd: "seek", time: (e.clientX - r.left) / r.width * (player.duration || 0) });
};

timeline.addEventListener("pointerdown", e => {
  timeline.setPointerCapture(e.pointerId);
  seekFromPointer(e);
});
timeline.addEventListener("pointermove", e => {
  if (e.buttons & 1) seekFromPointer(e);
});

$("back5").onclick = () => command({ cmd: "nudge", by: -5 });
$("fwd5").onclick = () => command({ cmd: "nudge", by: 5 });
play.onclick = () => command({ cmd: "play" });
stop.onclick = () => command({ cmd: "stop" });
menuBtn.onclick = () => openMenu(panel.hidden);
titleBtn.onclick = () => openTrackPanel(trackPanel.hidden);
$("fsBtn").onclick = toggleFullscreen;

addEventListener("pointerdown", e => {
  if (!panel.hidden && !e.target.closest(".menu")) openMenu(false);
  if (!trackPanel.hidden && !e.target.closest(".track")) openTrackPanel(false);
});
addEventListener("resize", layout);
addEventListener("fullscreenchange", () => {
  $("fsBtn").classList.toggle("active", !!document.fullscreenElement);
  layout();
});

addEventListener("keydown", e => {
  /* Never shadow a browser or system shortcut: Cmd-R, Cmd-L, Cmd-F and the
     rest all arrive here as plain letters otherwise. Shift is left alone, so
     an upper-case letter still works. */
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "INPUT" && /^(text|search)$/.test(e.target.type)) return;

  const colour = { g: "green", a: "amber", r: "red" }[e.key.toLowerCase()];
  if (colour) ["controlColour", "lyricColour", "chordColour"]
    .forEach(n => command({ cmd: "set", name: n, value: colour }));
  else if (e.key === " ") command({ cmd: player.playing ? "stop" : "play" });
  else if (e.key === "ArrowLeft") command({ cmd: "nudge", by: -5 });
  else if (e.key === "ArrowRight") command({ cmd: "nudge", by: 5 });
  else if (e.key.toLowerCase() === "f") toggleFullscreen();
  else if (e.key.toLowerCase() === "z") cycleZoom();
  else if (e.key.toLowerCase() === "l") openTrackPanel(trackPanel.hidden);
  else if (e.key.toLowerCase() === "c")
    command({ cmd: "set", name: "chordPanel", value: !state.chordPanel });
  else if (e.key.toLowerCase() === "s") togglePane();
  /* The shifted faces of the same two keys count too: reaching for "faster"
     and landing on + is the same intent, and the guard above has already let
     shifted keys through. */
  else if (e.key === "-" || e.key === "_") nudgeSpeed(-1);
  else if (e.key === "=" || e.key === "+") nudgeSpeed(1);
  else if (e.key === "\\") command({ cmd: "set", name: "speed", value: DEF.speed.reset });
  else if (e.key === "Escape") { openMenu(false); openTrackPanel(false); }
  else return;
  e.preventDefault();
});

/* Zoom steps through five sizes and comes back round, so Z alone is enough to
   find a size from across the room without hunting for the slider. */
function cycleZoom() {
  const d = DEF.zoom, steps = 5;
  const inc = (d.max - d.min) / (steps - 1);
  const i = Math.round((state.zoom - d.min) / inc);
  command({ cmd: "set", name: "zoom", value: d.min + mod(i + 1, steps) * inc });
}

/* Speed moves in the slider's own step, so the keys and the slider can never
   land on values the other cannot reach. set() clamps to the range. */
const nudgeSpeed = dir =>
  command({ cmd: "set", name: "speed", value: state.speed + dir * DEF.speed.step });

/* The pane is a choice, not a switch, so toggling it has to remember which
   kind of pane you had. */
let lastPane = "split";
function togglePane() {
  if (state.strumPane !== "off") lastPane = state.strumPane;
  command({ cmd: "set", name: "strumPane",
            value: state.strumPane === "off" ? lastPane : "off" });
}

/* ── boot ───────────────────────────────────────────────────────────────── */
load();
buildPanel();
buildTrackPanel();

SETTINGS.forEach(d => set(d.name, d.def, { quiet: true }));
SETTINGS.forEach(d => d.name in store.display && set(d.name, store.display[d.name], { quiet: true }));

renderTitle();
renderLine(-1, false);
layout();
transport(false);
drawTransport();

/* Coming up already pointed at a library is the whole point of remembering
   servers, so the reconnect runs before anything is asked of the user -- and
   the page it was served from is a server by definition, so that one is worth
   knowing about even the first time.

   Then the URL has its say, in order: a server to add, a track to open, a
   place to start. riffplay writes all three, which is how one shell command
   ends up at a playhead in a browser. */
const boot = new URLSearchParams(location.search);

for (const [k, v] of boot)
  if (k.startsWith("set.")) command({ cmd: "set", name: k.slice(4), value: v });

(async () => {
  const known = store.servers || (store.servers = []);
  const trial = [];        /* added by this boot, still to prove themselves */
  const remember = (u, keep) => {
    const url = cleanUrl(u);
    if (!url || known.some(s => s.url === url)) return;
    known.push({ url, name: url, at: Date.now() });
    if (!keep) trial.push(url);
  };

  /* A URL asked for one explicitly, so it stays in the list even if it is not
     answering yet -- that is a server you meant. The page's own origin is a
     guess, so it only stays if it turns out to be one of ours; otherwise every
     static host the file was ever opened from would silt up the list. */
  boot.getAll("server").forEach(u => remember(u, true));
  if (location.protocol.startsWith("http")) remember(location.origin, false);

  await Promise.all([refreshServers(), refreshDirs()]);
  for (const url of trial)
    if (!remote.find(r => r.url === url)?.ok) forgetServer(url);

  renderServers();
  renderDirs();
  renderResults("");

  if (boot.has("track")) command({ cmd: "track", key: boot.get("track") });
  if (boot.has("t")) command({ cmd: "seek", time: boot.get("t") });
})();

requestAnimationFrame(frame);
</script>
</body>
</html>
