   in form order, from the backing half; a call turn cuts to the licks half
   for exactly the window its licks occupy, and every other window of `n`
   licks is left to the player. Both halves are the same form, so a cut can
   land anywhere: a point in the licks half maps to the backing half by its
   beat position, which follows the grid rather than a fixed offset. */
const lickable = () => tradeable() && lickSpans.length > 0;

function lickProgramme(n) {
  const licks = tradeParts.find(p => p.role === "licks");
  const backing = tradeParts.find(p => p.role === "backing");
  if (!licks || !backing || !lickSpans.length) return [];
  const b0 = beatPos(licks.t_start), c0 = beatPos(backing.t_start);
  const toBacking = t => beatTime(c0 + beatPos(t) - b0);
  const buf = [];
  const MIN = .05;
  const push = (name, from, to) => {
    if (to - from > MIN) buf.push({ name, from, to });
  };

  let at = licks.t_start;        /* form position reached so far, licks-half time */
  for (let k = 0, turn = 0; k < lickSpans.length; k += n, turn++) {
    const last = Math.min(k + n, lickSpans.length) - 1;
    /* A window never starts before the previous one ended: annotations
       that overlap a little are trimmed rather than played twice. */
    const w0 = Math.max(at, lickSpans[k].t_start);
    const w1 = Math.max(w0, Math.min(licks.t_end, lickSpans[last].t_end));
    if (w1 <= w0) continue;
    const span = last > k ? `${k + 1}–${last + 1}` : `${k + 1}`;
    if (turn % 2) {
      /* The player's turn starts where the last one ended: the gap before
         the window is theirs too, and the chip says so. */
      push(`you ${span}`, toBacking(at), toBacking(w1));
    } else {
      /* A breath before the record's phrase is not worth a chip of its own;
         the licks half is just as quiet there, so the call starts early. */
      const lead = w0 - at < .25 ? at : w0;
      push("…", toBacking(at), toBacking(lead));
      push(`lick ${span}`, lead, w1);
    }
    at = w1;
  }
  push("…", toBacking(at), toBacking(licks.t_end));
  return buf;
}

function setTrade(n, unit) {
  if (!n || !tradeable()) return bufClear();
  unit = unit || looper.tradeUnit;
  if (unit === "lick" && !lickable()) unit = "bar";
  const buf = unit === "lick" ? lickProgramme(n) : tradeProgramme(n);
  if (!buf.length) return bufClear();
  looper.trade = n;
  looper.tradeUnit = unit;
  looper.buf = buf;
  looper.seg = 0;
  loopApply(buf[0].from);
}

/* T cycles the turn: off, one bar, two bars, then — where the map has
   them — one lick, two licks, and off again. */
function cycleTrade() {
  if (!tradeable()) return;
  const steps = [[0, "bar"], [1, "bar"], [2, "bar"]];
  if (lickable()) steps.push([1, "lick"], [2, "lick"]);
  let i = steps.findIndex(([n, u]) => n === looper.trade && (n === 0 || u === looper.tradeUnit));
  const [n, u] = steps[(i + 1) % steps.length];
  setTrade(n, u);
}

function bufMove(i, j) {
  looper.trade = 0;
  const [x] = looper.buf.splice(i, 1);
  looper.buf.splice(j, 0, x);
  if (looper.seg === i) looper.seg = j;
  else if (i < looper.seg && j >= looper.seg) looper.seg--;
  else if (i > looper.seg && j <= looper.seg) looper.seg++;
  loopApply(null);
}

/* ── the strips ───────────────────────────────────────────────────────── */
function renderLoopBar() {
  const kids = loopRanges.map(l => {
    const b = document.createElement("button");
    b.className = "range";
    b.textContent = "⟳ " + l.name;
    b.title = `${fmtTime(l.t_start)} – ${fmtTime(l.t_end)} — add to the loop buffer`;
    b.onclick = () => bufAdd(l);
    return b;
  });
  /* Trading builds the whole buffer at a press; pressing the lit one stops. */
  if (tradeable()) {
    const units = lickable() ? ["bar", "lick"] : ["bar"];
    for (const unit of units) for (const n of [1, 2]) {
      const b = document.createElement("button");
      b.className = "trade";
      b.dataset.n = n;
      b.dataset.unit = unit;
      b.textContent = `⇄ trade ${n} ${unit}${n > 1 ? "s" : ""}`;
      b.title = unit === "bar"
        ? `${n}-bar turns: the record's licks, then you over the backing (T cycles)`
        : `${n}-lick turns: the record plays a phrase as marked, then you take the next (T cycles)`;
      b.onclick = () => setTrade(looper.trade === n && looper.tradeUnit === unit ? 0 : n, unit);
      kids.push(b);
    }
  }
  loopBar.replaceChildren(...kids);
  /* Both strips come and go together: the buffer is *available* whenever
     there are loopable sections, empty or not. Their height changes the
     stage's, so the panels re-place. */
  const show = loopRanges.length > 0 || tradeable();
  const moved = show === loopBar.hidden;
  loopBar.hidden = loopBuffer.hidden = !show;
  if (moved) layout();
  renderLoopBuf();
}

function renderLoopBuf() {
  const kids = [];
  const label = document.createElement("span");
  label.className = "strip-label";
  label.textContent = "loop buffer";
  kids.push(label);

  if (!looper.buf.length) {
    const h = document.createElement("span");
    h.className = "hint";
    h.textContent = "press a section above to add it — the buffer plays in order and repeats";
    kids.push(h);
  }
  looper.buf.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = l.name;
    b.title = "click to remove — drag to reorder";
    chipHandlers(b, i);
    kids.push(b);
  });
  if (looper.decoding) {
    const h = document.createElement("span");
    h.className = "hint";
    h.textContent = "decoding…";
    kids.push(h);
  }
  if (looper.buf.length) {
    const x = document.createElement("button");
    x.className = "clear";
    x.textContent = "✕ clear";
    x.onclick = bufClear;
    kids.push(x);
  }
  loopBuffer.replaceChildren(...kids);
  drawLoopStrips();
}

function drawLoopStrips() {
  const inBuf = new Set(looper.buf.map(l => l.name));
  [...loopBar.querySelectorAll(".range")].forEach((b, i) =>
    b.classList.toggle("active", inBuf.has(loopRanges[i]?.name)));
  [...loopBar.querySelectorAll(".trade")].forEach(b =>
    b.classList.toggle("active", looper.on && looper.trade === +b.dataset.n
                                 && looper.tradeUnit === b.dataset.unit));
  [...loopBuffer.querySelectorAll(".chip")].forEach((b, i) =>
    b.classList.toggle("active", looper.on && i === looper.seg));
  drawTicks();
}

/* A chip answers two gestures: a click removes it, a drag reorders it. The
   pointer decides which it was — past a few pixels of travel it is a drag,
   the chip stepping through its siblings as the pointer crosses their
   midlines, and the buffer is reordered once, at the end. */
function chipHandlers(el, index) {
  el.onpointerdown = e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const x0 = e.clientX;
    let dragging = false;
    const mid = c => { const r = c.getBoundingClientRect(); return r.left + r.width / 2; };

    el.onpointermove = ev => {
      if (!dragging && Math.abs(ev.clientX - x0) < 6) return;
      dragging = true;
      el.classList.add("drag");
      const chips = [...loopBuffer.querySelectorAll(".chip")];
      const at = chips.indexOf(el);
      const left = chips[at - 1], right = chips[at + 1];
      if (left && ev.clientX < mid(left)) loopBuffer.insertBefore(el, left);
      else if (right && ev.clientX > mid(right)) loopBuffer.insertBefore(right, el);
    };

    el.onpointerup = () => {
      el.onpointermove = el.onpointerup = null;
      el.classList.remove("drag");
      if (!dragging) return bufRemove(index);
      const to = [...loopBuffer.querySelectorAll(".chip")].indexOf(el);
      if (to !== index) bufMove(index, to);
      else drawLoopStrips();
    };
  };
}

/* ── the frame ──────────────────────────────────────────────────────────── */
function frame() {
  if (looper.on && looper.mode === "engine") player.time = looperTime();
  else if (audio) player.time = audio.currentTime;

  /* The fallback loop: the element seeks — audibly — where the engine would
     have crossfaded. Debounced, because the element keeps reporting the old
     position until the seek lands, and hopping again on every frame of that
     latency would spin the whole programme. */
  if (looper.on && looper.mode === "fallback" && looper.buf.length && audio) {
    const cur = looper.buf[looper.seg] || looper.buf[0];
    if (player.time >= cur.to && performance.now() - looper.hopStamp > 250) {
      looper.hopStamp = performance.now();
      looper.seg = (looper.seg + 1) % looper.buf.length;
      seek(looper.buf[looper.seg].from);
      drawLoopStrips();
    }
  }

  if (player.playing) practised();
  updateLyrics(player.time);
  /* The programme chart reads programme time; everything else, the track's. */
  updateChords(loopGhostOn ? progTime(player.time) : player.time);
  updatePane(player.time);
  updateVoice(player.time);
  drawTransport();
  requestAnimationFrame(frame);
}

/* How long, and how recently — per track, so the library can put what you have
   been working on at the top. */
let lastTick = 0;
function practised() {
  const now = Date.now();
  const dt = lastTick ? now - lastTick : 0;
  lastTick = now;
  if (!track.id || dt <= 0 || dt > 1000) return;

  const s = store.stats[track.id] || (store.stats[track.id] = { secs: 0, last: 0 });
  s.secs += dt / 1000;
  s.last = now;
  if (Math.floor(s.secs) % 10 === 0) save();
}

const ago = t => {
  if (!t) return "";
  const d = (Date.now() - t) / 86400000;
  return d < 1 ? "today" : d < 2 ? "yesterday" : Math.floor(d) + "d";
};
const spent = s => (!s || s < 60 ? "" : Math.round(s / 60) + "m");

/* ── commands ───────────────────────────────────────────────────────────
   The single door in: clicks, keys, the URL, and later a socket. */
function command(msg) {
  const { cmd } = msg;
  if (cmd === "set") return set(msg.name, msg.value);
  if (cmd === "play") return looper.on && looper.mode === "engine"
    ? enginePlay() : audio && audio.play().catch(() => {});
  if (cmd === "stop") return looper.on && looper.mode === "engine"
    ? engineHold() : audio && audio.pause();
  if (cmd === "seek") return seek(Number(msg.time) || 0);
  if (cmd === "nudge") return progLooping()
    ? progGoto(mod(progTime(player.time) + Number(msg.by), progTotal()))
    : seek(player.time + Number(msg.by));
  if (cmd === "loop") {
    /* The socket's single range is a one-entry programme. */
    looper.trade = 0;
    looper.buf = msg.from == null ? []
      : [{ name: msg.name || "loop", from: Number(msg.from), to: Number(msg.to) }];
    loopApply(looper.buf.length ? looper.buf[0].from : null);
    return;
  }
  if (cmd === "track") return openTrackByKey(msg.key);
  if (cmd === "reload") return reloadTrack();
}

const net = {
  socket: null,
  connect(url) {
    this.socket = new WebSocket(url);
    this.socket.onmessage = e => { try { command(JSON.parse(e.data)); } catch (err) {} };
  },
  send(msg) {
    if (this.socket && this.socket.readyState === 1) this.socket.send(JSON.stringify(msg));
  }
};

/* ── the library ────────────────────────────────────────────────────────
   v0.1's loading, unchanged in behaviour: a directory handle kept in
   IndexedDB so the folder survives a reload, a file picker for one-offs, and
   pairing by filename stem — a track is a media file with a .txt beside it.
   This is the piece the server will eventually replace, endpoint for
   endpoint, without the rest of the app noticing. */
/* .mov is here for one reason: it is the only container that holds raw MP3
   frames in a way Apple's decoder accepts, which is what a VBR track remuxed
   for accurate seeking has to be if Safari is ever going to play it. */
const MEDIA_RE = /\.(mp3|ogg|wav|flac|m4a|mp4|m4v|mov|webm)$/i;
let _db = null, dirs = [], picked = [], remote = [];

function dbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("riffhound-karaoke", 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("dirs"))
        db.createObjectStore("dirs", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("charts"))
        db.createObjectStore("charts", { keyPath: "id" });
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e.target.error);
  });
}

function dbRun(store, mode, fn) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = e => reject(e.target.error);
  }));
}

const dbAdd = rec => dbRun("dirs", "readwrite", s => s.add(rec));
const dbAll = () => dbRun("dirs", "readonly", s => s.getAll());
const dbDel = id => dbRun("dirs", "readwrite", s => s.delete(id));

/* The last chart seen for a track. Not a cache in front of the server -- the
   server is always asked first, because the chart is the thing being edited in
   the next window and a stale one is worse than a slow one. This is what is
   left when the server does not answer at all: the difference between
   practising on last night's annotations and practising on none. */
const chartKept = id =>
  dbRun("charts", "readonly", s => s.get(id)).then(r => r?.text ?? null).catch(() => null);
const chartKeep = (id, text) =>
  dbRun("charts", "readwrite", s => s.put({ id, text, at: Date.now() })).catch(() => {});

const canDir = () => typeof showDirectoryPicker === "function";
const canFiles = () => typeof showOpenFilePicker === "function";

async function perm(handle) {
  try {
    if (await handle.queryPermission({ mode: "read" }) === "granted") return true;
    return await handle.requestPermission({ mode: "read" }) === "granted";
  } catch { return false; }
}

async function enumerate(handle) {
  const files = [];
  try {
    for await (const [name, h] of handle.entries())
      if (h.kind === "file") files.push({ name, handle: h });
  } catch {}
  return files.sort((a, b) => a.name.localeCompare(b.name));
}

/* Pair a media file with the .txt of the same stem. Only pairs are tracks. */
function pairUp(files, source) {
  const stems = {};
  for (const f of files) {
    const name = f.name || f.file?.name || "";
    const stem = name.replace(/\.[^/.]+$/, "");
    if (MEDIA_RE.test(name)) (stems[stem] ||= {}).media = f;
    else if (/\.txt$/i.test(name)) (stems[stem] ||= {}).txt = f;
  }
  return Object.entries(stems)
    .filter(([, p]) => p.media)
    .map(([stem, p]) => ({
      id: source + "/" + stem,
      title: (stem.includes("/") ? stem.split("/").pop() : stem).replace(/[_\-]+/g, " "),
      source, media: p.media, txt: p.txt || null
    }));
}

async function refreshDirs() {
  dirs = [];
  if (!canDir()) return;
  let rows = [];
  try { rows = await dbAll(); } catch { return; }
  for (const row of rows) {
    const ok = await perm(row.handle);
    dirs.push({ id: row.id, name: row.handle.name, handle: row.handle,
                files: ok ? await enumerate(row.handle) : [], ok });
  }
}

/* Where a track lives, which is the only thing that tells two files of the same
   name apart. A library with "Battle Hymn of the Republic" in two folders is a
   library, not a mistake -- but a list that shows the same title twice with
   nothing to choose between them is useless. */
const where = e =>
  (e.remote ? [e.source, e.folder].filter(Boolean).join("/") : e.source) || "";

function library() {
  const out = [];
  for (const r of remote) if (r.ok) out.push(...serverTracks(r));
  for (const d of dirs) if (d.ok) out.push(...pairUp(d.files, d.name));
  out.push(...pairUp(picked, "picked"));

  /* One server reached by two addresses is one library. That happens the moment
     you open the page on the LAN address having used localhost before: both are
     remembered, both answer, and every track arrives twice. Both are worth
     keeping -- either address may be the one that works next time -- so the
     addresses stay and the listing dedupes instead. */
  const seen = new Set();
  return out.filter(e => !seen.has(e.id) && seen.add(e.id));
}

/* ── servers ────────────────────────────────────────────────────────────
   A folder handle only exists on the machine that granted it, which is why a
   phone on a music stand cannot see the library the laptop can. A server can
   be reached from both, so the same folder becomes the same library from
   anywhere in the room -- and the same protocol serves the terminal client and
   the beatmapper later, without any of them owning a filesystem.

   Servers are remembered and re-checked at startup: a client should come up
   pointed at the library it was pointed at last, without being asked. The
   check is one small GET with a short deadline, so a server that has gone away
   costs a second at boot and says so in the panel rather than hanging the app.

   The server's own name, not its URL, keys what is remembered about a track:
   a laptop that comes back on a different port is the same library, and losing
   your practice history to a port number would be absurd. */
const HELLO_MS = 2500;

const cleanUrl = u => String(u || "").trim().replace(/\/+$/, "")
  .replace(/^(?!https?:\/\/)/, "http://");

async function ask(url, path, opts = {}) {
  const ctl = new AbortController();
  const bell = setTimeout(() => ctl.abort(), opts.ms || HELLO_MS);
  try {
    const r = await fetch(url + path, { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("server said " + r.status + " " + r.statusText);
    return opts.text ? await r.text() : await r.json();
  } finally {
    clearTimeout(bell);
  }
}

/* One handshake, then the listing. Kept together because a server that says
   hello but cannot list is not usable, and the panel should say so once. */
async function greet(url) {
  const hi = await ask(url, "/api/hello");
  if (!hi || hi.riffhound == null) throw new Error("not a RiffHound server");
  /* Asked for alongside, and allowed to fail: a server from before there were
     backgrounds is still a server. */
  const [got, bg] = await Promise.all([
    ask(url, "/api/tracks", { ms: 8000 }),
    ask(url, "/api/backgrounds").catch(() => ({}))]);
  return { url, name: hi.name || url, roots: hi.roots || [],
           tracks: got.tracks || [],
           backgrounds: Array.isArray(bg.backgrounds) ? bg.backgrounds : [],
           ok: true, why: "" };
}

/* Try every server we know, in parallel: they are independent and the slow one
   should not hold up the rest. A failure is remembered as a failure rather
   than dropped, so the panel can say which library is not answering. */
async function refreshServers() {
  const known = store.servers || (store.servers = []);
  remote = await Promise.all(known.map(async s => {
    try {
      return { ...await greet(s.url), at: s.at };
    } catch (e) {
      return { url: s.url, name: s.name || s.url, roots: [], tracks: [],
               ok: false, why: e.name === "AbortError" ? "no answer" : e.message };
    }
  }));
  /* Adopt whatever the servers now call themselves, so a rename follows. */
  remote.forEach(r => { const k = known.find(s => s.url === r.url); if (k) k.name = r.name; });
  save();
}

async function addServer(raw) {
  const url = cleanUrl(raw);
  if (!url) return "";
  const known = store.servers || (store.servers = []);
  let got;
  try {
    got = await greet(url);
  } catch (e) {
    noteProblem("Could not reach " + url, e);
    return e.name === "AbortError" ? "no answer" : "failed";
  }
  const row = known.find(s => s.url === url) || (known.push({ url }), known.at(-1));
  row.name = got.name;
  row.at = Date.now();
  save();
  remote = [...remote.filter(r => r.url !== url), got];
  return "ok";
}

function forgetServer(url) {
  store.servers = (store.servers || []).filter(s => s.url !== url);
  remote = remote.filter(r => r.url !== url);
  save();
}

/* ── backgrounds ────────────────────────────────────────────────────────
   An animation behind the display, picked from backgrounds/ beside the page.
   A page cannot list a folder, so the list is whatever the servers say they
   have; the file itself is then just an image, which animates a GIF without
   being asked and needs no fetch -- so a name that no server lists is still
   tried beside the page, which is where it is when the page came from file://
   and where it is before any server has answered. */
const backdrop = $("backdrop");
let backdropUrl = "", backdropProbe = null;

/* The flag follows the picture, not the setting: a name that did not load is
   a black stage, and should look like one. */
function showBackdrop(url) {
  backdrop.hidden = !url;
  backdrop.style.backgroundImage = url ? `url("${url}")` : "";
  root.dataset.backdrop = url ? "on" : "off";
}

const serverBackgrounds = () => remote.flatMap(r => r.ok ? r.backgrounds || [] : []);

function backgroundOptions() {
  const names = [...new Set(serverBackgrounds())]
    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
  return [{ v: "", label: "Off" },
          ...names.map(n => ({ v: n, label: n.replace(/\.\w+$/, "").replace(/[_\-]+/g, " ") }))];
}

/* The setting's picture, or -- while the picker is walking its grid -- the one
   under the cursor, which is a preview and not yet the setting. */
function applyBackground(name = state.background) {
  if (!name) {
    backdropUrl = "";
    backdropProbe = null;
    showBackdrop("");
    return;
  }
  const url = backgroundUrl(name);
  /* Only when it has changed: setting the same picture starts the loop again. */
  if (url === backdropUrl) return;
  backdropUrl = url;

  /* A CSS background does not say whether it loaded, so an image that is never
     shown finds out first; the picture already up stays up until it has. A
     later choice overtakes this one by no longer being the probe. */
  const probe = backdropProbe = new Image();
  probe.onload = () => { if (probe === backdropProbe) showBackdrop(url); };
  probe.onerror = () => { if (probe === backdropProbe) showBackdrop(""); };
  probe.src = url;
}

/* Where a background lives: on the server that lists it, else beside the page. */
function backgroundUrl(name) {
  const from = remote.find(r => r.ok && (r.backgrounds || []).includes(name));
  return new URL((from ? from.url + "/" : "") + "backgrounds/" + encodeURIComponent(name),
                 location.href).href;
}

/* The servers have answered, or one has been added or forgotten. */
function refreshBackgrounds() {
  sync("background");
  applyBackground();
  if (!bgPanel.hidden) renderBackgrounds(bgSearch.value);
}

/* ── background picker ──────────────────────────────────────────────────
   B opens a grid of live previews in the stage's top-left corner; the search
   box narrows it with the same letters-in-order match the track list uses,
   arrows walk the grid, Enter or a click sets the background. "Off" is the
   first tile while nothing has been typed, so the way back is in the grid. */
const bgPanel = $("bgPanel"), bgSearch = $("bgSearch"), bgGrid = $("bgGrid"), bgHint = $("bgHint");
const bgLevel = $("bgLevel"), bgLevelOut = $("bgLevelOut");
/* The same setting as the menu's "Background level", from a second control:
   set() goes through sync(), which keeps the two sliders agreeing. */
bgLevel.oninput = () => command({ cmd: "set", name: "backgroundLevel", value: bgLevel.value });
const BG_TILES = 16;
let bgShown = [], bgPick = -1;

const bgLabel = n => n.replace(/\.\w+$/, "").replace(/[_\-]+/g, " ");

function renderBackgrounds(query) {
  const q = String(query || "").trim();
  const names = backgroundOptions().map(o => o.v).filter(Boolean);
  const hits = names.filter(n => fuzzy(q, bgLabel(n)) || fuzzy(q, n));
  /* Sixteen tiles in all: the Off tile, when it is there, takes one of them. */
  const room = q ? BG_TILES : BG_TILES - 1;
  bgShown = (q ? [] : [""]).concat(hits.slice(0, room));
  if (bgPick >= bgShown.length) bgPick = bgShown.length - 1;
  bgGrid.replaceChildren(...bgShown.map((n, i) => {
    const el = document.createElement("div");
    el.className = "bgtile" + (n === state.background ? " on" : "") + (i === bgPick ? " pick" : "");
    if (n) el.style.backgroundImage = `url("${backgroundUrl(n)}")`;
    const tag = document.createElement("span");
    tag.textContent = n ? bgLabel(n) : "Off";
    el.append(tag);
    el.onclick = () => { pickBackground(n); openBgPanel(false); };
    return el;
  }));
  bgHint.textContent = !names.length ? "no backgrounds: none of the servers lists any"
    : hits.length > room ? `${hits.length} match — showing ${room}, type more to narrow`
    : hits.length ? `${hits.length} of ${names.length}` : "no match";
}

function pickBackground(name) {
  bgKept = true;
  command({ cmd: "set", name: "background", value: name });
  [...bgGrid.children].forEach((el, i) => el.classList.toggle("on", bgShown[i] === name));
}

/* Walking the grid shows each picture behind the display as the cursor
   reaches it, so the choice is made by looking rather than by name. It is a
   preview: Enter or a click keeps it, and closing any other way puts the
   setting's own picture back. */
function moveBgPick(by) {
  if (!bgShown.length) return;
  bgPick = bgPick < 0 ? (by > 0 ? 0 : bgShown.length - 1)
         : clamp(bgPick + by, 0, bgShown.length - 1);
  [...bgGrid.children].forEach((el, i) => el.classList.toggle("pick", i === bgPick));
  bgGrid.children[bgPick]?.scrollIntoView({ block: "nearest" });
  applyBackground(bgShown[bgPick]);
}

let bgKept = false;          /* the picker closed on a choice, not a retreat */

function openBgPanel(open) {
  if (!open && !bgPanel.hidden && !bgKept) applyBackground();   /* undo the preview */
  bgPanel.hidden = !open;
  if (!open) return;
  openMenu(false); openTrackPanel(false);
  bgPick = -1;
  bgKept = false;
  sync("backgroundLevel");
  renderBackgrounds(bgSearch.value);
  bgSearch.focus();
  bgSearch.select();
}

bgSearch.oninput = () => { bgPick = -1; renderBackgrounds(bgSearch.value); };
bgSearch.onkeydown = e => {
  const cols = 4;
  if (e.key === "ArrowRight") moveBgPick(1);
  else if (e.key === "ArrowLeft") moveBgPick(-1);
  else if (e.key === "ArrowDown") moveBgPick(cols);
  else if (e.key === "ArrowUp") moveBgPick(-cols);
  else if (e.key === "Enter") {
    /* Enter with nothing picked takes the first real match: type "rain",
       press Enter, done. */
    const i = bgPick >= 0 ? bgPick : bgShown.findIndex(n => n) >= 0 ? bgShown.findIndex(n => n) : -1;
    if (i >= 0) { pickBackground(bgShown[i]); openBgPanel(false); }
  }
  else return;
  e.preventDefault();
};

/* An id is a path, so it arrives with slashes in it and may arrive with spaces,
   plus signs or hashes. Encoding it a segment at a time keeps the slashes as
   slashes -- they are the structure -- and everything else literal. */
const idPath = tid => String(tid).split("/").map(encodeURIComponent).join("/");

/* Server tracks alongside local ones, in the shape the rest of the app already
   understands: a title, a source, and somewhere to get the two files. */
const serverTracks = r => r.tracks.map(t => ({
  id: "@" + r.name + "/" + t.id,
  title: t.title,
  source: r.name,
  remote: { base: r.url, tid: t.id },
  has: t.has,
  folder: t.folder || "",
  media: { url: r.url + "/media/" + idPath(t.id), name: t.media },
  txt: t.chart ? { url: r.url + "/chart/" + idPath(t.id), name: t.title + ".txt" } : null
}));

/* ── what a track carries ───────────────────────────────────────────────
   Beats, chords, lyrics, loops: enough to answer "show me only the ones I
   have beatmapped" — or the ones with a passage to go round — without
   opening them one at a time.

   A server says so in its listing, because it has the files and can read them
   for the price of a stat. A folder handle cannot be asked that cheaply, so the
   sidecars are read in the background after the listing is already on screen,
   and re-read only where the file has changed. Until that finishes a local
   track counts as unknown and passes every filter: hiding something because we
   have not looked yet is the one answer that is definitely wrong. */
const NOTHING = { beats: false, chords: false, lyrics: false, loops: false, melody: false,
                  trade: false };
const localFlags = new Map();   // track id -> { beats, chords, lyrics, loops }
const localSeen = new Map();    // track id -> "size:mtime" already read

const trackFlags = e =>
  e.remote ? (e.has || NOTHING)
  : !e.txt ? NOTHING
  : localFlags.get(e.id) || null;   /* null = not looked at yet */

/* Read the sidecars of every local track, cheapest first: a file whose size and
   timestamp are unchanged is skipped outright. parseTimeseries is the only
   thing that decides what an annotation is, here as everywhere else. */
async function scanLocalCharts() {
  let found = false;
  for (const e of library()) {
    if (e.remote || !e.txt) continue;
    try {
      const h = e.txt.handle || e.txt.file || e.txt;
      const f = ("getFile" in h) ? await h.getFile() : h;
      const stamp = f.size + ":" + f.lastModified;
      if (localSeen.get(e.id) === stamp) continue;
      const p = parseTimeseries(await f.text());
      localFlags.set(e.id, { beats: p.beats.length > 0,
                             chords: p.chords.length > 0,
                             lyrics: p.lyrics.length > 0,
                             loops: p.loops.length > 0,
                             melody: p.voices.length > 0,
                             trade: p.parts.some(x => x.role === "licks")
                                 && p.parts.some(x => x.role === "backing") });
      localSeen.set(e.id, stamp);
      found = true;
    } catch { localFlags.set(e.id, NOTHING); }
  }
  if (found && searchBox) renderResults(searchBox.value);
}

/* Subsequence match, as v0.1 did: every letter of the query in order. */
function fuzzy(q, s) {
  if (!q) return true;
  q = q.toLowerCase(); s = s.toLowerCase();
  let qi = 0;
  for (let i = 0; i < s.length && qi < q.length; i++) if (s[i] === q[qi]) qi++;
  return qi === q.length;
}

/* ── what went wrong ────────────────────────────────────────────────────
   A track that will not load used to put "⚠ could not play <title>" in the
   header and stop there, which says nothing you could act on and costs you the
   title as well. The header now carries the warning sign alone, and the reason
   lives in the panel the title already opens — where there is room to name the
   file, quote the browser, and say what to do about it. */
let problems = [];

const fileName = f => f?.name || f?.file?.name || f?.handle?.name || "the file";

/* The four MediaError codes, in the terms of this app rather than the spec. */
const MEDIA_ERR = {
  1: "loading was aborted",
  2: "the file could not be read to the end",
  3: "the audio is damaged, or in a form this browser cannot decode",
  4: "this browser will not play this file's format"
};

/* Two failures are worth naming, because both mean "the library moved under
   you" and both are fixed the same way. */
const HINTS = {
  NotFoundError:    "The file is not there any more. Re-open the folder to pick up its current contents.",
  NotReadableError: "The file changed on disk after the folder was opened. Re-open the folder to re-read it.",
  SecurityError:    "The browser withdrew permission for this folder. Re-open it to grant access again."
};

function clearProblems() { problems = []; showProblems(); }

function noteProblem(what, err) {
  const name = err?.name || "";
  const said = err?.message || (err == null ? "" : String(err));
  problems.push({ what, said: name && said && !said.startsWith(name) ? `${name}: ${said}` : (said || name),
                  hint: HINTS[name] || "" });
  showProblems();
}

function renderTitle() {
  titleText.textContent = (problems.length ? "⚠ " : "") + (track.title || "");
}

function showProblems() {
  renderTitle();
  if (!problemBox) return;
  problemBox.replaceChildren(...problems.map(p => {
    const box = document.createElement("div");
    box.className = "problem";
    const what = document.createElement("b");
    what.textContent = p.what;
    box.append(what);
    for (const line of [p.said, p.hint]) {
      if (!line) continue;
      const el = document.createElement("span");
      el.textContent = line;
      box.append(el);
    }
    return box;
  }));
  problemBox.hidden = !problems.length;
}

/* Returns what could be read: a reload needs to tell "the file has no lyrics"
   apart from "the file could not be read", which look identical on screen.
   opts.reload marks the one caller that is re-reading the track already up,
   which keeps the few things that belong to the practice session rather than
   to the track — see the speed below. */
async function openTrack(entry, opts = {}) {
  const getFile = async h => (h && "getFile" in h ? await h.getFile() : h);
  const ok = { text: true, media: true };

  /* Name the track before clearing, because clearing repaints the title and
     the title it should paint is this one, not the one on its way out. */
  track = { id: entry.id, title: entry.title };
  clearProblems();

  /* The chart, from the server if there is one and from disk otherwise. A
     server chart is always fetched, never taken from the copy kept here: it is
     the file the beatmapper is writing to, and the whole point of edit-and-hear
     is that the next reload has the edit in it. The kept copy is the fallback
     for a server that has gone away, not a cache in front of one. */
  let text = "";
  if (entry.remote) {
    try {
      text = entry.txt ? await ask(entry.remote.base,
                                   "/chart/" + idPath(entry.remote.tid),
                                   { text: true, ms: 8000 }) : "";
      chartKeep(entry.id, text);
    } catch (e) {
      console.warn("chart:", e);
      const kept = await chartKept(entry.id);
      if (kept == null) {
        ok.text = false;
        noteProblem("Could not fetch the chart for " + entry.title, e);
      } else {
        text = kept;
        noteProblem("Showing the last chart kept for this track",
                    { message: "The server did not answer, so its annotations "
                             + "are as of the last time it did." });
      }
    }
  } else if (entry.txt) {
    try { text = await (await getFile(entry.txt.handle || entry.txt.file || entry.txt)).text(); }
    catch (e) {
      console.warn("lyrics:", e);
      ok.text = false;
      noteProblem("Could not read " + fileName(entry.txt), e);
    }
  }

  const parsed = parseTimeseries(text);
  lyricLines = parsed.lyrics;
  sections = parsed.sections;
  beatGrid = parsed.beats;
  analyseBeats();
  clearChords();
  clearVoice();
  chordLine = parsed.chords;
  ghostChords();
  groupChords();
  /* A strum line runs until the next one, and the last one runs to the end of
     the track — which is not known yet, and does not need to be. */
  analyseStrums(parsed.strums, Infinity);
  analyseVoices(parsed.voices, parsed.keys);

  /* A new track must not inherit the old one's programme. A reload is the
     same track mid-practice: entries whose named ranges still exist re-map
     to wherever those ranges now are, and the playhead stays put. */
  loopRanges = parsed.loops;
  tradeParts = parsed.parts;
  lickSpans = parsed.licks;
  if (opts.reload) {
    /* A trade programme is derived, so it is derived again from the new
       ranges rather than matched chip by chip. */
    looper.buf = looper.trade
      ? (looper.tradeUnit === "lick" ? lickProgramme(looper.trade) : tradeProgramme(looper.trade))
      : looper.buf.map(b => {
      const l = loopRanges.find(x => x.name === b.name);
      return l && { name: l.name, from: l.t_start, to: l.t_end };
    }).filter(Boolean);
    if (!looper.buf.length) looper.trade = 0;
    if (looper.on) looper.buf.length ? loopApply(null) : loopOff();
  } else {
    looper.buf = [];
    looper.trade = 0;
    looper.on = false;
    looper.playing = false;
    looper.seg = 0;
    looper.pending = null;
    looper.forTrack = null;
    looper.mode = "engine";           /* a new track earns a fresh try */
    loopGhostOn = false;
    if (looper.ctx) looper.ctx.suspend().catch(() => {});
  }
  looper.srcBytes = looper.srcUrl = null;   /* set below, as the media is read */
  renderLoopBar();

  for (const note of parsed.notes) noteProblem(note, null);
  if (parsed.strums.length && strumLines.some(s => s.mismatch))
    noteProblem("A strum line's span is not the length of its pattern",
                { message: "Its slots are being spread over the span it was "
                         + "given, so they are not eighth notes on this track." });

  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  let url = null;
  /* Server media goes to the element as a URL rather than through a Blob: the
     browser then streams it, seeks with Range instead of refetching, and keeps
     the bytes in its own cache -- which is the local media cache, already
     written, already correct about revalidating. */
  if (entry.remote) {
    url = entry.media.url;
    looper.srcUrl = url;             /* the engine refetches; the cache has it */
  } else try {
    const file = await getFile(entry.media.handle || entry.media.file || entry.media);
    /* Read the bytes here rather than handing the File straight to
       createObjectURL. A File is a snapshot of a path: once the file behind it
       has been moved or rewritten — which is the normal state of affairs when
       something else on the machine is editing this library — the read fails.
       Deferring it means the failure arrives later, as a bare media error on
       the element with no name and no file attached to it. Reading now turns
       the same failure into an exception that can say which file and why, and
       the copy in memory cannot go stale underneath a track already playing. */
    const bytes = await file.arrayBuffer();
    looper.srcBytes = bytes;         /* the engine decodes from a copy of these */
    url = audioUrl = URL.createObjectURL(new Blob([bytes], { type: file.type || "" }));
  } catch (e) {
    console.warn("media:", e);
    ok.media = false;
    noteProblem("Could not read " + fileName(entry.media), e);
  }

  titleTags.innerHTML = "";

  /* A new track starts at the record's own speed. Half time belongs to the
     passage you were working on, not to the library, and inheriting last
     night's 0.6× is the kind of thing you only notice a verse in. A reload is
     the same track mid-practice, so it keeps the speed you set. */
  if (!opts.reload) command({ cmd: "set", name: "speed", value: DEF.speed.def });

  lastLine = -2;
  attachAudio(url);
  renderResults(searchBox.value);
  layout();
  return ok;
}

/* Re-read the current track from disk. The beatmapper writes annotations while
   this page is open, so edit-and-hear is the loop that matters; the playhead
   and the playing state survive a reload, because being sent back to bar one
   every time would make it useless mid-practice. */
async function reloadTrack() {
  if (!track.id) return "no track";

  const at = player.time, was = player.playing;
  if (was) command({ cmd: "stop" });

  /* Re-enumerate first: a .txt written since the folder was opened is not in
     the cached listing, so a track can gain annotations between reloads, and a
     server can have gained the track itself. */
  await Promise.all([refreshDirs(), refreshServers()]);
  scanLocalCharts();
  renderDirs();
  const entry = library().find(e => e.id === track.id);
  if (!entry) {
    /* The listing was just refreshed, so this is the folder's own answer: the
       track is not in it any more, under that name. */
    noteProblem(track.title + " is no longer in the folder",
                { message: "Nothing there pairs a media file with that name. "
                         + "It may have been renamed, moved, or given a different extension." });
    renderResults(searchBox ? searchBox.value : "");
    return "gone";
  }

  const ok = await openTrack(entry, { reload: true });

  /* seek() clamps against player.duration, and that stays 0 until the fresh
     audio reports its metadata — seeking any earlier lands at bar one. Wait
     for it, but never longer than a few seconds: a file that will not decode
     must not leave the button stuck. */
  if (audio && !player.duration) await new Promise(done => {
    audio.addEventListener("loadedmetadata", done, { once: true });
    audio.addEventListener("error", done, { once: true });
    setTimeout(done, 4000);
  });
  if (at > 0) seek(at);
  if (was) command({ cmd: "play" });

  return ok.text && ok.media ? "ok" : "unreadable";
}

/* A track can be named by its full id, by the id its server knows it as, or by
   title -- riffplay only has the server's id to hand, and a human typing a URL
   only has the title. */
const openTrackByKey = key => {
  const found = library().find(e =>
    e.id === key || e.remote?.tid === key || e.title === key);
  if (found) openTrack(found);
};

/* ── set / sync ─────────────────────────────────────────────────────────
   set() is the only thing that writes state. sync() is the only thing that
   writes controls, and never fires events, so a change can safely come from
   anywhere without the UI arguing with itself. */
const controls = {};                       /* name -> the element to reflect into */
const AFTER = {
  layout: () => layout(),
  lyrics: () => { renderLine(lastLine, lastRest); layout(); },
  /* The stroke surfaces are drawn once per chord row and once per pattern, so
     changing what they are supposed to show has to invalidate both. */
  strum: () => { groupAt = -1; paneAt = ""; layout(); },
  voice: () => { voiceAt = -1; layout(); }
};

function coerce(def, v) {
  if (def.type === "toggle") return !!v;
  if (def.type === "range") return clamp(Number(v), def.min, def.max);
  /* Taken on trust: the options arrive after the saved value does. */
  if (def.type === "select") return String(v ?? "");
  return def.options.some(o => o.v === v) ? v : def.def;
}

function set(name, value, opts = {}) {
  const def = DEF[name];
  if (!def) return;                        /* unknown setting: ignore, never throw */

  state[name] = coerce(def, value);
  const v = state[name];

  if (def.css) root.style.setProperty(def.css, v + (def.unit || ""));
  if (def.flag) root.dataset[def.flag] = v === true ? "on" : v === false ? "off" : v;
  if (def.apply) def.apply(v);

  sync(name);
  if (!opts.quiet) {
    (def.after || "").split(",").filter(Boolean).forEach(a => AFTER[a]?.());
    if (!def.volatile) store.display[name] = v;
    save();
  }
}

function sync(name) {
  const def = DEF[name], el = controls[name], v = state[name];
  if (name === "backgroundLevel") {              /* the picker's copy of the slider */
    if (document.activeElement !== bgLevel) bgLevel.value = v;
    bgLevelOut.value = v + "%";
  }
  if (!el) return;

  if (def.type === "choice") {
    [...el.children].forEach(b => b.classList.toggle("active", b.dataset.v === v));
  } else if (def.type === "select") {
    /* Rebuilt every time, since the list is whatever it is now. A value that
       is no longer on it stays, and says so, rather than reading as Off. */
    const opts = def.options();
    if (v && !opts.some(o => o.v === v)) opts.push({ v, label: v + " (missing)" });
    el.replaceChildren(...opts.map(o => new Option(o.label, o.v)));
    el.value = v;
  } else if (def.type === "toggle") {
    el.checked = v;
  } else if (document.activeElement !== el) {
    el.value = v;
  }

  const out = el.closest(".setting")?.querySelector("output");
  if (out) out.value = def.format ? def.format(v) : v + (def.suffix || def.unit || "");
}

/* ── the panel, built from the registry ─────────────────────────────────── */
function rowFor(def) {
  const row = document.createElement("div");
  row.className = "setting";
  row.innerHTML = `<label>${def.label}</label>`;

  if (def.type === "choice") {
    const sw = document.createElement("div");
    sw.className = "switch";
    def.options.forEach(o => {
      const b = document.createElement("button");
      b.dataset.v = o.v;
      b.innerHTML = (o.icon || "") + `<span>${o.label}</span>`;
      b.onclick = () => command({ cmd: "set", name: def.name, value: o.v });
      sw.append(b);
    });
    row.append(sw);
    controls[def.name] = sw;
  } else if (def.type === "select") {
    const sel = document.createElement("select");
    sel.onchange = () => command({ cmd: "set", name: def.name, value: sel.value });
    row.append(sel);
    controls[def.name] = sel;
  } else if (def.type === "toggle") {
    const box = document.createElement("input");
    box.type = "checkbox";
    box.onchange = () => command({ cmd: "set", name: def.name, value: box.checked });
    row.append(box);
    controls[def.name] = box;
  } else {
    const slider = document.createElement("input");
    Object.assign(slider, { type: "range", min: def.min, max: def.max, step: def.step });
    slider.oninput = () => command({ cmd: "set", name: def.name, value: slider.value });

    const val = document.createElement("span");
    val.className = "val";
    val.append(document.createElement("output"));
    if (def.reset !== undefined) {
      const r = document.createElement("button");
      r.className = "reset";
      r.textContent = "reset";
      r.onclick = () => command({ cmd: "set", name: def.name, value: def.reset });
      val.append(r);
    }
    row.append(slider, val);
    controls[def.name] = slider;
  }
  return row;
}

function group(title, id, defs) {
  const box = document.createElement("details");
  box.open = true;
  box.className = "tinted";
  if (id) box.id = id;
  const sum = document.createElement("summary");
  sum.textContent = title;
  const body = document.createElement("div");
  body.className = "group";
  body.append(...defs.map(rowFor));
  box.append(sum, body);
  return box;
}

function buildPanel() {
  const of = g => SETTINGS.filter(d => d.group === g);
  panel.replaceChildren(
    group("Playback", null, of("playback")),
    group("Display", null, of("common")),
    group("Lyrics", "lyricsGroup", of("lyrics")),
    group("Melody", "voiceGroup", of("voice")),
    group("Chords", "chordsGroup", of("chords")));

  /* Each part's settings wear that part's colour, so the panel says which
     display a control belongs to before you read the label. */
  parts.lyrics.push($("lyricsGroup"));
  parts.voice.push($("voiceGroup"));
  parts.chords.push($("chordsGroup"));
}


/* ── the load dialog ────────────────────────────────────────────────────── */
let searchBox = null, results = null, dirList = null, reloadBtn = null, problemBox = null;
let srvBox = null, srvList = null, filterRow = null, filterCount = null;

/* The things a chart can carry, as checkboxes. Off is "everything", so the
   default library is the whole library and a box only ever narrows it. */
const FILTERS = [
  { key: "beats", label: "Beats" },
  { key: "chords", label: "Chords" },
  { key: "lyrics", label: "Lyrics" },
  { key: "loops", label: "Loops" },
  { key: "melody", label: "Melody" },
  { key: "trade", label: "Trade" }
];

function buildTrackPanel() {
  /* First thing in the panel, because when it has anything to say it is the
     reason the panel was opened. */
  problemBox = document.createElement("div");
  problemBox.className = "problems";
  problemBox.hidden = true;

  const label = document.createElement("label");
  label.htmlFor = "search";
  label.textContent = "Load track";

  filterRow = document.createElement("div");
  filterRow.className = "filters";
  for (const f of FILTERS) {
    const lab = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!store.filters[f.key];
    box.onchange = () => {
      store.filters[f.key] = box.checked;
      save();
      renderResults(searchBox.value);
    };
    lab.append(box, document.createTextNode(f.label));
    filterRow.append(lab);
  }
  filterCount = document.createElement("span");
  filterCount.className = "count";
  filterRow.append(filterCount);

  searchBox = document.createElement("input");
  Object.assign(searchBox, { id: "search", className: "search", type: "search",
                             placeholder: "search tracks…", autocomplete: "off" });
  searchBox.oninput = () => { pickId = null; renderResults(searchBox.value); };
  /* The keys stay with the box, so typing and choosing are one motion: narrow
     it, arrow down, Enter. Enter with nothing chosen takes the top row, which
     is what the typing was for. */
  searchBox.onkeydown = e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowDown") movePick(1);
    else if (e.key === "ArrowUp") movePick(-1);
    else if (e.key === "Enter") {
      const e1 = shown.find(x => x.id === pickId) || shown[0];
      if (e1) { openTrack(e1); openTrackPanel(false); }
    }
    else return;
    e.preventDefault();
  };

  results = document.createElement("div");
  results.className = "results";

  const sources = document.createElement("div");
  sources.className = "sources";
  const dirBtn = document.createElement("button");
  dirBtn.textContent = "Open folder…";
  dirBtn.onclick = addFolder;
  const fileBtn = document.createElement("button");
  fileBtn.textContent = "Open files…";
  fileBtn.onclick = addFiles;

  reloadBtn = document.createElement("button");
  reloadBtn.textContent = "Reload";
  reloadBtn.title = "Re-read this track's audio and annotations from disk";
  reloadBtn.onclick = async () => {
    const label = "Reload";
    reloadBtn.dataset.busy = "1";        /* openTrack re-renders and would re-enable it */
    reloadBtn.disabled = true;
    reloadBtn.textContent = "Reading…";
    /* "Could not read" is mostly the picked-files path: a file chosen through
       the plain input is a snapshot the browser refuses to re-read once it has
       changed on disk. Better to say so than to show minutes-old annotations
       as though they were fresh. */
    const r = await reloadTrack();
    reloadBtn.textContent = { ok: "Reloaded ✓", gone: "Not on disk",
                              unreadable: "Could not read" }[r] || label;
    setTimeout(() => {
      reloadBtn.textContent = label;
      delete reloadBtn.dataset.busy;
      reloadBtn.disabled = !track.id;
    }, 1400);
  };
  sources.append(dirBtn, fileBtn, reloadBtn);

  /* One field and one button: a server is a URL, and the point of remembering
     them is that this is the last time you type it. */
  const srvRow = document.createElement("div");
  srvRow.className = "sources";
  srvBox = document.createElement("input");
  Object.assign(srvBox, { className: "search", type: "text", spellcheck: false,
                          placeholder: "http://host:8177", autocomplete: "off" });
  const srvBtn = document.createElement("button");
  srvBtn.textContent = "Connect";
  const connect = async () => {
    if (!srvBox.value.trim()) return;
    srvBtn.disabled = true;
    srvBtn.textContent = "…";
    const r = await addServer(srvBox.value);
    srvBtn.textContent = { ok: "Connected", "no answer": "No answer" }[r] || "Failed";
    if (r === "ok") srvBox.value = "";
    renderServers();
    refreshBackgrounds();
    renderResults(searchBox.value);
    setTimeout(() => { srvBtn.textContent = "Connect"; srvBtn.disabled = false; }, 1400);
  };
  srvBtn.onclick = connect;
  srvBox.onkeydown = e => { if (e.key === "Enter") connect(); };
  srvRow.append(srvBox, srvBtn);

  srvList = document.createElement("div");
  srvList.className = "dirs";

  dirList = document.createElement("div");
  dirList.className = "dirs";

  trackPanel.replaceChildren(problemBox, label, searchBox, filterRow, results,
                             sources, srvRow, srvList, dirList);
  renderResults("");
  renderServers();
  renderDirs();
  showProblems();          /* anything noted before the panel existed */
}

/* A track survives the filters when it has everything they ask for. Unknown --
   a local sidecar not read yet -- passes, because the alternative is hiding a
   track for not having been looked at. */
function passes(e) {
  const want = FILTERS.filter(f => store.filters[f.key]);
  if (!want.length) return true;
  const has = trackFlags(e);
  return has == null || want.every(f => has[f.key]);
}

/* What a listed track is carrying, in the same words as the filters. */
const carried = e => {
  const has = trackFlags(e);
  if (!has) return "";
  const on = FILTERS.filter(f => has[f.key]).map(f => f.label.toLowerCase());
  return on.length ? on.join(" · ") : "no chart";
};

/* The row the arrow keys are on, by track rather than by position: the list is
   redrawn under you whenever a server answers or a scan lands, and the cursor
   should still be on the track it was on. */
let shown = [], pickId = null;

function markPick() {
  [...results.children].forEach((b, i) =>
    b.classList.toggle("pick", !!shown[i] && shown[i].id === pickId));
  results.querySelector(".pick")?.scrollIntoView({ block: "nearest" });
}

function movePick(by) {
  if (!shown.length) return;
  const i = shown.findIndex(e => e.id === pickId);
  const j = i < 0 ? (by > 0 ? 0 : shown.length - 1)
                  : clamp(i + by, 0, shown.length - 1);
  pickId = shown[j].id;
  markPick();
}

function renderResults(query) {
  const q = String(query || "").trim();
  if (reloadBtn) reloadBtn.disabled = !track.id || reloadBtn.dataset.busy === "1";
  const all = library();
  const kept = all.filter(e => (fuzzy(q, e.title) || fuzzy(q, e.source)) && passes(e));
  if (filterCount)
    filterCount.textContent = kept.length === all.length
      ? all.length + " tracks"
      : kept.length + " of " + all.length;

  shown = kept
    .sort((a, b) => (store.stats[b.id]?.last || 0) - (store.stats[a.id]?.last || 0))
    .slice(0, 200);
  const rows = shown.map(e => {
    const s = store.stats[e.id] || {};
    const b = document.createElement("button");
    b.className = "result" + (e.id === track.id ? " on" : "");
    b.innerHTML = `<b>${e.title}<em>${where(e)}</em></b>` +
                  `<i>${carried(e)} ${spent(s.secs)}</i><i>${ago(s.last)}</i>`;
    b.onclick = () => { openTrack(e); openTrackPanel(false); };
    return b;
  });

  results.replaceChildren(...(rows.length ? rows : [Object.assign(
    document.createElement("div"),
    { className: "note",
      textContent: remote.length || dirs.length || picked.length
        ? "nothing found"
        : "connect to a server, or open a folder of tracks, to begin" })]));
  markPick();
}

function renderServers() {
  if (!srvList) return;
  srvList.replaceChildren(...remote.map(r => {
    const el = document.createElement("div");
    el.className = "dir";
    const n = document.createElement("span");
    n.textContent = r.name + (r.ok ? "" : " (" + r.why + ")");
    n.title = r.url;
    const c = document.createElement("span");
    c.className = "badge";
    c.textContent = r.ok ? r.tracks.length + " tracks · " + (r.roots.join(", ") || "server")
                         : "offline";
    const x = document.createElement("button");
    x.textContent = "forget";
    x.onclick = () => {
      forgetServer(r.url);
      renderServers();
      refreshBackgrounds();
      renderResults(searchBox.value);
    };
    el.append(n, c, x);
    return el;
  }));
}

function renderDirs() {
  const rows = dirs.map(d => {
    const el = document.createElement("div");
    el.className = "dir";
    const n = document.createElement("span");
    n.textContent = d.name + (d.ok ? "" : " (no permission)");
    const c = document.createElement("span");
    c.className = "badge";
    c.textContent = d.ok ? pairUp(d.files, d.name).length + " tracks" : "";
    const x = document.createElement("button");
    x.textContent = "forget";
    x.onclick = async () => { await dbDel(d.id); await refreshDirs(); renderDirs(); renderResults(searchBox.value); };
    el.append(n, c, x);
    return el;
  });

  if (picked.length) {
    const el = document.createElement("div");
    el.className = "dir";
    el.innerHTML = `<span>picked files</span>` +
      `<span class="badge">${pairUp(picked, "picked").length} tracks · this session</span>`;
    rows.push(el);
  }
  dirList.replaceChildren(...rows);
}

/* Prefer the File System Access API, because a handle can be kept and the
   folder is still there after a reload. Where it is missing — Safari, Firefox,
   and Chrome from a file:// page — fall back to a plain file input, which
   works everywhere but only for the session. */
async function addFolder() {
  if (!canDir()) return $("pickDir").click();
  try {
    const handle = await showDirectoryPicker({ mode: "read" });
    if (!handle) return;
    await dbAdd({ handle });
    await refreshDirs();
    renderDirs();
    renderResults(searchBox.value);
  } catch (e) {
    if (e.name === "AbortError") return;
    console.warn(e);
    $("pickDir").click();          /* blocked rather than absent: try the input */
  }
}

async function addFiles() {
  if (!canFiles()) return $("pickFiles").click();
  try {
    const handles = await showOpenFilePicker({ multiple: true });
    for (const h of handles) picked.push({ name: h.name, handle: h });
    renderResults(searchBox.value);
  } catch (e) {
    if (e.name === "AbortError") return;
    console.warn(e);
    $("pickFiles").click();
  }
}

function takeFiles(list) {
  for (const f of list) picked.push({ name: f.webkitRelativePath || f.name, file: f });
  renderResults(searchBox ? searchBox.value : "");
  renderDirs();
}

$("pickDir").onchange = e => takeFiles(e.target.files);
$("pickFiles").onchange = e => takeFiles(e.target.files);

/* ── menus and transport bar ────────────────────────────────────────────── */
function openMenu(open) {
  panel.hidden = !open;
  menuBtn.setAttribute("aria-expanded", open);
  menuBtn.classList.toggle("active", open);
  if (open) { openTrackPanel(false); openBgPanel(false); }
  peekBare(open);
}

function openTrackPanel(open) {
  trackPanel.hidden = !open;
  titleBtn.setAttribute("aria-expanded", open);
  if (open) { pickId = null; renderResults(searchBox.value); openMenu(false); openBgPanel(false); searchBox.focus(); }
  peekBare(open);
}

/* The dialogs live in the header, so with the header hidden they would open
   into nothing. Opening one brings the header back for as long as it is up;
   closing it hides the header again, if that is where it was. */
let bareResume = false;

function peekBare(open) {
  const bare = document.body.classList.contains("bare");
  if (open && bare) { toggleBare(); bareResume = true; }
  else if (!open && bareResume && panel.hidden && trackPanel.hidden) toggleBare();
}

function toggleBare() { /* hide or show the header; the stage takes the room */
  document.body.classList.toggle("bare");
  bareResume = false;        /* asked for by hand: nothing to resume */
  layout();
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

const seekFromPointer = e => {
  const r = timeline.getBoundingClientRect();
  const f = clamp((e.clientX - r.left) / r.width, 0, 1);
  /* The bar is programme time while the buffer plays, so a click is too. */
  if (progLooping()) progGoto(f * progTotal());
  else command({ cmd: "seek", time: f * (player.duration || 0) });
};

timeline.addEventListener("pointerdown", e => {
  timeline.setPointerCapture(e.pointerId);
  seekFromPointer(e);
});
timeline.addEventListener("pointermove", e => {
  if (e.buttons & 1) seekFromPointer(e);
});

$("back5").onclick = () => command({ cmd: "nudge", by: -5 });
$("fwd5").onclick = () => command({ cmd: "nudge", by: 5 });
play.onclick = () => command({ cmd: "play" });
stop.onclick = () => command({ cmd: "stop" });
menuBtn.onclick = () => openMenu(panel.hidden);
titleBtn.onclick = () => openTrackPanel(trackPanel.hidden);
$("fsBtn").onclick = toggleFullscreen;

addEventListener("pointerdown", e => {
  if (!panel.hidden && !e.target.closest(".menu")) openMenu(false);
  if (!trackPanel.hidden && !e.target.closest(".track")) openTrackPanel(false);
  if (!bgPanel.hidden && !e.target.closest("#bgPanel")) openBgPanel(false);
});
addEventListener("resize", layout);
addEventListener("fullscreenchange", () => {
  $("fsBtn").classList.toggle("active", !!document.fullscreenElement);
  layout();
});

addEventListener("keydown", e => {
  /* Never shadow a browser or system shortcut: Cmd-R, Cmd-L, Cmd-F and the
     rest all arrive here as plain letters otherwise. Shift is left alone, so
     an upper-case letter still works. */
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  /* Escape is the exception: the load dialog opens with the search box
     focused, so swallowing it here would leave the panel with no way out. */
  if (e.target.tagName === "INPUT" && /^(text|search|range)$/.test(e.target.type)
      && e.key !== "Escape") return;

  const colour = { g: "green", a: "amber", r: "red" }[e.key.toLowerCase()];
  if (colour) ["controlColour", "lyricColour", "voiceColour", "chordColour"]
    .forEach(n => command({ cmd: "set", name: n, value: colour }));
  else if (e.key === " ") command({ cmd: player.playing ? "stop" : "play" });
  /* With the load dialog up the vertical arrows belong to its list, wherever
     in the dialog the focus has wandered to. */
  else if (e.key === "ArrowDown" && !trackPanel.hidden) movePick(1);
  else if (e.key === "ArrowUp" && !trackPanel.hidden) movePick(-1);
  else if (e.key === "ArrowLeft") command({ cmd: "nudge", by: -5 });
  else if (e.key === "ArrowRight") command({ cmd: "nudge", by: 5 });
  else if (e.key.toLowerCase() === "f") toggleFullscreen();
  else if (e.key.toLowerCase() === "z") cycleZoom();
  else if (e.key.toLowerCase() === "l") openTrackPanel(trackPanel.hidden);
  else if (e.key.toLowerCase() === "b") openBgPanel(bgPanel.hidden);
  else if (e.key.toLowerCase() === "c")
    command({ cmd: "set", name: "chordPanel", value: !state.chordPanel });
  else if (e.key.toLowerCase() === "s") togglePane();
  else if (e.key.toLowerCase() === "m") toggleBare();
  else if (e.key.toLowerCase() === "v") toggleVoice();
  else if (e.key.toLowerCase() === "o") bufClear();
  else if (e.key.toLowerCase() === "t") cycleTrade();
  /* The shifted faces of the same two keys count too: reaching for "faster"
     and landing on + is the same intent, and the guard above has already let
     shifted keys through. */
  else if (e.key === "-" || e.key === "_") nudgeSpeed(-1);
  else if (e.key === "=" || e.key === "+") nudgeSpeed(1);
  else if (e.key === "\\") command({ cmd: "set", name: "speed", value: DEF.speed.reset });
  else if (e.key === "Escape") {
    const dialog = !panel.hidden || !trackPanel.hidden || !bgPanel.hidden;
    openMenu(false); openTrackPanel(false); openBgPanel(false);
    /* With no dialog to close, Escape is the way back when the controls are gone. */
    if (!dialog && document.body.classList.contains("bare")) toggleBare();
  }
  else return;
  e.preventDefault();
});

/* Zoom steps through five sizes and comes back round, so Z alone is enough to
   find a size from across the room without hunting for the slider. */
function cycleZoom() {
  const d = DEF.zoom, steps = 5;
  const inc = (d.max - d.min) / (steps - 1);
  const i = Math.round((state.zoom - d.min) / inc);
  command({ cmd: "set", name: "zoom", value: d.min + mod(i + 1, steps) * inc });
}

/* Speed moves in the slider's own step, so the keys and the slider can never
   land on values the other cannot reach. set() clamps to the range. */
const nudgeSpeed = dir =>
  command({ cmd: "set", name: "speed", value: state.speed + dir * DEF.speed.step });

/* The pane is a choice, not a switch, so toggling it has to remember which
   kind of pane you had. */
let lastPane = "split";
function togglePane() {
  if (state.strumPane !== "off") lastPane = state.strumPane;
  command({ cmd: "set", name: "strumPane",
            value: state.strumPane === "off" ? lastPane : "off" });
}

/* ── boot ───────────────────────────────────────────────────────────────── */
load();
buildPanel();
buildTrackPanel();

SETTINGS.forEach(d => set(d.name, d.def, { quiet: true }));
SETTINGS.forEach(d => d.name in store.display && set(d.name, store.display[d.name], { quiet: true }));

renderTitle();
renderLine(-1, false);
layout();
transport(false);
drawTransport();

/* Coming up already pointed at a library is the whole point of remembering
   servers, so the reconnect runs before anything is asked of the user -- and
   the page it was served from is a server by definition, so that one is worth
   knowing about even the first time.

   Then the URL has its say, in order: a server to add, a track to open, a
   place to start. riffplay writes all three, which is how one shell command
   ends up at a playhead in a browser. */
const boot = new URLSearchParams(location.search);

for (const [k, v] of boot)
  if (k.startsWith("set.")) command({ cmd: "set", name: k.slice(4), value: v });

(async () => {
  const known = store.servers || (store.servers = []);
  const trial = [];        /* added by this boot, still to prove themselves */
  const remember = (u, keep) => {
    const url = cleanUrl(u);
    if (!url || known.some(s => s.url === url)) return;
    known.push({ url, name: url, at: Date.now() });
    if (!keep) trial.push(url);
  };

  /* A URL asked for one explicitly, so it stays in the list even if it is not
     answering yet -- that is a server you meant. The page's own origin is a
     guess, so it only stays if it turns out to be one of ours; otherwise every
     static host the file was ever opened from would silt up the list. */
  boot.getAll("server").forEach(u => remember(u, true));
  if (location.protocol.startsWith("http")) remember(location.origin, false);

  await Promise.all([refreshServers(), refreshDirs()]);
  scanLocalCharts();          /* in the background; re-renders when it lands */
  for (const url of trial)
    if (!remote.find(r => r.url === url)?.ok) forgetServer(url);

  renderServers();
  renderDirs();
  renderResults("");
  refreshBackgrounds();

  if (boot.has("track")) command({ cmd: "track", key: boot.get("track") });
  if (boot.has("t")) command({ cmd: "seek", time: boot.get("t") });
})();

requestAnimationFrame(frame);
</script>
</body>
</html>
