  spane.style.setProperty("--smark", Math.round(band * .16) + "px");
  spane.style.setProperty("--sm", geo.paneMargin + "px");
  /* The pane is drawn against its own width, so a resize has to redraw it. */
  paneAt = "";
}

function placePreview(y, band) {
  preview.style.top = y + "px";
  preview.style.setProperty("--h", band + "px");
}

/* ── lyrics ─────────────────────────────────────────────────────────────
   No syllable map yet, so a line is one span: it lights while its own range
   is running, and the ball sweeps across it in that time. When the maps carry
   syllables this becomes the same landing-pad code the demo has. */
let pads = [], lastLine = -1, lastRest = false, lastLit = null, lastCue = -1;
let cueRight = null, cuePitch = 0;

const lineAt = i => lyricLines[clamp(i, 0, lyricLines.length - 1)];
const lineText = i =>
  (i >= 0 && i < lyricLines.length ? lyricLines[i].text : "");

/* Which line is on screen: the last one to have been promoted. */
function lineNow(t) {
  if (!lyricLines.length) return -1;
  let i = lyricLines.length - 1;
  while (i > 0 && t < lyricLines[i].promote) i--;
  return t < lyricLines[0].promote ? -1 : i;
}

/* When a line stops being on screen: the next line's promotion, or two seconds
   past the end for the last one. */
const handoff = i => (i + 1 < lyricLines.length ? lyricLines[i + 1].promote
                                                : lyricLines[i].t_end + 2);

/* Seconds from a line appearing until it is replaced. */
const lineHold = i => handoff(i) - lyricLines[i].t_start;

/* Is line i over, with the wait after it long enough to clear the row? */
const resting = (i, t) =>
  i >= 0 && lyricLines[i].rest != null && t >= lyricLines[i].rest;

/* The far end of the row; nothing may land past it. */
const rowEnd = () => Math.max(pads[0].x + 24, lyrics.clientWidth - 24);

/* Where the ball lands. Singing a line, that is where its sweep has got to by
   the time the next line takes over -- past the last word, because the ball
   keeps moving through the gap. Resting, the row is blank and the ball has the
   whole of it to cross, so it is the end of the row.

   Either way it is clamped to the row: extrapolating a two-second line across
   an eight-second wait used to put the catcher, and the ball chasing it, off
   the right of the screen. */
function catchX(i, rest) {
  if (rest) return rowEnd();
  const l = lyricLines[i];
  const span = Math.max(.2, l.t_end - l.t_start);
  return Math.min(rowEnd(), lerp(pads[0].x, pads[1].x, lineHold(i) / span));
}

function placeCatcher(i, rest) {
  if (!pads.length || i < 0) return;
  lyricCatch.style.left = catchX(i, rest) + "px";
  lyricCatch.style.top = pads[0].y + "px";
}

/* Resting, the current row is blank and the line that has just finished moves
   up to the past row -- which is what it now is. The lines ahead are the same
   either way: the next line to sing is still the next line to sing. */
function renderLine(i, rest) {
  const span = document.createElement("span");
  span.className = "line";
  span.textContent = (rest ? "" : lineText(i)) || "\u00a0";
  lyricCur.replaceChildren(span, cue);
  lyricPrev.textContent = lineText(rest ? i : i - 1);

  lyricAhead.replaceChildren(...Array.from({ length: state.nextLines }, (_, k) => {
    const el = document.createElement("div");
    el.className = "lyric side";
    el.textContent = lineText(i + k + 1);
    return el;
  }));

  lastLit = null;
  lastCue = -1;
  fitLines();
  measurePads();
  placeCatcher(i, rest);
}

/* Lines that no longer fit in the band are not drawn at all.

   The band is what is left once the surfaces below it have taken their space,
   so switching on the strum pane, or asking for more lines than the window is
   tall enough for, leaves room for fewer than were asked for. Letting the
   surplus spill was the wrong answer twice over: it ran over the chord row,
   and it showed a line in a place that means something else.

   The current line is never one of them: it is the line the display is for. So
   the past line goes first when the current line is the one being pushed out,
   since it is above and dropping it is what pulls the current line back in;
   otherwise the lines ahead go from the far end. The ball's headroom is the
   current line's own top margin, so what the past line hands back goes to the
   lines rather than to the hop. */
function fitLines() {
  const room = lyrics.clientHeight;
  if (!room) return;

  const ahead = [...lyricAhead.children];
  const show = (el, on) => { if (el) el.style.display = on ? "" : "none"; };
  ahead.forEach(el => show(el, true));
  show(lyricPrev, true);

  const top = () => lyrics.getBoundingClientRect().top;
  const over = el => el && el.getBoundingClientRect().bottom - top() > room + .5;

  /* The past line goes first when even the current line is being pushed out:
     it is above, so dropping it is what pulls the current line back in. */
  if (over(lyricCur)) show(lyricPrev, false);
  for (let k = ahead.length - 1; k >= 0 && over(ahead[k]); k--) show(ahead[k], false);

  fitWidths();
}

/* A line wider than the row is squeezed horizontally until it fits. The text
   gets narrower, not smaller, so the row keeps its height and the ball its
   zone; and the squeeze is measured against the unsqueezed width every time,
   so a resize never compounds it. */
function fitWidths() {
  const avail = lyrics.clientWidth - parseFloat(getComputedStyle(lyrics).paddingLeft) - 12;
  if (!(avail > 0)) return;
  for (const line of lyrics.querySelectorAll(".line")) {
    line.style.transform = "";
    const w = line.getBoundingClientRect().width;
    if (w > avail) line.style.transform = `scaleX(${(avail / w).toFixed(4)})`;
  }
}

/* Two points rather than a pad per syllable: where the line starts and where
   it ends. The ball rides between them. */
function measurePads() {
  const base = lyrics.getBoundingClientRect();
  const line = lyricCur.querySelector(".line");
  if (!line) { pads = []; return; }
  const r = line.getBoundingClientRect();
  const y = r.top - base.top;
  pads = [{ x: r.left - base.left, y }, { x: r.right - base.left, y }];
}

function updateCue(line, t) {
  const waiting = line ? line.t_start - t : 0;
  const dots = state.lineCue === "dots" && line && line.cued && waiting > 0
    ? clamp(Math.ceil(waiting / CUE_STEP), 0, CUE_DOTS) : 0;

  if (dots === lastCue) return;

  cue.replaceChildren(...Array.from({ length: dots }, () => {
    const dot = document.createElement("i");
    dot.className = "dot";
    return dot;
  }));

  if (dots > 0) {
    if (lastCue <= 0) {
      const r = cue.getBoundingClientRect(), base = lyrics.getBoundingClientRect();
      cueRight = r.right - base.left;
      cuePitch = r.width / dots;
    }
  } else {
    cueRight = null;
  }
  lastCue = dots;
}

/* Riding the countdown out, then one hop onto the first word so the ball
   arrives exactly as the line starts. */
function leadIn(dt, lead) {
  const head = w => cueRight - (w / CUE_STEP - .5) * cuePitch;
  return cueRight == null
    ? lerp(pads[0].x - LEAD_STEP * zoom(), pads[0].x, clamp(1 + dt / (lead || 1), 0, 1))
    : dt < -BOUNCE ? head(-dt)
    : lerp(head(BOUNCE), pads[0].x, clamp(dt / BOUNCE + 1, 0, 1));
}

/* Across the line while it is being sung, then on to the catcher. The run-out
   used to be the sweep extrapolated, which is right only while the ball has
   somewhere to go: a short line followed by a long wait sent it off the side of
   the screen. It now aims at the catcher, so the two agree by construction
   wherever that lands. */
function sweepAt(dt, span) {
  return lerp(pads[0].x, pads[1].x, span > 0 ? clamp(dt / span, 0, 1) : 1);
}

/* Both balls bounce on the same grid, so they agree about where the beat is.
   The hop is the one thing every stage has in common — the ball keeps time
   whether it is counting in, singing, running out, or crossing a blank row. */
const bob = () => arc(beatPhase(player.time)) * hopRoom() * num("bounce") * .6;

function updateLyrics(t) {
  const i = lineNow(t);
  const rest = resting(i, t);
  if (i !== lastLine || rest !== lastRest) {
    renderLine(i, rest);
    lastLine = i;
    lastRest = rest;
  }
  if (i < 0 || !pads.length) return;

  const line = lyricLines[i];
  const dt = t - line.t_start;
  const span = Math.max(.2, line.t_end - line.t_start);
  const to = handoff(i);
  const at = catchX(i, rest);

  updateCue(line, t);

  /* Four stages, and the ball is doing something different in each: riding the
     countdown in, sweeping the line, running out past its last word, or -- when
     the row has been cleared for a rest -- crossing the blank row from the
     margin to the return box, which is where the next line's countdown starts. */
  const ease = (from, t0, t1) =>
    lerp(from, at, clamp(t1 > t0 ? (t - t0) / (t1 - t0) : 1, 0, 1));

  /* Past the last word the ball keeps going if there is room, and never comes
     back: a line wider than the row used to send it to the wall and then
     bouncing backwards to the catcher. Now the wall is where it sticks, and it
     bounces in place there until the next line takes over. */
  const x = dt < 0        ? leadIn(dt, line.t_start - line.promote)
          : rest          ? ease(pads[0].x, line.rest, to)
          : t <= line.t_end ? sweepAt(dt, span)
          :                 Math.max(pads[1].x, ease(pads[1].x, line.t_end, to));

  lyricBall.style.left = Math.min(x, rowEnd()) + "px";
  lyricBall.style.top = (pads[0].y - bob() - ballSize()) + "px";

  const lit = dt >= 0 && t <= line.t_end;
  if (lit !== lastLit) {
    lyricCur.classList.toggle("on", lit);
    lastLit = lit;
  }
}

/* ── chords ─────────────────────────────────────────────────────────────
   A window of four chords, each box as wide as the chord is long, so the
   cursor can sweep the row linearly in time and still line up with the boxes.
   That is the proportional sizing an off-beat change needs; it comes free once
   the boxes stop being equal quarters of a bar. */
const ROW_BARS = 4;
let chordGroups = [], groupAt = -1, barLen = 2;
/* The start of the pass currently running. Everything drawn against the row --
   the cursor, the stroke boxes, the strum pane's own counter -- measures from
   here rather than from the row's first pass, which is what makes a repeated
   row repeat instead of scrolling. */
let groupFrom = 0, repMarks = [], lastRep = -1;

/* Everything the chord and strum surfaces own, back to nothing.

   Loading a track used to reset them a statement at a time at the call site,
   which drifted out of date every time a surface was added: the next-chord box
   and the ball's glyph both kept the last track's, and a track with no chords
   never drew over them, because updateChords() has nothing to draw and returns.
   One place, and it runs before the new track's data is worked out rather than
   after -- which is what lets it zero the arrays as well as the pixels. */
function clearChords() {
  chordGroups = [];
  strumLines = [];
  groupAt = -1;
  groupFrom = 0;
  repMarks = [];
  lastRep = -1;
  spanMax = 1;

  main.replaceChildren();
  preview.replaceChildren();
  main.style.gridTemplateColumns = "";
  preview.style.gridTemplateColumns = "";
  next.replaceChildren();

  paneAt = "";
  renderPane(null, 0);
  renderBeats(null);

  /* The marker and the next-chord box are hidden rather than emptied: there is
     no row for them to sweep and nothing coming next, and a ball parked
     mid-screen over an empty display is the most conspicuous leftover of the
     lot. renderGroup() brings them back when there is a row again. */
  ball.textContent = "";
  ball.classList.remove("strum");
  ball.style.display = cursor.style.display = next.style.display = "none";
}

/* Chords are grouped once, on load, and the row then holds a whole group at a
   time instead of shuffling along at every change. Groups never straddle a
   section, so what you memorise is "the four that open the chorus" rather than
   an arbitrary window that happened to line up that way. */
/* A row is four bars. A two-bar loop played four times is shown as four bars
   played twice, and an eight-bar phrase is two rows: four is what the eye
   takes in at once, so it is the unit whatever the phrase. The one exception
   is a phrase of exactly five or six bars, which is kept whole rather than
   split into four and a stub -- ten bars is 4, 4, 2, but six is six. */
const WHOLE_ROWS = [5, 6];
const MAX_REPS = 8;          /* more marks than this is a wall, not a count */

function groupChords() {
  const beats = sections[0]?.beatsPerBar || 4;
  barLen = (beatPeriod || BOUNCE) * beats;
  chordGroups = [];

  const bars = c => (c.t_end - c.t_start) / barLen;

  /* Split where the author already said to: a row written on one line, or a
     section. Repeats are looked for inside these and never across them --
     "the four that open the chorus" is not a repeat of the four that closed
     the verse even when the names line up. */
  const segs = [];
  {
    const sectionOf = t => sections.findIndex(s => t >= s.t_start && t < s.t_end);
    let run = [], inGroup = -1, inSection = -1;
    for (const c of chordLine) {
      const grp = c.group >= 0 ? c.group : -1;
      /* Chords written on one line take the section of their first chord.
         Sections are marked by ear and land a fraction of a bar off the changes
         they introduce; reading each chord's own section would shear
         "Em C G D" into "Em" and "C G D" at every boundary. */
      const sec = grp >= 0 && grp === inGroup ? inSection : sectionOf(c.t_start);
      if (grp !== inGroup || sec !== inSection) {
        if (run.length) segs.push(run);
        run = [];
        inGroup = grp;
        inSection = sec;
      }
      run.push(c);
    }
    if (run.length) segs.push(run);
  }

  /* How many chords from i make up exactly `want` bars, or 0 if none do. */
  const chordsFor = (seg, i, want) => {
    let n = 0, acc = 0;
    while (i + n < seg.length && acc < want - .05) acc += bars(seg[i + n++]);
    return Math.abs(acc - want) < .1 ? n : 0;
  };

  /* The n chords at i and at j are the same phrase: same names, same lengths.
     Lengths matter as much as names -- "Am G" over two bars and "Am G" over one
     are not the same phrase, and a player reading a repeat sign needs them not
     to be conflated. */
  const alike = (seg, i, j, n) => {
    if (j + n > seg.length) return false;
    for (let k = 0; k < n; k++)
      if (seg[i + k].name !== seg[j + k].name ||
          Math.abs(bars(seg[i + k]) - bars(seg[j + k])) > .1) return false;
    return true;
  };

  for (const seg of segs) {
    let i = 0;
    while (i < seg.length) {
      const repsOf = (m, cap = MAX_REPS) => {
        let r = 1;
        while (r < cap && alike(seg, i, i + r * m, m)) r++;
        return r;
      };

      /* A one- or two-bar phrase that keeps coming round is shown as itself
         with a count rather than folded into fours -- a vamp is a vamp. Only
         when the run is at least a row's worth, though, so a chord that merely
         happens twice is not pulled out of its row; and the shorter phrase wins
         a tie, since "E E" four times is E eight times. */
      let n = 0, reps = 1, cover = 0;
      for (const want of [1, 2]) {
        const m = chordsFor(seg, i, want);
        if (!m) continue;
        /* Compared uncapped, so a long vamp on one chord is not outscored by
           the same vamp read as pairs; the cap applies to what is drawn. */
        const r = repsOf(m, Infinity);
        if (r >= 2 && r * want >= ROW_BARS && r * want > cover) {
          n = m; reps = Math.min(r, MAX_REPS); cover = r * want;
        }
      }

      if (!n) {
        /* A segment that is exactly five or six bars is one row. Otherwise rows
           are four bars, and the last takes whatever is left -- so ten is
           4, 4, 2, and never 4, 6. */
        let remain = 0;
        for (let j = i; j < seg.length; j++) remain += bars(seg[j]);
        const whole = i === 0 && WHOLE_ROWS.find(w => Math.abs(remain - w) < .1);
        n = chordsFor(seg, i, whole || Math.min(ROW_BARS, remain));

        if (!n) {
          /* The chords do not land on the row's boundary: pack a row to fit,
             which is what every row used to be. */
          let acc = 0;
          while (i + n < seg.length && acc + bars(seg[i + n]) <= ROW_BARS + .05)
            acc += bars(seg[i + n++]);
          if (!n) n = 1;           /* a chord longer than a whole row still goes */
        }

        /* A row that comes round again is shown once and counted off. */
        reps = repsOf(n);
      }

      const g = seg.slice(i, i + n);
      g.reps = reps;
      g.starts = Array.from({ length: reps }, (_, r) => seg[i + r * n].t_start);
      g.at = g[0].t_start;
      g.span = g[n - 1].t_end - g[0].t_start;     /* one pass, not the whole run */
      g.to = seg[i + reps * n - 1].t_end;
      chordGroups.push(g);
      i += reps * n;
    }
  }

  chordGroups.forEach((g, i) => { g.i = i; });

  /* The widest *pass*, not the widest run: a phrase played four times is drawn
     once, so the ruler is the phrase. Still one seconds-per-pixel for the whole
     track -- a two-second chord is the same width wherever it appears -- and a
     shorter row simply stops early and leaves the tail empty. */
  spanMax = chordGroups.reduce((w, g) => Math.max(w, g.span), 0)
            || ROW_BARS * barLen;
}

/* A track with no chords still has bars. Where the map has beats and
   sections but nothing to put over them — a drum track — the chart is
   synthesised instead of left dark: one dim numbered box per bar, a row per
   few bars, laid on the recorded grid. So a loop has something that moves at
   the measure level — the row lights, the cursor crosses, the ball keeps the
   beat — and the drum transcription, when it lands, takes this spot. */
let ghostMode = false;   /* the chart is scaffolding, not the track's chords */

function ghostChords() {
  ghostMode = false;
  if (chordLine.length || beatGrid.length < 2) return;
  ghostMode = true;
  let gid = 100000;                  /* clear of the parser's group ids */
  const out = [];
  for (const s of sections) {
    const bpb = s.beatsPerBar || 4;
    const b0 = beatPos(s.t_start);
    /* Numbered through the track, not from 1 in every section, so the same
       bar has the same name here and on the loop programme's chart. */
    const base = Math.round(b0 / bpb);
    const bars = Math.round((beatPos(s.t_end) - b0) / bpb);
    for (let row = 0; row * ROW_BARS < bars; row++, gid++)
      for (let k = row * ROW_BARS; k < Math.min(bars, (row + 1) * ROW_BARS); k++)
        out.push({ t_start: beatTime(b0 + k * bpb), t_end: beatTime(b0 + (k + 1) * bpb),
                   name: String(base + k + 1), group: gid, ghost: true });
  }
  chordLine = out;
}

/* ── the loop ghost ─────────────────────────────────────────────────────
   With the buffer playing and no chords to put over it, the chart shows the
   programme instead: one dim box per measure of it, labelled with the
   track's measure number, four to a row. Queue "A" — one bar, measure 7 —
   three times and then "B" at measure 11, and the row reads 7 7 7 11, with
   the cursor walking the programme so the second pass lights the second 7.
   This chart lives in programme time; only the ball keeps reading the track
   clock, because the beats are wherever the record put them. */
let loopGhostOn = false;

/* The bars of a span, in track time: { w0, w1, bar } each, bar being the
   track's own measure number. Bars anchor to the section the span starts in
   — section starts are downbeats by construction — and number on from the
   bars before it. A partial bar at either edge is kept, as the slice it is. */
function barsIn(from, to) {
  const s = sections.find(x => from >= x.t_start - .001 && from < x.t_end);
  const bpb = s?.beatsPerBar || sections[0]?.beatsPerBar || 4;
  const anchor = s ? beatPos(s.t_start) : 0;
  const base = Math.round(anchor / bpb);
  const b0 = beatPos(from) - anchor, b1 = beatPos(to) - anchor;
  const out = [];
  for (let j = Math.floor(b0 / bpb + 1e-6); j * bpb < b1 - 1e-6; j++) {
    const bs = Math.max(b0, j * bpb), be = Math.min(b1, (j + 1) * bpb);
    const w0 = beatTime(bs + anchor), w1 = beatTime(be + anchor);
    if (w1 - w0 <= 1e-6) continue;
    out.push({ w0, w1, bar: base + j + 1 });
  }
  return out;
}

function loopGhost() {
  const ms = [];
  let acc = 0;
  for (const l of looper.buf) {
    for (const b of barsIn(l.from, l.to)) {
      const d = b.w1 - b.w0;
      ms.push({ p0: acc, p1: acc + d, bar: b.bar, wall: b.w0 });
      acc += d;
    }
  }

  chordGroups = [];
  for (let i = 0; i < ms.length; i += ROW_BARS) {
    const g = ms.slice(i, i + ROW_BARS).map(m => ({
      t_start: m.p0, t_end: m.p1, name: String(m.bar), wall: m.wall, ghost: true }));
    g.reps = 1;
    g.starts = [g[0].t_start];
    g.at = g[0].t_start;
    g.span = g[g.length - 1].t_end - g[0].t_start;
    g.to = g[g.length - 1].t_end;
    chordGroups.push(g);
  }
  chordGroups.forEach((g, i) => { g.i = i; });
  spanMax = chordGroups.reduce((w, g) => Math.max(w, g.span), 0) || 1;
}

/* Which chart the chord surfaces carry: the programme's while the buffer
   plays, the sections' otherwise — and only where the track has no chords
   of its own, which real chords always outrank. */
function refreshGhost() {
  if (!ghostMode) return;
  loopGhostOn = progLooping();
  if (loopGhostOn) loopGhost(); else groupChords();
  groupAt = -1;                /* whatever is on screen is the other chart's */
  lastRep = -1;
}

function chordBox(c, i) {
  const el = document.createElement("div");
  el.className = c.ghost ? "measure ghost" : "measure";
  /* The small time is a place in the record, so a programme box shows where
     its bar actually lives rather than its position in the programme. */
  el.innerHTML = `<small>${fmtTime(c.wall ?? c.t_start)}</small>` +
    `<span class="name">${chordHtml(c.name)}</span>`;
  return el;
}

/* One seconds-per-pixel for the whole track, set by the longest group. A
   shorter group simply stops early and leaves the rest of the row empty,
   rather than being stretched to fill it — so the cursor crosses the screen at
   the same rate all the way through, and a two-second chord looks like a
   two-second chord wherever it appears. */
let spanMax = 1;

function sizeRow(el, group) {
  const cols = group.map(c => Math.max(.15, c.t_end - c.t_start));
  const rest = spanMax - cols.reduce((a, b) => a + b, 0);
  if (rest > .05) cols.push(rest);          /* the empty tail */
  el.style.gridTemplateColumns = cols.map(d => d.toFixed(3) + "fr").join(" ");
}

function renderGroup(i) {
  const g = chordGroups[i], ahead = chordGroups[i + 1];
  ball.style.display = cursor.style.display = next.style.display = "";
  main.replaceChildren(...(g || []).map(chordBox));
  sizeRow(main, g || []);

  /* One rectangle per pass, emptying as the passes are spent. The same counter
     the strum pane carries, for the same reason: how many times round is the
     thing you cannot read off the chords themselves. */
  repMarks = [];
  lastRep = -1;
  repBox = null;
  if (g && g.reps > 1) {
    repBox = document.createElement("div");
    repBox.className = "repeats";
    repBox.style.left = (g.span / spanMax * 100) + "%";   /* where every pass ends */
    repBox.style.setProperty("--reps", g.reps);
    for (let k = 0; k < g.reps; k++)
      repMarks.push(repBox.appendChild(document.createElement("i")));
    main.append(repBox);       /* absolute, so it takes no cell of the grid */
  }

  preview.replaceChildren(...(ahead || []).map(chordBox));
  sizeRow(preview, ahead || []);
  /* "Next: bar 5" is not a cue anyone plays to; the boxes sit this one out. */
  const ghost = g && g[0].ghost;
  next.replaceChildren(...(ahead && !ghost ? ahead : []).map((c, k) => {
    const el = document.createElement("div");
    el.className = "next";
    el.innerHTML = (k ? "" : "<small>next</small>") + `<b>${chordHtml(c.name)}</b>`;
    return el;
  }));
  next.style.display = ghost ? "none" : "";
  placeNext();
  renderBeats(g);
}

/* The coming group starts where this one's pass ends -- the spot the ball
   lands on -- just past the repeat stack if there is one. Its boxes are on the
   row's own scale (a little narrower, so they read as coming rather than
   here), and as many follow the first as the room to the right holds. */
let repBox = null;

function placeNext() {
  const g = chordGroups[groupAt], ahead = chordGroups[groupAt + 1];
  if (!g || !ahead || !next.childElementCount) return;
  const scale = main.clientWidth / spanMax;
  let x = main.offsetLeft + g.span * scale + 4;
  if (repBox) x = main.offsetLeft + g.span * scale + repBox.offsetWidth / 2 + 6;
  const edge = stage.clientWidth - main.offsetLeft;
  next.style.left = Math.round(x) + "px";
  let used = 0;
  [...next.children].forEach((el, k) => {
    const w = Math.max(60, Math.round((ahead[k].t_end - ahead[k].t_start) * scale * .7));
    const fits = k === 0 || used + 6 + w <= edge - x;
    el.style.display = fits ? "" : "none";
    /* The first box always shows, squeezed to the room if it must. */
    el.style.width = (k === 0 ? Math.max(60, Math.min(w, Math.round(edge - x))) : w) + "px";
    if (fits) used += (used ? 6 : 0) + w;
  });
}

function updateChords(t) {
  if (!chordGroups.length) return;

  let i = 0;
  while (i < chordGroups.length - 1 && t >= chordGroups[i].to) i++;
  if (i !== groupAt) { groupAt = i; renderGroup(i); }

  const g = chordGroups[i];

  /* Which pass over the row, and where inside it. A row that repeats is drawn
     once and crossed once per pass, instead of the cursor crawling over the
     whole run at a quarter of the rate. */
  let r = 0;
  while (r < g.starts.length - 1 && t >= g.starts[r + 1]) r++;
  groupFrom = g.starts[r];
  if (r !== lastRep) {
    repMarks.forEach((m, k) => m.classList.toggle("spent", k < r));
    lastRep = r;
  }

  /* Against the fixed scale, not the row's own length. */
  const f = clamp((t - groupFrom) / spanMax, 0, 1);
  ball.style.left = cursor.style.left = (f * 100) + "%";

  /* Bounce or strum: the ball is on the beat, or it is the right hand. In hand
     mode it carries the stroke it is about to play, and the motion never stops
     even where the pattern has nothing to strike. With no pattern to follow
     there is no hand to draw, so it goes back to keeping the beat rather than
     standing still with nothing in it. */
  /* The ball keeps the record's own time even when the chart above it is
     drawn in programme time: the beats are wherever the take put them. */
  const here = state.chordCue === "hand" ? strumAt(player.time) : null;
  ball.classList.toggle("strum", !!here);
  ball.style.top = (here ? strumY(player.time, here) : bounceY(player.time)) + "px";
  const sl = here && here.pat.slots[Math.min(here.pat.n - 1,
                                             Math.floor(here.f * here.pat.n))];
  const glyph = sl ? sl.glyph || "·" : "";
  if (ball.textContent !== glyph) ball.textContent = glyph;
  updateBeats(t);

  /* Which chord of the pass is sounding, by how far into the pass we are --
     the row shows the first pass's chords, so later passes are read against
     their offsets. */
  const dt = t - groupFrom;
  let k = 0;
  while (k < g.length - 1 && dt >= g[k].t_end - g.at) k++;
  main.querySelectorAll(".measure").forEach((el, j) =>
    el.classList.toggle("current", j === k && t >= g.at));
}

/* The chord ball bounces on the map's beats, so it drifts with the record.
   Its size and zone come from the layout: in high bounce both are grown, so
   the same arc fills whatever room the missing lyric band left. */
function bounceY(t) {
  const ball = geo.ball || BALL;
  const room = Math.max(0, geo.zone - ball - 4);
  return geo.zone - ball -
    arc(beatPhase(t)) * clamp(room * .62 * num("bounce"), 0, room);
}

/* In hand mode the ball is not bouncing, it is strumming: it rides the same
   swing the pane's marker does, so the two agree about where the hand is. */
function strumY(t, here) {
  const ball = geo.ball || BALL;
  const room = Math.max(0, geo.zone - ball / 2 - 4);
  return geo.zone - ball / 2 +
    swingThrough(here.pat, here.f) * clamp(geo.zone * .5 * num("bounce"), 0, room);
}

/* ── strum pane ─────────────────────────────────────────────────────────
   One loop of the current pattern, drawn once and then only lit.

   The pane is a fixed ruler — PANE_BARS bars of it, always — and a loop takes
   as much of that as it is long: a one-bar pattern is a quarter of the pane and
   the marker crosses that quarter in a bar, at exactly the rate a four-bar
   pattern crosses the whole thing. Letting every loop fill the pane instead
   made the marker's speed mean nothing, and sent a one-bar loop tearing across
   the screen four times as fast as a four-bar one for no musical reason.

   Same argument as spanMax on the chord row, and the same consequence: a short
   loop stops early and leaves the tail of the pane empty rather than being
   stretched across it. */
const PANE_BARS = 4;
const barBeats = () => sections[0]?.beatsPerBar || 4;
const paneSpan = line => clamp(line.loop / (PANE_BARS * barBeats()), .05, 1);

let paneSlots = [], paneMark = null, paneCursor = null;
let paneMarks = [], paneAt = "", paneW1 = 1;
let lastPaneSlot = -1, lastPaneCell = null, lastPaneLoop = -1;

/* Every x in the pane goes through here, so slots, ties, bar lines, the
   cursor and the marker cannot land on different grids. Fractions are of the
   loop, not of the pane, so the ruler above is applied in exactly one place. */
const paneX = f => `calc(var(--sm) + (100% - 2 * var(--sm)) * ${f * paneW1})`;
const paneW = df => `calc((100% - 2 * var(--sm)) * ${df * paneW1})`;

const ROW = { down: "down", up: "up" };

function renderPane(pat, loops, w) {
  paneSlots = [];
  lastPaneSlot = -1;
  lastPaneCell = null;
  lastPaneLoop = -1;
  paneMarks = [];
  paneW1 = w || 1;

  if (!pat) {
    spane.replaceChildren();
    paneMark = paneCursor = null;
    return;
  }

  const n = pat.n, kids = [];

  /* Slots as large as the band allows, or as large as they fit, whichever is
     smaller: a one-bar loop in a quarter of the pane has four times the slots
     per inch that a four-bar one does, and the glyphs would run together. */
  const room = Math.max(0, spane.clientWidth - geo.paneMargin * 2);
  if (room > 0) {
    const pitch = room * paneW1 / n;
    spane.style.setProperty("--sglyph",
      Math.round(Math.min(geo.paneGlyph, pitch * .95)) + "px");
    spane.style.setProperty("--scount",
      Math.round(Math.min(geo.paneCount, pitch * .5)) + "px");
  }

  for (const sl of pat.slots) {
    const x = paneX(sl.s / n);

    /* A tie is the stroke before it, held: drawn as a line out of that stroke
       along its own row rather than as a mark of its own, because what the
       hand does here is nothing. */
    if (sl.tie && sl.from >= 0) {
      const tie = document.createElement("div");
      tie.className = "stie " + ROW[pat.slots[sl.from].dir];
      tie.style.left = paneX(pat.slots[sl.from].s / n);
      tie.style.width = paneW((sl.s - pat.slots[sl.from].s + .5) / n);
      kids.push(tie);
    } else if (sl.hit) {
      const el = document.createElement("div");
      /* The row follows the hand, not the glyph: an up-muted chunk still
         happens on the way up, and the four downs of "DdDd" are four downs. */
      el.className = "sslot " + ROW[sl.dir] + (sl.weight < 1 ? " light" : "");
      el.style.left = x;
      el.textContent = sl.glyph;
      paneSlots[sl.s] = el;
      kids.push(el);
    }

    const count = document.createElement("div");
    count.className = "scount";
    count.style.left = x;
    count.textContent = sl.s % 2 ? "&" : String(sl.s / 2 % 4 + 1);
    kids.push(count);
  }

  for (let b = 1; b < n / 8; b++) {
    const rule = document.createElement("div");
    rule.className = "sbar";
    rule.style.left = paneX(b * 8 / n);
    kids.push(rule);
  }

  /* How many times the loop comes round before the chords move on. */
  if (loops > 1) {
    const box = document.createElement("div");
    box.className = "repeats";
    for (let k = 0; k < loops; k++)
      paneMarks.push(box.appendChild(document.createElement("i")));
    kids.push(box);
  }

  /* The wrap point, which is the end of the loop rather than the end of the
     pane -- with a fixed ruler those are only the same thing at four bars. */
  const catcher = document.createElement("div");
  catcher.className = "catcher scatch";
  catcher.style.left = paneX(1);
  catcher.textContent = "↵";
  paneCursor = document.createElement("div");
  paneCursor.className = "scursor";
  paneMark = document.createElement("div");
  paneMark.className = "smark";

  spane.dataset.rows = state.strumPane;
  spane.replaceChildren(...kids, catcher, paneCursor, paneMark);
}

function updatePane(t) {
  const here = strumAt(t);

  /* The pane is rebuilt only when the pattern itself changes, so a loop that
     repeats for a whole verse is drawn once. */
  /* Keyed on the group too, because the repeat dots count loops inside it. */
  const key = here ? `${here.line.pat.src}@${here.line.from}#${groupAt}` : "";
  if (key !== paneAt || spane.dataset.rows !== state.strumPane) {
    paneAt = key;
    renderPane(here && here.pat, here ? loopsPerGroup(here.line) : 0,
               here ? paneSpan(here.line) : 1);
  }
  if (!here || !paneMark) return;

  const x = paneX(here.f);
  paneCursor.style.left = x;
  paneMark.style.left = x;
  /* Split mode reads the swing as the row it is heading for, hand mode as the
     hand's own path through the strings. One motion, two projections. */
  const swing = clamp(geo.paneSwing * num("bounce"), 0, geo.paneRoom);
  paneMark.style.top = state.strumPane === "hand"
    ? `calc(var(--mid-y) + ${(swingThrough(here.pat, here.f) * swing).toFixed(1)}px)`
    : `calc(var(--mid-y) + ${(swingToward(here.pat, here.f) * geo.paneRow).toFixed(1)}px)`;

  /* Which pass over the loop, counted from the start of the chord row. This
     used to count from the start of the strum line, which is the pass number
     since the top of the song -- so every rectangle was spent by the second bar
     and the counter looked like noise. */
  const pass = Math.floor((beatPos(t) - beatPos(groupFrom)) / here.line.loop);
  if (pass !== lastPaneLoop) {
    paneMarks.forEach((m, k) => m.classList.toggle("spent", k < pass));
    lastPaneLoop = pass;
  }

  const slot = Math.min(here.pat.n - 1, Math.floor(here.f * here.pat.n));
  if (slot === lastPaneSlot) return;
  lastPaneCell?.classList.remove("hit");
  lastPaneCell = paneSlots[slot] || null;
  lastPaneCell?.classList.add("hit");
  lastPaneSlot = slot;
}

/* How many times the loop comes round inside one chord row. Both are lengths
   in beats, so this is the honest count even where the row is not four bars. */
function loopsPerGroup(line) {
  const g = chordGroups[groupAt];
  if (!g || !(line.loop > 0)) return 0;
  /* One pass over the row, not the whole run: a repeated row is drawn once, and
     the chord row's own counter is what says how many times it comes round. */
  return Math.max(1, Math.round(
    (beatPos(g.at + g.span) - beatPos(g.at)) / line.loop));
}

/* ── stroke boxes on the chord row ──────────────────────────────────────
   The same strokes again, but laid out in the chord row's space rather than
   the pattern's: one box per stroke the row contains, at the spot the cursor
   will be when it is played. Rebuilt with the row, since that is the window
   they are drawn against. */
let beatCells = [], lastCell = null, lastSlot = -1;

function renderBeats(g) {
  beatCells = [];
  lastCell = null;
  lastSlot = -1;
  /* A programme chart's row is in programme time; the strum slots are in
     track time, and mixing the two would scatter the boxes. */
  if (!g || !strumLines.length || loopGhostOn) { beats.replaceChildren(); return; }

  /* The row's window, not the group's own extent: a short group leaves the
     tail of the row empty, and the strokes stop where the group does. */
  const t0 = g.at, t1 = g.at + spanMax;
  const cells = [];

  for (const line of strumLines) {
    const to = Math.min(t1, line.to);
    if (to <= Math.max(t0, line.from)) continue;
    let k = Math.max(0, Math.floor((beatPos(Math.max(t0, line.from)) - line.b0) / line.loop));
    for (; ; k++) {
      const at = slotTime(line, k, 0);
      if (at >= to) break;
      for (const sl of line.pat.slots) {
        if (!sl.hit) continue;
        const t = slotTime(line, k, sl.s);
        if (t < t0 || t < line.from || t >= to) continue;
        const cell = document.createElement("div");
        cell.className = "beat" + (sl.weight < 1 ? " light" : "");
        cell.style.left = ((t - t0) / spanMax * 100) + "%";
        cell.textContent = sl.glyph;
        beatCells.push({ t: t - t0, cell });   /* offset into the pass */
        cells.push(cell);
      }
    }
  }

  beatCells.sort((a, b) => a.t - b.t);
  /* Boxes are as wide as the gap between them allows, so an eighth-note
     pattern stays a row of boxes rather than one smear. */
  const gap = beatCells.length > 1
    ? beatCells.slice(1).reduce((m, c, i) => Math.min(m, c.t - beatCells[i].t), 1e9)
    : spanMax;
  const px = main.clientWidth * gap / spanMax;   /* .beats may be display:none */
  beats.style.setProperty("--bw", Math.round(clamp(px - 3, 10, geo.boxH * 1.6)) + "px");
  beats.replaceChildren(...cells);
}

function updateBeats(t) {
  /* Against the pass, not the track: the boxes were laid out from the row's
     first pass, and every pass after it lights the same boxes. */
  const dt = t - groupFrom;
  let i = -1;
  while (i + 1 < beatCells.length && dt >= beatCells[i + 1].t) i++;
  if (i === lastSlot) return;
  lastCell?.classList.remove("hit");
  lastCell = i >= 0 ? beatCells[i].cell : null;
  lastCell?.classList.add("hit");
  lastSlot = i;
}

/* ── melody pane ────────────────────────────────────────────────────────
   One voice line at a time, as a piano roll: pitch up the side, time across,
   a bar per note. Like the chord row, what is written on one line is what
   is on the screen, and like the strum pane it is drawn once per line and
   then only lit.

   The pane is laid out in beats, not seconds, and the cursor's place is
   beatPos(t) measured from the line's first beat: so the notes sit on the
   record's own grid and drift with it, and a line written as seven beats
   takes seven of the record's beats however the take pushes and pulls. The
   ruler is the longest line in the track, so a beat is the same width in
   every line and the cursor crosses at one rate all the way through. */
let voiceLines = [], keyLines = [], voiceRuler = 4, voiceAt = -1;
let vNotes = [], vCursor = null, vMark = null, vTrace = null, vScore = null;
let vLastNote = -2, vLastRow = null, vHold = null;

const voiceOn = () => state.voicePane !== "off" && voiceLines.length > 0;

/* A key: line carries the tonic for every voice line after it that leaves
   its own out. The last one before the line wins; none means the line must
   name its own. */
function tonicAt(t) {
  let k = null;
  for (const key of keyLines) if (key.t_start <= t) k = key; else break;
  return k ? k.midi : null;
}

function clearVoice() {
  voiceLines = [];
  keyLines = [];
  voiceAt = -1;
  vNotes = [];
  vLastNote = -2;
  vHold = null;
  vpane.replaceChildren();
  setGuide(null);
}

/* Lay each line on the beat grid, pair it with the lyric it is sung to, and
   choose the pitch window each one is shown in. */
function analyseVoices(list, keys) {
  keyLines = keys;
  voiceLines = [];
  for (const v of list) {
    const p = parseVoice(v.src, tonicAt(v.t_start));
    for (const q of p.problems) noteProblem(`voice line at ${fmtTime(v.t_start)}: ${q}`, null);
    if (!p.notes.length) continue;

    const b0 = beatPos(v.t_start);
    let acc = 0;
    const notes = p.notes.map(n => {
      const b = acc;
      acc += n.beats;
      return { midi: n.midi, beats: n.beats, b, t: beatTime(b0 + b), t1: beatTime(b0 + acc) };
    });
    const pitched = notes.filter(n => n.midi != null);
    if (!pitched.length) continue;

    const span = beatPos(v.t_end) - b0;
    const lo = Math.min(...pitched.map(n => n.midi)), hi = Math.max(...pitched.map(n => n.midi));
    voiceLines.push({
      t_start: v.t_start, t_end: v.t_end, src: v.src, tonic: p.tonic, notes, b0,
      total: acc, lo, hi, first: pitched[0],
      /* The span is the author's, and the sum of the durations is the
         author's too; when they disagree by more than a beat's slop, one of
         them is a typo, and it is worth saying which line. */
      mismatch: span > .05 && Math.abs(span - acc) > Math.max(.5, acc * .06)
    });
  }
  voiceLines.sort((a, b) => a.t_start - b.t_start);

  /* When the line comes on screen: the lyric it belongs to decides, so the
     roll and the words flip together and share one countdown. A line sung to
     no lyric -- a hummed intro -- keeps the lyric rule for itself. */
  voiceLines.forEach((v, i) => {
    const earliest = Math.max(i ? voiceLines[i - 1].t_end : 0, v.t_start - CUE_LEAD);
    v.cued = v.t_start - earliest >= CUE_MIN;
    v.promote = v.cued ? earliest : v.t_start;
    let best = 0, lyric = -1;
    lyricLines.forEach((l, j) => {
      const o = Math.min(l.t_end, v.t_end) - Math.max(l.t_start, v.t_start);
      if (o > best) { best = o; lyric = j; }
    });
    v.lyric = lyric;
    if (lyric >= 0) v.promote = lyricLines[lyric].promote;
    v.i = i;
  });
  if (voiceLines.length) voiceLines[0].promote = Math.min(voiceLines[0].promote, 0);

  /* The window: the line's range with a little air, at least an octave and a
     bit, and kept from one line to the next while it still fits, so the roll
     does not jump every line. Decided in file order, not playback order, so a
     seek lands on the same picture. */
  let win = null;
  for (const v of voiceLines) {
    if (!(win && v.lo >= win.lo + 1 && v.hi <= win.hi - 1)) {
      let lo = v.lo - 2, hi = v.hi + 2;
      while (hi - lo < 12) { lo--; hi++; }
      win = { lo, hi };
    }
    v.win = win;
  }

  voiceRuler = voiceLines.reduce((w, v) => Math.max(w, v.total), 0) || 4;
  for (const v of voiceLines) if (v.mismatch) {
    noteProblem(`The voice line at ${fmtTime(v.t_start)} adds up to ${v.total} beats but spans `
                + `${(beatPos(v.t_end) - v.b0).toFixed(1)}`,
                { message: "Its notes are laid on the beat grid from where the line starts, "
                         + "so the tail of the line is not where the line says it ends." });
  }
}

/* Which line is on screen: the last one to have been promoted, as lineNow. */
function voiceNow(t) {
  if (!voiceLines.length) return -1;
  let i = voiceLines.length - 1;
  while (i > 0 && t < voiceLines[i].promote) i--;
  return t < voiceLines[0].promote ? -1 : i;
}

const voiceHandoff = i => (i + 1 < voiceLines.length ? voiceLines[i + 1].promote
                                                     : voiceLines[i].t_end + 2);

function placeVoice(y, band) {
  vpane.style.display = band > 0 ? "" : "none";
  const nextH = Math.round(band * .17);
  geo.vGridH = band - nextH - 4;      /* the pane's border */
  geo.vBand = band;
  vpane.style.top = y + "px";
  vpane.style.height = band + "px";
  vpane.style.setProperty("--vgrid-h", geo.vGridH + "px");
  vpane.style.setProperty("--vnext-h", nextH + "px");
  vpane.style.setProperty("--vmark", Math.round(clamp(band * .1, 10, 22)) + "px");
  voiceAt = -1;                        /* rows are sized against the band */
}

/* Every x in the pane goes through here: beats from the line's start, as a
   fraction of the ruler. */
const voiceX = b => (b / voiceRuler * 100).toFixed(3) + "%";

/* Where a bar line falls inside the line: bars are counted from the section
   the line starts in, so a line that begins on a pickup still shows the
   downbeat where the record has it. */
function barPhase(v) {
  const beats = barBeats();
  const sec = sections.find(s => v.t_start >= s.t_start && v.t_start < s.t_end);
  const from = sec ? beatPos(sec.t_start) : (beatGrid.length ? 0 : v.b0);
  return mod(v.b0 - from, beats);
}

function renderVoice(i) {
  const v = voiceLines[i], ahead = voiceLines[i + 1];
  vNotes = [];
  vLastNote = -2;
  vLastRow = null;
  vHold = null;
  vpane.replaceChildren();
  if (!v) { vCursor = vMark = vTrace = vScore = null; return; }

  const { lo, hi } = v.win;
  const rows = hi - lo + 1;
  const rowH = geo.vGridH / rows;
  vpane.style.setProperty("--rows", rows);
  const row = m => (hi - m) / rows * 100 + "%";

  /* The keys down the side. Names on every row where they fit; on the Cs and
     the tonic where they do not, which is enough to find the octave. */
  const keys = document.createElement("div");
  keys.className = "vkeys";
  const grid = document.createElement("div");
  grid.className = "vgrid";
  for (let m = hi; m >= lo; m--) {
    const pc = mod(m, 12);
    const k = document.createElement("div");
    k.className = "vkey" + (BLACK_KEY[pc] ? " black" : "") + (pc === 0 ? " c" : "")
                + (mod(m - v.tonic, 12) === 0 ? " tonic" : "");
    k.style.top = row(m);
    if (rowH >= 11 || pc === 0 || mod(m - v.tonic, 12) === 0)
      k.textContent = pc === 0 || rowH < 11 ? noteName(m) : NOTE_NAMES[pc];
    keys.append(k);

    const r = document.createElement("div");
    r.className = "vrow" + (BLACK_KEY[pc] ? " black" : "") + (pc === 0 ? " c" : "");
    r.style.top = row(m);
    grid.append(r);
  }

  /* Beat ticks, with the downbeats heavier; both run to the ruler's end so an
     empty tail still reads as time. */
  const phase = barPhase(v), beats = barBeats();
  for (let b = 0; b <= voiceRuler + .001; b++) {
    const tick = document.createElement("div");
    tick.className = mod(b + phase, beats) === 0 ? "vbar" : "vbeat";
    tick.style.left = voiceX(b);
    grid.append(tick);
  }

  v.notes.forEach((n, k) => {
    if (n.midi == null) return;
    const el = document.createElement("div");
    el.className = "vnote";
    el.style.left = voiceX(n.b);
    el.style.width = voiceX(n.beats);
    el.style.top = row(n.midi);
    vNotes[k] = el;
    grid.append(el);
  });

  /* Where the line hands off, at the end of its own beats rather than of the
     ruler. */
  const catcher = document.createElement("div");
  catcher.className = "vcatch";
  catcher.style.left = voiceX(v.total);
  catcher.textContent = "↵";
  grid.append(catcher);

  vTrace = document.createElement("canvas");
  vTrace.className = "vtrace";
  vCursor = document.createElement("div");
  vCursor.className = "vcursor";
  vMark = document.createElement("div");
  vMark.className = "vmark";
  grid.append(vTrace, vCursor, vMark);

  vScore = document.createElement("div");
  vScore.className = "vscore";

  /* The next line, small and dim: enough to see where it starts and which way
     it goes, which is what a singer wants to know before it arrives. */
  const nxt = document.createElement("div");
  nxt.className = "vnext";
  if (ahead) {
    const lab = document.createElement("small");
    lab.textContent = "next";
    nxt.append(lab);
    const span = Math.max(1, ahead.hi - ahead.lo);
    for (const n of ahead.notes) {
      if (n.midi == null) continue;
      const el = document.createElement("i");
      el.style.left = voiceX(n.b);
      el.style.width = voiceX(n.beats);
      el.style.top = (8 + (1 - (n.midi - ahead.lo) / span) * 78) + "%";
      nxt.append(el);
    }
  }

  vpane.append(keys, grid, nxt, vScore);
  traceReset(v);
}

/* The row a pitch sits on, in pixels down the grid. */
const rowY = (v, m) => (v.win.hi - m + .5) / (v.win.hi - v.win.lo + 1) * geo.vGridH;

/* Which note of the line is sounding at beat b: -1 before the first, the
   index of the note under b, or the last index once the line is over. */
function noteAt(v, b) {
  if (b < 0) return -1;
  let k = 0;
  while (k < v.notes.length - 1 && b >= v.notes[k + 1].b) k++;
  return k;
}

function updateVoice(t) {
  const i = voiceNow(t);
  if (i !== voiceAt) { voiceAt = i; renderVoice(i); }
  if (i < 0 || !vMark) { setGuide(null); return; }

  const v = voiceLines[i];
  const b = beatPos(t) - v.b0;
  const k = noteAt(v, b);
  const n = k >= 0 ? v.notes[k] : null;
  const sounding = n && n.midi != null && b < n.b + n.beats;

  /* Before the line, the marker waits at the left edge on the first note's
     row, keeping the beat; on the last beat it hops in and lands as the
     first note starts. After the line it rides out to the return mark. */
  const lead = v.first.t - t;
  let x, target;
  if (lead > 0) {
    x = lead < BOUNCE ? lerp(0, v.first.b, 1 - lead / BOUNCE) : 0;
    target = v.first.midi;
  } else if (b >= v.total) {
    x = v.total;
    target = vHold;
  } else {
    x = b;
    if (n && n.midi != null) vHold = n.midi;
    target = vHold ?? v.first.midi;
    /* Across a rest, drift to the next note's row over the rest, so the eye
       is already there when it lands. */
    if (n && n.midi == null) {
      const nx = v.notes.slice(k + 1).find(m => m.midi != null);
      if (nx && vHold != null)
        target = lerp(vHold, nx.midi, clamp((b - n.b) / n.beats, 0, 1));
    }
  }
  x = clamp(x, 0, voiceRuler);
  vCursor.style.left = vMark.style.left = voiceX(x);
  vCursor.style.display = lead > BOUNCE ? "none" : "";

  const hop = clamp(geo.vGridH * .18 * num("bounce"), 4, 30);
  const y = rowY(v, target) - arc(beatPhase(player.time)) * hop;
  vMark.style.top = y.toFixed(1) + "px";

  if (k !== vLastNote) {
    vNotes.forEach((el, j) => {
      el.classList.toggle("on", j === k && b < v.total);
      el.classList.toggle("done", j < k || b >= v.total);
    });
    vLastNote = k;
  }

  setGuide(sounding && player.playing ? n.midi : null);
  listenFrame(v, b, sounding ? n : null);
}

/* ── listening ──────────────────────────────────────────────────────────
   The singer, through the microphone: a pitch a frame, drawn behind the
   cursor as a trail on the roll, and counted against the note that should
   be sounding. YIN, as webui/voice uses it, on the analyser's own buffer.

   The microphone hears the song a little after the element played it, and
   the browser's input path adds more; the mic delay setting pulls the trail
   back by that much so a note sung on time lands on its bar. */
const mic = { ctx: null, analyser: null, stream: null, buf: null, node: null,
              smooth: 0, good: 0, midi: NaN };
let trail = [], scored = { hit: 0, of: 0 };

function audioCtx() {
  if (!mic.ctx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (Ctor) mic.ctx = new Ctor();
  }
  if (mic.ctx && mic.ctx.state !== "running") mic.ctx.resume().catch(() => {});
  return mic.ctx;
}

async function listen(on) {
  if (!on) {
    if (mic.stream) mic.stream.getTracks().forEach(tr => tr.stop());
    mic.node?.disconnect();
    mic.stream = mic.analyser = mic.node = null;
    mic.midi = NaN;
    return;
  }
  if (mic.stream) return;
  try {
    if (!navigator.mediaDevices?.getUserMedia)
      throw new Error("the microphone needs HTTPS or localhost");
    const ctx = audioCtx();
    if (!ctx) throw new Error("WebAudio is not available");
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    if (!state.listen) { stream.getTracks().forEach(tr => tr.stop()); return; }
    mic.stream = stream;
    mic.node = ctx.createMediaStreamSource(stream);
    mic.analyser = ctx.createAnalyser();
    mic.analyser.fftSize = 2048;
    mic.buf = new Float32Array(mic.analyser.fftSize);
    mic.node.connect(mic.analyser);
  } catch (e) {
    noteProblem("Could not open the microphone", e);
    command({ cmd: "set", name: "listen", value: false });
  }
}

/* The fundamental of a buffer, by the YIN difference function, or 0. */
function yin(x, rate, minF, maxF, threshold) {
  const n = x.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += x[i] * x[i];
  if (Math.sqrt(rms / n) < .006) return 0;

  const minTau = Math.max(2, Math.floor(rate / maxF));
  const maxTau = Math.min(n >> 1, Math.ceil(rate / minF));
  if (maxTau <= minTau) return 0;

  const d = yin.d && yin.d.length > maxTau ? yin.d : (yin.d = new Float32Array(maxTau + 1));
  const half = n >> 1;
  for (let tau = 1; tau <= maxTau; tau++) {
    let sum = 0;
    for (let i = 0; i < half; i++) { const q = x[i] - x[i + tau]; sum += q * q; }
    d[tau] = sum;
  }
  let run = 0, best = 0, bestV = Infinity;
  d[0] = 1;
  for (let tau = 1; tau <= maxTau; tau++) {
    run += d[tau];
    d[tau] = run ? d[tau] * tau / run : 1;
  }
  let tau = minTau;
  for (; tau <= maxTau; tau++) {
    if (d[tau] < threshold) {
      while (tau + 1 <= maxTau && d[tau + 1] < d[tau]) tau++;
      best = tau;
      break;
    }
    if (d[tau] < bestV) { bestV = d[tau]; best = tau; }
  }
  if (tau > maxTau && bestV >= .45) return 0;
  if (!best) return 0;
  let bt = best;
  if (best > 1 && best < maxTau) {
    const s0 = d[best - 1], s1 = d[best], s2 = d[best + 1];
    const den = 2 * (2 * s1 - s2 - s0);
    if (Math.abs(den) > 1e-9) bt = best + (s2 - s0) / den;
  }
  return rate / bt;
}

/* The pitch being sung right now, as a fractional MIDI number, or NaN. Held
   a quarter second past the last confident reading so a breath does not
   break the trail. */
function sungPitch() {
  if (!mic.analyser) return NaN;
  mic.analyser.getFloatTimeDomainData(mic.buf);
  const f = yin(mic.buf, mic.ctx.sampleRate, 65, 1200, .15);
  const now = performance.now();
  if (f > 0) {
    const m = 69 + 12 * Math.log2(f / 440);
    mic.smooth = mic.good && Math.abs(m - mic.smooth) < 1 ? mic.smooth * .5 + m * .5 : m;
    mic.good = now;
    mic.midi = mic.smooth;
  } else if (now - mic.good > 250) mic.midi = NaN;
  return mic.midi;
}

function traceReset(v) {
  trail = [];
  scored = { hit: 0, of: 0 };
  if (!vTrace) return;
  const dpr = devicePixelRatio || 1;
  vTrace.width = Math.round(vTrace.clientWidth * dpr);
  vTrace.height = Math.round(vTrace.clientHeight * dpr);
  vTrace.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
  if (vScore) vScore.textContent = mic.analyser ? "mic" : "";
}

function listenFrame(v, b, note) {
  if (!mic.analyser || !vTrace) return;
  const m = sungPitch();
  if (!(vTrace.width > 0)) traceReset(v);

  /* The reading is of a moment slightly before now. */
  const bs = beatPos(player.time - num("micOffset") / 1000) - v.b0;
  const heard = !isNaN(m) && bs >= 0 && bs <= v.total;
  if (heard) {
    trail.push({ b: bs, m });
    if (trail.length > 1500) trail.shift();
  }

  /* Score the note that should be sounding at the moment heard, not at now:
     a note is a hit while what was sung sits within a quarter tone of it. */
  const at = noteAt(v, bs);
  const should = at >= 0 && v.notes[at].midi != null && bs < v.notes[at].b + v.notes[at].beats
    ? v.notes[at] : null;
  let hit = false;
  if (should && player.playing) {
    scored.of++;
    hit = heard && Math.abs(m - should.midi) <= .5;
    if (hit) scored.hit++;
  }
  if (note) vNotes[v.notes.indexOf(note)]?.classList.toggle("hit", hit);

  const g = vTrace.getContext("2d");
  const w = vTrace.clientWidth, h = vTrace.clientHeight;
  g.clearRect(0, 0, w, h);
  g.fillStyle = getComputedStyle(vpane).getPropertyValue("--fg") || "#fff";
  g.globalAlpha = .85;
  const rows = v.win.hi - v.win.lo + 1;
  const r = clamp(h / rows * .32, 1.5, 4);
  for (const p of trail) {
    const y = (v.win.hi - p.m + .5) / rows * h;
    if (y < -r || y > h + r) continue;
    g.beginPath();
    g.arc(p.b / voiceRuler * w, y, r, 0, TAU);
    g.fill();
  }

  if (vScore) {
    const pct = scored.of >= 10 ? Math.round(scored.hit / scored.of * 100) + "%" : "mic";
    if (vScore.textContent !== pct) vScore.textContent = pct;
    vScore.classList.toggle("live", heard);
  }
}

/* ── guide tone ─────────────────────────────────────────────────────────
   The melody, quietly, under the record: an oscillator that follows the
   note the cursor is on. Nothing is scheduled ahead; the frame moves it,
   and a frame's worth of lateness is well inside what a singer can use. */
const guide = { osc: null, gain: null, midi: null };

function setGuide(midi) {
  const vol = num("guideTone") / 100;
  if (midi == null || vol <= 0) {
    if (guide.gain && guide.midi != null) {
      const now = guide.osc.context.currentTime;
      guide.gain.gain.cancelScheduledValues(now);
      guide.gain.gain.setTargetAtTime(0, now, .02);
    }
    guide.midi = null;
    return;
  }
  const ctx = audioCtx();
  if (!ctx) return;
  if (!guide.osc) {
    guide.osc = ctx.createOscillator();
    guide.osc.type = "triangle";
    guide.gain = ctx.createGain();
    guide.gain.gain.value = 0;
    guide.osc.connect(guide.gain).connect(ctx.destination);
    guide.osc.start();
  }
  const now = ctx.currentTime;
  if (midi !== guide.midi) {
    guide.osc.frequency.setTargetAtTime(440 * Math.pow(2, (midi - 69) / 12), now, .005);
    /* A fresh attack on every note, so repeated notes read as repeated. */
    guide.gain.gain.cancelScheduledValues(now);
    guide.gain.gain.setTargetAtTime(0, now, .008);
    guide.gain.gain.setTargetAtTime(vol * .18, now + .03, .015);
    guide.midi = midi;
  }
}

function toggleVoice() {
  command({ cmd: "set", name: "voicePane",
            value: state.voicePane === "off" ? "roll" : "off" });
}

/* ── audio ──────────────────────────────────────────────────────────────
   The element is the clock. Everything else reads it. */
function attachAudio(url) {
  /* Tearing the old element down must not look like a failure. Assigning
     src = "" makes the browser resolve the empty string against the page and
     try to decode the HTML as media, which fires `error` a task later — by
     which time the handler below would blame the track just loaded, so every
     reload ended in "could not play" over a track that plays fine. Dropping
     the attribute and re-running load() abandons the resource silently. */
  if (audio) { audio.pause(); audio.removeAttribute("src"); audio.load(); }
  audio = null;
  player.time = 0;
  player.duration = 0;
  transport(false);

  if (!url) return;

  const el = audio = new Audio(url);
  el.preload = "auto";
  applyRate();                     /* a new element starts at 1× otherwise */
  /* A discarded element can still report pause or error after the swap, and
     what it has to say is about a track no longer on screen. */
  const live = fn => () => { if (el === audio) fn(); };
  el.addEventListener("loadedmetadata", live(() => {
    player.duration = el.duration || 0;
    drawTransport();
  }));
  el.addEventListener("play", live(() => transport(true)));
  el.addEventListener("pause", live(() => transport(false)));
  el.addEventListener("ended", live(() => transport(false)));
  el.addEventListener("error", live(() => {
    const why = MEDIA_ERR[el.error?.code] || "the browser gave no reason";
    const said = el.error?.message;
    noteProblem("Could not play " + track.title,
                { message: said ? `${why} — ${said}` : why });
  }));
}

/* Speed without pitch.
   Web Audio's playbackRate is a resampler: it plays the same samples on a
   different clock, so 0.75× also drops the track five semitones and you end up
   practising against an instrument that is out of tune with your own. The
   media element's own stretcher is the one that does what practising slowly
   means — preservesPitch keeps the key and stretches time — so the element
   stays the clock and this is a property on it rather than a graph.
   It is the default in every current browser; set it anyway, because a browser
   that has quietly turned it off would be silently transposing the track. */
const rate = () => num("speed");

function applyRate() {
  /* Before the early return: the readout answers for the speed whether or not
     there is a track loaded to apply it to. */
  drawTransport();
  if (!audio) return;
  audio.preservesPitch = true;
  if ("mozPreservesPitch" in audio) audio.mozPreservesPitch = true;
  if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = true;
  audio.playbackRate = rate();
  /* The engine stretches too — WSOLA, so the key holds at any rate. */
  if (looper.node) looper.node.port.postMessage({ cmd: "speed", v: rate() });
}

function seek(to) {
  const t = clamp(to, 0, player.duration || 0);
  if (looper.on && looper.mode === "engine" && looper.node) {
    /* The engine owns the clock: a seek lands inside the programme. */
    engineSeek(t);
    player.time = looperTime();
  } else {
    player.time = t;
    if (audio) audio.currentTime = t;
  }
  /* Jumping backwards must not leave the old line on screen. */
  lastLine = -2;
  drawTransport();
}

function transport(on) {
  if (on !== player.playing) {
    player.playing = on;
    if (!on) save();
  }
  play.disabled = player.playing || !audio;
  stop.disabled = !player.playing;
}

function drawTransport() {
  /* Looping, the bar and the clock answer for the programme; otherwise for
     the record. Position wraps with the buffer, which is the truth of it. */
  const looping = progLooping();
  const d = looping ? progTotal() : (player.duration || 0);
  const t = looping ? progTime(player.time) : player.time;
  const f = d ? clamp(t / d, 0, 1) : 0;
  tlFill.style.width = (f * 100) + "%";
  tlHead.style.left = (f * 100) + "%";
  clockOut.textContent = `${fmtTime(t)} / ${fmtTime(d)}`;

  /* Tempo is read off the grid rather than declared, so it tracks the take —
     and then off the speed as well, because what the readout is for is the
     count you are playing to, not the one on the record. */
  const r = rate();
  const bpm = bpmAt(player.time);
  bpmOut.textContent = bpm ? Math.round(bpm * r) : "";
  rateOut.textContent = r === 1 ? "" : "×" + String(+r.toFixed(2));
}

/* ── loops ──────────────────────────────────────────────────────────────
   A "loop:" range in the map is a passage worth going round — the drum
   pattern, the hard bar, the solo. The strip under the header offers one
   button per range; pressing one appends a copy of it to the loop buffer,
   the strip below that, and the buffer is the programme the player then
   goes round: add A three times and then B, and it plays A A A B A A A B…
   until the buffer is cleared.

   The going round itself is the beatmapper's trick (src/wsola.cpp), ported:
   the whole track is decoded to PCM and played through a WSOLA
   time-stretcher in an AudioWorklet, and a wrap just moves the read head —
   the overlap-add tail crossfades the seam, so there is no seek, no decoder
   gap, no click. It also keeps the speed control honest inside a loop:
   WSOLA is a stretcher, not a resampler, so any rate keeps the key.
   Where the worklet cannot be had, the old seek-back loop still runs —
   audibly worse, and it says so. */
const looper = {
  buf: [],           /* the programme: { name, from, to } in track seconds */
  trade: 0,          /* bars (or licks) per turn while trading, 0 when the buffer is hand-built */
  tradeUnit: "bar",  /* what a turn is counted in: "bar" or "lick" */
  seg: 0,            /* which entry is sounding */
  on: false,         /* buffer engaged: the engine (or fallback) owns playback */
  mode: "engine",    /* "engine" until proven otherwise, then "fallback" */
  playing: false,    /* engine transport, distinct from the element's */
  ctx: null, node: null, pending: null, forTrack: null, moduleReady: false,
  sampleRate: 0,
  srcBytes: null, srcUrl: null,  /* where the PCM can be had, set per track */
  lastF: 0, lastAt: 0,           /* last cursor report + arrival stamp */
  clockT: null, clockAt: 0,      /* the smoothed, forward-only display clock */
  hopStamp: 0,                   /* fallback: when the last hop was issued */
  decoding: false,
};

/* The worklet, as source: the page must work from file://, so the module is
   handed over as a Blob URL rather than fetched. Frames are planar rather
   than interleaved because that is what the worklet hands out, and the
   single loop range became a segment list: crossing one segment's end
   carries the overshoot into the next, and the last wraps to the first. */
const WSOLA_SRC = `
const FRAME = 2048, HOP = 512, SEARCH = 128;
const HANN = new Float32Array(FRAME);
for (let i = 0; i < FRAME; i++)
  HANN[i] = 0.25 * (1 - Math.cos(2 * Math.PI * i / FRAME));

registerProcessor("wsola", class extends AudioWorkletProcessor {
  constructor() {
    super();
    this.pcm = null; this.frames = 0;
    this.synth = null; this.stage = null;
    this.pending = 0; this.offset = 0; this.first = true;
    this.pos = 0; this.speed = 1;
    this.segs = []; this.seg = 0;
    this.port.onmessage = e => this.msg(e.data);
  }

  msg(m) {
    if (m.cmd === "pcm") {
      this.pcm = m.channels;
      this.frames = m.channels[0].length;
      this.synth = m.channels.map(() => new Float32Array(FRAME));
      this.stage = m.channels.map(() => new Float32Array(HOP));
      this.hardSeek(0);
    } else if (m.cmd === "segs") {
      this.segs = m.segs;
      if (!this.segs.length) return;
      /* Keep going if the head is still inside some segment — editing the
         programme should not restart the bar — otherwise fall to the start
         of the nearest surviving entry, tail preserved so the jump is a
         crossfade like any other. */
      const i = this.segs.findIndex(g => this.pos >= g.s && this.pos < g.e);
      if (i >= 0) this.seg = i;
      else {
        this.seg = Math.min(this.seg, this.segs.length - 1);
        this.pos = this.segs[this.seg].s;
      }
    } else if (m.cmd === "seek") {
      this.seg = m.seg;
      this.hardSeek(m.frame);
    } else if (m.cmd === "speed") {
      this.speed = m.v;
    }
  }

  hardSeek(frame) {
    this.pos = frame;
    this.pending = this.offset = 0;
    this.first = true;               /* nothing laid down to align against */
    if (this.synth) this.synth.forEach(b => b.fill(0));
    this.report();
  }

  report() { this.port.postMessage({ f: this.pos, seg: this.seg }); }

  /* Where the read head goes when it crosses the end of its segment: into
     the next entry of the programme, overshoot and all, so the groove keeps
     its phase across the seam. */
  advance() {
    if (!this.segs.length) return this.pos < this.frames;
    let g = this.segs[this.seg], guard = 0;
    while (this.pos >= g.e && guard++ < 64) {
      const over = this.pos - g.e;
      this.seg = (this.seg + 1) % this.segs.length;
      g = this.segs[this.seg];
      this.pos = g.s + over;
    }
    return true;
  }

  /* One synthesis hop: find the analysis frame near the nominal read head
     whose opening best matches the overlap tail already laid, window it in,
     ship the first HOP frames, keep the tail. src/wsola.cpp, step for step. */
  step() {
    const ch = this.pcm.length;
    const base = Math.floor(this.pos);

    let best = 0;
    if (!this.first && this.frames >= HOP) {
      let bc = -Infinity;
      for (let d = -SEARCH; d <= SEARCH; d++) {
        const cand = base + d;
        if (cand < 0 || cand + HOP > this.frames) continue;
        let corr = 0;
        for (let c = 0; c < ch; c++) {
          const src = this.pcm[c], ref = this.synth[c];
          for (let i = 0; i < HOP; i++) corr += ref[i] * src[cand + i];
        }
        if (corr > bc) { bc = corr; best = d; }
      }
    }

    let read = base + best;
    if (read < 0) read = 0;
    if (this.frames >= FRAME) read = Math.min(read, this.frames - FRAME);
    else read = 0;

    for (let c = 0; c < ch; c++) {
      const src = this.pcm[c], syn = this.synth[c];
      const n = Math.min(FRAME, this.frames - read);
      for (let i = 0; i < n; i++) syn[i] += src[read + i] * HANN[i];
      this.stage[c].set(syn.subarray(0, HOP));
      syn.copyWithin(0, HOP);
      syn.fill(0, FRAME - HOP);
    }

    this.pos += HOP * this.speed;
    this.pending = HOP;
    this.offset = 0;
    this.first = false;
    this.report();
  }

  process(_, outputs) {
    const out = outputs[0];
    if (!this.pcm || !out.length) return true;
    const n = out[0].length;
    let written = 0;
    while (written < n) {
      if (this.offset >= this.pending) {
        if (!this.advance()) break;
        this.step();
      }
      const take = Math.min(this.pending - this.offset, n - written);
      for (let c = 0; c < out.length; c++) {
        const src = this.stage[Math.min(c, this.stage.length - 1)];
        out[c].set(src.subarray(this.offset, this.offset + take), written);
      }
      written += take;
      this.offset += take;
    }
    return true;
  }
});
`;

function buildEngine() {
  looper.decoding = true;
  renderLoopBuf();
  return (async () => {
    const ctx = looper.ctx || (looper.ctx = new AudioContext());
    if (!looper.moduleReady) {
      const url = URL.createObjectURL(new Blob([WSOLA_SRC], { type: "application/javascript" }));
      try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
      looper.moduleReady = true;
    }
    /* decodeAudioData eats its buffer, so it gets a copy and the original
       stays good for the next track load or a retry. */
    let bytes;
    if (looper.srcBytes) bytes = looper.srcBytes.slice(0);
    else if (looper.srcUrl) bytes = await (await fetch(looper.srcUrl)).arrayBuffer();
    else throw new Error("no media to decode");
    const decoded = await ctx.decodeAudioData(bytes);

    if (looper.node) looper.node.disconnect();
    const node = looper.node = new AudioWorkletNode(ctx, "wsola",
      { numberOfInputs: 0, outputChannelCount: [2] });
    node.connect(ctx.destination);
    node.port.onmessage = e => {
      looper.lastF = e.data.f;
      looper.lastAt = performance.now();
      if (e.data.seg !== looper.seg) { looper.seg = e.data.seg; drawLoopStrips(); }
    };

    const chs = [];
    for (let c = 0; c < Math.min(2, decoded.numberOfChannels); c++)
      chs.push(new Float32Array(decoded.getChannelData(c)));
    node.port.postMessage({ cmd: "pcm", channels: chs }, chs.map(a => a.buffer));
    node.port.postMessage({ cmd: "speed", v: rate() });
    looper.sampleRate = decoded.sampleRate;
    return looper;
  })().catch(e => {
    noteProblem("Seamless looping unavailable — falling back to plain seeks", e);
    looper.mode = "fallback";
    looper.pending = null;
    return null;
  }).finally(() => { looper.decoding = false; renderLoopBuf(); });
}

function ensureEngine() {
  if (looper.mode !== "engine") return Promise.resolve(null);
  if (!looper.pending || looper.forTrack !== track.id) {
    looper.forTrack = track.id;
    looper.pending = buildEngine();
  }
  return looper.pending;
}

const segFrames = () => looper.buf.map(l => ({
  s: Math.round(l.from * looper.sampleRate),
  e: Math.round(l.to * looper.sampleRate)
}));

function engineSeek(t) {
  let i = looper.buf.findIndex(l => t >= l.from && t < l.to);
  if (i < 0) {
    /* Outside the programme — a nudge or a timeline drag past its edges —
       lands on the nearest entry rather than being ignored. */
    let bd = Infinity;
    looper.buf.forEach((l, k) => {
      const d = Math.min(Math.abs(t - l.from), Math.abs(t - l.to));
      if (d < bd) { bd = d; i = k; }
    });
    t = clamp(t, looper.buf[i].from, looper.buf[i].to - .001);
  }
  looper.seg = i;
  looper.lastF = t * looper.sampleRate;
  looper.lastAt = performance.now();
  looper.clockT = null;                  /* a seek snaps the display clock */
  looper.node.port.postMessage({ cmd: "seek",
    frame: Math.round(t * looper.sampleRate), seg: i });
  drawLoopStrips();
}

function enginePlay() {
  if (!looper.ctx) return;
  looper.playing = true;
  looper.lastAt = performance.now();
  looper.ctx.resume().catch(() => {});
  transport(true);
}

function engineHold() {
  looper.playing = false;
  if (looper.ctx) looper.ctx.suspend().catch(() => {});
  transport(false);
}

/* ── programme time ───────────────────────────────────────────────────────
   While the buffer plays, the transport shows the programme rather than the
   record: the parts laid end to end, position accumulating through them and
   wrapping when the whole programme comes round. The track's own clock stays
   underneath — beats, bpm, lyrics all still read real track time. */
const progLooping = () => looper.on && looper.buf.length > 0;
const progTotal = () => looper.buf.reduce((a, l) => a + (l.to - l.from), 0);

function progTime(t) {
  let acc = 0;
  for (let i = 0; i < looper.seg && i < looper.buf.length; i++)
    acc += looper.buf[i].to - looper.buf[i].from;
  const cur = looper.buf[looper.seg] || looper.buf[0];
  return acc + clamp(t - cur.from, 0, cur.to - cur.from);
}

/* Jump to a programme position: unlike a track seek, this knows *which pass*
   of a repeated part was meant — clicking in the third A goes to the third
   chip, not the first. */
function progGoto(pt) {
  let acc = 0;
  for (let i = 0; i < looper.buf.length; i++) {
    const l = looper.buf[i], d = l.to - l.from;
    if (pt < acc + d || i === looper.buf.length - 1) {
      const t = l.from + clamp(pt - acc, 0, Math.max(0, d - .001));
      looper.seg = i;
      if (looper.mode === "engine" && looper.node) {
        looper.lastF = t * looper.sampleRate;
        looper.lastAt = performance.now();
        looper.clockT = null;
        looper.node.port.postMessage({ cmd: "seek",
          frame: Math.round(t * looper.sampleRate), seg: i });
      } else if (audio) audio.currentTime = t;
      player.time = t;
      lastLine = -2;
      drawLoopStrips();
      drawTransport();
      return;
    }
    acc += d;
  }
}

/* The seams between the programme's parts, as marks on the timeline. Rebuilt
   with the strips: cheap, and always in step with the buffer. */
function drawTicks() {
  [...timeline.querySelectorAll(".tl-tick")].forEach(el => el.remove());
  if (!progLooping() || looper.buf.length < 2) return;
  const total = progTotal();
  let acc = 0;
  for (let i = 0; i < looper.buf.length - 1; i++) {
    acc += looper.buf[i].to - looper.buf[i].from;
    const el = document.createElement("div");
    el.className = "tl-tick";
    el.style.left = (acc / total * 100) + "%";
    timeline.append(el);
  }
}

/* The engine's clock. Cursor reports arrive ~86 times a second and the gaps
   are bridged by extrapolation — which can land a few milliseconds ahead of
   the next report, so the raw estimate steps backwards when one arrives.
   Time that runs backwards, however slightly, makes every threshold in the
   display flicker as it re-crosses: the beat boxes, the pass counter, the
   group under the cursor. So the raw estimate feeds a smoothed clock that
   only moves forward within a pass, leaning gently toward the reports; a
   genuine jump — the wrap, a seek — snaps. */
function looperTime() {
  if (!looper.sampleRate) return player.time;
  const now = performance.now();
  let raw = looper.lastF / looper.sampleRate;
  if (looper.playing) raw += (now - looper.lastAt) / 1000 * rate();

  const t0 = looper.clockT;
  if (t0 == null || Math.abs(raw - t0) > .25) {
    looper.clockT = raw;
  } else {
    const ideal = t0 + (looper.playing ? (now - looper.clockAt) / 1000 * rate() : 0);
    let t = ideal + (raw - ideal) * .1;
    if (looper.playing && t < t0) t = t0;
    looper.clockT = t;
  }
  looper.clockAt = now;
  return looper.clockT;
}

/* Every edit to the buffer lands here: it decides whether looping should be
   running at all, hands the engine the new programme, and moves the playhead
   only when a move was asked for. Engaging starts playback — pressing a
   section button means "play this round", not "arm something". */
function loopApply(seekTo) {
  renderLoopBuf();
  if (!looper.buf.length) return loopOff();

  const engaging = !looper.on;
  if (engaging) {
    looper.on = true;
    looper.seg = 0;
    /* The context has to be born inside the click for autoplay's blessing;
       by the time the decode lands the gesture may be spent. */
    if (looper.mode === "engine" && !looper.ctx) {
      try { looper.ctx = new AudioContext(); }
      catch (e) { looper.mode = "fallback"; }
    }
    if (audio) audio.pause();
  }

  (async () => {
    const eng = await ensureEngine();
    if (!looper.on || !looper.buf.length) return;    /* cleared while decoding */
    if (eng) {
      eng.node.port.postMessage({ cmd: "segs", segs: segFrames() });
      if (engaging || seekTo != null) engineSeek(seekTo != null ? seekTo : looper.buf[0].from);
      if (engaging) enginePlay();
    } else if (audio) {
      /* Fallback: the element stays the clock and frame() hops the seams. */
      looper.seg = Math.min(looper.seg, looper.buf.length - 1);
      if (engaging || seekTo != null) seek(seekTo != null ? seekTo : looper.buf[0].from);
      if (engaging) audio.play().catch(() => {});
    }
    drawLoopStrips();
  })();

  refreshGhost();
}

function loopOff() {
  if (!looper.on) return drawLoopStrips();
  const t = player.time;
  const was = looper.mode === "engine" ? looper.playing : player.playing;
  looper.on = false;
  looper.seg = 0;
  if (looper.mode === "engine") {
    /* Hand the clock back to the element where the engine left off. */
    looper.playing = false;
    if (looper.ctx) looper.ctx.suspend().catch(() => {});
    if (audio) {
      audio.currentTime = clamp(t, 0, player.duration || 0);
      if (was) audio.play().catch(() => {});
    }
  }
  drawLoopStrips();
  refreshGhost();
}

/* ── the loop buffer's edits ──────────────────────────────────────────── */
function bufAdd(l) {
  looper.trade = 0;
  looper.buf.push({ name: l.name, from: l.t_start, to: l.t_end });
  loopApply(looper.buf.length === 1 ? l.t_start : null);
}

function bufRemove(i) {
  looper.trade = 0;
  looper.buf.splice(i, 1);
  if (looper.seg >= i && looper.seg > 0) looper.seg--;
  loopApply(null);
}

function bufClear() {
  looper.trade = 0;
  looper.buf = [];
  loopApply(null);
}

/* ── trading licks ────────────────────────────────────────────────────────
   A track with "licks" and "backing" ranges is the same passage twice: once
   with a lead player on it, once bare. Trading turns the two into one
   programme that walks the passage bar by bar, taking each turn of `n` bars
   from alternate halves — bars 1–2 from the licks, bars 3–4 from the
   backing, bars 5–6 from the licks… — so the form keeps moving while the
   lead passes between the record and the room. It is a buffer like any
   other, so the engine wraps it, the ghost charts it and a chip lights as
   it plays; the only difference is that it is built, not queued, and a
   hand edit turns it back into a plain buffer. */
const tradeable = () =>
  tradeParts.some(p => p.role === "licks") && tradeParts.some(p => p.role === "backing");

function tradeProgramme(n) {
  const licks = tradeParts.find(p => p.role === "licks");
  const backing = tradeParts.find(p => p.role === "backing");
  if (!licks || !backing) return [];
  const bl = barsIn(licks.t_start, licks.t_end);
  const bb = barsIn(backing.t_start, backing.t_end);
  const count = Math.min(bl.length, bb.length);
  const buf = [];
  for (let k = 0, turn = 0; k < count; k += n, turn++) {
    const bars = turn % 2 ? bb : bl;
    const last = Math.min(k + n, count) - 1;
    const who = turn % 2 ? "you" : "lick";
    const span = last > k ? `${k + 1}–${last + 1}` : `${k + 1}`;
    buf.push({ name: `${who} ${span}`, from: bars[k].w0, to: bars[last].w1 });
  }
  return buf;
}

/* Trading by licks. The lead does not stop on the bar line — it runs over,
   comes in early, and on some tracks barely pauses — so a turn is a phrase
   as recorded rather than a count of bars. The passage plays through once,
