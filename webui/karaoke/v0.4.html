<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar / Voice Karaoke v0.4</title>
<style>
  * { box-sizing: border-box; }

  /* The theme hue lives on :root so every derived colour below is resolved
     against the *current* --fg; deriving them anywhere else would freeze
     them at the value --fg had on that element. */
  :root[data-theme="green"] { --fg: #46ff7a; }
  :root[data-theme="amber"] { --fg: #ffb43c; }
  :root[data-theme="red"]   { --fg: #ff4436; }
  :root[data-theme="blue"]  { --fg: #4fa8ff; }
  :root[data-theme="purple"] { --fg: #c06cff; }

  :root {
    --fg: #46ff7a;  /* fallback; the [data-theme] rules above win */
    --pad: 16px;
    --gap: 12px;
    --next-w: clamp(110px, 15vw, 240px);
    --disp-w: calc(100% - var(--pad) * 2 - var(--next-w));
    --dim: color-mix(in srgb, var(--fg) 52%, #000);
    --panel: color-mix(in srgb, var(--fg) 11%, #000);
    --hot: color-mix(in srgb, var(--fg) 34%, #000);
    --glow: color-mix(in srgb, var(--fg) 55%, transparent);
    --scan-pitch: 2px;   /* both overwritten by the settings sliders */
    --brightness: 100%;
    --bg-level: 40%;
    --chord-fill: 100%;  /* how solid the chord panels are, from the settings */
    --chord-panel: color-mix(in srgb, var(--panel) var(--chord-fill), transparent);
    --chord-hot: color-mix(in srgb, var(--hot) var(--chord-fill), transparent);
    --chord-back: color-mix(in srgb, #050705 var(--chord-fill), transparent);
    --lyric-zoom: 100;                       /* per cent, from the settings */
    --cur-size: calc(clamp(18px, 2.9vw, 38px) * var(--lyric-zoom) / 100);
    --side-size: calc(clamp(15px, 1.9vw, 25px) * var(--lyric-zoom) / 100);
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--fg);
    background: #040604;
    font: 700 14px/1.4 ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    letter-spacing: .1em;
    text-shadow: 0 0 7px var(--glow);
    filter: brightness(var(--brightness));
  }

  /* Chrome is upper-case CRT lettering; chord names keep their own case,
     since "Am" and "AM" are not the same chord. */
  header, .next small { text-transform: uppercase; }

  /* A subtree with its own phosphor colour. JS sets --fg here; the shades
     have to be mixed again at the same place, since the :root versions were
     already resolved against the :root hue and only inherit their result. */
  .tinted {
    --dim: color-mix(in srgb, var(--fg) 52%, #000);
    --panel: color-mix(in srgb, var(--fg) 11%, #000);
    --hot: color-mix(in srgb, var(--fg) 34%, #000);
    --glow: color-mix(in srgb, var(--fg) 55%, transparent);
    --chord-panel: color-mix(in srgb, var(--panel) var(--chord-fill), transparent);
    --chord-hot: color-mix(in srgb, var(--hot) var(--chord-fill), transparent);
    --chord-back: color-mix(in srgb, #050705 var(--chord-fill), transparent);
    color: var(--fg);
    text-shadow: 0 0 7px var(--glow);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    padding: 5px var(--pad);
  }

  /* Bare mode (M): nothing but the music. The header goes, and so does the
     cursor, which is the other thing on screen that reads as a control. */
  body.bare :is(header, .loopbar, .loopbuf, .cursor) { display: none !important; }

  h1 { margin: 0; font-size: 21px; }

  /* The title is a control, not just a heading: it opens the track menu. */
  .track { position: relative; }

  .title-btn,
  .title-btn:hover:not(:disabled) {
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg);
  }

  .title-btn { cursor: pointer; text-shadow: inherit; }
  .title-btn:hover:not(:disabled) { text-shadow: 0 0 12px var(--fg); }
  #titleTags { color: var(--dim); }

  button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }

  .switch { display: inline-flex; }

  button {
    padding: 6px 10px;
    border: 1px solid var(--dim);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    text-shadow: inherit;
  }

  /* Overlap the borders instead of dropping one: a button whose neighbour is
     disabled (35% opacity) was left with no visible edge of its own. */
  .switch button + button { margin-left: -1px; }
  .switch button.active, .switch button:hover:not(:disabled) { position: relative; z-index: 1; }

  button.active, button:hover:not(:disabled) {
    color: var(--fg);
    background: var(--hot);
    border-color: var(--fg);
    text-shadow: 0 0 10px var(--fg);
  }

  /* The inactive half of play/stop reads as an unlit key on the panel. */
  button:disabled {
    opacity: .35;
    cursor: default;
  }

  /* Big three-digit tempo readout, top right, as the prototype had it: the one
     number you play to should be legible from where you are standing, not set
     in the small print beside the clock. It is read off the beat grid rather
     than typed, so it is a readout and not an input any more, and it goes
     without a "bpm" beside it — three digits that size, next to a clock that
     is plainly a clock, are not going to be read as anything else, and the
     header has better uses for the width.
     flex: none, or it is the first thing squeezed out when the header gets
     tight and the timeline, which is flex: 1, takes the room. Tabular figures,
     or the row twitches as 99 becomes 100. */
  .bpm {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 5px;
    padding: 0 4px;
  }

  .bpm-num {
    font-size: clamp(30px, 4.4vw, 48px);
    line-height: .9;
    color: var(--fg);
    text-shadow: 0 0 14px var(--fg);
    font-variant-numeric: tabular-nums;
  }

  /* Playing off the record's own speed is worth saying out loud: it is what
     explains a readout that disagrees with the sleeve. */
  .bpm-rate { font-size: 12px; color: var(--fg); }

  /* ---- settings menu --------------------------------------------------- */

  .menu { position: relative; }

  /* The two icon buttons belong together, so they sit closer than the
     header's own gap would put them. */
  .tools { display: flex; align-items: center; gap: 5px; }

  .menu-btn {
    display: grid;
    gap: 4px;
    place-content: center;
    width: 40px;
    height: 34px;
    padding: 0;
  }

  .menu-btn i { width: 20px; height: 3px; background: currentColor; }

  .fs-ico {
    width: 18px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    width: 420px;
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 2px solid var(--fg);
    box-shadow: 0 0 24px -4px var(--fg);

    /* Semi-transparent, with the backdrop blurred so the display still reads
     through it without the labels having to fight the scanlines. */
    background: #050705b3;   /* 70% */
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }

  .panel[hidden] { display: none; }

  /* One row per setting: name on the left, control on the right, readout after
     it. Wider dialog, but each setting costs one line instead of two. */
  .setting {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    font-size: 12px;
  }

  .setting > label { flex: 1; min-width: 0; }
  .setting output { order: 3; min-width: 3.2em; text-align: right; color: var(--fg); }
  .setting .val { order: 3; }
  .setting .switch { flex: none; max-width: 262px; }

  /* A choice whose options are not known until something has been asked --
     and may be many -- so it is a list rather than a row of keys. */
  .setting select {
    flex: none;
    width: 262px;
    padding: 4px 6px;
    border: 1px solid var(--dim);
    border-radius: 0;
    background: var(--panel);
    text-shadow: inherit;
    text-transform: uppercase;
    outline: none;
    cursor: pointer;
  }

  .setting select:focus, .setting select:hover { border-color: var(--fg); }

  /* Second level: common settings first, then one collapsible group per
     display. The group body is its own element so `details` keeps its
     disclosure behaviour whatever display the panel grid gives it. */
  .panel details { border-top: 1px solid var(--dim); padding-top: 8px; }

  .panel summary {
    cursor: pointer;
    font-size: 12px;
    letter-spacing: .14em;
    color: var(--dim);
  }

  .panel details[open] summary { color: var(--fg); }
  .group { display: grid; gap: 9px; padding-top: 9px; }

  /* A readout paired with its reset button, in the row's right-hand cell. */
  .val { display: flex; align-items: center; gap: 8px; }

  .reset {
    padding: 1px 6px;
    font-size: 10px;
    letter-spacing: .08em;
  }

  .search {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--dim);
    background: var(--panel);
    outline: none;
  }

  .search:focus { border-color: var(--fg); }
  .search::placeholder { color: var(--dim); opacity: .7; }
  .note { width: 100%; text-align: right; font-size: 11px; color: var(--dim); opacity: .75; }
  .setting .switch button { flex: 1; padding: 5px 2px; font-size: 11px; }

  /* Mode icons. The circle is the moving marker, drawn where it meets the
     music; the lines are the rows the stroke glyphs sit on. So the icon says
     both what moves and what it lands on. */
  .ico {
    display: block;
    width: 100%;
    max-width: 40px;
    height: auto;
    margin: 0 auto 3px;
    overflow: visible;
  }

  .ico .wv { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .55; }
  .ico .row { stroke: currentColor; stroke-width: 1.6; }
  .ico .mk { fill: currentColor; }
  .ico .fr { fill: none; stroke: currentColor; stroke-width: 1.4; }

  /* Framing for the strum pane: one frame round the whole pane, or a box
     round each stroke. Transparent rather than none, so nothing resizes. */
  /* With each stroke in its own box the pane needs no surface of its own. */
  :root[data-strumframe="boxes"] .spane {
    border-color: transparent;
    background: none;
  }

  :root[data-strumframe="boxes"] .sslot {
    display: grid;
    place-items: center;
    min-width: 1.5em;
    min-height: 1.25em;
    border: 2px solid var(--dim);
    background: var(--chord-back);
  }

  :root[data-strumframe="boxes"] .sslot.hit { border-color: var(--fg); }

  input[type=checkbox] {
    appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 2px solid var(--dim);
    background: var(--panel);
    cursor: pointer;
  }

  input[type=checkbox]:checked {
    border-color: var(--fg);
    background: var(--fg);
    box-shadow: 0 0 10px var(--fg);
  }

  input[type=range] {
    appearance: none;
    flex: none;
    width: 168px;
    height: 20px;
    background: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-runnable-track {
    height: 8px;
    border: 1px solid var(--dim);
    background: repeating-linear-gradient(90deg, var(--dim) 0 3px, #0000 3px 8px);
  }

  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 20px;
    margin-top: -6px;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }

  input[type=range]::-moz-range-track {
    height: 8px;
    border: 1px solid var(--dim);
    background: repeating-linear-gradient(90deg, var(--dim) 0 3px, #0000 3px 8px);
  }

  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 20px;
    border: 0;
    border-radius: 0;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }

  /* ---- stage ---------------------------------------------------------- */

  .stage { position: relative; flex: 1; overflow: hidden; }

  /* The CRT look is three independent pieces: the monochrome palette and the
     text-shadow bloom above, a vignette (::before), and the scanline raster
     (::after) — a repeating gradient of one transparent line and one dark
     line, so --scan-pitch is the distance from one dark line to the next. */
  .stage::before,
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .stage::before {
    z-index: 19;
    background: radial-gradient(120% 90% at 50% 45%, #0000 55%, #000c);
  }

  .stage::after {
    z-index: 20;
    background: repeating-linear-gradient(
      #0000 0 calc(var(--scan-pitch) / 2),
      #000000a0 calc(var(--scan-pitch) / 2) var(--scan-pitch));
  }

  :root[data-scan="off"] .stage::after { display: none; }

  /* The background animation: first in the stage and under everything in it,
     so the vignette and the raster fall across it as they do across the rest
     of the picture. Dimmed by opacity against the stage's black rather than by
     a filter, which keeps a busy GIF from out-shouting the lyrics.

     A box with the picture as its background rather than an <img>: the box is
     the stage's size because its edges are pinned to the stage's, which no
     browser gets wrong, and cover-and-centre then crops a picture of the wrong
     shape evenly -- top and bottom, or left and right. An <img> has to be
     talked into the stage's height first, and where that fails it falls back
     to its own shape and loses only its bottom. */
  .backdrop {
    position: absolute;
    inset: 0;
    background: center / cover no-repeat;
    opacity: var(--bg-level);
    pointer-events: none;
    user-select: none;
  }

  .backdrop[hidden] { display: none; }

  /* Over a picture the phosphor has nothing dark to be bright against, so
     what is drawn on the stage gets a black edge and a shadow under it -- as
     well as its bloom, not instead of it, and only while a picture is actually
     showing: on plain black the stage is the CRT it always was.

     Two ways, because a filter shadows everything in its layer in proportion
     to how solid it is. Where a layer is all marks and no surface -- the
     lyrics, the playhead, the repeat counters -- that is what is wanted: the
     ball, the pads and the dots are not text, and one rule covers them all.
     But a faded chord panel is a surface, and three stacked shadows of a
     one-third-solid fill add up to a nearly solid black one behind it, which
     is the opposite of what fading it was for. So inside the panels the edge
     goes on the glyphs alone, as a text-shadow ahead of the bloom, in every
     rule that sets a bloom of its own. */
  :root[data-backdrop="on"][data-ink="on"] :is(.lyrics, .playhead, .spane .repeats) {
    filter: drop-shadow(0 0 1.5px #000) drop-shadow(0 0 1.5px #000)
            drop-shadow(0 2px 4px #000);
  }

  :root[data-backdrop="on"][data-ink="on"] {
    --ink: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000, 0 2px 4px #000;
  }

  :root[data-backdrop="on"][data-ink="on"] :is(.main-row, .preview, .beats, .spane, .next-row) {
    text-shadow: var(--ink), 0 0 7px var(--glow);
  }

  :root[data-backdrop="on"][data-ink="on"] :is(.measure.current, .sslot.hit, .next.lit) {
    text-shadow: var(--ink), 0 0 16px var(--fg);
  }

  :root[data-backdrop="on"][data-ink="on"] .beat.hit { text-shadow: var(--ink), 0 0 12px var(--fg); }
  :root[data-backdrop="on"][data-ink="on"] .measure.ghost .name { text-shadow: var(--ink); }

  /* The chord surfaces switch off together; the strum pane is independent. */
  :root[data-chords="off"] .main-row,
  :root[data-chords="off"] .preview,
  :root[data-chords="off"] .beats,
  :root[data-chords="off"] .next,
  :root[data-chords="off"] .playhead { display: none; }

  /* Holds however many lines-ahead are asked for, without becoming a row of
     its own: its children are the flex items. */
  #lyricAhead { display: contents; }

  /* ---- lyrics --------------------------------------------------------- */

  /* Three lines stacked at the top of the stage; the current one carries a
     landing pad above every syllable, and the ball flies in the gap left
     above it. JS sets the block's height. */
  /* Left-justified, with a gutter wide enough for a full eight-dot cue: 8
     dots + 7 gaps + the offset, in units of the side lines' font size. */
  .lyrics {
    position: absolute;
    top: 0;
    left: var(--pad);
    width: var(--disp-w);
    padding-left: calc(var(--side-size) * 4.8);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 4px;
    z-index: 5;
  }

  .lyric { position: relative; white-space: nowrap; }
  /* A line wider than the row is squeezed to the row (JS sets the scale) rather
     than run off the side, so its last word, and the ball, stay on screen. */
  .lyric .line { display: inline-block; transform-origin: left center; }

  .lyric.side {
    color: var(--dim);
    font-size: var(--side-size);
    opacity: .7;
  }

  .lyric.cur {
    margin-top: var(--hop-room);
    display: flex;
    align-items: flex-start;
    font-size: var(--cur-size);
  }

  /* A syllable is a column: landing pad on top, text below. */
  .syl {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    color: var(--dim);
    transition: color 90ms;
  }

  /* ♯ and ♭ sit too far from the letter, and the global letter-spacing pushes
     them further; pull them back and drop the tracking on the glyph itself. */
  .acc {
    margin-left: -.16em;
    margin-right: -.04em;
    letter-spacing: 0;
  }

  .syl.word { margin-left: .42em; }
  .syl:first-child { margin-left: 0; }  /* keep the line flush with the others */
  .syl.sung { color: var(--fg); }
  .syl.hit { text-shadow: 0 0 18px var(--fg); }

  .pad {
    width: 100%;
    height: 4px;
    margin-bottom: .18em;
    background: var(--dim);
  }

  /* A held syllable gets a narrower, broken pad — the ball bounces in place
     on it instead of arcing away. */
  .pad.sustain {
    width: 48%;
    background: repeating-linear-gradient(90deg, var(--dim) 0 4px, #0000 4px 8px);
  }

  .syl.sung .pad { background: var(--fg); }
  .syl.sung .pad.sustain { background: repeating-linear-gradient(90deg, var(--fg) 0 4px, #0000 4px 8px); }
  .syl.hit .pad { box-shadow: 0 0 12px var(--fg); }

  /* Countdown until the line starts: one dot per half beat, anchored by its
     right edge to the left of the text, so dots vanish from the left and the
     lyric itself never shifts. Sized against --side-size rather than the host
     line's own em, so the gutter fits it exactly whichever line carries it. */
  .cue {
    position: absolute;
    right: calc(100% + var(--side-size) * .6);
    top: 50%;
    display: flex;
    gap: calc(var(--side-size) * .22);
    transform: translateY(-50%);
  }

  .dot {
    width: calc(var(--side-size) * .33);
    height: calc(var(--side-size) * .33);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 6px var(--fg);
  }

  /* Guides off: plain karaoke, syllables still light up as they're sung. */
  :root[data-guide="off"] .pad,
  :root[data-guide="off"] .lyric-ball { display: none; }

  /* The block is bottom-anchored, so dropping the past line hands its space
     back to the lyrics rather than leaving a hole. */
  :root[data-past="off"] #lyricPrev { display: none; }

  .lyric-ball {
    position: absolute;
    width: calc(22px * var(--lyric-zoom) / 100);
    height: calc(22px * var(--lyric-zoom) / 100);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 20px var(--fg);
    transform: translateX(-50%);
  }

  /* One chord row moves or lights up — the one being played. Everything else
     about the chords is fixed, so no motion competes with now. */
  .main-row {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    display: grid;
    grid-template-columns: repeat(var(--bars, 4), 1fr);
    gap: var(--gap);
    z-index: 4;
  }

  /* The group queued up next: parked below the main row, left-justified,
     small and quiet. Static — it only changes at a group boundary. */
  .preview {
    position: absolute;
    left: var(--pad);
    width: calc(var(--disp-w) * .38);
    display: grid;
    grid-template-columns: repeat(var(--bars, 4), 1fr);
    gap: 6px;
    opacity: .5;
  }

  .preview .measure { border-width: 1px; }
  .preview small { display: none; }

  .measure {
    position: relative;
    height: var(--h);
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 2px solid var(--dim);
    background: var(--chord-panel);
    font-size: calc(var(--h) * .42);
  }

  .name { white-space: nowrap; }

  .measure small {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 11px;
    opacity: .55;
  }

  .main-row .measure {
    color: var(--dim);
    font-size: calc(var(--h) * .58);
    transition: background 120ms, border-color 120ms, color 120ms;
  }

  .main-row .measure.current {
    color: var(--fg);
    border-color: var(--fg);
    background: var(--chord-hot);
    text-shadow: 0 0 16px var(--fg);
  }

  /* Repeat counter in the last bar: one rectangle per pass, emptying from the
     left as passes are spent. It follows the bar's own colour so it stays
     part of the bar rather than a second thing to watch. */
  .repeats {
    position: absolute;
    right: 10px;
    bottom: 9px;
    display: flex;
    gap: 6px;
  }

  .repeats i {
    width: 15px;
    height: 22px;
    border: 3px solid currentColor;
    background: currentColor;
  }

  .repeats i.spent { background: none; }

  /* On the chord row it is the thing the ball lands on: a stack of repeat
     signs at the end of the pass, one per time round, spent from the bottom
     up. The spent ones stay, faint, so a glance back still shows the total. */
  .main-row .repeats {
    top: 50%; bottom: auto; right: auto;
    transform: translate(-50%, -50%);
    flex-direction: column-reverse;
    gap: .3em;
    padding: .35em .4em;
    border: 2px solid var(--dim);
    background: var(--chord-panel);   /* the same glass as the chord boxes */
    color: var(--fg);
    /* Small: a sign, not a chord. Smaller still when there are many, so the
       stack never outgrows the row. */
    font-size: min(calc(var(--h) * .09), calc(var(--h) / var(--reps, 1) * .4));
    z-index: 5;
  }
  /* A repeat sign drawn in CSS -- two dots, a thin line, a thick line -- so it
     is the same glyph on every device rather than whatever the font has. */
  .main-row .repeats i {
    --sign:
      radial-gradient(circle, currentColor 0 .13em, #0000 .17em) 0 .22em / .34em .34em no-repeat,
      radial-gradient(circle, currentColor 0 .13em, #0000 .17em) 0 .64em / .34em .34em no-repeat,
      linear-gradient(currentColor, currentColor) .48em 0 / .12em 100% no-repeat,
      linear-gradient(currentColor, currentColor) .72em 0 / .28em 100% no-repeat;
    width: 1em; height: 1.2em;
    border: 0; padding: 0;
    background: var(--sign);
    transition: opacity 150ms;
  }
  .main-row .repeats i.spent { background: var(--sign); opacity: .18; }

  /* Same counter in the pane, but counting loops of the pattern inside one
     chord row rather than passes over the row. */
  .spane .repeats { top: 6px; bottom: auto; right: 8px; }
  .spane .repeats i { width: 9px; height: 14px; border-width: 2px; }

  /* One box per eighth-note slot the player has to act on, straddling the top
     edge of the chord row. Positioned in *time* — slot s of 32 sits at s/32
     of the row — which is the same linear space the playhead sweeps, so the
     ball crosses a box's centre exactly on the beat it belongs to. */
  .beats {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    pointer-events: none;
    z-index: 6;
  }

  .beat {
    position: absolute;
    top: 0;
    height: 100%;
    width: var(--bw);
    display: grid;
    place-items: center;
    border: 2px solid var(--dim);
    /* Opaque unless the panels have been faded: the chord row's edge runs
       behind it, and shows through as soon as this does not cover it. */
    background: var(--chord-back);
    color: var(--dim);
    font-size: calc(var(--bh) * .62);
    line-height: 1;
    transform: translateX(-50%);
  }

  .beat.light { font-size: calc(var(--bh) * .44); opacity: .78; }

  .beat.hit {
    color: var(--fg);
    border-color: var(--fg);
    background: var(--chord-hot);
    text-shadow: 0 0 12px var(--fg);
  }

  /* Strum is a three-way: nothing, boxes on the chord row, or its own pane.
     With the pane up the chord row keeps its cursor and bar highlight but
     loses the ball — one bouncing thing on screen at a time. */
  .beats, .spane { display: none; }
  :root[data-chordcue="boxes"] .beats,
  :root[data-chordcue="hand"]  .beats { display: block; }
  :root[data-chordcue="off"]   .ball  { display: none; }
  /* In high bounce the ball is the show: with nothing to sing and nothing
     strummed, it stays on even where the chord cue is off. */
  :root[data-highbounce]       .ball  { display: block; }
  :root:not([data-pane="off"]) .spane { display: block; }

  /* ---- strum pane ----------------------------------------------------- */

  .spane {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    border: 2px solid var(--dim);
    background: var(--chord-panel);
    z-index: 5;
  }

  /* One loop of the pattern, however many bars that is. Slots are placed by
     time across the pane, so the marker crosses each at its own moment. */
  .sslot {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: var(--sglyph);
    line-height: 1;
    color: var(--dim);
    transition: color 90ms;
  }

  /* data-rows, not data-guide: :root already carries a data-guide for the
     sing guide, and two meanings for one name is asking for trouble. */
  .spane[data-rows="split"] .sslot.up   { top: var(--up-y); }
  .spane[data-rows="split"] .sslot.down { top: var(--down-y); }
  .spane[data-rows="hand"]  .sslot      { top: var(--mid-y); }

  .sslot.hit { color: var(--fg); text-shadow: 0 0 16px var(--fg); }

  /* Weight is drawn as weight: a light stroke is a smaller, quieter glyph than
     a heavy one, so "DuDu" and "dudu" look as different as they sound without
     needing a second symbol for either. */
  .sslot.light { font-size: calc(var(--sglyph) * .6); opacity: .75; }

  /* A tie is not a stroke, so it is not a glyph: it is a line drawn out of the
     stroke it holds, along that stroke's own row. */
  .stie {
    position: absolute;
    height: 0;
    margin-left: calc(var(--sglyph) * .4);
    border-top: 2px solid var(--dim);
    opacity: .6;
  }

  .spane[data-rows="split"] .stie.up   { top: var(--up-y); }
  .spane[data-rows="split"] .stie.down { top: var(--down-y); }
  .spane[data-rows="hand"]  .stie      { top: var(--mid-y); }

  .scount {
    position: absolute;
    top: var(--count-y);
    transform: translate(-50%, -50%);
    font-size: var(--scount);
    color: var(--dim);
    opacity: .6;
  }

  .sbar {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--dim);
    opacity: .5;
  }

  .smark {
    position: absolute;
    width: var(--smark);
    height: var(--smark);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 20px var(--fg);
    transform: translate(-50%, -50%);
  }

  /* Where the phrase hands off. Placed at the exact spot the ball lands on the
     return, so it reads as the destination of the last bounce rather than as
     decoration at the end of the row. */
  .catcher {
    position: absolute;
    display: grid;
    place-items: center;
    min-width: 1.2em;
    padding: 0 .1em;
    border: 2px dashed var(--dim);
    color: var(--dim);
    line-height: 1.1;
    font-size: var(--cur-size);
    transform: translate(-50%, -100%);   /* bottom edge on the landing line */
  }

  .scatch {
    font-size: var(--sglyph);
    transform: translate(-50%, -50%);
  }

  .spane .scount { color: var(--dim); }

  .spane[data-rows="split"] .scatch { top: var(--down-y); }
  .spane[data-rows="hand"]  .scatch { top: var(--mid-y); }

  .scursor {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 3px dashed var(--fg);
    opacity: .45;
    transform: translateX(-50%);
  }

  /* ---- melody pane ---------------------------------------------------- */

  .vpane { display: none; }
  :root:not([data-voice="off"]) .vpane { display: block; }

  /* A piano roll of the line being sung: keys down the left, time across,
     one bar per note, the next line sketched underneath. Rows are a fraction
     of the grid so the window can be any size without a resize redraw. */
  .vpane {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    border: 2px solid var(--dim);
    background: var(--panel);
    z-index: 5;
    --vk: 46px;
    --rows: 13;
  }

  .vkeys {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--vk);
    height: var(--vgrid-h);
    border-right: 1px solid var(--dim);
    overflow: hidden;
  }

  .vkey {
    position: absolute;
    left: 0;
    right: 0;
    height: calc(100% / var(--rows));
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding-left: 5px;
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0;
    color: var(--dim);
    background: var(--hot);
  }

  .vkey.black { background: #000; }
  .vkey.c { border-top: 1px solid var(--dim); }
  .vkey.tonic { color: var(--fg); }

  .vgrid {
    position: absolute;
    left: var(--vk);
    right: 0;
    top: 0;
    height: var(--vgrid-h);
    overflow: hidden;
  }

  .vrow {
    position: absolute;
    left: 0;
    right: 0;
    height: calc(100% / var(--rows));
    box-sizing: border-box;
  }

  .vrow.black { background: color-mix(in srgb, var(--fg) 4%, #000); }
  .vrow.c { border-top: 1px solid var(--dim); opacity: .7; }

  .vbeat, .vbar {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--dim);
  }

  .vbeat { opacity: .25; }
  .vbar { opacity: .75; }

  .vnote {
    position: absolute;
    height: calc(100% / var(--rows));
    box-sizing: border-box;
    border: 1px solid #000;
    border-radius: 2px;
    background: var(--dim);
    transition: background 90ms, box-shadow 90ms;
  }

  .vnote.on { background: var(--fg); box-shadow: 0 0 14px var(--fg); }
  .vnote.on.hit { box-shadow: 0 0 24px var(--fg), 0 0 6px var(--fg); filter: brightness(1.35); }
  .vnote.done { opacity: .5; }

  .vcursor {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 3px dashed var(--fg);
    opacity: .45;
    transform: translateX(-50%);
  }

  .vmark {
    position: absolute;
    width: var(--vmark);
    height: var(--vmark);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 20px var(--fg);
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .vtrace {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .vcatch {
    position: absolute;
    top: 50%;
    display: grid;
    place-items: center;
    min-width: 1.2em;
    padding: 0 .1em;
    border: 2px dashed var(--dim);
    color: var(--dim);
    font-size: 14px;
    line-height: 1.1;
    transform: translate(-50%, -50%);
  }

  .vnext {
    position: absolute;
    left: var(--vk);
    right: 0;
    bottom: 0;
    height: var(--vnext-h);
    border-top: 1px solid var(--dim);
    overflow: hidden;
  }

  .vnext small {
    position: absolute;
    left: 6px;
    top: 2px;
    font-size: 9px;
    color: var(--dim);
    opacity: .8;
  }

  .vnext i {
    position: absolute;
    height: 2px;
    background: var(--dim);
    opacity: .75;
  }

  /* The microphone's verdict, top right: "mic" while it is listening and
     nothing has been sung yet, then how much of the line landed. */
  .vscore {
    position: absolute;
    right: 8px;
    top: 4px;
    font-size: 12px;
    color: var(--dim);
    z-index: 3;
  }

  .vscore.live { color: var(--fg); text-shadow: 0 0 10px var(--fg); }

  /* ---- playhead ------------------------------------------------------- */

  .playhead {
    position: absolute;
    left: var(--pad);
    width: var(--disp-w);
    pointer-events: none;
    z-index: 8;
  }

  .cursor {
    position: absolute;
    top: var(--ball-zone);
    bottom: 0;
    border-left: 4px dashed var(--fg);
    opacity: .6;
    transform: translateX(-50%);
  }

  .ball {
    position: absolute;
    width: var(--ball-size, 34px);
    height: var(--ball-size, 34px);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 26px var(--fg);
    transform: translateX(-50%);
  }

  /* Strum guide: the strumming hand keeps swinging whether or not it strikes,
     so only the glyph changes — the motion never stops. */
  .ball.strum {
    display: grid;
    place-items: center;
    border-radius: 0;
    background: none;
    box-shadow: none;
    font-size: 30px;
    line-height: 1;
    text-shadow: 0 0 14px var(--fg);
  }

  :root[data-playhead="off"] .playhead { display: none; }

  /* ---- next-chord margin ---------------------------------------------- */

  /* The coming group, from where the ball will land: the first box is where
     the row hands over, and more of the group follows it while there is room.
     JS places the row and sizes the boxes to the chord row's own scale. */
  .next-row {
    position: absolute;
    display: flex;
    gap: 6px;
    z-index: 6;
  }

  .next {
    flex: none;
    display: grid;
    place-content: center;
    gap: 4px;
    text-align: center;
    border: 2px dashed var(--dim);
    color: var(--dim);
    z-index: 6;
    transition: color 150ms, border-color 150ms;
  }

  .next.lit {
    color: var(--fg);
    border-color: var(--fg);
    border-style: solid;
    background: var(--chord-hot);
    text-shadow: 0 0 16px var(--fg);
  }

  .next b { font-size: calc(var(--h) * .46); font-weight: inherit; }
  .next small { font-size: 11px; opacity: .7; }


  /* ---- load dialog ----------------------------------------------------- */

  /* This is the one panel read at arm's length -- picking a track from behind
     an instrument, or off a phone on a stand -- so it takes the screen instead
     of hanging off the title button it opens from. Fixed rather than absolute
     for the same reason: it is no longer positioned against that button. */
  #trackPanel {
    position: fixed;
    top: 2.5vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(1200px, 95vw);
    height: 95vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px;
  }

  /* .panel[hidden] is two attributes to this rule's one id, so without this the
     dialog would be display:flex whether or not it was meant to be open. */
  #trackPanel[hidden] { display: none; }

  /* The list is the panel: everything else is a fixed strip above or below it,
     and the slack goes here. */
  #trackPanel .results { flex: 1; min-height: 0; max-height: none; }
  #trackPanel .result { font-size: clamp(15px, 1.9vw, 28px); padding: .26em .4em; gap: 16px; }
  #trackPanel .result i { font-size: .58em; }
  #trackPanel > label { font-size: 13px; color: var(--dim); }

  /* The search field, sized by its own text.

     .search carries flex:1 because it was written for a row -- the settings
     line it used to sit on -- and this panel is a column, where flex:1 means
     grow *downwards*. So it stretched to share the slack with the list and
     became a tall box with small type in it. Here it takes its natural height,
     the list keeps all the slack, and the padding is in em so the box is the
     size of what is typed in it rather than a fixed number of pixels around
     something much smaller. */
  #trackPanel > .search {
    flex: none;
    font-size: clamp(16px, 1.9vw, 28px);
    padding: .3em .45em;
  }

  /* ---- background picker (B) ------------------------------------------ */

  /* In the stage's top-left corner, so it sits under the header when there is
     one and at the very top when there is not. A search box over a grid of
     live previews; the pictures are the backgrounds themselves. */
  #bgPanel {
    top: 8px;
    left: var(--pad);
    width: min(760px, calc(100% - var(--pad) * 2));
    max-height: calc(100% - 16px);
    grid-template-rows: auto 1fr auto auto;
    overflow: hidden;
  }
  #bgPanel[hidden] { display: none; }
  #bgPanel > .setting { justify-content: flex-start; }
  #bgPanel > .setting > label { flex: none; }
  #bgPanel > .setting input[type=range] { flex: 1; }
  #bgPanel > .search { font-size: clamp(15px, 1.6vw, 22px); padding: .3em .45em; }
  #bgPanel > label { font-size: 13px; color: var(--dim); }
  .bggrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    min-height: 0;
    overflow-y: auto;
  }
  .bgtile {
    position: relative;
    aspect-ratio: 16 / 9;
    border: 2px solid var(--dim);
    background: #000 center / cover no-repeat;
    color: var(--dim);
    cursor: pointer;
    overflow: hidden;
  }
  .bgtile span {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 2px 6px;
    font-size: 12px;
    background: #050705b3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bgtile:hover, .bgtile.pick { border-color: var(--fg); color: var(--fg); }
  .bgtile.on { border-color: var(--fg); box-shadow: 0 0 12px var(--glow); color: var(--fg); }
  .bgtile.pick { box-shadow: inset 0 0 0 2px var(--fg); }

  .results { display: grid; gap: 2px; width: 100%; max-height: 190px; overflow-y: auto; align-content: start; }

  .result {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: baseline;
    padding: 5px 6px;
    border: 1px solid transparent;
    background: none;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
  }

  .result:hover, .result.on, .result.pick { border-color: var(--fg); background: var(--hot); color: var(--fg); }
  .result b { font-weight: inherit; }
  .result b em {
    font-style: normal;
    font-size: .5em;
    margin-left: 1.1em;
    color: var(--dim);
    opacity: .75;
  }
  .result i { font-style: normal; color: var(--dim); font-size: 11px; }
  .result.on b::after { content: " \25c2"; }

  /* What a track has to carry to be worth listing. Off is "everything", so an
     unfiltered library is the default and each box only ever narrows. */
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 18px;
    font-size: 13px;
    color: var(--dim);
  }

  .filters label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    letter-spacing: .12em;
  }

  .filters input { width: 15px; height: 15px; accent-color: var(--fg); cursor: pointer; }
  .filters label:has(input:checked) { color: var(--fg); }
  .filters .count { margin-left: auto; opacity: .75; }

  /* ---- transport bar --------------------------------------------------- */

  .timeline {
    flex: 1;
    min-width: 90px;
    height: 14px;
    position: relative;
    border: 1px solid var(--dim);
    background: var(--panel);
    cursor: pointer;
  }

  .tl-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--hot); }

  /* While the loop buffer plays, the bar is the programme laid end to end and
     these are the seams between its parts. */
  .tl-tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: var(--dim);
  }

  .tl-head {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 3px;
    background: var(--fg);
    box-shadow: 0 0 10px var(--fg);
    transform: translateX(-50%);
  }

  /* flex: none — otherwise these shrink away when the header gets tight and
     the timeline, which is flex: 1, takes the room. */
  .clock { flex: none; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .seek { padding: 4px 7px; font-size: 11px; }

  /* ---- loader ---------------------------------------------------------- */

  .sources { display: flex; gap: 6px; width: 100%; }
  .sources button { flex: 1; font-size: 11px; padding: 6px 4px; }

  .dirs { display: grid; gap: 3px; width: 100%; }

  .dir {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: baseline;
    font-size: 11px;
    color: var(--dim);
  }

  .dir button { padding: 1px 6px; font-size: 10px; }
  .badge { font-size: 10px; color: var(--dim); opacity: .75; }

  /* Why the track would not load. Full width of the panel and left-aligned:
     these are sentences, not labels. */
  .problems { display: grid; gap: 6px; width: 100%; }

  .problem {
    display: grid;
    gap: 2px;
    padding: 6px 8px;
    border: 1px solid var(--fg);
    background: var(--hot);
    font-size: 11px;
    text-align: left;
  }

  .problem b { font-weight: inherit; color: var(--fg); }
  /* --dim is tuned for reading against the page's near-black, and these lines
     sit on --hot instead, where it sinks into the background. */
  .problem span { color: color-mix(in srgb, var(--fg) 80%, #000); }

  /* ---- loop strips ------------------------------------------------------ */
  /* Two rows under the header: the map's "loop:" ranges, one button each, and
     the loop buffer they feed — the programme the player goes round. The
     rows' own display would beat the hidden attribute, so the empty state is
     spelled out. */
  .loopbar, .loopbuf {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 4px var(--pad);
    text-transform: uppercase;
  }

  .loopbar[hidden], .loopbuf[hidden] { display: none; }

  .loopbuf { padding-bottom: 8px; }

  .strip-label, .loopbuf .hint { font-size: 11px; color: var(--dim); }

  /* A chip mid-drag floats a shade lighter; the row reorders under it. */
  .loopbuf .chip { touch-action: none; }
  .loopbuf .chip.drag { opacity: .6; }

  /* Clearing is an aside, not another segment of the programme. */
  .loopbuf .clear { margin-left: auto; border-color: transparent; }

  /* Ghost measures: the chart a track with no chords still has. Bar numbers
     in the dim shade, so the grid reads as scaffolding rather than music. */
  .measure.ghost .name { color: var(--dim); text-shadow: none; }

  /* The one line being sung. No syllable map yet, so the whole line lights. */
  .lyric.cur .line { color: var(--dim); transition: color 90ms; }
  .lyric.cur.on .line { color: var(--fg); text-shadow: 0 0 18px var(--fg); }
</style>
</head>
<body>
  <header class="tinted">
    <div class="tools">
      <div class="menu">
        <button class="menu-btn" id="menuBtn" aria-label="Settings" aria-expanded="false">
          <i></i><i></i><i></i>
        </button>
        <div class="panel" id="panel" hidden></div>
      </div>

      <button class="menu-btn" id="fsBtn" aria-label="Fullscreen" title="Fullscreen (F)">
        <svg class="fs-ico" viewBox="0 0 18 14" aria-hidden="true">
          <path d="M1,5 V1 H6 M12,1 H17 V5 M17,9 V13 H12 M6,13 H1 V9"/>
        </svg>
      </button>
    </div>

    <div class="switch">
      <button id="play">Play</button>
      <button id="stop">Stop</button>
    </div>

    <div class="track">
      <h1>
        <button class="title-btn" id="titleBtn" aria-expanded="false"
                aria-haspopup="true"><span id="titleText"></span><span id="titleTags"></span></button>
      </h1>
      <div class="panel" id="trackPanel" hidden></div>
    </div>

    <button class="seek" id="back5" title="Back 5 seconds">−5</button>
    <div class="timeline" id="timeline">
      <div class="tl-fill" id="tlFill"></div>
      <div class="tl-head" id="tlHead"></div>
    </div>
    <button class="seek" id="fwd5" title="Forward 5 seconds">+5</button>
    <span class="clock" id="clock">0:00 / 0:00</span>
    <div class="bpm" title="Tempo — - and = change speed, \ back to the record">
      <span class="bpm-num" id="bpmOut"></span>
      <span class="bpm-rate" id="rateOut"></span>
    </div>
  </header>

  <div class="loopbar tinted" id="loopBar" hidden></div>
  <div class="loopbuf tinted" id="loopBuffer" hidden></div>

  <!-- Fallbacks for browsers without the File System Access API. These work
       everywhere, including from file://, but hold files only for the session. -->
  <input type="file" id="pickDir" webkitdirectory multiple hidden>
  <input type="file" id="pickFiles" multiple hidden>

  <div class="stage" id="stage">
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="panel tinted" id="bgPanel" hidden>
      <input class="search" id="bgSearch" type="search" placeholder="background — type to narrow, arrows to pick, Enter to set"
             autocomplete="off" spellcheck="false">
      <div class="bggrid" id="bgGrid"></div>
      <div class="setting"><label for="bgLevel">Level</label>
        <input type="range" id="bgLevel" min="5" max="100" step="5">
        <span class="val"><output id="bgLevelOut"></output></span></div>
      <label id="bgHint"></label>
    </div>

    <div class="lyrics tinted" id="lyrics">
      <div class="lyric side" id="lyricPrev"></div>
      <div class="lyric cur" id="lyricCur"><span class="cue" id="cue"></span></div>
      <div id="lyricAhead"></div>
      <div class="lyric-ball" id="lyricBall"></div>
      <span class="catcher" id="lyricCatch">↵</span>
    </div>

    <!-- Present but empty: the beatmaps have no chords yet. -->
    <div id="main" class="main-row tinted"></div>
    <div id="preview" class="preview tinted"></div>
    <div id="beats" class="beats tinted"></div>
    <div id="spane" class="spane tinted" data-rows="split"></div>
    <div id="vpane" class="vpane tinted"></div>

    <div class="next-row tinted" id="next"></div>

    <div class="playhead tinted" id="playhead">
      <div id="cursor" class="cursor"></div>
      <div id="ball" class="ball"></div>
    </div>
  </div>
<script>
/* ===========================================================================
   Karaoke v0.2 — the v1.2 shell over v0.1's loading and playback.

   The demo ran on a beat clock because it owned its own notation. A real
   beatmap has none of that yet: no tempo, no key, no chords, and lyrics timed
   in seconds. So this runs on seconds, taken from the audio element, and the
   chord surfaces are present but empty until the maps carry chords.

   State still comes in three kinds with three lifetimes — display settings
   saved globally, track settings saved per track, transport never saved — and
   everything that changes any of them still goes through command().
   =========================================================================== */

const $ = id => document.getElementById(id);
const root = document.documentElement;
const mod = (n, m) => ((n % m) + m) % m;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, t) => a + (b - a) * t;
const arc = t => 4 * t * (1 - t);
const TAU = Math.PI * 2;

const fmtTime = s => {
  if (!isFinite(s) || s < 0) s = 0;
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
};

/* ── timing, in seconds ─────────────────────────────────────────────────
   With no tempo there is nothing to beat against, so the guides run on a
   fixed rate: one bounce every half second, and a countdown that starts four
   seconds out at one dot per half second. When beatmaps carry a tempo these
   become derived rather than assumed. */
const BOUNCE = 0.5;         /* seconds per bounce */
const CUE_DOTS = 8;
const CUE_STEP = 0.5;       /* seconds per dot */
const CUE_LEAD = CUE_DOTS * CUE_STEP;
const CUE_MIN = 1.2;        /* a shorter gap isn't worth counting down */
const REST_MIN = 2;         /* blank row shorter than this would only flicker */

const SECTION_KINDS = ["intro", "verse", "chorus", "bridge", "solo", "outro",
                       "instrumental", "interlude", "pre-chorus", "refrain"];

/* ── strum notation ─────────────────────────────────────────────────────
   One character per eighth note. Case is weight — a capital is a full stroke,
   lowercase the same stroke played light — so "DuDu" and "dudu" are the same
   hand doing the same thing at two dynamics, and the pattern reads as itself
   rather than as a key that has to be looked up.

     D d  down       U u  up       M m  muted / percussive
     ^    tie: the last stroke rings on through this slot
     _    silence: nothing sounds here

   `dir` is the direction the hand travels, which is not always deducible from
   the glyph: a mute can be struck either way. Left null here and resolved per
   pattern by compileStrum(), because what makes a chunk an up-chunk is where
   the hand was on the slot before it. */
const STROKES = {
  D: { glyph: "↓", dir: "down", weight: 1,   hit: true  },
  d: { glyph: "↓", dir: "down", weight: .55, hit: true  },
  U: { glyph: "↑", dir: "up",   weight: 1,   hit: true  },
  u: { glyph: "↑", dir: "up",   weight: .55, hit: true  },
  M: { glyph: "✕", dir: null,   weight: 1,   hit: true  },
  m: { glyph: "✕", dir: null,   weight: .55, hit: true  },
  "^": { glyph: "",  dir: null, weight: 0,   hit: false, tie: true },
  "_": { glyph: "",  dir: null, weight: 0,   hit: false }
};

const flip = d => (d === "down" ? "up" : "down");

/* Resolve a written pattern into slots that know which way the hand is going.
   The rule is one half-swing per eighth: the hand alternates unless a stroke
   says otherwise, and a stroke that says otherwise wins. So "DuDu" alternates,
   "DdDd" is four downs — the hand has to recover between them, which is what
   makes it a different motion rather than the same one relabelled — and "M" or
   "m" simply takes whichever way the hand was already headed.

   Compiled patterns are cached: the same pattern is asked for once per frame
   and there are only ever a handful of distinct ones in a song. */
const strumCache = new Map();

function compileStrum(src) {
  const hit = strumCache.get(src);
  if (hit) return hit;

  /* Slot 0 falls on a beat, and the hand is on its way down on a beat. */
  let dir = "up";
  const slots = [...src].map((ch, s) => {
    const k = STROKES[ch] || STROKES._;
    dir = k.dir || flip(dir);
    return { ch, s, glyph: k.glyph, hit: !!k.hit, tie: !!k.tie,
             weight: k.weight, dir };
  });

  /* A tie belongs to the stroke it extends, so it can be drawn as one — and it
     is silent if nothing came before it to ring on. */
  slots.forEach((sl, i) => {
    if (!sl.tie) return;
    let j = i - 1;
    while (j >= 0 && !slots[j].hit) j--;
    sl.from = j >= 0 ? j : -1;
    if (j >= 0) sl.dir = slots[j].dir;
  });

  const pat = { src, slots, n: slots.length, beats: slots.length / 2,
                hits: slots.filter(s => s.hit) };
  strumCache.set(src, pat);
  return pat;
}

/* ── the swing ──────────────────────────────────────────────────────────
   The hand's path between two strokes, as one number: 0 at the strings, +1 at
   the bottom of a down-stroke's follow-through, −1 at the top.

   Everything about the motion falls out of the two strokes at either end of the
   gap. A down followed by an up is half a swing — through the strings, out the
   bottom, back up through them. A down followed by another down is a whole one,
   because the hand has to get back above the strings first: that recovery is
   the entire difference between "DuDu" and "DdDd", and it is why a pattern
   cannot be animated by a fixed sine wave once the patterns are written by
   hand. Long gaps keep the hand moving at the same eighth-note rate rather than
   drifting slowly across, since that is what a player's hand actually does. */
function halfSwings(gapSlots, sameDir) {
  /* One half-swing per eighth, forced to the parity the two ends demand: an
     even number of half-swings comes back the way it started, an odd number
     turns round. Ties go to the lazier hand. */
  const want = Math.max(1, gapSlots);
  const lo = sameDir ? 2 : 1;
  let h = Math.round(want / 2) * 2 + (sameDir ? 0 : 1);
  if (h - want >= 1) h -= 2;      /* on a tie, the smaller: the lazier hand */
  return Math.max(lo, h);
}

/* The gap the phase f (0..1 through one loop) sits in, wrapping round the end
   of the pattern so the last stroke leads back into the first. */
function strumGap(pat, f) {
  const H = pat.hits;
  if (!H.length) return null;
  let j = H.length - 1;
  for (let k = 0; k < H.length; k++) if (f >= H[k].s / pat.n) j = k;

  const a = H[j], b = H[(j + 1) % H.length];
  const f0 = a.s / pat.n;
  let f1 = b.s / pat.n;
  if (f1 <= f0) f1 += 1;                     /* wraps past the end of the loop */
  let at = f;
  if (at < f0) at += 1;                      /* before the first stroke of the loop */

  const gap = (f1 - f0) * pat.n;
  return { a, b, s: clamp((at - f0) / (f1 - f0), 0, 1),
           h: halfSwings(gap, a.dir === b.dir),
           sign: a.dir === "down" ? 1 : -1 };
}

/* Two readings of the same swing. `through` is the hand: zero when it is at the
   strings, so a stroke is the instant it crosses. `toward` is the row the
   stroke is written on: ±1 at each stroke, so the marker arrives at the glyph
   it is about to play. Same h, same sign — a quarter turn apart. */
function swingThrough(pat, f) {
  const g = strumGap(pat, f);
  if (!g) return 0;
  return g.sign * Math.sin(g.h * Math.PI * g.s) * (.6 + .4 * g.a.weight);
}

function swingToward(pat, f) {
  const g = strumGap(pat, f);
  if (!g) return 0;
  return g.sign * Math.cos(g.h * Math.PI * g.s);
}

/* v0.1's parser, unchanged in behaviour: "t_start t_end event", with lyric:
   lines and section keywords. Beat-relative times (B45) are still skipped —
   they need a beatmap to resolve, which is the next thing to arrive. */
/* ── voice notation ─────────────────────────────────────────────────────
   A "voice:" line is one phrase of the melody, written in RiffText: a tonic,
   a bar, and steps. A step is a chromatic interval from the tonic -- 0 is the
   tonic, 12 the octave above, -5 the fourth below -- or _ for a rest, and
   carries a duration that defaults to a quarter note:

     voice: E4 | 0,2e,4e,7h,_q,4q^e,2e

     w h q e s t   whole, half, quarter, eighth, sixteenth, thirty-second
     .             dotted:   q. is a beat and a half
     /N            divided:  e/3 is one of a triplet of eighths
     ^             tied:     q^e is one note held for a beat and a half
     ^e            as a step: the previous note held on for another eighth

   The tonic carries its octave, so a line is absolute pitch, which is what
   the roll and the microphone both need. A "key: E3" line supplies the tonic
   for every voice line after it that leaves its own out. Intervals rather
   than note names because that is what RiffText is, and it is what makes a
   transposition one number rather than a rewrite. A bracketed chord is
   accepted but sung as its first note, since the line is one voice. */
const PITCH_CLASS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const BLACK_KEY = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
const DURATIONS = { w: 4, h: 2, q: 1, e: .5, s: .25, t: .125 };   /* in beats */

const noteName = m => NOTE_NAMES[mod(m, 12)] + (Math.floor(m / 12) - 1);

/* "E4", "F#3", "Bb" -> MIDI number, or NaN. The octave defaults to 4. A key
   line's mode suffix ("Em", "Bbmaj") is ignored: only the tonic matters. */
function parsePitch(s) {
  const m = /^\s*([A-Ga-g])([#b]*)(\d)?\s*(?:m|maj|min|major|minor|dor|mix|lyd|aeo|loc)?\s*$/.exec(String(s));
  if (!m) return NaN;
  let n = PITCH_CLASS[m[1].toUpperCase()] + 12 * ((m[3] === undefined ? 4 : +m[3]) + 1);
  for (const a of m[2]) n += a === "#" ? 1 : -1;
  return n;
}

/* A duration at the start of s -- "q.", "e/3", "q^e" -- and what follows it.
   Null where s does not start with one; the caller then supplies the default,
   which is how a bare "0" is a quarter note. */
function parseDuration(s) {
  const re = /^([whqest])(\.?)(?:\/(\d+))?/;
  let beats = 0, rest = s, any = false;
  for (;;) {
    const m = re.exec(rest);
    if (!m) break;
    any = true;
    let d = DURATIONS[m[1]];
    if (m[2]) d *= 1.5;
    if (m[3]) d /= Math.max(1, +m[3]);
    beats += d;
    rest = rest.slice(m[0].length);
    if (rest[0] !== "^") break;          /* a tie joins the next duration on */
    rest = rest.slice(1);
  }
  return any ? { beats, rest } : null;
}

/* The steps of one line, as notes: { midi, beats } with a null midi for a
   rest. Problems are collected rather than thrown, so a typo in one line
   loses that line and nothing else. */
function parseVoice(src, tonicDefault) {
  const problems = [], notes = [];
  let tonic = NaN, s = src;

  const bar = src.indexOf("|");
  if (bar >= 0) {
    tonic = parsePitch(src.slice(0, bar));
    if (isNaN(tonic)) problems.push(`"${src.slice(0, bar).trim()}" is not a note name`);
    s = src.slice(bar + 1);
  } else if (tonicDefault != null) tonic = tonicDefault;
  else problems.push("no tonic on the line and no key: line before it");
  if (isNaN(tonic)) tonic = 60;

  let i = 0;
  const skip = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  const here = () => `"${s.slice(i, i + 8).trim()}"`;

  while (true) {
    skip();
    if (i >= s.length) break;
    let midi = null, extend = false;

    if (s[i] === "^") { extend = true; i++; }
    else if (s[i] === "_") i++;
    else if (s[i] === "[") {
      i++;
      const vals = [];
      for (;;) {
        skip();
        const m = /^-?\d+/.exec(s.slice(i));
        if (!m) break;
        vals.push(+m[0]);
        i += m[0].length;
        skip();
        if (s[i] === ",") i++; else break;
      }
      skip();
      if (s[i] !== "]") { problems.push(`missing ] after ${here()}`); break; }
      i++;
      if (vals.length > 1) problems.push(`the chord [${vals.join(",")}] is sung as its first note`);
      if (vals.length) midi = tonic + vals[0];
    } else {
      const m = /^-?\d+/.exec(s.slice(i));
      if (!m) { problems.push(`${here()}: expected an interval, _ or ^`); break; }
      midi = tonic + +m[0];
      i += m[0].length;
    }

    const d = parseDuration(s.slice(i));
    let beats = DURATIONS.q;
    if (d) { beats = d.beats; i = s.length - d.rest.length; }
    skip();
    if (i < s.length) {
      if (s[i] === ",") i++;
      else { problems.push(`${here()}: expected a duration or a comma`); break; }
    }

    if (extend) {
      const prev = notes[notes.length - 1];
      if (prev) { prev.beats += beats; continue; }
      midi = null;                       /* a tie with nothing before it rests */
    }
    notes.push({ midi, beats });
  }
  return { tonic, notes, problems };
}

function parseTimeseries(text) {
  const lyrics = [], sections = [], beats = [], chords = [], strums = [], loops = [];
  const voices = [], keys = [], parts = [], licks = [];
  const notes = [];   /* things worth telling the user about the file itself */
  let gid = 0;

  for (const rawLine of text.split("\n")) {
    /* A '#' only starts a comment at the start of a line or after whitespace.
       Cutting at the first '#' unconditionally eats every sharp: "chord: F#m7"
       silently becomes "chord: F", and nothing downstream can tell. Same rule
       as the C loader in lib/riffdsp/timeseries.cpp. */
    const ci = rawLine.search(/(^|[ \t])#/);
    const line = (ci >= 0 ? rawLine.slice(0, ci) : rawLine).trim();
    if (!line) continue;

    const m = line.match(/^(\S+)\s+(\S+)\s+(.*)/);
    if (!m) continue;
    if (/^B/i.test(m[1]) || /^B/i.test(m[2])) continue;

    const t_start = parseFloat(m[1]), t_end = parseFloat(m[2]);
    const event = m[3].trim();
    if (!isFinite(t_start) || !isFinite(t_end) || t_end < t_start) continue;

    /* A bare B is a beat marker: the recorded grid, drift and all. */
    if (event === "B") { beats.push(t_start); continue; }

    if (event.startsWith("lyric:")) {
      const text = event.slice(6).trim();
      if (text) lyrics.push({ t_start, t_end, text });
      continue;
    }

    /* "chords: G D C E" is a bar per chord across the span, and one group on
       screen. It is both shorthand and the grouping mechanism: what is written
       on one line is what you see on one row, which is the unit you actually
       memorise. A lone "chord:" keeps its explicit span, for changes that do
       not land on bar lines. */
    /* One keyword, however many names: "chords: G D C E" is a bar each across
       the span, and "chord: A A" is two bars of A rather than a chord called
       "A A". A single name is a plain span, and consecutive singles are free to
       share a row; anything written with several names is a row of its own. */
    if (event.startsWith("chord:") || event.startsWith("chords:")) {
      const names = event.slice(event.indexOf(":") + 1).trim().split(/\s+/).filter(Boolean);
      if (!names.length) continue;

      const d = (t_end - t_start) / names.length;
      names.forEach((name, k) => chords.push({
        t_start: t_start + k * d, t_end: t_start + (k + 1) * d, name,
        group: names.length > 1 ? gid : -1
      }));
      if (names.length > 1) gid++;
      continue;
    }

    /* "strum: DuDuDu" is one loop of the right hand, written in eighths. The
       span is the loop: where it starts and how long it takes to come round,
       which is what lets it be laid on the record's own beats rather than on a
       count. It then keeps repeating until the next strum line, so a song with
       one pattern needs one line. */
    if (event.startsWith("strum:")) {
      const src = event.slice(6).trim();
      const pattern = src.replace(/[\s|]+/g, "");   /* bar lines are decoration */
      if (!pattern) continue;
      const bad = [...new Set(pattern.split("").filter(c => !(c in STROKES)))];
      if (bad.length) {
        notes.push(`Strum pattern "${src}" has no stroke for ${bad.map(c => `"${c}"`).join(", ")}`);
        continue;
      }
      strums.push({ t_start, t_end, pattern });
      continue;
    }

    /* "voice: E4 | 0,2e,4e,7h" is one phrase of the melody in RiffText, and
       one line on the roll. "key: E3" is the tonic for every voice line after
       it that leaves its own out. Only the keyword is read here: the notes
       are read once the beat grid is known, in analyseVoices. */
    if (event.startsWith("voice:")) {
      const src = event.slice(6).trim();
      if (src) voices.push({ t_start, t_end, src });
      continue;
    }
    if (event.startsWith("key:")) {
      const midi = parsePitch(event.slice(4));
      if (isNaN(midi)) notes.push(`"${event}" is not a key: expected a note such as E or Bb3`);
      else keys.push({ t_start, midi });
      continue;
    }

    /* "loop: drums" marks a passage worth going round: the span is what
       repeats, the name is what goes on the button. Only the explicit
       keyword counts — anything else in the file is not a loop. */
    if (event.startsWith("loop:")) {
      const name = event.slice(5).trim();
      loops.push({ t_start, t_end, name: name || "loop " + (loops.length + 1) });
      continue;
    }

    /* "licks" and "backing" are the two halves of a trading track: the same
       passage twice, once with the lead playing over it and once without.
       Bar k of one answers bar k of the other, which is what lets the player
       hand the lead back and forth between the record and the person in
       the room. Anything after the keyword is a label. */
    const part = /^(licks|backing)\b[\s:]*(.*)$/.exec(event);
    if (part) {
      parts.push({ role: part[1], t_start, t_end, label: part[2].trim() });
      continue;
    }
    /* "lick" is one phrase of the lead, as played: pickup, tail and all,
       with no regard for the bar lines. Trading by licks takes its turns
       from these. */
    const lick = /^lick\b[\s:]*(.*)$/.exec(event);
    if (lick) {
      licks.push({ t_start, t_end, label: lick[1].trim() });
      continue;
    }

    for (const kind of SECTION_KINDS) {
      if (event === kind || event.startsWith(kind + ":") || event.startsWith(kind + " ")) {
        const rest = event.slice(kind.length).replace(/^[\s:]+/, "").trim();
        const meter = /@(\d+)\s*\/\s*(\d+)/.exec(rest);
        sections.push({ t_start, t_end, kind, label: rest,
                        beatsPerBar: meter ? +meter[1] : 4 });
        break;
      }
    }
  }

  lyrics.sort((a, b) => a.t_start - b.t_start);
  sections.sort((a, b) => a.t_start - b.t_start);
  chords.sort((a, b) => a.t_start - b.t_start);
  strums.sort((a, b) => a.t_start - b.t_start);
  loops.sort((a, b) => a.t_start - b.t_start);
  voices.sort((a, b) => a.t_start - b.t_start);
  keys.sort((a, b) => a.t_start - b.t_start);
  parts.sort((a, b) => a.t_start - b.t_start);
  licks.sort((a, b) => a.t_start - b.t_start);
  beats.sort((a, b) => a - b);

  /* When a line should appear, and whether that lead-in is long enough to
     count down: the same rule the demo used, in seconds. */
  lyrics.forEach((l, i) => {
    const earliest = Math.max(i ? lyrics[i - 1].t_end : 0, l.t_start - CUE_LEAD);
    l.cued = l.t_start - earliest >= CUE_MIN;
    l.promote = l.cued ? earliest : l.t_start;
  });
  if (lyrics.length) lyrics[0].promote = 0;

  /* A line stops being the current line when it stops being sung, not when the
     next one arrives. Where those are far apart -- an instrumental bar, a solo,
     the gap between verses -- leaving it up says "sing this" for eight seconds
     after it was over. So the line clears at its end and the row goes blank for
     the wait, which the ball crosses on its way to the return box. Below
     REST_MIN there is nothing to cross and the blank would only flicker, so
     short gaps keep the old behaviour: the line stays and the ball rides out
     past its last word. */
  lyrics.forEach((l, i) => {
    const next = i + 1 < lyrics.length ? lyrics[i + 1].promote : l.t_end;
    l.rest = next - l.t_end >= REST_MIN ? l.t_end : null;
  });

  return { lyrics, sections, beats, chords, strums, loops, voices, keys, parts, licks, notes };
}

/* Real accidental glyphs, kerned back against the letter they belong to. */
const accSpan = a => `<span class="acc">${a === "#" ? "♯" : "♭"}</span>`;
const chordHtml = name => String(name)
  .replace(/([A-G])([#b])/g, (_, note, a) => note + accSpan(a))
  .replace(/([#b])(\d)/g, (_, a, digit) => accSpan(a) + digit);

const PHOSPHOR = { green: "#46ff7a", amber: "#ffb43c", red: "#ff4436",
                   blue: "#4fa8ff", purple: "#c06cff" };
const COLOURS = [{ v: "green", label: "Green" },
                 { v: "amber", label: "Amber" },
                 { v: "red", label: "Red" },
                 { v: "blue", label: "Blue" },
                 { v: "purple", label: "Purple" }];

/* ── icons ──────────────────────────────────────────────────────────────
   One grammar: the wave is the marker's path through a bar, the circle is the
   marker drawn where it meets the music, and the short lines are the rows the
   stroke glyphs sit on. So an icon says both what moves and what it lands on. */

const DEF = Object.fromEntries(SETTINGS.map(d => [d.name, d]));

/* ── stores ───────────────────────────────────────────────────────────── */
const STORE = "riffhound.karaoke.v1";
const store = { display: {}, tracks: {}, stats: {}, servers: [], filters: {} };

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    for (const k of ["display", "tracks", "stats"])
      if (saved[k]) Object.assign(store[k], saved[k]);
    if (Array.isArray(saved.servers)) store.servers = saved.servers;
    if (saved.filters) Object.assign(store.filters, saved.filters);
  } catch (e) {}
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {}
  }, 250);
}

/* ── elements ─────────────────────────────────────────────────────────── */

const lyricAhead = $("lyricAhead"), lyricBall = $("lyricBall");
const cue = $("cue"), lyricCatch = $("lyricCatch");

const ball = $("ball"), cursor = $("cursor"), playhead = $("playhead");

/* ── transport ──────────────────────────────────────────────────────────
   Position is one number again, but now the audio owns it: when a track is
   loaded the element is the clock and we only read it. That is the honest
   arrangement — the sound cannot be made to follow us. */
const player = { time: 0, duration: 0, playing: false };
let track = { id: null, title: "No track loaded" };
let audio = null, audioUrl = null;

const LYRIC_BALL = 22, HOP_ROOM = 46, LEAD_STEP = 52, BALL = 34, BALL_ZONE = 76;

const zoom = () => num("zoom");
const hopRoom = () => HOP_ROOM * zoom();
const ballSize = () => LYRIC_BALL * zoom();
/* Like the lyric band below: the pane only takes its band when the track has
   a strum pattern to put in it. The setting survives untouched, so a track
   that does strum gets the pane back without anyone reaching for the menu. */
const paneOn = () => state.strumPane !== "off" && strumLines.length > 0;
const chordsOn = () => state.chordPanel;
const zone = () => (state.chordCue === "off" ? 14 : BALL_ZONE);
/* The lyric band earns its space by having something to sing: switched off,
   or empty for this track, it collapses — and with the chart still on below,
   the freed sky goes to an exaggerated bounce, the beat writ large. */
const showLyrics = () => state.lyricsPanel && lyricLines.length > 0;
const highBounce = () => chordsOn() && !showLyrics();

let lyricLines = [], sections = [], beatGrid = [], chordLine = [], loopRanges = [];
let tradeParts = [];   /* the map's licks/backing ranges, if it has them */
let lickSpans  = [];   /* the map's individual "lick" phrases, in the licks half */

/* The beatmap's own grid, when it has one. Bouncing on recorded beats rather
   than a fixed rate is the difference between following the record and
   following a metronome that happens to start in the right place. */
function beatIndex(t) {
  let lo = 0, hi = beatGrid.length - 1;
  if (hi < 0 || t < beatGrid[0]) return -1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (beatGrid[mid] <= t) lo = mid; else hi = mid - 1;
  }
  return lo;
}

/* The typical gap, taken as the median so a couple of wild intervals — or a
   long unmarked stretch — cannot drag it. */
let beatPeriod = 0;
function analyseBeats() {
  const gaps = [];
  for (let i = 1; i < beatGrid.length; i++) gaps.push(beatGrid[i] - beatGrid[i - 1]);
  gaps.sort((a, b) => a - b);
  beatPeriod = gaps.length ? gaps[gaps.length >> 1] : 0;
}

/* Most maps mark only the opening: Margaritaville has 150 beats over three
   and a half minutes. So: bounce on real beats where they are written, and
   where they run out — or a gap is too long to be one beat — carry on at the
   established period, in phase from the last beat actually marked. That keeps
   the bounce honest for as long as the map is, then plausible after. */
const GAP_FACTOR = 1.6;

function beatPhase(t) {
  const p = beatPeriod || BOUNCE;
  if (!beatGrid.length) return mod(t, p) / p;

  const i = beatIndex(t);
  if (i < 0) return mod(t - beatGrid[0], p) / p;
  if (i >= beatGrid.length - 1) return mod(t - beatGrid[i], p) / p;

  const d = beatGrid[i + 1] - beatGrid[i];
  return d > p * GAP_FACTOR ? mod(t - beatGrid[i], p) / p : (t - beatGrid[i]) / d;
}

function bpmAt(t) {
  if (!beatPeriod) return 0;
  const i = beatIndex(t);
  if (i < 0 || i >= beatGrid.length - 1) return Math.round(60 / beatPeriod);

  /* Averaged over four beats so the readout doesn't jitter on human timing. */
  const j = Math.min(beatGrid.length - 1, i + 4);
  const local = (beatGrid[j] - beatGrid[i]) / (j - i);
  return Math.round(60 / (local > beatPeriod * GAP_FACTOR ? beatPeriod : local));
}

/* A fractional beat number for a time and its inverse, by interpolating
   between the beats either side and extrapolating past both ends with the
   nearest interval. A strum loop is a number of beats long, not a number of
   seconds, so laying its repeats out in this coordinate is what makes them
   drift with the take instead of walking off it. The two are exact inverses,
   which matters: a slot's time is round-tripped through both. */
function beatPos(t) {
  const p = beatPeriod || BOUNCE;
  if (beatGrid.length < 2) return t / p;

  const i = beatIndex(t);
  if (i < 0) return (t - beatGrid[0]) / (beatGrid[1] - beatGrid[0]);
  if (i >= beatGrid.length - 1) {
    const n = beatGrid.length;
    return n - 1 + (t - beatGrid[n - 1]) / (beatGrid[n - 1] - beatGrid[n - 2]);
  }
  return i + (t - beatGrid[i]) / (beatGrid[i + 1] - beatGrid[i]);
}

function beatTime(b) {
  const p = beatPeriod || BOUNCE;
  if (beatGrid.length < 2) return b * p;

  const n = beatGrid.length;
  if (b <= 0)     return beatGrid[0] + b * (beatGrid[1] - beatGrid[0]);
  if (b >= n - 1) return beatGrid[n - 1] + (b - n + 1) * (beatGrid[n - 1] - beatGrid[n - 2]);
  const i = Math.floor(b);
  return lerp(beatGrid[i], beatGrid[i + 1], b - i);
}

/* ── strum ──────────────────────────────────────────────────────────────
   A strum line is one loop: its span says where the loop starts and how many
   beats it takes to come round, and it keeps repeating until the next strum
   line. So a song played one way needs one line, and a bridge that changes the
   right hand needs one more. */
let strumLines = [];

function analyseStrums(list, until) {
  strumLines = list.map((s, i) => {
    const pat = compileStrum(s.pattern);
    const b0 = beatPos(s.t_start);
    const span = beatPos(s.t_end) - b0;
    /* The span is the authority on how long the loop is, because the beats are
       what the audio actually did; the pattern's own length is the fallback for
       a line written without one. They disagreeing is worth saying out loud —
       it means the eighths in the pattern are not the eighths on the record. */
    const loop = span > .05 ? span : pat.beats;
    return { pat, b0, loop, mismatch: span > .05 && Math.abs(span - pat.beats) > .05,
             from: s.t_start, to: i + 1 < list.length ? list[i + 1].t_start : until };
  });
}

/* Which loop of which pattern is running at t, and how far through it. */
function strumAt(t) {
  if (!strumLines.length) return null;
  let i = 0;
  while (i < strumLines.length - 1 && t >= strumLines[i + 1].from) i++;
  const s = strumLines[i];
  if (t < s.from || t >= s.to) return null;

  const k = (beatPos(t) - s.b0) / s.loop;
  return { line: s, pat: s.pat, f: mod(k, 1) };
}

/* When slot `s` of loop `k` is played. Slots are evenly spaced across the
   loop — eighth notes when the line is written as one — and the time comes
   back through the beat grid, so a slot lands where the beat under it landed. */
const slotTime = (line, k, s) =>
  beatTime(line.b0 + (k + s / line.pat.n) * line.loop);

/* ── panels ─────────────────────────────────────────────────────────────
   A stack of bands: each says how tall it wants to be and where to put
   itself. The chord surfaces are still here, and still sized, so that when
   the maps grow chords there is nowhere new to put them. */
const PANELS = [
  { id: "lyrics", flex: true, place: placeLyrics, want: () => {
      const vw = root.clientWidth;
      const side = clamp(vw * .019, 15, 25) * zoom();
      const cur = clamp(vw * .029, 18, 38) * zoom();
      const rows = (state.pastLine ? 1 : 0) + state.nextLines;
      return Math.round(hopRoom() + cur * 1.3 + rows * side * 1.45 + 22);
    } },
  /* The roll sits under the words and over the chords: what to sing, then
     what is being played under it. */
  { id: "voice", gap: () => 14, place: placeVoice,
    height: h => (voiceOn() ? Math.round(h * .24) : 0) },
  { id: "strum", gap: () => 16, place: placePane,
    height: h => (paneOn() ? Math.round(h * .17) : 0) },
  { id: "chords", gap: () => geo.zone + 8, place: placeChords,
    height: h => (chordsOn()
      ? Math.max(90, Math.round(h * (paneOn() ? .27 : .3) * (voiceOn() ? .8 : 1))) : 0) },
  { id: "preview", gap: () => 14, place: placePreview,
    height: h => (chordsOn() ? Math.round(h * (paneOn() ? .081 : .09)) : 0) }
];

let geo = {};

function layout() {
  const h = stage.clientHeight;
  geo = { zone: zone(), ball: BALL };

  const bands = PANELS.map(p => (p.flex ? 0 : p.height(h)));
  const used = bands.reduce((a, b, i) =>
    a + b + (b > 0 && PANELS[i].gap ? PANELS[i].gap() : 0), 0);

  const flex = PANELS.findIndex(p => p.flex);
  if (flex >= 0) bands[flex] = showLyrics()
    ? clamp(PANELS[flex].want(), 90, Math.max(90, h - used)) : 0;

  /* High bounce: the room the lyric band gave up is handed to the ball's
     zone rather than left as slack, so the chart keeps the bottom of the
     stage and the ball gets the sky. The chords gap reads geo.zone, so the
     stack still lands exactly at the bottom edge — and the ball itself grows
     into the part it now plays. */
  if (highBounce()) {
    geo.zone += Math.max(0, h - used - (flex >= 0 ? bands[flex] : 0));
    geo.ball = clamp(Math.round(geo.zone * .12), BALL, 64);
  }
  root.toggleAttribute("data-highbounce", highBounce());

  let y = 0;
  PANELS.forEach((p, i) => {
    if (bands[i] > 0 && p.gap) y += p.gap();
    p.place(y, bands[i], h);
    if (bands[i] > 0) y += bands[i];
  });

  fitLines();
  measurePads();
  if (lastLine >= 0) placeCatcher(lastLine, lastRest);
}

function placeLyrics(y, band) {
  lyrics.style.display = band > 0 ? "" : "none";
  lyrics.style.top = y + "px";
  lyrics.style.height = band + "px";
  lyrics.style.setProperty("--hop-room", hopRoom() + "px");
}

function placeChords(y, band) {
  geo.top = y; geo.mainH = band; geo.bottom = y + band; geo.boxH = 20;
  main.style.top = y + "px";
  main.style.setProperty("--h", band + "px");
  beats.style.top = Math.round(y - geo.boxH / 2) + "px";
  beats.style.height = geo.boxH + "px";
  beats.style.setProperty("--bh", geo.boxH + "px");
  beats.style.setProperty("--bw", Math.round(geo.boxH * 1.05) + "px");
  playhead.style.top = (y - geo.zone) + "px";
  playhead.style.height = (geo.zone + band) + "px";
  playhead.style.setProperty("--ball-zone", geo.zone + "px");
  playhead.style.setProperty("--ball-size", (geo.ball || BALL) + "px");

  const nextH = Math.round(band * .7);
  next.style.top = Math.round(y + (band - nextH) / 2) + "px";
  next.style.height = nextH + "px";
  next.style.setProperty("--h", nextH + "px");
  placeNext();                 /* the boxes are laid out against the row's width */
}

function placePane(y, band) {
  /* The data-pane flag only says the setting is on; a track with no strum
     pattern gets no band, and a zero-height frame would still draw its edge. */
  spane.style.display = band > 0 ? "" : "none";
  const countH = Math.round(band * .2), bandH = band - countH;
  const upY = Math.round(bandH * .24), midY = Math.round(bandH * .5);
  const downY = Math.round(bandH * .76);
  /* What the marker's ±1 is worth in pixels, in each of the pane's two
     readings: the rows it lands on, and the swing it makes through them. */
  geo.paneRow = downY - midY;
  geo.paneSwing = Math.round(bandH * .3);
  geo.paneRoom = Math.round(bandH * .46);
  /* The sizes the band alone would like. A loop that only occupies part of the
     pane packs its slots tighter than that, so renderPane may come back and
     take them down; these are the ceiling. */
  geo.paneGlyph = Math.round(band * .3);
  geo.paneCount = Math.round(band * .13);
  geo.paneMargin = Math.round(band * .225 + 6);

  spane.style.top = y + "px";
  spane.style.height = band + "px";
  spane.style.setProperty("--up-y", upY + "px");
  spane.style.setProperty("--mid-y", midY + "px");
  spane.style.setProperty("--down-y", downY + "px");
  spane.style.setProperty("--count-y", Math.round(bandH + countH * .5) + "px");
  spane.style.setProperty("--sglyph", geo.paneGlyph + "px");
  spane.style.setProperty("--scount", geo.paneCount + "px");
