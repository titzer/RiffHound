    drums: 'KH,H,K,H,SH,H,K,H,KH,H,K,H,SH,H,K,H,KH,H,K,H,SH,H,K,H,KH,H,K,H,SH,H,K,H',
    fill:  'K,KS,T,KST' },
  { name: 'Afrobeat',          steps: 32, timeSig: '4/4',
    drums: 'KH,_,H,SH,_,H,KH,H,_,H,SH,_,H,KH,_,H,KH,_,H,SH,_,H,KH,H,_,H,SH,_,H,KH,_,H',
    fill:  'S,ST,T,KST' },
  { name: 'Trap Feel',         steps: 32, timeSig: '4/4',
    drums: 'K,H,H,H,SH,H,H,H,K,H,K,H,SH,H,H,H,K,H,H,H,SH,H,H,H,K,H,K,H,SH,H,H,H',
    fill:  'K,S,T,KST' },
  { name: 'Dembow',            steps: 32, timeSig: '4/4',
    drums: 'KH,H,SH,KH,H,H,SH,H,KH,H,SH,KH,H,H,SH,H,KH,H,SH,KH,H,H,SH,H,KH,H,SH,KH,H,H,SH,H',
    fill:  'K,KS,T,KST' },
  { name: 'Sparse Groove',     steps: 32, timeSig: '4/4',
    drums: 'KH,_,_,SH,_,_,KH,_,KH,_,_,SH,_,_,KH,_,KH,_,_,SH,_,_,KH,_,KH,_,_,SH,_,_,K,_',
    fill:  'S,_,T,KST' },
];

// 5 drum voices
const VOICES = [
  { id: 'kick',  name: 'Kick',  muted: false },
  { id: 'snare', name: 'Snare', muted: false },
  { id: 'hat',   name: 'Hat',   muted: false },
  { id: 'tom',   name: 'Tom',   muted: false },
  { id: 'clap',  name: 'Clap',  muted: false },
];

// pattern[voiceIndex][stepIndex] -> boolean (eighth-note grid)
let pattern = [];      // main pattern
let fillPattern = [];  // fill pattern (last 4 steps)

// --- DOM refs ---
const el = {};
const $ = id => document.getElementById(id);
const root = document.documentElement;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// --- Audio setup ---
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const master = ctx.createGain(); master.connect(ctx.destination);
const bus = { drums: ctx.createGain(), riff: ctx.createGain() };
Object.values(bus).forEach(g => g.connect(master));

// One-off buffers
const noiseBuf = (() => {
  const b = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
})();

// =========================
// Audio voices
// =========================
function voiceKick(t) {
  const o = ctx.createOscillator(); o.type = 'sine';
  const g = ctx.createGain();
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.08);
  g.gain.setValueAtTime(1.0, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g).connect(bus.drums);
  o.start(t); o.stop(t + 0.14);
}

function voiceSnare(t) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q = 0.8;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  s.connect(bp).connect(g).connect(bus.drums);
  s.start(t); s.stop(t + 0.12);
}

function voiceHat(t) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  s.connect(hp).connect(g).connect(bus.drums);
  s.start(t); s.stop(t + 0.06);
}

function voiceTom(t) {
  const o = ctx.createOscillator(); o.type = 'sine';
  const g = ctx.createGain();
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(110, t + 0.1);
  g.gain.setValueAtTime(0.8, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  o.connect(g).connect(bus.drums);
  o.start(t); o.stop(t + 0.16);
}

function voiceClap(t) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  s.connect(hp).connect(g).connect(bus.drums);
  s.start(t); s.stop(t + 0.08);
}

function voiceRiff(t, len, accent, midi = riffMidi) { // plucky filtered saw+square; len = gate time in seconds
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'square';   o2.frequency.value = f * 1.004;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
  lp.frequency.setValueAtTime(accent ? 5000 : 2600, t);
  lp.frequency.exponentialRampToValueAtTime(500, t + 0.12);
  const g = ctx.createGain();
  const peak = accent ? 0.5 : 0.3;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.0015);   // fast attack, so the onset reads as sharply as a drum hit
  g.gain.setValueAtTime(peak * 0.8, t + len);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.05);
  o1.connect(lp); o2.connect(lp); lp.connect(g).connect(bus.riff);
  o1.start(t); o2.start(t); o1.stop(t + len + 0.08); o2.stop(t + len + 0.08);
  // a short pick transient marks the exact onset (the low tone alone takes a cycle or two to register)
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
  const cg = ctx.createGain(); cg.gain.setValueAtTime(accent ? 0.12 : 0.07, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.008);
  s.connect(hp).connect(cg).connect(bus.riff);
  s.start(t); s.stop(t + 0.01);
}

function triggerVoice(id, t) {
  switch(id) {
    case 'kick':  voiceKick(t); break;
    case 'snare': voiceSnare(t); break;
    case 'hat':   voiceHat(t); break;
    case 'tom':   voiceTom(t); break;
    case 'clap':  voiceClap(t); break;
  }
}

// =========================
// Pattern serialization
// =========================
function serializePattern() {
  const voiceChars = ['K', 'S', 'H', 'T', 'C'];

  // Serialize main pattern
  const drumsSteps = [];
  for (let si = 0; si < steps; si++) {
    let stepStr = '';
    for (let vi = 0; vi < VOICES.length; vi++) {
      if (pattern[vi][si]) stepStr += voiceChars[vi];
    }
    drumsSteps.push(stepStr || '_'); // Use '_' for rest
  }

  // Serialize fill pattern
  const fillSteps = [];
  for (let fi = 0; fi < getFillLength(); fi++) {
    let stepStr = '';
    for (let vi = 0; vi < VOICES.length; vi++) {
      if (fillPattern[vi][fi]) stepStr += voiceChars[vi];
    }
    fillSteps.push(stepStr || '_'); // Use '_' for rest
  }

  return `tempo=${bpm}; drums=${drumsSteps.join(',')}; fill=${fillSteps.join(',')}`;
}

function deserializePattern(text) {
  deserializing = true;
  try {
    // Parse the format: "tempo: <NUM>; drums: ...; fill: ..."
    const parts = text.split(';').map(p => p.trim());

    // Parse tempo
    const tempoMatch = parts[0].match(/tempo=\s*(\d+)/);
    if (tempoMatch) {
      actionSetBPM(parseInt(tempoMatch[1], 10));
    }

    // Parse drums
    const drumsMatch = parts[1].match(/drums=\s*(.+)/);
    if (drumsMatch) {
      const drumSteps = drumsMatch[1].split(',').map(s => s.trim());
      const voiceMap = { 'K': 0, 'S': 1, 'H': 2, 'T': 3, 'C': 4 };

      for (let si = 0; si < Math.min(drumSteps.length, steps); si++) {
        const stepStr = drumSteps[si];
        // Clear this step first
        for (let vi = 0; vi < VOICES.length; vi++) {
          pattern[vi][si] = false;
        }
        // Set voices that are present
        if (stepStr !== '_') {
          for (let char of stepStr) {
            if (voiceMap.hasOwnProperty(char)) {
              pattern[voiceMap[char]][si] = true;
            }
          }
        }
      }
    }

    // Parse fill
    const fillMatch = parts[2].match(/fill=\s*(.+)/);
    if (fillMatch) {
      const fillSteps = fillMatch[1].split(',').map(s => s.trim());
      const voiceMap = { 'K': 0, 'S': 1, 'H': 2, 'T': 3, 'C': 4 };

      for (let fi = 0; fi < Math.min(fillSteps.length, getFillLength()); fi++) {
        const stepStr = fillSteps[fi];
        // Clear this step first
        for (let vi = 0; vi < VOICES.length; vi++) {
          fillPattern[vi][fi] = false;
        }
        // Set voices that are present
        if (stepStr !== '_') {
          for (let char of stepStr) {
            if (voiceMap.hasOwnProperty(char)) {
              fillPattern[voiceMap[char]][fi] = true;
            }
          }
        }
      }
    }

    renderGrid();
  } catch (e) {
    console.error('Error parsing pattern:', e);
  } finally {
    deserializing = false;
  }
}

function updatePatternText() {
  if (deserializing) return; // Don't update while deserializing to avoid cursor jumps
  el.patternText.value = serializePattern();
}

// =========================
// Rendering the grid
// =========================
function renderRepeatBoxes() {
  el.repeatBoxes.innerHTML = '';
  for (let i = 0; i < repeatCount; i++) {
    const box = document.createElement('div');
    box.className = 'repeatBox';
    const isFill = isFillIteration(i + 1);
    box.classList.add(isFill ? 'typeB' : 'typeA');
    box.textContent = isFill ? "A'" : 'A';
    const targetIteration = i + 1;
    box.dataset.iteration = targetIteration;
    box.style.cursor = 'pointer';
    box.addEventListener('click', () => actionJumpToRepeat(targetIteration));
    el.repeatBoxes.appendChild(box);
  }
}

function renderGrid() {
  el.grid.innerHTML = '';
  renderRuler();
  VOICES.forEach((v, vi) => {
    const row = document.createElement('div');
    row.className = 'row' + (v.muted ? ' voiceMuted' : '');

    // Per-voice randomize button
    const cb = document.createElement('button');
    cb.className = 'voiceRandom';
    cb.textContent = '⚄';
    cb.title = `Randomize ${v.name}`;
    cb.addEventListener('click', () => randomizeVoice(vi));

    // Per-voice mute button
    const name = document.createElement('button');
    name.className = 'voiceMute' + (v.muted ? ' muted' : '');
    name.textContent = v.name;
    name.addEventListener('click', () => actionToggleVoiceMute(vi));

    // Steps grid (main pattern + fill, with 1-column gap between)
    const stepsWrap = document.createElement('div');
    stepsWrap.className = 'steps';
    const totalCols = steps + 1 + getFillLength();
    stepsWrap.style.gridTemplateColumns = `repeat(${totalCols}, 1fr)`;

    // Main pattern cells
    const bar = getBarSize();
    const beatDiv = getBeatDiv();
    const endColIdx = steps - getFillLength();
    for (let si = 0; si < steps; si++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (pattern[vi][si]) cell.classList.add('on');
      if ((si % beatDiv) === 0) cell.classList.add('beat');
      if ((si % bar) === 0)     cell.classList.add('barStart');
      if (si === endColIdx)     cell.classList.add('endCol');
      cell.addEventListener('click', () => actionToggleStep(vi, si, false));
      stepsWrap.appendChild(cell);
    }

    // Gap between main pattern and fill
    const gap = document.createElement('div');
    gap.className = 'fillGap';
    stepsWrap.appendChild(gap);

    // Fill pattern cells
    for (let fi = 0; fi < getFillLength(); fi++) {
      const cell = document.createElement('div');
      cell.className = 'cell fill';
      if (fi === 0)                    cell.classList.add('fillStart');
      if (fillPattern[vi][fi])         cell.classList.add('on');
      if ((fi % getBeatDiv()) === 0)   cell.classList.add('beat');
      cell.addEventListener('click', () => actionToggleStep(vi, fi, true));
      stepsWrap.appendChild(cell);
    }

    row.appendChild(cb);
    row.appendChild(name);
    row.appendChild(stepsWrap);
    el.grid.appendChild(row);
  });
  renderTitle();
  highlightColumn(currentStep);
  refreshLayout();
}

function renderRuler() {
  const bar = getBarSize();
  const beatDiv = getBeatDiv();

  const row = document.createElement('div');
  row.className = 'row rulerRow';

  const spacer1 = document.createElement('button');
  spacer1.className = 'voiceRandom';
  spacer1.style.visibility = 'hidden';
  const spacer2 = document.createElement('button');
  spacer2.className = 'voiceMute';
  spacer2.style.visibility = 'hidden';
  row.appendChild(spacer1);
  row.appendChild(spacer2);

  const stepsWrap = document.createElement('div');
  stepsWrap.className = 'steps';
  stepsWrap.style.gridTemplateColumns = `repeat(${steps + 1 + getFillLength()}, 1fr)`;

  const fillStart = steps - getFillLength();
  for (let si = 0; si < steps; si++) {
    const cell = document.createElement('div');
    cell.className = 'rulerCell';
    if (si === fillStart) {
      cell.textContent = 'end';
      cell.classList.add('endLabel');
    } else if (si % bar === 0) {
      cell.textContent = si / bar + 1;
      cell.classList.add('barNum');
    } else if (si % beatDiv === 0) {
      cell.textContent = (si % bar) / beatDiv + 1;
      cell.classList.add('beatNum');
    }
    stepsWrap.appendChild(cell);
  }

  // Gap between main ruler and fill ruler
  const rulerGap = document.createElement('div');
  rulerGap.className = 'fillGap';
  stepsWrap.appendChild(rulerGap);

  for (let fi = 0; fi < getFillLength(); fi++) {
    const cell = document.createElement('div');
    cell.className = 'rulerCell';
    if (fi % beatDiv === 0) {
      const fillLen = getFillLength();
      const beatNum = (bar - fillLen + fi) / beatDiv + 1;
      cell.textContent = fi === 0 ? 'fill' : beatNum;
      cell.classList.add(fi === 0 ? 'fillLabel' : 'beatNum');
    }
    stepsWrap.appendChild(cell);
  }

  row.appendChild(stepsWrap);
  el.grid.appendChild(row);
}

// Determine grouping: force 6/8 for 24 steps, else fallback heuristic
function getBarSize() {
  if (steps === 24) return 6;               // 24 eighths = 4 bars of 6/8
  return (steps % 6 === 0 && steps % 8 !== 0) ? 6 : 8;
}
function getBeatDiv() {                     // eighth-note steps per beat
  return timeSig === '6/8' ? 3 : 2;        // 6/8: dotted-quarter beats; otherwise quarter-note beats
}

function highlightColumn(stepIdx) {
  el.grid.querySelectorAll('.columnActive, .past').forEach(c => c.classList.remove('columnActive', 'past'));
  const rows = el.grid.querySelectorAll('.row');
  rows.forEach(row => {
    const cells = row.querySelectorAll('.steps .cell, .steps .rulerCell, .steps .fillGap');
    cells.forEach((cell, idx) => {
      if (idx === stepIdx) cell.classList.add('columnActive');
      else if (idx < stepIdx) cell.classList.add('past');
    });
  });
}

function highlightRepeatBox(iteration) {
  el.repeatBoxes.querySelectorAll('.repeatBox.active').forEach(b => b.classList.remove('active'));
  const boxes = el.repeatBoxes.querySelectorAll('.repeatBox');
  if (boxes[iteration - 1]) boxes[iteration - 1].classList.add('active');
}

function updateCellActivity(iteration) {
  const isFinalIteration = isFillIteration(iteration);
  const rows = el.grid.querySelectorAll('.row');

  rows.forEach(row => {
    const cells = row.querySelectorAll('.steps .cell');
    cells.forEach((cell, idx) => {
      if (isFinalIteration) {
        // Final iteration: main cells in fill region are inactive, fill cells are active
        if (idx >= steps - getFillLength() && idx < steps) {
          // Main pattern cells that get replaced by fill
          cell.classList.add('inactive');
        } else if (idx >= steps) {
          // Fill cells are active
          cell.classList.remove('inactive');
        } else {
          // Main pattern cells before fill region are active
          cell.classList.remove('inactive');
        }
      } else {
        // Normal iterations: fill cells are inactive
        if (idx >= steps) {
          cell.classList.add('inactive');
        } else {
          cell.classList.remove('inactive');
        }
      }
    });
  });
}

// =========================
// Bouncing balls
// =========================
function getBallGeom() { // column x-centers (relative to the lane) and hop height, cached until layout changes
  if (ballGeom) return ballGeom;
  const lane = el.ballLane.getBoundingClientRect();
  const rows = el.grid.querySelectorAll('.row:not(.rulerRow) .steps');
  const xs = Array.from(rows[0].children, c => { const r = c.getBoundingClientRect(); return r.left + r.width / 2 - lane.left; }); // main cells, gap, fill cells
  const size = el.ball.offsetWidth;
  const colW = rows[0].firstElementChild.getBoundingClientRect().width;
  const padH = rows[rows.length - 1].getBoundingClientRect().bottom - lane.bottom; // from the ball's landing line to the bottom row
  const mainX = xs[steps], fillX = xs[xs.length - 1] + xs[1] - xs[0]; // pad centers: gap column, and just past the last fill column
  [[el.padMain, mainX], [el.padFill, fillX]].forEach(([pad, x]) => {
    pad.style.width = `${colW}px`;
    pad.style.height = `${padH}px`;
    pad.style.left = `${x - colW / 2}px`;
    pad.style.fontSize = `${Math.min(colW, padH) * 0.8}px`;
  });
  ballGeom = { xs, size, mainX, fillX, firstX: xs[0], hop: el.ballLane.clientHeight - size,
               inX: Math.min(2 * xs[0] - xs[getBeatDiv()], -size) }; // new ball starts one hop left of step 1, and always off-screen
  return ballGeom;
}

function displayColumn(si, iteration) { // grid column that shows step si during the given iteration
  const fillStart = steps - getFillLength();
  return (isFillIteration(iteration) && si >= fillStart) ? steps + 1 + (si - fillStart) : si;
}

function placeBall(b, size, x, y, scale) {
  b.style.transform = `translate(${x - size / 2}px, ${-y}px) scale(${scale})`;
}

function hopBalls(ball, ball2, g, p, x0, x1, wrap) { // draw hop progress p from x0 to x1; g: { size, hop, inX, firstX }
  const arc = 4 * g.hop * p * (1 - p);
  placeBall(ball, g.size, x0 + (x1 - x0) * p, arc, 1);
  if (wrap) placeBall(ball2, g.size, g.inX + (g.firstX - g.inX) * p, arc, 1); // fresh ball bounces in from off the left edge
  else placeBall(ball2, g.size, 0, 0, 0);                                      // the second ball only exists during the last hop
}

// One hop per beat, landing on each beat's column. The last hop of a loop lands on the teleporter pad
// while a fresh ball bounces in from the left to land on step 1. The old ball vanishes on landing and the
// pad it hit flashes briefly.
function updateBall(elapsed) {
  const g = getBallGeom();
  const beatDiv = getBeatDiv();
  const pos = Math.max(0, elapsed) / stepDuration();   // fractional steps since transport start
  const from = Math.floor(pos / beatDiv) * beatDiv;    // step of the beat we last landed on
  const to = from + beatDiv;
  const p = (pos - from) / beatDiv;                    // 0..1 progress through this hop
  const itFrom = Math.floor(from / steps) % repeatCount + 1;
  const fillLoop = isFillIteration(itFrom);            // this loop ends on the fill's pad
  // first quarter-beat after a teleport: the pad that was just hit (the previous loop's) glows
  const t = (from > 0 && from % steps === 0) ? Math.max(0, 1 - p / 0.25) : 0;
  const hitFill = isFillIteration((itFrom + repeatCount - 2) % repeatCount + 1); // previous loop ended with the fill
  el.padMain.classList.toggle('dim', playing && fillLoop && !(t > 0 && !hitFill));  // a pad stays lit while it glows
  el.padFill.classList.toggle('dim', playing && !fillLoop && !(t > 0 && hitFill));
  el.padMain.style.setProperty('--hit', hitFill ? 0 : t);
  el.padFill.style.setProperty('--hit', hitFill ? t : 0);
  const wrap = to % steps === 0;
  const x1 = wrap ? (fillLoop ? g.fillX : g.mainX) : g.xs[displayColumn(to % steps, Math.floor(to / steps) % repeatCount + 1)];
  hopBalls(el.ball, el.ball2, g, p, g.xs[displayColumn(from % steps, itFrom)], x1, wrap);
}

function updateRiffBall(elapsed) { // same, over the riff's own length and single pad
  const g = riffGeom;
  if (!g || !riff) return;
  const bd = riff.beatDiv, len = riff.beats.length * bd;
  const pos = Math.max(0, elapsed - RIFF_ONSET_LAG) / stepDuration();
  const from = Math.floor(pos / bd) * bd, to = from + bd;
  const p = (pos - from) / bd;
  showChord(Math.floor(pos / len));
  el.riffPad.style.setProperty('--hit', (from > 0 && from % len === 0) ? Math.max(0, 1 - p / 0.25) : 0);
  const wrap = to % len === 0;
  hopBalls(el.riffBall, el.riffBall2, g, p, g.ballX(from % len), wrap ? g.padX : g.ballX(to % len), wrap);
}

function refreshBall() { // re-place the drum ball after a layout or transport change
  ballGeom = null;
  if (!playing) updateBall(0);
  else if (paused) updateBall(pausedElapsed);
}

// =========================
// Riff: generator
// =========================
function riffBeatsPerBar() { return getBarSize() / getBeatDiv(); }

function riffDivs() { return timeSig === '6/8' ? [1, 3, 6] : [1, 2, 3, 4, 5, 6]; } // subdivisions a beat can have
function isTuplet(div) { return timeSig !== '6/8' && (div === 3 || div === 5 || div === 6); } // odd against the 16th grid

function slotStrengths(div) { // metrical weight of each slot within a beat
  if (div === 1) return [1];
  if (timeSig === '6/8') return div === 6 ? [1, .25, .5, .25, .5, .25] : [1, .5, .5];
  if (div === 5) return [1, .25, .35, .25, .35];
  if (div === 6) return [1, .2, .3, .5, .2, .3];       // two triplets: the second half-beat is the secondary accent
  return div === 4 ? [1, .25, .5, .25] : div === 3 ? [1, .3, .4] : [1, .5];
}

function pickBeatDiv() { // subdivision for a new beat, from the 16ths / Triplets knobs
  if (timeSig === '6/8') return Math.random() < Math.min(1, riffKnob.sixteenths + riffKnob.triplets) ? 6 : 3; // both knobs push toward six per beat
  let pt = riffKnob.triplets, ps = riffKnob.sixteenths;
  if (pt + ps > 1) { const sum = pt + ps; pt /= sum; ps /= sum; }
  const r = Math.random();
  return r < pt ? 3 : r < pt + ps ? 4 : 2;
}

function generateBeat(isDownbeat) { // one beat's slot string
  const k = riffKnob, div = pickBeatDiv(), w = slotStrengths(div);
  const triplet = isTuplet(div);
  let out = '';
  for (let i = 0; i < div; i++) {
    // syncopation slides the hit probability from favoring strong slots to favoring weak ones
    const f = (1 - k.sync) * (0.35 + w[i]) + k.sync * (1.35 - 0.9 * w[i]);
    let p = k.density * f * (triplet ? 1.4 : 1);       // triplets sound best mostly filled in
    if (i === 0 && isDownbeat) p = Math.max(p, 1 - 0.7 * k.sync); // anchor the bar
    if (Math.random() >= p) { out += '.'; continue; }
    out += Math.random() < k.accent * (i === 0 && isDownbeat ? 2 : 1) ? 'X' : 'x';
  }
  return out;
}

function riffNotes(beats, beatDiv) { // flatten beats into notes with position and gap-to-next (in steps, cyclic)
  const list = [];
  let open = null, lead = 0, leading = true;           // open: note the next tie would extend; lead: length of ties before the first note
  beats.forEach((b, bi) => [...b].forEach((c, k) => {
    const pos = (bi + k / b.length) * beatDiv, slotLen = beatDiv / b.length;
    if (c === '-') {
      if (open) open.end = pos + slotLen;
      else if (leading) lead += slotLen;                // ties at the very start belong to the last note, around the loop
    } else {
      leading = false;
      open = c === '.' ? null : { pos, bi, k, c };
      if (open) list.push(open);
    }
  }));
  const total = beats.length * beatDiv;
  if (open && lead) open.end = total + lead;
  list.forEach((o, i) => { o.gap = (i + 1 < list.length ? list[i + 1].pos : list[0].pos + total) - o.pos; });
  return list;
}

function dropOrphanTies(beats) { // a tie with nothing sounding before it (cyclically) is just a rest
  const lens = beats.map(b => b.length), flat = [...beats.join('')], n = flat.length;
  if (!flat.some(c => c !== '.' && c !== '-')) flat.fill('.');
  for (let changed = true; changed;) {
    changed = false;
    flat.forEach((c, i) => { if (c === '-' && flat[(i + n - 1) % n] === '.') { flat[i] = '.'; changed = true; } });
  }
  let at = 0;
  return lens.map(len => flat.slice(at, at += len).join(''));
}

function applyLongs(beats, only) { // hold some notes that have at least an 8th of room after them (only: Set of beat indices, or null = all)
  const out = beats.map(b => [...b]);
  riffNotes(beats, getBeatDiv()).forEach(o => {
    if (only && !only.has(o.bi)) return;
    if (o.gap < 0.99 || (o.c !== 'x' && o.c !== 'X') || Math.random() >= riffKnob.long) return;
    out[o.bi][o.k] = o.c === 'X' ? 'O' : 'o';
  });
  return out.map(b => b.join(''));
}

function generateRiffBeats() { // a fresh riff for the current meter and knobs
  const bpb = riffBeatsPerBar();
  const bars = Math.min(riffBars, steps / getBarSize());
  const back = Math.max(1, Math.floor(bpb / 2));       // within a bar, beat i may echo beat i - back
  let beats = [];
  for (let tries = 0; tries < 20; tries++) {
    beats = [];
    for (let b = 0; b < bars; b++) {
      const srcBar = b >= 2 ? b - 2 : b - 1;           // bar 2 echoes bar 1; bars 3/4 echo bars 1/2
      const echoBar = b > 0 && Math.random() < riffKnob.repeat;
      for (let i = 0; i < bpb; i++) {
        const last = i === bpb - 1;
        if (echoBar && (!last || Math.random() < 0.3)) beats.push(beats[srcBar * bpb + i]); // echo, usually with a new last beat
        else if (!echoBar && i >= back && Math.random() < riffKnob.repeat * 0.5) beats.push(beats[b * bpb + i - back]);
        else beats.push(generateBeat(i === 0));
      }
    }
    const perBar = Array.from({ length: bars }, (_, b) => riffNotes(beats.slice(b * bpb, (b + 1) * bpb), 1).length);
    if (Math.min(...perBar) >= Math.max(2, Math.round(riffKnob.density * getBarSize() * 0.8))) break; // no near-empty bars
  }
  return applyLongs(beats, null);
}

function setChar(str, i, c) { return str.slice(0, i) + c + str.slice(i + 1); }

function varyRiffBeats(beats) { // similar-but-different: a few small edits, scaled by the Variation knob
  const bpb = riffBeatsPerBar();
  const edits = Math.max(1, Math.round(riffKnob.vary * beats.length * 0.6));
  const rnd = n => Math.floor(Math.random() * n);
  let out = beats;
  for (let tries = 0; tries < 10; tries++) {
    out = beats.slice();
    const touched = new Set();
    for (let e = 0; e < edits; e++) {
      // the opening beat anchors the riff: mostly leave it alone
      const bi = (out.length > 1 && Math.random() < 0.8) ? 1 + rnd(out.length - 1) : rnd(out.length);
      const r = Math.random();
      if (r < 0.4) {                                   // add or drop one note
        const k = rnd(out[bi].length);
        out[bi] = setChar(out[bi], k, out[bi][k] === '.' ? 'x' : '.');
      } else if (r < 0.75) {                           // rewrite the beat from the current knobs
        out[bi] = generateBeat(bi % bpb === 0);
      } else if (r < 0.9) {                            // echo another beat
        out[bi] = out[rnd(out.length)];
      } else if (bi + 1 < out.length) {                // swap with the next beat
        [out[bi], out[bi + 1]] = [out[bi + 1], out[bi]];
        touched.add(bi + 1);
      }
      touched.add(bi);
    }
    if (out.join() !== beats.join() && riffNotes(out, 1).length >= 2) return applyLongs(out, touched);
  }
  return out;
}

// =========================
// Riff: text, display, playback
// =========================
function riffBody(beats) { // beats separated by ',', bars by ' | '
  const bpb = riffBeatsPerBar(), bars = [];
  for (let i = 0; i < beats.length; i += bpb) bars.push(beats.slice(i, i + bpb).join(','));
  return bars.join(' | ');
}

function serializeRiff() { // "riff=" then the beats (the key matches the drum pattern's "drums="), then the chords if any
  return 'riff=' + riffBody(riff.beats) + (riffChords.length ? '; chords=' + riffChords.join(' ') : '');
}

// --- Riff history ---
function riffHistoryAdd(beats) { // remember a riff as the most recent; an already-listed riff just moves to the front
  const body = riffBody(beats);
  const i = riffHistory.indexOf(body);
  if (i >= 0) riffHistory.splice(i, 1);
  riffHistory.push(body);
  if (riffHistory.length > RIFF_HISTORY_MAX) riffHistory.shift();
  renderRiffHistory();
}

function renderRiffHistory() { // the dropdown: a heading with the count, then the riffs newest first (greyed if made for another meter)
  const sel = el.selRiffHistory;
  sel.innerHTML = '';
  const head = document.createElement('option');
  head.value = ''; head.textContent = `📜 ${riffHistory.length}`;
  sel.appendChild(head);
  for (let i = riffHistory.length - 1; i >= 0; i--) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = `${riffHistory.length - i}. ${riffHistory[i]}`;
    opt.disabled = !parseRiff(riffHistory[i]);
    sel.appendChild(opt);
  }
  sel.value = '';
}

function actionPickRiffHistory(i) { // bring back a riff from the history
  const beats = parseRiff(riffHistory[i]);
  if (beats) setRiff(beats, false, true);
  el.selRiffHistory.value = '';
}

function splitRiffText(text) { // "riff=…; chords=…" → { riffPart, chordPart }; chordPart is null when there is no chords key
  const m = /;\s*chords\s*=([^;]*)/i.exec(text);
  if (!m) return { riffPart: text, chordPart: null };
  return { riffPart: text.slice(0, m.index) + text.slice(m.index + m[0].length), chordPart: m[1] };
}

// --- Chord progression ---
const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function parseChords(text) { // "E E A A", "Am7, D | G" → root names, or null if a token isn't a chord
  const out = [];
  for (const t of text.split(/[\s,|]+/).filter(t => t.length)) {
    const m = /^([A-Ga-g])([#b]?)/.exec(t);
    if (!m) return null;
    out.push(m[1].toUpperCase() + m[2]);
  }
  return out;
}

function chordMidi(name) { // the chord's root, in the octave that puts it nearest the selected Note
  const pc = (NOTE_PC[name[0]] + (name[1] === '#' ? 1 : name[1] === 'b' ? -1 : 0) + 12) % 12;
  let d = (pc - riffMidi % 12 + 12) % 12;
  if (d > 6) d -= 12;                                  // -5..+6 semitones from the Note
  return riffMidi + d;
}

function riffMidiAt(play) { // pitch for the riff's play-th time through (0-based)
  return riffChords.length ? chordMidi(riffChords[play % riffChords.length]) : riffMidi;
}

function setChords(chords) { // install a progression; mirror it into whichever text fields aren't being typed in
  riffChords = chords;
  if (document.activeElement !== el.riffChords) { el.riffChords.value = chords.join(' '); el.riffChords.classList.remove('bad'); }
  if (document.activeElement !== el.riffText && riff) { el.riffText.value = serializeRiff(); el.riffText.classList.remove('bad'); }
  renderChordBoxes();
}

function renderChordBoxes() {
  el.riffChordBoxes.innerHTML = '';
  riffChords.forEach(c => {
    const box = document.createElement('span');
    box.className = 'chordBox';
    box.textContent = c;
    el.riffChordBoxes.appendChild(box);
  });
  riffChordShown = -1;
  showChord(0);
}

function showChord(play) { // highlight the chord of the given play (visual clock)
  if (!riffChords.length) return;
  const idx = play % riffChords.length;
  if (idx === riffChordShown) return;
  riffChordShown = idx;
  [...el.riffChordBoxes.children].forEach((b, i) => b.classList.toggle('active', i === idx));
}

function parseRiff(text) { // returns beats, or null if the text isn't a valid riff for the current meter
  text = text.replace(/^\s*riff\s*=/i, '').replace(/;\s*$/, '');   // the "riff=" key is optional when pasting
  const beats = text.split(/[\s,|]+/).filter(t => t.length);
  if (!beats.length || !beats.every(b => riffDivs().includes(b.length) && /^[.xXoO-]+$/.test(b))) return null;
  const bars = beats.length / riffBeatsPerBar();
  if (![1, 2, 4].includes(bars) || steps % (beats.length * getBeatDiv()) !== 0) return null;
  return beats;
}

function setRiff(beats, keepText, fromHistory = false) { // install a riff (keepText: don't overwrite what the user is typing)
  // New, Vary and hand edits alike: the riff joins the history once it has played through unchanged (fromHistory: it is already there)
  beats = dropOrphanTies(beats);
  riffPending = !fromHistory;
  riffCleanLoops = (playing && !paused) ? 0 : 1;      // stopped: the next play starts at a boundary
  riff = { beatDiv: getBeatDiv(), barSize: getBarSize(), beats };
  riffOnsets = riffNotes(beats, riff.beatDiv);
  riffPlays = 0;
  riffBars = beats.length / riffBeatsPerBar();         // keep the Length control showing what we actually have
  set('riffBars', String(riffBars), { apply: false });
  if (!keepText) { el.riffText.value = serializeRiff(); el.riffText.classList.remove('bad'); }
  renderRiff();
  updateRiffCount();
}

function riffFits() { // still valid for the current meter and pattern length?
  return riff && riff.beatDiv === getBeatDiv() && riff.barSize === getBarSize() && steps % (riff.beats.length * riff.beatDiv) === 0;
}

function renderRiff() { // draw the riff: lined up with the drum columns if it is as long as the pattern, else centered and larger
  if (!riffFits()) { // pattern changed under us (setRiff re-renders): same meter but now too long → keep the opening bars; new meter → start over
    const sameMeter = riff && riff.beatDiv === getBeatDiv() && riff.barSize === getBarSize();
    setRiff(sameMeter ? riff.beats.slice(0, steps / riff.beatDiv) : generateRiffBeats());
    return;
  }
  el.riffLane.innerHTML = '';
  riffSlotEls = []; riffNowEl = null;
  const bd = riff.beatDiv, bar = riff.barSize, len = riff.beats.length * bd;
  el.riffLane.classList.toggle('big', len === bar);
  const lane = el.riffLane.getBoundingClientRect();
  // step i spans [left + i*pitch, left + (i+1)*pitch - gap]
  let left, pitch, gap;
  const aligned = len === steps && state.drumPane;     // (a hidden drum grid has no columns to line up with)
  if (aligned) {
    const cols = el.grid.querySelector('.row:not(.rulerRow) .steps').children;
    const c0 = cols[0].getBoundingClientRect();
    left = c0.left - lane.left;
    pitch = cols[1].getBoundingClientRect().left - c0.left;
    gap = pitch - c0.width;
  } else {
    pitch = lane.width * (len === bar ? 0.6 : 0.8) / len;
    left = (lane.width - pitch * len) / 2;
    gap = -2;                                          // neighboring beat boxes share a border
  }
  riff.beats.forEach((beat, bi) => {
    const be = document.createElement('div');
    be.className = 'riffBeat' + ((bi * bd) % bar === 0 ? ' barStart' : '');
    be.style.left = `${left + bi * bd * pitch}px`;
    be.style.width = `${bd * pitch - gap}px`;
    riffSlotEls.push([...beat].map((c, k) => {
      const se = document.createElement('div');
      se.className = 'riffSlot' + (c === '-' ? ' tie' : c !== '.' ? ' on' : '') + (c === 'X' || c === 'O' ? ' acc' : '');
      if (c === 'X' || c === 'O') se.textContent = '>';
      se.addEventListener('click', e => actionEditRiffSlot(bi, k, e.shiftKey));
      be.appendChild(se);
      return se;
    }));
    el.riffLane.appendChild(be);
    const dv = document.createElement('div');
    dv.className = 'riffDiv' + (isTuplet(beat.length) ? ' trip' : '');
    dv.textContent = beat.length;
    dv.title = 'Subdivisions in this beat (click to change)';
    dv.style.left = `${left + bi * bd * pitch + (bd * pitch - gap) / 2}px`;
    dv.addEventListener('click', () => actionCycleRiffDiv(bi));
    el.riffLane.appendChild(dv);
  });
  // held notes get a tail out to where they end
  riffOnsets.filter(o => (o.c === 'o' || o.c === 'O') && o.end === undefined).forEach(o => { // (tied notes show their length as tie slots)
    const from = left + (o.pos + bd / riff.beats[o.bi].length) * pitch;
    const to = Math.min(left + (o.pos + riffGate(o)) * pitch, left + len * pitch - gap);
    if (to <= from) return;
    const tail = document.createElement('div');
    tail.className = 'riffTail';
    tail.style.left = `${from}px`;
    tail.style.width = `${to - from}px`;
    el.riffLane.appendChild(tail);
  });
  // ball + pad: the ball lands in the middle of the first quarter of each beat's box (where a first 16th sits);
  // the pad sits just past the last beat
  // (when aligned, that is exactly the drum grid's gap column)
  const size = el.riffBall.offsetWidth;
  const padW = aligned ? pitch - gap : Math.min(pitch, lane.height);
  const padLeft = left + len * pitch + (aligned ? 0 : 6);
  el.riffPad.style.left = `${padLeft}px`;
  el.riffPad.style.width = `${padW}px`;
  el.riffPad.style.height = `${lane.height}px`;
  el.riffPad.style.fontSize = `${Math.min(padW, lane.height) * 0.8}px`;
  const ballX = step => left + step * pitch + (bd * pitch - gap) / 8;
  riff.beats.forEach((_, bi) => { // beat numbers 1..N straight through (no restart per bar), right under the landing spot
    const num = document.createElement('div');
    num.className = 'riffBeatNum';
    num.textContent = bi + 1;
    num.style.left = `${ballX(bi * bd)}px`;
    el.riffLane.appendChild(num);
  });
  riffGeom = { left, pitch, gap, size, ballX, firstX: ballX(0), padX: padLeft + padW / 2,
               hop: el.riffBallLane.clientHeight - size, inX: ballX(-bd) }; // new ball starts one beat left of beat 1: same speed as every other hop
  // a dot at the point of the ball's arc where each note starts (ties start nothing): same math as hopBalls
  el.riffBallLane.querySelectorAll('.riffDot').forEach(d => d.remove());
  riffOnsets.forEach(o => {
    const from = Math.floor(o.pos / bd + 1e-9) * bd, p = Math.max(0, (o.pos - from) / bd);
    const x0 = ballX(from), x1 = from + bd >= len ? riffGeom.padX : ballX(from + bd);
    const dot = document.createElement('div');
    dot.className = 'riffDot' + (o.c === 'X' || o.c === 'O' ? ' acc' : '');
    dot.style.left = `${x0 + (x1 - x0) * p}px`;
    dot.style.bottom = `${4 * riffGeom.hop * p * (1 - p) + size / 2}px`; // ball center
    el.riffBallLane.appendChild(dot);
  });
  if (!playing) updateRiffBall(0);
  else if (paused) updateRiffBall(pausedElapsed);
}

function riffGate(o) { return Math.min(o.gap * 0.9, 4); } // held-note length in steps

function scheduleRiffStep(totalSteps, when) { // schedule the riff notes that start within this drum step
  if (totalSteps < 0 || !riff) return;
  const riffLen = riff.beats.length * riff.beatDiv, s = totalSteps % riffLen;
  if (s === 0 && totalSteps > 0) riffLoopDone();
  if (muted || riffMuted) return;
  const dur = stepDuration(), midi = riffMidiAt(Math.floor(totalSteps / riffLen));
  riffOnsets.forEach(o => {
    if (Math.floor(o.pos + 1e-6) !== s) return;
    const held = o.c === 'o' || o.c === 'O';
    const len = o.end !== undefined ? (o.end - o.pos) * dur * 0.95   // tied: sounds through its tie slots
              : held ? riffGate(o) * dur : Math.min(0.09, o.gap * dur * 0.6);
    voiceRiff(when + (o.pos - s) * dur, len, o.c === 'X' || o.c === 'O', midi);
  });
}

function riffLoopDone() { // the riff just finished a play; in auto mode, move on to a variation every riffEvery plays
  riffPlays++;
  if (riffPending && ++riffCleanLoops >= 2) { riffHistoryAdd(riff.beats); riffPending = false; } // played through unchanged: remember it
  if (riffAuto && riffPlays >= riffEvery) { setRiff(varyRiffBeats(riff.beats)); riffCleanLoops = 1; } // installed right at a boundary: this loop counts
  else updateRiffCount();
}

function updateRiffCount() {
  el.riffCount.textContent = (riffAuto && playing) ? `${Math.min(riffPlays + 1, riffEvery)}/${riffEvery}` : '';
}

function updateRiffPlayhead(elapsed) { // outline the slot being played
  let now = null;
  if (playing && riff) {
    const beatPos = (Math.max(0, elapsed) / stepDuration() / riff.beatDiv) % riff.beats.length;
    const pb = Math.floor(beatPos), slots = riffSlotEls[pb];
    if (slots) now = slots[Math.floor((beatPos - pb) * slots.length)];
  }
  if (now === riffNowEl) return;
  if (riffNowEl) riffNowEl.classList.remove('now');
  if (now) now.classList.add('now');
  riffNowEl = now;
}

function refreshLayout() { // things positioned from the drum grid's columns
  refreshBall();
  renderRiff();
}

// =========================
// Transport & scheduling (8th notes)
// =========================
function stepDuration() { return (60 / bpm) / 2; } // 8th-note grid

function scheduleStep(si, when, useFill) {
  if (muted) return; // Skip sound generation when muted
  VOICES.forEach((v, vi) => {
    if (v.muted) return; // Skip muted voices
    if (useFill) {
      if (fillPattern[vi][si]) triggerVoice(v.id, when);
    } else {
      if (pattern[vi][si]) triggerVoice(v.id, when);
    }
  });
}

function actionToggleVoiceMute(vi) {
  VOICES[vi].muted = !VOICES[vi].muted;
  renderGrid();
}

function scheduleAudioStep(n, when) { // queue the drums and riff notes of absolute step n
  const si = n % steps;
  const fillStart = steps - getFillLength();
  const inFill = isFillIteration(Math.floor(n / steps) % repeatCount + 1) && si >= fillStart;
  scheduleStep(inFill ? si - fillStart : si, when, inFill);
  scheduleRiffStep(n, when);
}

function heardTime() { // audio-clock time of what is coming out of the speakers right now
  // ctx.currentTime is the time being *rendered*; it is heard one output latency later. Visuals follow the heard time,
  // otherwise the ball lands (and columns light up) a few tens of ms before the hit sounds.
  const latency = (ctx.baseLatency || 0) + (ctx.outputLatency === undefined ? 0.03 : ctx.outputLatency);
  return ctx.currentTime - latency;
}

function tickRAF() { // visuals & near-future scheduling
  if (!playing || paused) return;
  const now = ctx.currentTime;
  const dur = stepDuration();
  const elapsed = Math.max(0, heardTime() - startTime); // visuals only; audio is scheduled against `now`
  const totalSteps = Math.floor(elapsed / dur);

  // Audio runs ahead of the visuals: queue every step that starts within SCHED_AHEAD at its exact time.
  // (Scheduling a step only once it has begun makes on-the-step notes a frame late while notes inside the
  // step are exact, which audibly skews triplets and 16ths.)
  while (startTime + nextSchedStep * dur < now + SCHED_AHEAD) {
    const when = startTime + nextSchedStep * dur;
    if (when > now - 0.05) scheduleAudioStep(nextSchedStep, when); // after a stall (hidden tab), skip what's long past
    nextSchedStep++;
  }

  // Calculate which iteration we're in (1..repeatCount)
  const stepsPerIteration = steps;
  const iteration = Math.floor(totalSteps / stepsPerIteration) % repeatCount + 1;
  const stepInIteration = totalSteps % stepsPerIteration;

  // Determine if we're playing the fill
  const isFinalIteration = isFillIteration(iteration);
  const inFillRegion = isFinalIteration && (stepInIteration >= steps - getFillLength());

  // Fill steps display in the fill columns (+1 skips the fillGap element)
  const displayStep = inFillRegion ? steps + 1 + stepInIteration - (steps - getFillLength()) : stepInIteration;

  // Track iteration changes
  if (iteration !== currentIteration) {
    currentIteration = iteration;
    highlightRepeatBox(iteration);
    updateCellActivity(iteration);
  }

  if (displayStep !== currentStep) {
    highlightColumn(displayStep);
    currentStep = displayStep;
  }

  updateBall(elapsed);
  updateRiffBall(elapsed);
  updateRiffPlayhead(elapsed);
  requestAnimationFrame(tickRAF);
}

// =========================
// UI actions (top-level)
// =========================
function actionPlay() { // start transport
  if (playing) return;
  ctx.resume();
  playing = true;
  startTime = ctx.currentTime + 0.06;
  nextSchedStep = 0;
  currentStep = 0;
  currentIteration = 1;
  riffPlays = 0;
  highlightColumn(currentStep);
  highlightRepeatBox(1);
  updateCellActivity(1);
  requestAnimationFrame(tickRAF);
  document.body.classList.add('playing');
  updateTransport();
  updateRiffCount();
}

function actionPause() { // toggle pause
  if (!playing) return;
  if (!paused) {
    paused = true;
    pausedElapsed = ctx.currentTime - startTime;
  } else {
    paused = false;
    startTime = ctx.currentTime - pausedElapsed;
    requestAnimationFrame(tickRAF);
  }
  updateTransport();
}

function actionStop() { // stop transport
  if (!playing) return;
  playing = false;
  paused = false;
  pausedElapsed = 0;
  document.body.classList.remove('playing');
  currentIteration = 1;
  highlightRepeatBox(0); // Clear highlight
  updateCellActivity(1); // Reset to first iteration state
  el.grid.querySelectorAll('.cell.inactive').forEach(c => c.classList.remove('inactive'));
  updateTransport();
  refreshBall();
  updateRiffBall(0);
  updateRiffPlayhead(0);
  updateRiffCount();
}

function actionMuteToggle() { // toggle mute
  muted = !muted;
  updateMuteButton();
}

function updateMuteButton() { // lit while there is sound
  el.btnMute.classList.toggle('active', !muted);
  el.btnMute.textContent = muted ? 'Muted' : 'Sound';
}

function actionTapSpace() { // accumulate taps → BPM
  const now = performance.now();
  taps.push(now);
  while (taps.length > 6) taps.shift();
  if (taps.length >= 2) {
    const diffs = taps.slice(1).map((t,i) => t - taps[i]);
    const avg = diffs.reduce((a,b) => a + b, 0) / diffs.length;
    set('tempo', Math.round(60000 / avg));
    if (playing) { // the tap is the new downbeat: the pattern starts over from here, and so does the scheduler
      startTime = ctx.currentTime;
      nextSchedStep = 0;
      if (paused) pausedElapsed = 0;
    }

    // Flash the tap button
    el.btnTap.classList.add('flash');
    setTimeout(() => el.btnTap.classList.remove('flash'), 150);
  }
}

function actionSetBPM(val) { // keys, tempo field or pattern text; the tempo is a setting (see applyBPM)
  set('tempo', parseInt(val, 10) || bpm);
}

function actionSetSteps(n) { // change grid length (16/32)
  steps = n;
  VOICES.forEach((_, vi) => {
    const old = pattern[vi];
    const next = new Array(steps).fill(false);
    for (let i = 0; i < Math.min(old.length, next.length); i++) next[i] = old[i];
    pattern[vi] = next;
    const oldFill = fillPattern[vi];
    const newFill = new Array(getFillLength()).fill(false);
    for (let i = 0; i < Math.min(oldFill.length, newFill.length); i++) newFill[i] = oldFill[i];
    fillPattern[vi] = newFill;
  });
  currentStep = 0;
  renderGrid();
  updatePatternText();
}

function actionSetRepeat(n) { // change repeat count (0 = no fill)
  fillEnabled = n > 0;
  repeatCount = Math.max(1, n);
  renderRepeatBoxes();
  if (playing) {
    // Re-highlight and update activity for current iteration
    highlightRepeatBox(currentIteration);
    updateCellActivity(currentIteration);
  } else {
    currentIteration = 1;
    updateCellActivity(1);
  }
}

function actionJumpToRepeat(targetIteration) { // jump to a specific repeat
  if (!playing) return; // Only works during playback

  const now = ctx.currentTime;
  const dur = stepDuration();
  const elapsed = now - startTime;
  const totalSteps = Math.max(0, Math.floor(elapsed / dur));
  const stepInIteration = totalSteps % steps;

  // Same position within the iteration, different iteration: shift the transport by whole steps so the beat stays continuous
  const targetTotalSteps = (targetIteration - 1) * steps + stepInIteration;
  startTime -= (targetTotalSteps - totalSteps) * dur;
  nextSchedStep += targetTotalSteps - totalSteps; // steps already queued stay queued

  // Force immediate update
  currentIteration = targetIteration;
  highlightRepeatBox(targetIteration);
  updateCellActivity(targetIteration);
}

function randomizeVoicePattern(vi) { // update pattern data for one voice
  const K=0, S=1, H=2, T=3, C=4;
  const bar = getBarSize();
  const beatDiv = getBeatDiv();
  pattern[vi].fill(false);
  fillPattern[vi].fill(false);

  switch (VOICES[vi].id) {
    case 'kick':
      for (let i = 0; i < steps; i++) {
        const pos = i % bar;
        const snare = pattern[S][i];
        if (pos === 0)                              { pattern[vi][i] = true; }               // beat 1: always
        else if (pos === bar/2 && !snare)           { pattern[vi][i] = Math.random() < 0.65; } // beat 3: 65%
        else if (pos % beatDiv === 0 && !snare)     { pattern[vi][i] = Math.random() < 0.2; }  // other beats: 20%
        else if (!snare)                            { pattern[vi][i] = Math.random() < 0.08; }  // offbeats: 8%
      }
      fillPattern[vi][0] = Math.random() < 0.4;
      break;

    case 'snare':
      for (let i = 0; i < steps; i++) {
        const pos = i % bar;
        const kick = pattern[K][i];
        if (bar === 8) {
          if (pos === 2)              { pattern[vi][i] = Math.random() < 0.9; }
          else if (pos === 6)         { pattern[vi][i] = Math.random() < 0.85; }
          else if (!kick)             { pattern[vi][i] = Math.random() < 0.08; }
        } else if (timeSig === '6/8') {
          if (pos === 3)              { pattern[vi][i] = Math.random() < 0.9; }  // beat 2 (dotted quarter)
          else if (!kick)             { pattern[vi][i] = Math.random() < 0.06; }
        } else { // 3/4
          if (pos === 2 || pos === 4) { pattern[vi][i] = Math.random() < 0.85; } // beats 2 and 3
          else if (!kick)             { pattern[vi][i] = Math.random() < 0.06; }
        }
      }
      for (let fi = 0; fi < getFillLength(); fi++) fillPattern[vi][fi] = true;
      break;

    case 'hat':
      for (let i = 0; i < steps; i++) {
        const busy = pattern[K][i] || pattern[S][i];
        if (i % beatDiv === 0) { pattern[vi][i] = Math.random() < 0.85; }
        else                   { pattern[vi][i] = Math.random() < (busy ? 0.3 : 0.55); }
      }
      // hat drops out during fill
      break;

    case 'tom':
      for (let i = 0; i < steps; i++) {
        if (!pattern[K][i] && !pattern[S][i]) { pattern[vi][i] = Math.random() < 0.12; }
      }
      for (let fi = 0; fi < getFillLength(); fi++) fillPattern[vi][fi] = true;
      break;

    case 'clap':
      for (let i = 0; i < steps; i++) {
        const pos = i % bar;
        const snare = pattern[S][i];
        if (bar === 8) {
          if (pos === 6)                    { pattern[vi][i] = Math.random() < 0.7; }
          else if (pos === 2 && !snare)     { pattern[vi][i] = Math.random() < 0.25; }
          else if (!snare)                  { pattern[vi][i] = Math.random() < 0.05; }
        } else if (timeSig === '6/8') {
          if (pos === 3 && !snare)          { pattern[vi][i] = Math.random() < 0.4; }  // beat 2
          else if (!snare)                  { pattern[vi][i] = Math.random() < 0.03; }
        } else { // 3/4
          if ((pos === 2 || pos === 4) && !snare) { pattern[vi][i] = Math.random() < 0.3; }
          else if (!snare)                  { pattern[vi][i] = Math.random() < 0.03; }
        }
      }
      fillPattern[vi][getFillLength() - 1] = Math.random() < 0.7;
      break;
  }
}

function randomizeVoice(vi) { // randomize one voice and re-render
  randomizeVoicePattern(vi);
  renderGrid();
  updatePatternText();
}

function actionToggleStep(vi, si, isFill) { // toggle a cell on/off
  if (isFill) {
    fillPattern[vi][si] = !fillPattern[vi][si];
  } else {
    pattern[vi][si] = !pattern[vi][si];
  }
  renderGrid();
  updatePatternText();
}

function actionClear() { // clear all steps
  VOICES.forEach((_, vi) => {
    pattern[vi].fill(false);
    fillPattern[vi].fill(false);
  });
  renderGrid();
  updatePatternText();
}

function actionPermute() { // shuffle bars as units (fill untouched)
  const bar = getBarSize();
  const numBars = Math.floor(steps / bar);
  if (numBars < 2) return;

  // Fisher-Yates shuffle on bar indices
  const indices = Array.from({ length: numBars }, (_, i) => i);
  for (let i = numBars - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }

  VOICES.forEach((_, vi) => {
    const old = pattern[vi].slice();
    for (let b = 0; b < numBars; b++) {
      for (let s = 0; s < bar; s++) {
        pattern[vi][b * bar + s] = old[indices[b] * bar + s];
      }
    }
  });
  renderGrid();
  updatePatternText();
}

function actionSimplify() { // randomly remove ~30% of off-beat enabled steps
  const beatDiv = getBeatDiv();
  const fillLen = getFillLength();
  VOICES.forEach((_, vi) => {
    for (let si = 0; si < steps; si++) {
      if (pattern[vi][si] && si % beatDiv !== 0 && Math.random() < 0.3)
        pattern[vi][si] = false;
    }
  });
  renderGrid();
  updatePatternText();
}

function actionRandom() { // randomize all voices in dependency order
  VOICES.forEach((_, vi) => { pattern[vi].fill(false); fillPattern[vi].fill(false); });
  [0, 1, 2, 3, 4].forEach(vi => randomizeVoicePattern(vi)); // kick→snare→hat→tom→clap
  renderGrid();
  updatePatternText();
}

function actionNewRiff() { setRiff(generateRiffBeats()); }

function actionSetRiffBars(n) { // change riff length: longer = the riff continues (repeats) into the new bars, shorter = keep the opening bars
  const want = Math.min(n, steps / getBarSize()) * riffBeatsPerBar();
  setRiff(Array.from({ length: want }, (_, i) => riff.beats[i % riff.beats.length]));
}

function actionVaryRiff() { setRiff(varyRiffBeats(riff.beats)); }

function actionRotateRiff(by) { // shift the riff by whole beats, wrapping around (ties across the seam stay intact: the riff is cyclic)
  const n = riff.beats.length, k = ((by % n) + n) % n;
  if (!k) return;
  const beats = riff.beats.slice(n - k).concat(riff.beats.slice(0, n - k)); // forward: every beat lands one later, the last wraps to the front
  const plays = riffPlays;
  setRiff(beats);
  riffPlays = plays; updateRiffCount(); // a hand edit doesn't restart the auto count
}

function actionEditRiffSlot(bi, k, hold) { // click: rest → note → accent → tie (if the slot before is voiced) → rest; shift-click: staccato ↔ held
  const c = riff.beats[bi][k];
  const before = k > 0 ? riff.beats[bi][k - 1] : riff.beats[(bi + riff.beats.length - 1) % riff.beats.length].slice(-1);
  const afterAccent = before !== '.' ? '-' : '.';
  const next = hold ? ({ '.': 'o', '-': 'o', x: 'o', X: 'O', o: 'x', O: 'X' })[c]
                    : ({ '.': 'x', '-': '.', x: 'X', X: afterAccent, o: 'O', O: afterAccent })[c];
  const beats = riff.beats.slice();
  beats[bi] = setChar(beats[bi], k, next);
  const plays = riffPlays;
  setRiff(beats);
  riffPlays = plays; updateRiffCount(); // a hand edit doesn't restart the auto count
}

function actionCycleRiffDiv(bi) { // next subdivision for this beat; notes move to the nearest slot of the new grid
  const old = riff.beats[bi], divs = riffDivs();
  const n = divs[(divs.indexOf(old.length) + 1) % divs.length];
  const slots = new Array(n).fill('.');
  [...old].forEach((c, k) => {
    const j = Math.round(k * n / old.length);
    if (c !== '.' && j < n && slots[j] === '.') slots[j] = c;
  });
  const beats = riff.beats.slice();
  beats[bi] = slots.join('');
  const plays = riffPlays;
  setRiff(beats);
  riffPlays = plays; updateRiffCount(); // a hand edit doesn't restart the auto count
}

function typingText() { // is the keyboard busy in a text field? (they need their spaces, and '-' is a tie in the riff text)
  const a = document.activeElement;
  return !!a && a.tagName === 'INPUT' && /^(text|search)$/.test(a.type);
}

function actionFullscreenToggle() { // enter or leave browser fullscreen
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

function actionKeyDown(e) { // global keyboard shortcuts
  if (e.metaKey || e.ctrlKey || e.altKey) return; // never shadow a browser shortcut: Cmd-R and the rest arrive here as plain letters
  if (e.code === 'Escape') { // closes whatever is open; with nothing open, it is the way back when the controls are hidden
    const dialog = !el.panel.hidden || !el.bgPanel.hidden;
    openMenu(false); openBgPanel(false);
    if (!dialog && document.body.classList.contains('bare')) toggleBare();
    if (typingText()) document.activeElement.blur();
    return;
  }
  if (typingText()) return;
  switch (e.code) {
    case 'Space':                                                     // (a focused button would take the space as a click)
      if (document.activeElement instanceof HTMLButtonElement) document.activeElement.blur();
      if (playing) actionStop(); else actionPlay();
      break;
    case 'KeyP': actionPause(); break;
    case 'KeyT': actionTapSpace(); break;
    case 'KeyS': actionMuteToggle(); break;
    case 'KeyF': actionFullscreenToggle(); break;
    case 'KeyE': set('editor', collapsed); break;
    case 'KeyB': openBgPanel(el.bgPanel.hidden); break;
    case 'KeyM': toggleBare(); break;
    case 'KeyN': case 'KeyR': actionNewRiff(); break;                 // N (or R): next riff
    case 'KeyV': actionVaryRiff(); break;
    case 'BracketLeft':  actionRotateRiff(-1); break;                 // [ ]: rotate the riff a beat
    case 'BracketRight': actionRotateRiff(1); break;
    case 'Minus': case 'NumpadSubtract': actionSetBPM(Math.ceil(bpm / 5) * 5 - 5); break;   // to the next multiple of 5 down
    case 'Equal': case 'NumpadAdd':      actionSetBPM(Math.floor(bpm / 5) * 5 + 5); break;  // and up
    default: return;
  }
  e.preventDefault();
}

function stepsSelValue() {
  if (steps === 24) return timeSig === '6/8' ? '24_68' : '24_34';
  return String(steps);
}

function loadBuiltInPattern(p) {
  const newTimeSig = p.timeSig || '4/4';
  if (p.steps !== steps || newTimeSig !== timeSig) {
    timeSig = newTimeSig;
    steps   = p.steps;
    set('meter', stepsSelValue(), { apply: false });
    pattern     = VOICES.map(() => new Array(steps).fill(false));
    fillPattern = VOICES.map(() => new Array(getFillLength()).fill(false));
  }
  deserializePattern(`tempo=${bpm}; drums=${p.drums}; fill=${p.fill}`);
  updatePatternText();
}

// --- Store ---
const STORE = 'riffhound.drums.v1';
const store = { settings: {} };

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    if (saved.settings) Object.assign(store.settings, saved.settings);
  } catch (e) {}
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {}
  }, 250);
}

// --- Parts: what wears which colour ---
const parts = { control: [], drums: [], riff: [] };
function tint(part, colour) { parts[part].forEach(e => e.style.setProperty('--fg', PHOSPHOR[colour])); }

// --- What the settings drive ---
function applyBPM(v) { // the tempo changed: menu, tempo field, keys, tap or pattern text
  const oldBpm = bpm;
  bpm = v;
  el.bpmDisplay.value = bpm;
  if (bpm === oldBpm || booting) return;
  if (playing) {
    // Preserve current position (including the fraction of the step) when changing tempo
    const now = ctx.currentTime;
    const oldDur = (60 / oldBpm) / 2;
    startTime = now - ((now - startTime) / oldDur) * stepDuration();
  }
  updatePatternText();
}

function applyMeter(v) { // '16', '24_34', '24_68' or '32'
  timeSig = v === '24_68' ? '6/8' : v === '24_34' ? '3/4' : '4/4';
  if (booting) steps = parseInt(v, 10);
  else actionSetSteps(parseInt(v, 10));
}

function applyEditor(on) { // expand the drum grid into the editor, or collapse it to the mini display
  collapsed = !on;
  document.body.classList.toggle('collapsed', collapsed);
  if (!booting) refreshLayout();
}

function applyRiffBars(n) {
  if (booting || !riff) riffBars = n;
  else actionSetRiffBars(n);
}

function actionTypeRiff(box) { // the riff text was edited
  const { riffPart, chordPart } = splitRiffText(box.value);
  const beats = parseRiff(riffPart);
  const chords = chordPart === null ? [] : parseChords(chordPart);
  box.classList.toggle('bad', !beats || !chords);
  if (beats && chords) { setChords(chords); setRiff(beats, true); }
}

function actionTypeChords(box) { // the chord progression was edited
  const chords = parseChords(box.value);
  box.classList.toggle('bad', !chords);
  if (chords) setChords(chords);
}

// --- set / sync ---
// set() is the only thing that writes a setting. sync() is the only thing that writes its controls, and never
// fires events, so a change can come from anywhere without the UI arguing with itself.
const controls = {};        // setting name -> the element to reflect into
const headToggles = {};     // setting name -> { box, on }: the switch in a menu item's own line
const rings = {};           // colour setting name -> its row of rings
const AFTER = { layout: () => refreshLayout() };

function coerce(def, v) {
  if (def.type === 'toggle') return !!v;
  if (def.type === 'range') {
    const n = Number(v);
    return Number.isFinite(n) ? clamp(Math.round(n / def.step) * def.step, def.min, def.max) : def.def;
  }
  if (def.open) return String(v ?? '');    // taken on trust: the list arrives after the saved value does
  const opts = def.type === 'colour' ? COLOURS : typeof def.options === 'function' ? def.options() : def.options;
  return opts.some(o => o.v === v) ? v : def.def;
}

function set(name, value, opts = {}) { // opts.apply === false: the value is already in force, only record it; opts.quiet: don't save
  const def = DEF[name];
  if (!def || def.widget) return;          // unknown setting: ignore, never throw

  const v = state[name] = coerce(def, value);
  if (def.css) root.style.setProperty(def.css, v + (def.unit || ''));
  if (def.flag) root.dataset[def.flag] = v === true ? 'on' : v === false ? 'off' : v;
  if (def.apply && opts.apply !== false) def.apply(v);

  sync(name);
  if (!opts.quiet) {
    (def.after || '').split(',').filter(Boolean).forEach(a => AFTER[a]());
    if (!def.volatile) store.settings[name] = v;
    save();
  }
}

function sync(name) {
  const def = DEF[name], c = controls[name], v = state[name];
  const head = headToggles[name];
  if (head) head.box.checked = head.on(v);
  const dots = rings[name];
  if (dots) [...dots.children].forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (name === 'backgroundLevel') {        // the picker's copy of the slider
    if (document.activeElement !== el.bgLevel) el.bgLevel.value = v;
    el.bgLevelOut.value = v + '%';
  }
  if (!c) return;

  if (def.type === 'choice') {
    [...c.children].forEach(b => b.classList.toggle('active', b.dataset.v === v));
  } else if (def.type === 'select') {
    // Rebuilt every time, since the list is whatever it is now. A value no longer on it stays, and says so
    const opts = def.options().slice();
    if (v && !opts.some(o => o.v === v)) opts.push({ v, label: v + ' (missing)' });
    c.replaceChildren(...opts.map(o => new Option(o.label, o.v)));
    c.value = v;
  } else if (def.type === 'toggle') {
    c.checked = v;
  } else if (document.activeElement !== c) {
    c.value = v;
  }

  const out = c.closest('.setting')?.querySelector('output');
  if (out) out.value = v + (def.suffix || def.unit || '');
}

// --- The menu, built from the registry ---
function ringsFor(name) { // the colour choice: five rings, only the chosen one filled, in its own colour
  const dots = document.createElement('span');
  dots.className = 'rings';
  dots.append(...COLOURS.map(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ring';
    b.dataset.v = c.v;
    b.title = c.label;
    b.style.setProperty('--c', PHOSPHOR[c.v]);
    b.onclick = () => set(name, c.v);
    return b;
  }));
  rings[name] = dots;
  return dots;
}

function rowFor(def) {
  const row = document.createElement('div');
  row.className = 'setting';
  if (def.tip) row.title = def.tip;
  if (def.label) {
    const label = document.createElement('label');
    label.textContent = def.label;
    row.append(label);
  }

  if (def.type === 'choice') {
    const sw = document.createElement('div');
    sw.className = 'switch';
    def.options.forEach(o => {
      const b = document.createElement('button');
      b.dataset.v = o.v;
      b.textContent = o.label;
      b.onclick = () => set(def.name, o.v);
      sw.append(b);
    });
    row.append(sw);
    controls[def.name] = sw;
  } else if (def.type === 'select') {
    const sel = document.createElement('select');
    sel.onchange = () => { set(def.name, sel.value); sel.blur(); };   // (a list that keeps the focus takes the keys)
    row.append(sel);
    controls[def.name] = sel;
  } else if (def.type === 'toggle') {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.onchange = () => set(def.name, box.checked);
    row.append(box);
    controls[def.name] = box;
  } else if (def.type === 'colour') {
    row.append(ringsFor(def.name));
  } else if (def.type === 'range') {
    const slider = document.createElement('input');
    Object.assign(slider, { type: 'range', min: def.min, max: def.max, step: def.step });
    slider.oninput = () => set(def.name, slider.value);
    const val = document.createElement('span');
    val.className = 'val';
    val.append(document.createElement('output'));
    row.append(slider, val);
    controls[def.name] = slider;
  } else if (def.type === 'text') {         // a text form of something on the stage; what is typed is applied as it is typed
    const box = document.createElement('input');
    Object.assign(box, { type: 'text', className: 'search', spellcheck: false, placeholder: def.placeholder || '' });
    box.autocomplete = 'off';
    box.oninput = () => def.input(box);
    row.classList.add('wide');
    row.append(box);
    el[def.el] = box;
  } else if (def.type === 'pick') {         // a list to take something from; it holds no choice of its own
    const sel = document.createElement('select');
    if (def.literal) sel.className = 'literal';
    sel.onchange = () => {
      if (sel.value !== '') def.pick(parseInt(sel.value, 10));
      sel.value = '';
      sel.blur();
    };
    row.append(sel);
    el[def.el] = sel;
  } else if (def.type === 'actions') {
    const sw = document.createElement('div');
    sw.className = 'switch';
    def.buttons.forEach(a => {
      const b = document.createElement('button');
      b.textContent = a.label;
      b.title = a.tip;
      b.onclick = a.run;
      sw.append(b);
    });
    row.classList.add('wide');
    row.append(sw);
  }
  return row;
}

// One menu item: its name, the pane's show/hide switch and the part's colour if it has them, and a button that
// opens the item's rows underneath. Opening one closes the others.
function group(title, rows, toggle, colour) {
  const box = document.createElement('div');
  box.className = 'item tinted';

  const head = document.createElement('div');
  head.className = 'item-head';
  const name = document.createElement('button');
  name.type = 'button';
  name.className = 'item-name';
  name.textContent = title;
  const expand = document.createElement('button');
  expand.type = 'button';
  expand.className = 'expand';
  expand.title = 'More settings';

  const body = document.createElement('div');
  body.className = 'group';
  body.append(...rows);

  box.show = open => {
    body.hidden = !open;
    box.classList.toggle('open', open);
    expand.textContent = open ? '▾' : '▸';
    expand.setAttribute('aria-expanded', open);
  };
  const flip = () => {
    const open = body.hidden;
    [...el.panel.children].forEach(it => it !== box && it.show && it.show(false));
    box.show(open);
  };
  name.onclick = expand.onclick = flip;
  box.show(false);

  if (toggle) {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.title = 'Show ' + DEF[toggle].label.toLowerCase();
    cb.onchange = () => set(toggle, cb.checked);
    headToggles[toggle] = { box: cb, on: v => !!v };
    head.append(cb);
  } else {
    const gap = document.createElement('span');
    gap.className = 'nobox';
    head.append(gap);
  }
  head.append(name);
  if (colour) head.append(ringsFor(colour));
  head.append(expand);
  box.append(head, body);
  return box;
}
