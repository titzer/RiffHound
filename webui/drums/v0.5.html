   re-roll one voice.`,
  `<b>Riff.</b> A one-note rhythm riff that plays in sync with the drums. It is drawn centered on its own scale
   (large when it is a single bar), and lines up with the drum columns when it is as long as the drum pattern.
   Each box is a beat; the number under it is how many slots it is split into (1 quarter, 2 eighths, 3 triplet,
   4 sixteenths, 5 quintuplet, 6 sextuplet; in 6/8: 1, 3, 6): click the number to cycle it. Click a slot to cycle
   rest → note → accent (&gt;) → tie → rest; shift-click switches a note between staccato and long. A tie
   (offered only when the slot before it is voiced) carries the previous note on through that slot, including
   across a beat boundary.`,
  `<b>Riff text.</b> One character per slot (<code>.</code> rest, <code>x</code> staccato, <code>X</code> accent,
   <code>o</code> long, <code>O</code> accented long, <code>-</code> tie), beats separated by commas, bars by
   <code>|</code>. Chords is a simple progression, one chord per play of the riff: <code>E E A A</code> plays the
   riff twice on E and twice on A, then repeats. Only the root matters (<code>Am7</code> is A), pitched in the
   octave nearest the selected note; the box for the chord being played lights up. It is carried in the riff text
   as <code>; chords=…</code>.`,
  `<b>Riff generator.</b> New rolls a fresh riff from the generator's settings; Vary makes a small change; Auto
   vary does a Vary every N plays, so the riff drifts toward wherever the settings are. History holds the last
   ${RIFF_HISTORY_MAX} riffs, newest first: a riff goes in once it has played through unchanged, whether it came
   from New, Vary, Auto or your own edits.`,
];

function helpRows() {
  const keys = document.createElement('div');
  keys.className = 'keys';
  KEYS.forEach(([key, what]) => {
    const k = document.createElement('kbd'), w = document.createElement('span');
    k.textContent = key; w.textContent = what;
    keys.append(k, w);
  });
  return [keys, ...HELP.map(html => {
    const p = document.createElement('p');
    p.className = 'prose';
    p.innerHTML = html;
    return p;
  })];
}

function buildPanel() {
  const rows = g => SETTINGS.filter(d => d.group === g && !d.head).map(rowFor);
  const drums    = group('Drums', rows('drums'), 'drumPane', 'drumColour');
  const drumGen  = group('Drum generator', rows('drumgen'));
  const riffs    = group('Riff', rows('riff'), 'riffPane', 'riffColour');
  const riffGen  = group('Riff generator', rows('riffgen'));
  el.panel.replaceChildren(
    group('Playback', rows('playback')),
    group('Display', rows('display'), null, 'controlColour'),
    drums, drumGen, riffs, riffGen,
    group('Help', helpRows()));
  // each part's settings wear that part's colour, so the menu says which pane a control belongs to
  parts.drums.push(drums, drumGen);
  parts.riff.push(riffs, riffGen);
}

// =========================
// Backgrounds
// =========================
// An animation behind the display, as in the karaoke app and out of the same folder: karaoke/backgrounds, beside
// this page's own folder. A page cannot list a folder, so the list is whatever a RiffHound server says it has (the
// one that served this page, and the ones the karaoke app remembers), and failing that the names that were there
// when this was written, so the page has its pictures when it is opened straight off the disk.
const BG_DIR = '../karaoke/backgrounds/';
const BG_BUILTIN = [
  'amber_city.gif', 'barrel.gif', 'beach1.gif', 'beach2.gif', 'beach3.gif', 'beach_pixel.gif',
  'beach_sunset.gif', 'bridge.gif', 'city_drive_red.gif', 'computer_room.gif', 'cube.gif',
  'cyber_city1.gif', 'cyber_city2.gif', 'cyber_city3.gif', 'cyber_city4.gif', 'cyber_city5.gif',
  'ferrari.webp', 'field1.gif', 'field2.gif', 'fireplace1.gif', 'fireplace2.gif', 'fireplace3.gif',
  'fireplace4.gif', 'fireplace5.gif', 'giphy.gif', 'girls.gif', 'hacking_blue.gif', 'hexagons.gif',
  'line_wave.gif', 'mario_kart.gif', 'matrix2.gif', 'matrix3.gif', 'pole_city.gif',
  'pole_sunset.gif', 'pole_sunset2.gif', 'sunset2.gif', 'sunset3.gif', 'sunset4.gif', 'sunset5.gif',
  'sunset6.gif', 'sunset7.gif', 'sunset_black.gif', 'sunset_blue.gif', 'sunset_clouds.gif',
  'sunset_drive.gif', 'sunset_goko.gif', 'sunset_pink.gif', 'sunset_purple.gif',
  'sunset_purple2.gif', 'sunset_purple3.gif', 'sunset_purple4.gif', 'sunset_pyramid.gif',
  'waterfall.gif'
];
const BG_TILES = 16;
let bgServers = [];         // the servers that answered: { url, backgrounds: [name, ...] }
let backdropUrl = '', backdropProbe = null;
let bgShown = [], bgPick = -1;
let bgKept = false;         // the picker closed on a choice, not a retreat

async function askBackgrounds(url) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 2500);
  try {
    const got = await (await fetch(url + '/api/backgrounds', { signal: ctl.signal })).json();
    return { url, backgrounds: Array.isArray(got.backgrounds) ? got.backgrounds : [] };
  } finally {
    clearTimeout(timer);
  }
}

async function findBackgroundServers() {
  const urls = new Set();
  if (location.protocol.startsWith('http')) urls.add(location.origin);
  try {
    const karaoke = JSON.parse(localStorage.getItem('riffhound.karaoke.v1') || '{}');
    (karaoke.servers || []).forEach(s => s && s.url && urls.add(s.url));
  } catch (e) {}
  if (!urls.size) return;
  bgServers = (await Promise.all([...urls].map(u => askBackgrounds(u).catch(() => null)))).filter(Boolean);
  sync('background');
  applyBackground();
  if (!el.bgPanel.hidden) renderBackgrounds(el.bgSearch.value);
}

const bgLabel = n => n.replace(/\.\w+$/, '').replace(/[_\-]+/g, ' ');

function backgroundNames() {
  return [...new Set(BG_BUILTIN.concat(bgServers.flatMap(s => s.backgrounds)))]
    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
}

function backgroundOptions() {
  return [{ v: '', label: 'Off' }, ...backgroundNames().map(n => ({ v: n, label: bgLabel(n) }))];
}

function backgroundUrl(name) { // on the server that lists it, else in the folder
  const from = bgServers.find(s => s.backgrounds.includes(name));
  return new URL(from ? from.url + '/backgrounds/' + encodeURIComponent(name) : BG_DIR + encodeURIComponent(name), location.href).href;
}

function showBackdrop(url) { // the flag follows the picture, not the setting: a name that did not load is a black stage
  el.backdrop.hidden = !url;
  el.backdrop.style.backgroundImage = url ? `url("${url}")` : '';
  root.dataset.backdrop = url ? 'on' : 'off';
}

function applyBackground(name = state.background) { // the setting's picture, or the one the picker is previewing
  if (!name) {
    backdropUrl = '';
    backdropProbe = null;
    showBackdrop('');
    return;
  }
  const url = backgroundUrl(name);
  if (url === backdropUrl) return;         // setting the same picture again would start its loop again
  backdropUrl = url;
  // A CSS background does not say whether it loaded, so an image that is never shown finds out first; the picture
  // already up stays up until it has. A later choice overtakes this one by no longer being the probe.
  const probe = backdropProbe = new Image();
  probe.onload = () => { if (probe === backdropProbe) showBackdrop(url); };
  probe.onerror = () => { if (probe === backdropProbe) showBackdrop(''); };
  probe.src = url;
}

function fuzzy(q, s) { // subsequence match: every letter of the query, in order
  q = q.toLowerCase(); s = s.toLowerCase();
  let qi = 0;
  for (let i = 0; i < s.length && qi < q.length; i++) if (s[i] === q[qi]) qi++;
  return qi === q.length;
}

// --- Background picker (B) ---
// A grid of live previews in the stage's top-left corner; the search box narrows it, arrows walk the grid, Enter
// or a click sets the background. "Off" is the first tile while nothing has been typed.
function renderBackgrounds(query) {
  const q = String(query || '').trim();
  const names = backgroundNames();
  const hits = names.filter(n => fuzzy(q, bgLabel(n)) || fuzzy(q, n));
  const room = q ? BG_TILES : BG_TILES - 1;            // the Off tile, when it is there, takes one of them
  bgShown = (q ? [] : ['']).concat(hits.slice(0, room));
  if (bgPick >= bgShown.length) bgPick = bgShown.length - 1;
  el.bgGrid.replaceChildren(...bgShown.map((n, i) => {
    const tile = document.createElement('div');
    tile.className = 'bgtile' + (n === state.background ? ' on' : '') + (i === bgPick ? ' pick' : '');
    if (n) tile.style.backgroundImage = `url("${backgroundUrl(n)}")`;
    const tag = document.createElement('span');
    tag.textContent = n ? bgLabel(n) : 'Off';
    tile.append(tag);
    tile.onclick = () => { pickBackground(n); openBgPanel(false); };
    return tile;
  }));
  el.bgHint.textContent = !names.length ? 'no backgrounds'
    : hits.length > room ? `${hits.length} match — showing ${room}, type more to narrow`
    : hits.length ? `${hits.length} of ${names.length}` : 'no match';
}

function pickBackground(name) {
  bgKept = true;
  set('background', name);
  [...el.bgGrid.children].forEach((tile, i) => tile.classList.toggle('on', bgShown[i] === name));
}

function moveBgPick(by) { // walking the grid previews each picture behind the display; closing without choosing puts the setting's own back
  if (!bgShown.length) return;
  bgPick = bgPick < 0 ? (by > 0 ? 0 : bgShown.length - 1) : clamp(bgPick + by, 0, bgShown.length - 1);
  [...el.bgGrid.children].forEach((tile, i) => tile.classList.toggle('pick', i === bgPick));
  el.bgGrid.children[bgPick]?.scrollIntoView({ block: 'nearest' });
  applyBackground(bgShown[bgPick]);
}

function openBgPanel(open) {
  if (!open && !el.bgPanel.hidden && !bgKept) applyBackground();   // undo the preview
  el.bgPanel.hidden = !open;
  if (!open) return;
  openMenu(false);
  bgPick = -1;
  bgKept = false;
  sync('backgroundLevel');
  renderBackgrounds(el.bgSearch.value);
  el.bgSearch.focus();
  el.bgSearch.select();
}

function actionBgSearchKey(e) {
  const cols = 4;
  if (e.key === 'ArrowRight') moveBgPick(1);
  else if (e.key === 'ArrowLeft') moveBgPick(-1);
  else if (e.key === 'ArrowDown') moveBgPick(cols);
  else if (e.key === 'ArrowUp') moveBgPick(-cols);
  else if (e.key === 'Enter') { // with nothing picked, the first real match: type "rain", press Enter, done
    const i = bgPick >= 0 ? bgPick : bgShown.findIndex(n => n);
    if (i >= 0) { pickBackground(bgShown[i]); openBgPanel(false); }
  }
  else return;
  e.preventDefault();
}

// =========================
// Menu and header
// =========================
function openMenu(open) {
  el.panel.hidden = !open;
  el.menuBtn.setAttribute('aria-expanded', open);
  el.menuBtn.classList.toggle('active', open);
  if (open) openBgPanel(false);
  peekBare(open);
}

// The menu lives in the header, so with the header hidden it would open into nothing. Opening it brings the
// header back for as long as it is up; closing it hides the header again, if that is where it was.
let bareResume = false;

function peekBare(open) {
  const bare = document.body.classList.contains('bare');
  if (open && bare) { toggleBare(); bareResume = true; }
  else if (!open && bareResume && el.panel.hidden) toggleBare();
}

function toggleBare() { // hide or show the header; the stage takes the room
  document.body.classList.toggle('bare');
  bareResume = false;        // asked for by hand: nothing to resume
  refreshLayout();
}

function updateTransport() { // the keys that would do nothing right now are unlit
  [[el.btnPlay, playing], [el.btnPause, !playing], [el.btnStop, !playing]].forEach(([b, off]) => {
    if (off && document.activeElement === b) b.blur();   // a disabled button that keeps the focus swallows the keyboard
    b.disabled = off;
  });
  el.btnPause.classList.toggle('active', paused);
}

// =========================
// Wiring (once)
// =========================
function init() {
  // Cache DOM
  ['btnPlay', 'btnPause', 'btnStop', 'btnMute', 'btnTap', 'bpmDisplay', 'titleTags', 'repeatBoxes', 'menuBtn', 'panel', 'fsBtn',
   'backdrop', 'bgPanel', 'bgSearch', 'bgGrid', 'bgLevel', 'bgLevelOut', 'bgHint',
   'drumPane', 'ballLane', 'ball', 'ball2', 'padMain', 'padFill', 'grid',
   'riffPane', 'riffChordBoxes', 'riffCount', 'riffBallLane', 'riffBall', 'riffBall2', 'riffPad', 'riffLane'].forEach(id => { el[id] = $(id); });
  parts.control.push(document.querySelector('header'), el.bgPanel);   // the picker is a control, so it wears the menu's colour
  parts.drums.push(el.drumPane);
  parts.riff.push(el.riffPane);

  // Settings: the menu, then the defaults, then whatever was saved over them
  load();
  buildPanel();
  booting = true;
  STATEFUL.forEach(d => set(d.name, d.def, { quiet: true }));
  STATEFUL.forEach(d => d.name in store.settings && set(d.name, store.settings[d.name], { quiet: true }));
  booting = false;

  // Initialize pattern
  pattern = VOICES.map(() => new Array(steps).fill(false));
  fillPattern = VOICES.map(() => new Array(getFillLength()).fill(false));

  // Wire events to actions
  el.btnPlay.addEventListener('click', actionPlay);
  el.btnPause.addEventListener('click', actionPause);
  el.btnStop.addEventListener('click', actionStop);
  el.btnMute.addEventListener('click', actionMuteToggle);
  el.btnTap.addEventListener('click', actionTapSpace);
  el.menuBtn.addEventListener('click', () => openMenu(el.panel.hidden));
  el.fsBtn.addEventListener('click', actionFullscreenToggle);

  el.bpmDisplay.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 3);
  });
  el.bpmDisplay.addEventListener('change', e => {
    const val = parseInt(e.target.value, 10);
    if (val >= 30 && val <= 300) {
      actionSetBPM(val);
    } else {
      e.target.value = Math.round(bpm).toString();
    }
  });
  el.bpmDisplay.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

  // the same setting as the menu's "Background level", from a second control
  el.bgLevel.addEventListener('input', () => set('backgroundLevel', el.bgLevel.value));
  el.bgSearch.addEventListener('input', () => { bgPick = -1; renderBackgrounds(el.bgSearch.value); });
  el.bgSearch.addEventListener('keydown', actionBgSearchKey);

  window.addEventListener('pointerdown', e => { // a click elsewhere closes what is open
    if (!el.panel.hidden && !e.target.closest('.menu')) openMenu(false);
    if (!el.bgPanel.hidden && !e.target.closest('#bgPanel')) openBgPanel(false);
  });
  window.addEventListener('resize', refreshLayout);
  document.addEventListener('fullscreenchange', () => {
    el.fsBtn.classList.toggle('active', !!document.fullscreenElement);
    refreshLayout();
  });
  window.addEventListener('keydown', actionKeyDown);

  // First render
  initPresetSelect();
  renderRiffHistory();
  renderRepeatBoxes();
  renderGrid();
  updateCellActivity(1); // Initialize with first iteration state
  updateTransport();
  updateMuteButton();

  // Start with a random pattern
  actionRandom(); // This also calls updatePatternText()

  findBackgroundServers();
}

// Boot
init();
