<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RiffHound Drum Machine v0.5</title>
<style>
  /* The look and the manners are the karaoke app's: a CRT with one phosphor colour per part, the transport in a
     header, and every setting behind the menu button. */
  * { box-sizing: border-box; }

  :root {
    --fg: #46ff7a;          /* fallback; each part's colour is set on the part itself (tint() in the script) */
    --fill-fg: #ffb43c;     /* the fill's colour, wherever a fill is drawn */
    --pad: 16px;
    --scan-pitch: 2px;      /* from here down: overwritten by the settings */
    --brightness: 140%;
    --bg-level: 40%;
    --pane-fill: 100%;
    --zoom: 100;
    --bounce: 100;
    --mini-h: calc(2.2vh * var(--zoom) / 100);   /* row height of the collapsed drum grid */
    --ball: calc(2.6vh * var(--zoom) / 100);
  }

  /* Whatever is drawn for the fill wears the fill's colour, in whichever part it sits */
  :is(.cell.fill, .repeatBox.typeB, #padFill, .fillLabel, .endLabel, .riffDiv.trip) { --fg: var(--fill-fg); }

  /* The shades of a colour. They are mixed again wherever --fg is set, since the :root versions were resolved
     against the :root colour and only inherit their result. */
  :root, .tinted, :is(.cell.fill, .repeatBox.typeB, #padFill, .fillLabel, .endLabel, .riffDiv.trip) {
    --dim: color-mix(in srgb, var(--fg) 52%, #000);
    --panel: color-mix(in srgb, var(--fg) 11%, #000);
    --hot: color-mix(in srgb, var(--fg) 34%, #000);
    --glow: color-mix(in srgb, var(--fg) 55%, transparent);
    /* surfaces on the stage, which the Panel opacity setting fades so a background shows through */
    --cell: color-mix(in srgb, var(--panel) var(--pane-fill), transparent);
    --cell-beat: color-mix(in srgb, color-mix(in srgb, var(--fg) 18%, #000) var(--pane-fill), transparent);
    --cell-bar: color-mix(in srgb, color-mix(in srgb, var(--fg) 27%, #000) var(--pane-fill), transparent);
    --cell-hot: color-mix(in srgb, var(--hot) var(--pane-fill), transparent);
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--fg);
    background: #040604;
    font: 700 14px/1.4 ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    letter-spacing: .1em;
    text-shadow: 0 0 7px var(--glow);
    filter: brightness(var(--brightness));
  }

  .tinted { color: var(--fg); text-shadow: 0 0 7px var(--glow); }

  /* ---- header ---------------------------------------------------------- */

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    padding: 5px var(--pad);
    text-transform: uppercase;
  }

  /* Bare mode (M): nothing but the music */
  body.bare header { display: none !important; }

  h1 { margin: 0; font-size: 21px; white-space: nowrap; }
  #titleTags { color: var(--dim); font-size: 13px; margin-left: 1em; text-transform: none; }
  .spacer { flex: 1; }

  button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }

  .switch { display: inline-flex; }

  button {
    padding: 6px 10px;
    border: 1px solid var(--dim);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    text-shadow: inherit;
    text-transform: inherit;
  }

  /* Overlap the borders instead of dropping one */
  .switch button + button { margin-left: -1px; }
  .switch button.active, .switch button:hover:not(:disabled) { position: relative; z-index: 1; }

  button.active, button.flash, button:hover:not(:disabled) {
    color: var(--fg);
    background: var(--hot);
    border-color: var(--fg);
    text-shadow: 0 0 10px var(--fg);
  }

  /* The keys that would do nothing right now read as unlit */
  button:disabled { opacity: .35; cursor: default; }

  /* Loop boxes: one per time through the pattern, the one being played lit. Click one to jump to it */
  .loop { display: flex; align-items: center; gap: 8px; }
  .strip-label { font-size: 11px; color: var(--dim); }
  #repeatBoxes { display: flex; gap: 4px; }
  .repeatBox {
    min-width: 34px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 1px solid var(--dim);
    background: var(--panel);
    color: var(--dim);
    letter-spacing: 0;
    text-shadow: 0 0 7px var(--glow);
    cursor: pointer;
  }
  .repeatBox.active {
    color: var(--fg);
    border-color: var(--fg);
    background: var(--hot);
    text-shadow: 0 0 10px var(--fg);
    box-shadow: 0 0 12px -2px var(--fg);
  }

  /* Big three-digit tempo, top right. It is a text field: click it and type */
  .bpm-num {
    flex: none;
    width: 3.3ch;
    height: 1em;             /* a text field would otherwise stand a full line high, and the header with it */
    padding: 0;
    border: 0;
    border-bottom: 2px solid transparent;
    background: none;
    outline: none;
    text-align: right;
    font-size: clamp(30px, 4.4vw, 48px);
    line-height: .9;
    letter-spacing: 0;
    color: var(--fg);
    text-shadow: 0 0 14px var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .bpm-num:focus { border-bottom-color: var(--fg); }

  /* ---- settings menu --------------------------------------------------- */

  .menu { position: relative; }
  .tools { display: flex; align-items: center; gap: 5px; }

  .menu-btn {
    display: grid;
    gap: 4px;
    place-content: center;
    width: 40px;
    height: 34px;
    padding: 0;
  }

  .menu-btn i { width: 20px; height: 3px; background: currentColor; }

  .fs-ico {
    width: 18px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    width: 420px;
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    display: grid;
    gap: 10px;
    padding: 14px;
    border: 2px solid var(--fg);
    box-shadow: 0 0 24px -4px var(--fg);
    /* Semi-transparent, with what is behind it blurred, so the display still reads through it */
    background: #050705b3;
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }

  .panel[hidden] { display: none; }

  /* One row per setting: name on the left, control on the right, readout after it */
  .setting {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    font-size: 12px;
  }

  .setting > label { flex: 1; min-width: 0; }
  .setting output { order: 3; min-width: 3.2em; text-align: right; color: var(--fg); white-space: nowrap; }
  .setting .val { order: 3; }
  .setting .switch { flex: none; max-width: 262px; }
  .setting .switch button { flex: 1; padding: 5px 6px; font-size: 11px; }

  /* A row that needs the panel's whole width: a text field, or a line of action buttons */
  .setting.wide { display: grid; gap: 4px; justify-content: stretch; }
  .setting.wide .switch { display: flex; max-width: none; }

  .setting select {
    flex: none;
    width: 262px;
    padding: 4px 6px;
    border: 1px solid var(--dim);
    border-radius: 0;
    background: var(--panel);
    text-shadow: inherit;
    text-transform: uppercase;
    outline: none;
    cursor: pointer;
  }

  .setting select:focus, .setting select:hover { border-color: var(--fg); }

  .search {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--dim);
    background: var(--panel);
    outline: none;
  }

  .search:focus { border-color: var(--fg); }
  .search::placeholder { color: var(--dim); opacity: .7; }

  /* Pattern and riff text is case-sensitive (x is a note, X an accent), so it is shown as typed and set tight */
  .setting input[type=text], .setting select.literal { text-transform: none; letter-spacing: 0; }
  .setting input.bad { border-color: var(--fg); border-style: dashed; color: var(--dim); }

  /* The menu's items, closed: a name, a show/hide switch for the panes, the part's colour, and a button that
     opens the rest. One open at a time. */
  .panel .item { border-top: 1px solid var(--dim); padding-top: 6px; }
  .item-head { display: flex; align-items: center; gap: 12px; }
  .item-name {
    flex: 1;
    padding: 4px 0;
    border: 0;
    background: none;
    text-align: left;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: pointer;
  }
  .item.open .item-name, .item-name:hover:not(:disabled) { color: var(--fg); background: none; }
  .item-head input[type=checkbox], .item-head .nobox { flex: none; width: 16px; height: 16px; }
  .item-head .expand { flex: none; width: 30px; padding: 2px 0; font-size: 12px; }
  .rings { display: flex; gap: 6px; }
  .ring {
    width: 16px; height: 16px;
    padding: 0;
    border: 2px solid var(--dim);
    border-radius: 50%;
    background: none;
    cursor: pointer;
  }
  .ring:hover:not(:disabled) { border-color: var(--fg); background: none; }
  .ring.on, .ring.on:hover:not(:disabled) { border-color: var(--c); background: var(--c); box-shadow: 0 0 8px var(--c); }
  .group { display: grid; gap: 9px; padding-top: 9px; }
  .group[hidden] { display: none; }

  .val { display: flex; align-items: center; gap: 8px; }

  /* Help: the keys, then the long form */
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12px; }
  .keys kbd { font: inherit; color: var(--fg); white-space: nowrap; }
  .keys span { color: var(--dim); }
  .prose { margin: 0; font-size: 11px; font-weight: 400; line-height: 1.55; letter-spacing: .03em; text-transform: none; color: var(--dim); }
  .prose code { font: inherit; font-weight: 700; color: var(--fg); }

  input[type=checkbox] {
    appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 2px solid var(--dim);
    background: var(--panel);
    cursor: pointer;
  }

  input[type=checkbox]:checked {
    border-color: var(--fg);
    background: var(--fg);
    box-shadow: 0 0 10px var(--fg);
  }

  input[type=range] {
    appearance: none;
    flex: none;
    width: 168px;
    height: 20px;
    background: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-runnable-track {
    height: 8px;
    border: 1px solid var(--dim);
    background: repeating-linear-gradient(90deg, var(--dim) 0 3px, #0000 3px 8px);
  }

  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 20px;
    margin-top: -6px;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }

  input[type=range]::-moz-range-track {
    height: 8px;
    border: 1px solid var(--dim);
    background: repeating-linear-gradient(90deg, var(--dim) 0 3px, #0000 3px 8px);
  }

  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 20px;
    border: 0;
    border-radius: 0;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }

  /* ---- stage ----------------------------------------------------------- */

  /* The two panes share the height left under the header. The CRT is the palette and the bloom above, a vignette
     (::before) and the scanline raster (::after); both lie over everything on the stage. */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }

  .stage::before,
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .stage::before {
    z-index: 19;
    background: radial-gradient(120% 90% at 50% 45%, #0000 55%, #000c);
  }

  .stage::after {
    z-index: 20;
    background: repeating-linear-gradient(
      #0000 0 calc(var(--scan-pitch) / 2),
      #000000a0 calc(var(--scan-pitch) / 2) var(--scan-pitch));
  }

  :root[data-scan="off"] .stage::after { display: none; }

  /* The background animation: under everything on the stage, dimmed by opacity against the stage's black */
  .backdrop {
    position: absolute;
    inset: 0;
    background: center / cover no-repeat;
    opacity: var(--bg-level);
    pointer-events: none;
    user-select: none;
  }

  .backdrop[hidden] { display: none; }

  /* Over a picture the phosphor has nothing dark to be bright against, so marks and lettering get a black edge
     as well as their bloom. Surfaces do not: a shadow behind a faded panel would undo the fading. */
  :root[data-backdrop="on"][data-ink="on"] { --ink: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000, 0 2px 4px #000; }
  :root[data-backdrop="on"][data-ink="on"] .pane { text-shadow: var(--ink), 0 0 7px var(--glow); }
  :root[data-backdrop="on"][data-ink="on"] .chordBox.active { text-shadow: var(--ink), 0 0 16px var(--fg); }
  :root[data-backdrop="on"][data-ink="on"] .ball {
    filter: drop-shadow(0 0 1.5px #000) drop-shadow(0 0 1.5px #000) drop-shadow(0 2px 4px #000);
  }

  .pane { position: relative; z-index: 4; }
  :root[data-drums="off"] #drumPane, :root[data-riff="off"] #riffPane { display: none; }

  /* ---- background picker (B) ------------------------------------------- */

  #bgPanel {
    top: 8px;
    left: var(--pad);
    width: min(760px, calc(100% - var(--pad) * 2));
    max-height: calc(100% - 16px);
    grid-template-rows: auto 1fr auto auto;
    overflow: hidden;
  }
  #bgPanel[hidden] { display: none; }
  #bgPanel > .setting { justify-content: flex-start; }
  #bgPanel > .setting > label { flex: none; }
  #bgPanel > .setting input[type=range] { flex: 1; }
  #bgPanel > .search { font-size: clamp(15px, 1.6vw, 22px); padding: .3em .45em; }
  #bgPanel > label { font-size: 13px; color: var(--dim); }
  .bggrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    min-height: 0;
    overflow-y: auto;
  }
  .bgtile {
    position: relative;
    aspect-ratio: 16 / 9;
    border: 2px solid var(--dim);
    background: #000 center / cover no-repeat;
    color: var(--dim);
    cursor: pointer;
    overflow: hidden;
  }
  .bgtile span {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 2px 6px;
    font-size: 12px;
    background: #050705b3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bgtile:hover, .bgtile.pick { border-color: var(--fg); color: var(--fg); }
  .bgtile.on { border-color: var(--fg); box-shadow: 0 0 12px var(--glow); color: var(--fg); }
  .bgtile.pick { box-shadow: inset 0 0 0 2px var(--fg); }

  /* ---- bouncing balls -------------------------------------------------- */

  /* bouncing-ball lanes: one above the drum grid (expanded or collapsed) and one above the riff */
  .ballLane { position: relative; height: calc((2.6vh * var(--zoom) + 7.4vh * var(--bounce)) / 100); pointer-events: none; }   /* hop = lane height - ball size */
  .ball { position: absolute; left: 0; bottom: 0; width: var(--ball); height: var(--ball); border-radius: 50%; background: var(--fg); box-shadow: 0 0 20px var(--fg); transform-origin: center bottom; will-change: transform; }
  #ball2 { transform: scale(0); }
  /* teleporter pads: one at each place a loop can end (drums: gap column after the main steps, and just past the fill;
     riff: just past its last beat). They hang below the lane across the rows (JS sets left/width/height), top edge level with the top row.
     The pad the current loop isn't heading for is dimmed; --hit flashes the pad that was just hit */
  .pad { position: absolute; top: 100%; left: 0; height: 7.5vh; border: 2px dashed var(--dim); background: var(--cell); color: var(--dim); display: flex; align-items: center; justify-content: center; line-height: 1; letter-spacing: 0; --hit: 0; box-shadow: 0 0 calc(var(--hit) * 4vh) calc(var(--hit) * 1vh) var(--fg); }
  .pad.dim { opacity: 0.25; }

  /* ---- drum grid ------------------------------------------------------- */

  #grid { padding: 0 6vw 0.5vh 1vw; display: grid; grid-template-columns: auto auto 1fr; column-gap: 6px; row-gap: 0; }
  .row { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; }
  /* per-voice mute: lit while the voice sounds, struck out while it is muted */
  button.voiceMute { min-width: 7ch; text-align: center; font-size: 1.8vh; padding: 0.4vh 0.4vw; color: var(--fg); text-transform: uppercase; }
  button.voiceMute.muted { opacity: .4; text-decoration: line-through; }
  /* per-voice randomize button */
  button.voiceRandom { background: none; border-color: transparent; padding: 1px 3px; font-size: 2.6vh; line-height: 1; letter-spacing: 0; }
  /* gapless grid: cells touch, separated by hairlines of whatever is behind them; beats are shaded a little lighter */
  .steps { display: grid; gap: 0; grid-auto-flow: column; width: 100%; }
  .cell { height: 6vh; border: 0 solid transparent; border-width: 0 1px 1px 0; background: var(--cell) padding-box; display: inline-flex; align-items: center; justify-content: center; user-select: none; position: relative; cursor: pointer; }
  .cell.beat:not(.on) { background-color: var(--cell-beat); }

  /* on cells: dim until the playhead reaches them, a little brighter on a bar start */
  .cell.on { background-color: var(--dim); }
  .cell.on.barStart { background-color: color-mix(in srgb, var(--fg) 68%, #000); }
  /* bar start circle */
  .cell.barStart::before { content: ''; position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: var(--dim); opacity: .45; pointer-events: none; }
  .cell.barStart.on::before { background: #040604; opacity: 1; }
  /* current column: a frame of full brightness, and the cells that sound are lit */
  body.playing .cell.columnActive { box-shadow: inset 0 0 0 3px var(--fg); }
  body.playing .cell.on.columnActive { background-color: var(--fg); box-shadow: 0 0 16px var(--fg); z-index: 1; }
  /* past cells (already played): burnt down */
  body.playing .cell.on.past { background-color: var(--hot); }
  /* muted voice: its cells are hatched, whatever the playhead is doing */
  .voiceMuted .cell.on { background: repeating-linear-gradient(135deg, var(--dim) 0 2px, #0000 2px 6px) padding-box !important; box-shadow: none !important; }
  /* inactive cells (the bars the fill replaces, or the fill while it is not due): almost invisible */
  .cell.inactive { opacity: .12; }
  /* gap column between main pattern and fill */
  .fillGap { pointer-events: none; }
  /* right-facing triangle on end-column and fill-start cells */
  .cell.endCol::after, .cell.fillStart::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40%; aspect-ratio: 1;
    clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
    background: var(--dim);
    opacity: .45;
    pointer-events: none;
  }
  .cell.endCol.on::after, .cell.fillStart.on::after { background: #040604; opacity: 1; }
  /* ruler row */
  .rulerCell { height: 3vh; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid transparent; letter-spacing: 0; }
  .rulerCell.beatNum { font-size: 1.4vh; color: var(--dim); }
  .rulerCell.barNum { font-size: 1.8vh; color: var(--fg); }
  .rulerCell.fillLabel, .rulerCell.endLabel { font-size: 1.6vh; color: var(--fg); text-shadow: 0 0 7px var(--glow); }
  body.playing .rulerCell.columnActive { border-color: var(--fg); }

  /* collapsed editor: read-only mini view of all five voices */
  body.collapsed .voiceRandom { display: none; }
  /* left margin holds the per-voice mute buttons (the incoming ball flies in above them); right margin holds the end-of-fill pad */
  body.collapsed #grid { display: block; padding: 0 6vw 1vh 0.5vw; }
  body.collapsed .row { display: flex; align-items: stretch; }
  body.collapsed .row.rulerRow { display: none; }
  body.collapsed .row .steps { flex: 1; width: auto; gap: 0; }
  body.collapsed button.voiceMute { width: 5vw; min-width: 0; margin-right: 0.5vw; height: var(--mini-h); padding: 0; font-size: calc(var(--mini-h) * .6); line-height: 1; border-color: transparent; background: none; overflow: hidden; }
  body.collapsed #grid .cell { height: var(--mini-h); pointer-events: none; }
  body.collapsed .cell::before, body.collapsed .cell::after { display: none; }
  body.collapsed .cell.barStart:not(.on) { background-color: var(--cell-bar); }
  body.collapsed.playing .cell.columnActive:not(.on) { background-color: var(--cell-hot); box-shadow: none; }

  /* ---- riff pane ------------------------------------------------------- */

  /* one-voice rhythm riff (beats are boxes, subdivided into 1-6 slots). Centered on its own scale,
     unless it is as long as the drum pattern, in which case it lines up with the drum columns */
  .riffTop { display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 4vh; padding: 0 var(--pad); font-size: 2.2vh; }
  #riffCount { color: var(--dim); }
  #riffLane { position: relative; height: calc(6vh * var(--zoom) / 100); margin-bottom: 3.4vh; }
  #riffLane.big { height: calc(10vh * var(--zoom) / 100); }   /* single-bar riffs are drawn large */
  #riffLane.big .riffSlot { font-size: 3.4vh; }
  .riffBeat { position: absolute; top: 0; height: 100%; display: flex; border: 2px solid var(--dim); background: var(--cell); }
  .riffBeat.barStart { border-left: 5px solid var(--fg); }
  /* subdivision count under each beat box; click to cycle it (.trip: a tuplet, i.e. 3/5/6 against the 16th grid) */
  .riffDiv { position: absolute; top: calc(100% + 0.5vh); transform: translateX(-50%); min-width: 2.2em; padding: 0 0.5em; text-align: center; font-size: 1.7vh; line-height: 1.4; letter-spacing: 0; color: var(--dim); background: var(--cell); border: 1px solid var(--dim); cursor: pointer; user-select: none; }
  .riffDiv:hover { color: var(--fg); border-color: var(--fg); background: var(--hot); }
  .riffSlot { flex: 1; border-left: 1px solid var(--hot); cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; font-size: 2vh; letter-spacing: 0; color: #040604; text-shadow: none; }
  .riffSlot:first-child { border-left: none; }
  .riffSlot.on { background: var(--dim); }
  .riffSlot.on.acc { background: color-mix(in srgb, var(--fg) 80%, #000); }
  .riffSlot.tie { background: linear-gradient(var(--dim), var(--dim)) center / 100% 30% no-repeat; border-left-color: transparent; }
  .riffSlot.now { box-shadow: inset 0 0 0 3px var(--fg); }
  .riffSlot.on.now { background: var(--fg); box-shadow: 0 0 16px var(--fg); }
  /* note-onset dots on the riff ball's trajectory (drawn over the ball, so they show as it passes through) */

<script>
// =========================
// Drum Practice v0.1.1 — step editor (5 voices, 16/32 steps)
// =========================

// --- Global state ---
let bpm = 110;              // quarter-note BPM
let playing = false;
let paused = false;

let muted = false;

// (in 6/8 a beat is a dotted quarter: 1, 3 = 8ths, 6 = 16ths).
// Slot chars: '.' rest, 'x' staccato, 'X' accented staccato, 'o' long, 'O' accented long,

let riff = null;            // { beatDiv, barSize, beats: [...] } — beatDiv/barSize record the meter it was made for

];

let ballGeom = null;        // cached layout for the bouncing ball (null = recompute)

// =========================

    drums: 'KH,H,KH,SH,H,H,H,H,KH,SH,H,H,KH,H,KH,SH,H,H,H,H,KH,SH,H,H',

    drums: 'K,_,_,S,_,_,K,_,_,S,_,_,K,_,_,S,_,_,K,_,_,S,_,_',
    fill:  'S,_,T,_,T,KS' },

  // ── 32 steps (4/4, 4 bars) ──
  { name: 'Extended Rock',     steps: 32, timeSig: '4/4',
    drums: 'KH,H,SH,H,KH,H,SH,H,KH,H,SH,H,KH,H,SH,H,KH,H,SH,H,KH,H,SH,H,KH,H,SH,KH,KH,H,SH,H',
    fill:  'S,S,ST,ST' },
  { name: 'Syncopated Funk',   steps: 32, timeSig: '4/4',
    drums: 'KH,H,SH,KH,H,H,SH,H,KH,_,SH,_,KH,H,SH,H,KH,H,SH,KH,H,KH,SH,H,KH,_,SH,_,KH,H,SH,H',
